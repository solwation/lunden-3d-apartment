# The shared-world Worker (#178, #119). cloudflare/setup.sh creates the KV namespace and fills in its id;
# the id is not a secret (it is useless without your Cloudflare login / API token).
name = "lunden-l1007"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "DRAWINGS"
class_name = "DrawingRoom"

[[migrations]]
tag = "drawing-room-v1"
new_sqlite_classes = ["DrawingRoom"]

[[kv_namespaces]]
binding = "LUNDEN"
id = "838d93b9358b42418f6f89fff6634ae1"

# Optional: a global per-IP write limit (otherwise the Worker counts per instance). Uncomment to use
# Cloudflare's rate-limiting binding:
# [[unsafe.bindings]]
# name = "LIMITER"
# type = "ratelimit"
# namespace_id = "1007"
# simple = { limit = 30, period = 60 }
