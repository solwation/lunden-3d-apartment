name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # commits that change nothing on the site do not deploy (#304); the page also reloads only when the content
    # hash in version.json changes (tools/stamp.sh), so a deploy of the same content reloads nobody
    paths-ignore:
      - 'docs/**'
      - 'material/**'
      - 'cloudflare/**'
      - '**.md'
      - '.github/workflows/cloud.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site with version stamp
        run: tools/stamp.sh _site "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
