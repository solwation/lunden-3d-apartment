name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # commits that change nothing on the site do not deploy (#304); the page also reloads only when the content
    # hash in version.json changes (tools/stamp.sh), so a deploy of the same content reloads nobody
    paths-ignore:
      - 'docs/**'
      - 'material/**'
      - 'cloudflare/**'
      - '**.md'
      - '.github/workflows/cloud.yml'
  workflow_dispatch:
  # once a day, so the TODO post-its on the fridge (#340, tools/todo.py) follow the issues without a code push;
  # the content hash is the same, so no open page reloads for it
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: stamp.sh dates each changelog entry from git history (#341)
      - name: Build site with version stamp
        run: tools/stamp.sh _site "${GITHUB_SHA::7}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # tools/todo.py reads the open issues (#340)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
