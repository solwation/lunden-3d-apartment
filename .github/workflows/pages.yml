name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # commits that change nothing on the site do not deploy (#304); the page also reloads only when the content
    # hash in version.json changes (tools/stamp.sh), so a deploy of the same content reloads nobody
    paths-ignore:
      - 'docs/**'
      - 'material/**'
      - 'cloudflare/**'
      - '**.md'
      - '.github/workflows/cloud.yml'
      - '.github/workflows/launcher-tests.yml'
      - '.github/workflows/release.yml'
      # the Unreal version (#2243) is not part of the site: its project, build scripts and data-contract schemas
      # (#2245) never deploy Pages; the site's own files stay where they are
      - 'unreal/**'
      - 'tools/unreal-engine/**'
      - 'shared/schema/**'
  workflow_dispatch:
  # once a day, so the TODO post-its on the fridge (#340, tools/todo.py) follow the issues without a code push;
  # the content hash is the same, so no open page reloads for it
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: stamp.sh dates each changelog entry from git history (#341)
      - name: Build site with version stamp
        run: tools/stamp.sh _site "${GITHUB_SHA::7}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # tools/todo.py reads the open issues (#340)
      - uses: actions/configure-pages@v5
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for the uploaded Pages artifact
        uses: ./.github/actions/wait-for-pages-artifact
        timeout-minutes: 2
        with:
          artifact-id: ${{ steps.upload.outputs.artifact_id }}
      - name: Deploy the uploaded artifact to GitHub Pages
        id: deployment
        uses: actions/github-script@v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          retries: 0 # Repeating an ambiguous create request could publish twice.
          script: |
            const deploy = require('./.github/actions/wait-for-pages-artifact/deploy.cjs');
            await deploy({github, context, core}, process.env.PAGES_ARTIFACT_ID);
