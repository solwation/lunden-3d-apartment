name: Deploy the shared-world Worker

# Redeploys cloudflare/worker.js when it changes on main (#178). Optional: the first setup is
# cloudflare/setup.sh on your own computer. Without the repo secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID (or before setup.sh has written the KV id) the job just says so and stays green.

on:
  push:
    branches: [main]
    paths: ['cloudflare/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Ready to deploy?
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "No Cloudflare secrets in the repo: skipping (see cloudflare/README.md)."; echo "go=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'SET_BY_SETUP_SH' cloudflare/wrangler.toml; then
            echo "Run cloudflare/setup.sh once first (no KV id yet): skipping."; echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: deploy
