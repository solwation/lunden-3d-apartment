name: Avatar piece reproducibility

on:
  push:
    branches: [main]
    paths:
      - 'src/avatar*.js'
      - 'src/config.js'
      - 'src/olof.js'
      - 'models/avatar-rigged.glb'
      - 'tools/unreal-engine/avatar-looks.json'
      - 'tools/unreal-engine/avatar-parts.json'
      - 'tools/unreal-engine/avatar-parts.mjs'
      - '.github/workflows/avatar-parts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check avatar pieces (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both V8 implementations implicated in #2368 must reproduce the committed GLB hashes.
          - os: ubuntu-latest
            node: '22.23.5'
          - os: windows-latest
            node: '24.15.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /models/avatar-rigged.glb
            /tools/unreal-engine/avatar-looks.json
            /tools/unreal-engine/avatar-parts.json
            /tools/unreal-engine/avatar-parts.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --prefix . --no-save --no-package-lock --no-audit --no-fund --ignore-scripts three@0.170.0
      - run: node tools/unreal-engine/avatar-parts.mjs --check
