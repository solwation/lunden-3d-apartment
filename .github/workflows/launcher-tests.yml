name: Windows launcher tests

on:
  push:
    branches: [main]
    paths:
      - 'unreal/Launcher/**'
      - 'unreal/Launcher.Tests/**'
      - 'tools/unreal-engine/wire/players.json'
      - 'tools/unreal-engine/make-manifest.mjs'
      - 'tools/unreal-engine/tests/make-manifest.test.mjs'
      - 'tools/unreal-engine/verify-published.mjs'
      - 'tools/unreal-engine/sign-manifest.mjs'
      - 'tools/unreal-engine/tests/sign-manifest.test.mjs'
      - 'shared/schema/release-manifest.schema.json'
      - 'tools/unreal-engine/get-signer-identity.ps1'
      - 'tools/unreal-engine/launcher-release-inputs.mjs'
      - 'tools/unreal-engine/package-signed-launcher.ps1'
      - 'tools/unreal-engine/tests/signed-launcher-package-test.ps1'
      - 'tools/unreal-engine/tests/launcher-dialogs.ps1'
      - 'tools/unreal-engine/release-notes.mjs'
      - 'tools/unreal-engine/release-notes/**'
      - 'tools/unreal-engine/tests/release-notes.test.mjs'
      - '.github/workflows/launcher-tests.yml'
  workflow_dispatch:
    inputs:
      browser_peers:
        description: Compare movement in the Windows launcher, desktop Chromium and a touch browser
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            unreal/Launcher
            unreal/Launcher.Tests
            cloudflare
            src
            tools/unreal-engine
            shared/schema
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.x'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Generate the stock manifest fixture and check release asset mapping
        env:
          LUNDEN_GENERATED_TEST_MANIFEST: ${{ runner.temp }}/generated-stock-manifest.json
        run: node --test tools/unreal-engine/tests/make-manifest.test.mjs
      - name: Sign a manifest with the release signing tool for the launcher cross-check
        env:
          LUNDEN_NODE_SIGNED_MANIFEST_DIR: ${{ runner.temp }}/node-signed-manifest
        run: node --test tools/unreal-engine/tests/sign-manifest.test.mjs
      - name: Render the Swedish release notes (#2377)
        run: node --test tools/unreal-engine/tests/release-notes.test.mjs
      - name: Install local-room browsers for the three-client test
        if: github.event_name == 'workflow_dispatch' && inputs.browser_peers
        run: |
          npm install --prefix . --no-save --no-package-lock --no-audit --no-fund --ignore-scripts playwright@1.58.2 three@0.170.0
          npx playwright install chromium
      - name: Run launcher tests on Windows
        env:
          LUNDEN_GENERATED_TEST_MANIFEST: ${{ runner.temp }}/generated-stock-manifest.json
          LUNDEN_NODE_SIGNED_MANIFEST_DIR: ${{ runner.temp }}/node-signed-manifest
        run: dotnet test unreal/Launcher.Tests/Lunden.Launcher.Tests.csproj --configuration Release --logger "console;verbosity=normal"
      - name: Verify Windows launcher movement with desktop and touch browsers
        if: github.event_name == 'workflow_dispatch' && inputs.browser_peers
        env:
          LUNDEN_TEST_BROWSER_PEERS: '1'
        run: dotnet test unreal/Launcher.Tests/Lunden.Launcher.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~LauncherAndWebPeer --logger "console;verbosity=normal"
      - name: Verify Windows Authenticode acceptance and rejection
        shell: pwsh
        run: ./unreal/Launcher.Tests/Test-Authenticode.ps1
      - name: Verify packaging with a signed Windows fixture
        shell: pwsh
        run: ./tools/unreal-engine/tests/signed-launcher-package-test.ps1
      - name: Open the setup, progress and error dialogs without a console (#2420)
        shell: pwsh
        run: ./tools/unreal-engine/tests/launcher-dialogs.ps1 -Out "$env:RUNNER_TEMP/launcher-dialogs"
      - name: Upload the dialog screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: launcher-dialogs
          path: ${{ runner.temp }}/launcher-dialogs
          if-no-files-found: ignore
