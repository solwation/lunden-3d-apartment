name: Unreal export

# #2305: when main changes what the Unreal export is built from, export the web scene headless, check it, compare it
# zone by zone with the previous export, keep it as an artifact for the Windows import (tools/unreal-engine/sync-import.ps1)
# and open or update one tracking issue on a failure or deviation, so nothing goes quiet.
# The Pages workflow is separate and unchanged. docs/development/unreal.md, "Automatic export and import (#2305)".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Export even when an export of the same sources already exists'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # find the previous export and an existing export of the same sources
  issues: write # the tracking issue on failure or deviation

concurrency:
  group: unreal-export
  queue: max # keep the export baseline and tracking issue serial; a later push must not replace the stale one

env:
  PLAYWRIGHT_VERSION: '1.58.2'
  THREE_VERSION: '0.170.0' # tools/unreal-engine/export-world.mjs serves three from node_modules when it matches

jobs:
  export:
    # pinned: Playwright 1.58.2 has no Chromium build for ubuntu-latest's Ubuntu 26.04 (first run, #2316)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tool tests
        id: tests
        run: node --test tools/unreal-engine/tests/export-ci.test.mjs tools/unreal-engine/tests/check-import.test.mjs
      - name: Export key
        id: key
        run: node tools/unreal-engine/export-ci.mjs key
      - name: Look for an export of the same sources
        id: existing
        run: |
          record=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=${{ steps.key.outputs.artifact }}&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not)][0] | select(.) | [.id, .workflow_run.id] | @tsv')
          if [ -n "$record" ] && [ "${{ inputs.force }}" != "true" ]; then
            read -r id run_id <<< "$record"
            echo "artifact-id=$id" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "### Unreal export: sources unchanged" >> "$GITHUB_STEP_SUMMARY"
            echo "Source hash \`${{ steps.key.outputs.source-hash }}\` already has artifact [\`${{ steps.key.outputs.artifact }}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts/$id). Checking Lighting against its measurements." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Previous export manifest
        id: prev
        if: steps.existing.outputs.found != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=unreal-export-manifest&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not)][0].id // empty')
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/prev.zip"
            unzip -q -o "$RUNNER_TEMP/prev.zip" -d "$RUNNER_TEMP/prev"
          else
            echo "no earlier export manifest: this is the first export"
          fi
      - name: Cache the Playwright browser
        if: steps.existing.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ env.PLAYWRIGHT_VERSION }}-ubuntu-24.04
      - name: Install Playwright and three
        id: install
        if: steps.existing.outputs.found != 'true'
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION" "three@$THREE_VERSION"
          npx playwright install chromium
      - name: Export
        id: export
        if: steps.existing.outputs.found != 'true'
        run: node tools/unreal-engine/export-world.mjs --out "$RUNNER_TEMP/export"
      - name: Check the export
        id: check
        if: steps.existing.outputs.found != 'true'
        run: node tools/unreal-engine/check-export.mjs --dir "$RUNNER_TEMP/export"
      - name: Compare zone by zone with the previous export
        id: compare
        if: steps.existing.outputs.found != 'true'
        run: node tools/unreal-engine/export-ci.mjs compare --prev "$RUNNER_TEMP/prev" --cur "$RUNNER_TEMP/export" --out "$RUNNER_TEMP/export-diff.json"
      - name: Upload the export
        id: upload
        if: steps.existing.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.key.outputs.artifact }}
          path: ${{ runner.temp }}/export/
          retention-days: 30
          if-no-files-found: error
      - name: Upload the manifest and comparison (the next run's baseline)
        if: steps.existing.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unreal-export-manifest
          path: |
            ${{ runner.temp }}/export/export-manifest.json
            ${{ runner.temp }}/export-diff.json
          retention-days: 90
          if-no-files-found: error
      - name: Restore lighting measurements for an unchanged export
        id: measurements
        if: steps.existing.outputs.found == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/export/measurements.json
          key: unreal-lighting-measurements-v1-${{ steps.key.outputs.source-hash }}
      - name: Read measurements from the existing export on a cold cache
        id: recover
        if: steps.existing.outputs.found == 'true' && steps.measurements.outputs.cache-hit != 'true'
        env:
          ARTIFACT_ID: ${{ steps.existing.outputs.artifact-id }}
          SOURCE_HASH: ${{ steps.key.outputs.source-hash }}
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/lighting-export.zip"
          unzip -p "$RUNNER_TEMP/lighting-export.zip" export-manifest.json | jq -e --arg hash "$SOURCE_HASH" '.sourceHash == $hash'
          unzip -p "$RUNNER_TEMP/lighting-export.zip" measurements.json > "$RUNNER_TEMP/export/measurements.json"
      - name: Cache the lighting measurements for subsequent pushes
        if: steps.measurements.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/export/measurements.json
          key: unreal-lighting-measurements-v1-${{ steps.key.outputs.source-hash }}
      - name: Check the versioned Lighting assets against the export
        id: lighting
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' lfs pull \
            --include='unreal/Lunden/Content/Lunden/Lighting/BP_LundenSky.uasset' --exclude='' origin
          python3 tools/unreal-engine/check-lighting.py "$RUNNER_TEMP/export/measurements.json"
          python3 tools/unreal-engine/tests/lighting-freshness.py "$RUNNER_TEMP/export/measurements.json"
      - name: Report a failure or deviation in the tracking issue
        if: ${{ !cancelled() }}
        env:
          FAILED: ${{ steps.tests.outcome == 'failure' && 'tool tests' || steps.key.outcome == 'failure' && 'export key' || steps.existing.outcome == 'failure' && 'look for an existing export' || steps.prev.outcome == 'failure' && 'previous export manifest' || steps.install.outcome == 'failure' && 'install Playwright' || steps.export.outcome == 'failure' && 'export' || steps.check.outcome == 'failure' && 'check-export' || steps.compare.outcome == 'failure' && 'compare' || steps.upload.outcome == 'failure' && 'upload' || steps.recover.outcome == 'failure' && 'recover lighting measurements' || steps.lighting.outcome == 'failure' && 'versioned Lighting (rebuild build_lighting.py on Windows)' || '' }}
        run: |
          outcome=success
          [ -n "$FAILED" ] && outcome=failure
          [ "${{ job.status }}" = "failure" ] && outcome=failure
          node tools/unreal-engine/export-ci.mjs report --outcome "$outcome" --failed "$FAILED" --diff "$RUNNER_TEMP/export-diff.json" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
