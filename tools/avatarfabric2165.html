<body><script type="module">
// #2165 component page, driven by tools/avatarfabric2165browser.cjs: four figures in low sun (T-shirt cotton + jeans, sweater knit + jeans,
// hoodie fleece + jeans, T-shirt + fine twill trousers), group views, jeans / torso close-ups and the mirror preview (src/avatarpreview.js).
import * as THREE from 'three';
import { Avatar } from '../src/avatar.js';
import { AvatarPreview } from '../src/avatarpreview.js';
import { decodeAvatarLook, avatarEyeHeight } from '../src/config.js';
const code = '210000100c5e8o2w0l8j0n0b0r8t8y8';
const W = 960, H = 600, renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x9db4c8);
scene.add(new THREE.HemisphereLight(0xcfe0f2, 0x6f6a5c, 0.9)); // the sky and the ground's bounce
const sun = new THREE.DirectionalLight(0xfff0d8, 3.2); sun.position.set(-2.4, 1.7, 2.2); scene.add(sun); // a low sun from the front left
const looks = [{ cut: 0, sleeves: 0, legs: 0, top: 0xd9d4c4, pants: 0x3f5274 }, { cut: 0, sleeves: 1, legs: 0, top: 0x6f3a36, pants: 0x3f5274 },
  { cut: 2, sleeves: 1, legs: 0, top: 0x3a5a6a, pants: 0x3f5274 }, { cut: 0, sleeves: 0, legs: 2, top: 0xd9d4c4, pants: 0x6d5a45 }];
const mk = (o) => ({ ...decodeAvatarLook(code, 'fabric'), tall: 1, build: 1, style: 0, ...o });
const avatars = looks.map((o, i) => {
  const a = new Avatar(mk(o)); a.baseY = 1.62 - avatarEyeHeight(a.look); a.object.position.set((i - 1.5) * 0.8, a.baseY, 0); scene.add(a.object); return a;
});
const cam = new THREE.PerspectiveCamera(30, W / H, 0.02, 60);
const pose = (walk) => { for (const a of avatars) for (let k = 0; k < (walk ? 37 : 90); k++) a.update(1 / 60, { speed: walk ? 1.4 : 0 }); scene.updateMatrixWorld(true); };
const draw = () => { renderer.info.reset(); renderer.render(scene, cam); return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, textures: renderer.info.memory.textures, programs: renderer.info.programs.length }; };
const frame = (a) => a.mesh.getWorldQuaternion(new THREE.Quaternion());
window.__group = (walk, yaw = 0.55) => { // the figures turned a little towards the sun
  pose(walk); for (const a of avatars) a.object.rotation.y = yaw; scene.updateMatrixWorld(true);
  cam.fov = 24; cam.updateProjectionMatrix(); const t = new THREE.Vector3(0, 0.9, 0); cam.position.set(0, 1.4, 4.6); cam.lookAt(t); return draw();
};
const world = (a, bone, off = [0, 0, 0]) => a.bones[bone].localToWorld(new THREE.Vector3(...off));
const CLOSE = { // [bone, offset, direction (figure frame), distance, fov]
  knee: ['kneeL', [0, 0.06, 0.04], [0.5, 0.1, 1], 0.9, 30], thigh: ['thighL', [0, -0.18, 0.04], [0.5, 0.1, 1], 0.9, 30],
  torso: ['torso', [0, 0.18, 0.05], [0.45, 0.15, 1], 0.8, 30], sleeve: ['elbowL', [0, 0.0, 0], [1, 0.15, 0.6], 0.7, 30],
};
window.__close = (k, name, bend = 0) => {
  pose(false); const a = avatars[k], [bone, off, dir, dist, fov] = CLOSE[name], p = world(a, bone, off);
  a.object.rotation.y = 0; scene.updateMatrixWorld(true);
  cam.fov = fov; cam.updateProjectionMatrix(); cam.position.copy(p).addScaledVector(new THREE.Vector3(...dir).normalize().applyQuaternion(frame(a)), dist); cam.lookAt(p); return draw();
};
// the four garments side by side as the mirror shows them (src/avatarpreview.js: 220 × 310 at the game's capped ratio), as one canvas
window.__preview = () => {
  const sheet = document.createElement('canvas'), pv = new AvatarPreview(document.createElement('canvas')), px = 330, py = 465;
  sheet.width = px * 4; sheet.height = py;
  looks.forEach((o, i) => { pv.draw(mk(o), { yaw: 0.4 }); sheet.getContext('2d').drawImage(pv.canvas, i * px, 0, px, py); });
  pv.dispose(); renderer.domElement.style.display = 'none'; document.body.appendChild(sheet); sheet.id = 'sheet'; return sheet.width;
};
window.__showMain = () => { renderer.domElement.style.display = 'block'; document.getElementById('sheet')?.remove(); };
window.__time = (n = 20) => {
  const gl = renderer.getContext(), px = new Uint8Array(4); window.__group(false); renderer.render(scene, cam); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  const t0 = performance.__real(); for (let i = 0; i < n; i++) renderer.render(scene, cam); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); return +((performance.__real() - t0) / n).toFixed(1);
};
window.__ready = true;
</script></body></html>
