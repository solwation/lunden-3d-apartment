<!doctype html><html lang="sv"><meta charset="utf-8"><title>Beer shelf model</title><pre id="out">running…</pre><iframe id="f" src="../index.html?life&shot&cloud=" width="900" height="600"></iframe>
<script>
const f=document.getElementById('f'),out=document.getElementById('out'),lines=[];let pass=true;
const check=(ok,name)=>{lines.push(`${ok?'PASS':'FAIL'} ${name}`);pass&&=!!ok;out.textContent=lines.join('\n');};
f.onload=async()=>{try{const w=f.contentWindow,d=f.contentDocument;while(!w.__app)await new Promise(r=>setTimeout(r,100));const A=w.__app,S=A.beerShelf,fridge=A.fridge,V=A.camera.position.constructor;

check(S.packages.every((p,i)=>S.packages.slice(i+1).every(q=>Math.abs(p.object.position.x-q.object.position.x)>(p.diameter+q.diameter)/2)),'all four packages have distinct nonoverlapping positions');
fridge.isOpen=true;for(let i=0;i<60;i++)fridge.update(1/60);S.update();check(S.group.visible,'opening the fridge exposes the same four labels');fridge.toggle();for(let i=0;i<60;i++)fridge.update(1/60);S.update();check(!S.group.visible&&S.packages.length===4,'door closing hides the shelf without duplicating packages');

check(alternate.packages[0].height===.23&&alternate.packages[1].height===.27&&alternate.packages.slice(0,2).every(p=>p.object.children.length===4&&p.object.position.y+p.height+.006<roof),'330/500 ml bottle bodies, shoulders, necks and caps retain shelf/roof clearance');fridge.object.remove(alternate.group);
}catch(e){check(false,e.stack);}out.textContent=lines.join('\n')+'\n'+(pass?'ALL PASS':'SOME FAILED');};
</script></html>
