<!doctype html><meta charset="utf-8"><title>River continuation geometry</title><pre id="result">Running</pre>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { SITE, EDGE_BACKDROP as E } from '../src/config.js';
import { buildEdgeBackdrop } from '../src/edgebackdrop.js';
import { cutRiverGround } from '../src/riveredge.js';
import { groundBelowDeckY } from '../src/surroundings.js';
import { waterYAt } from '../src/riverbridge.js';
const checks=[];
const assert=(ok,message='assertion')=>{checks.push({ok:!!ok,message});if(!ok)throw Error(message);};
try {
  const edge = buildEdgeBackdrop(groundBelowDeckY), B = SITE.backgroundGround, G = SITE.south.ground;
  assert(JSON.stringify(edge.children.map(c => c.name)) === JSON.stringify(['edge-land','edge-houses']), 'two existing batches');
  const land = edge.getObjectByName('edge-land');
  assert(land.geometry.attributes.position.count / 3 < 26000, 'bounded corridor subdivision, no new draw call');
  const scene = new THREE.Group(); scene.add(edge);
  for (const [x0,x1] of [[G.x0,B.x0],[B.x1,G.x1]]) {
    const g = cutRiverGround(new THREE.PlaneGeometry(x1-x0,B.z1-B.z0).rotateX(-Math.PI/2).translate((x0+x1)/2,E.level,(B.z1+B.z0)/2));
    scene.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({side:THREE.DoubleSide})));
  }
  scene.updateMatrixWorld(true);
  for (const r of E.rivers) {
    const [a,b] = r.path, length = Math.hypot(b[0]-a[0],b[1]-a[1]), dx = (b[0]-a[0])/length, dz = (b[1]-a[1])/length;
    const y = waterYAt(...a);
    const pointAt=distance=>{
      let remaining=distance,index=1;
      for(;index<r.path.length-1;index++){const u=r.path[index-1],v=r.path[index],len=Math.hypot(v[0]-u[0],v[1]-u[1]);if(remaining<=len)break;remaining-=len;}
      const u=r.path[index-1],v=r.path[index],len=Math.hypot(v[0]-u[0],v[1]-u[1]);return {x:u[0]+(v[0]-u[0])*remaining/len,z:u[1]+(v[1]-u[1])*remaining/len,dx:(v[0]-u[0])/len,dz:(v[1]-u[1])/len};
    };
    for (const distance of [.1,1,3,10,25]) {
      const {x,z}=pointAt(distance);
      const ray = new THREE.Raycaster(new THREE.Vector3(x,20,z),new THREE.Vector3(0,-1,0));
      const hit = ray.intersectObjects(scene.children,true)[0];
      assert(hit,`${r.name}: rendered surface at ${distance}m outside terrain`);
      assert(Math.abs(hit.point.y-y)<.002,`${r.name}: water is visible, with no far-ground/skirt cap at ${distance}m (${hit.point.y} vs ${y})`);
      assert(hit.object.name==='edge-land','actual water in edge-land');
    }
    let submerged=0;
    for (const offset of [-3.2,-3.5,3.2,3.5]) {
      const point=pointAt(300),x=point.x-point.dz*offset,z=point.z+point.dx*offset;
      const ray=new THREE.Raycaster(new THREE.Vector3(x,20,z),new THREE.Vector3(0,-1,0));
      const hits=ray.intersectObjects(scene.children,true);
      const below=hits.filter(h=>h.point.y<y-.003),water=hits.find(h=>Math.abs(h.point.y-y)<.002);
      if(below.length)submerged++;
      assert(!below.length||water,`${r.name}: submerged emitted bank at offset ${offset} is covered by emitted water`);
    }
    assert(submerged>0,`${r.name}: actual submerged bank triangles were probed`);
    // The bank joins the sampled terrain continuously right outside the boundary at several lateral offsets.
    for (const offset of [-18,-8,8,18]) {
      const x=a[0]+dx*.02-dz*offset,z=a[1]+dz*.02+dx*offset;
      if (x>B.x0&&x<B.x1) continue;
      const edgeZ=z-(x-a[0])*dz/dx;
      const ray=new THREE.Raycaster(new THREE.Vector3(x,20,z),new THREE.Vector3(0,-1,0));
      const hit=ray.intersectObjects(scene.children,true)[0];
      assert(hit,`${r.name}: bank rendered at offset ${offset}`);
      assert(Math.abs(hit.point.y-groundBelowDeckY(a[0],edgeZ))<.3,`${r.name}: bank meets local terrain without a cliff at offset ${offset}`);
    }
  }
  scene.traverse(o=>{o.geometry?.dispose();if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material?.dispose();});
 document.querySelector('#result').textContent=JSON.stringify({ok:true,checks});
} catch(error) {document.querySelector('#result').textContent=JSON.stringify({ok:false,error:error.stack,checks});}
</script>
