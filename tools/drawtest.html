<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Drawing test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Drawing with crayons (#93): aim at the paper in Sovrum 3, the action button "Rita på pappret" opens
// drawing mode (the view goes over the paper, the palette shows, no walking), synthetic pointer events
// draw a red line (pixels change in the paper's canvas), "Sudda allt" clears it, E leaves drawing mode
// and the camera is back where it was.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/drawtest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
localStorage.removeItem('lunden.drawing');
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, step, drawing, scene } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  scene.updateMatrixWorld(true);
  const p = drawing.paper.position;
  player.spawn(p.x, p.z + 0.9, 0); player.pos.y = 3.25; player.eyeY = 3.25 + 1.62;
  for (let i = 0; i < 3; i++) step(1 / 60);
  camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(p.x - camera.position.x, p.z - camera.position.z));
  step(1 / 60);
  let pass = check(!btn.hidden && /rita på pappret/i.test(btn.textContent), `button "${btn.textContent}"`);
  const before = camera.position.clone();
  btn.click();
  for (let i = 0; i < 40; i++) step(1 / 60);
  pass &= check(drawing.active && !d.getElementById('draw-panel').hidden, 'drawing mode, palette shown');
  pass &= check(Math.abs(camera.rotation.x + Math.PI / 2) < 0.01 && camera.position.distanceTo(drawing.view.pos) < 0.01, 'looking straight down at the paper');
  const pos0 = player.pos.clone();
  player.keys = new Set(['KeyW']); for (let i = 0; i < 20; i++) step(1 / 60); player.keys = new Set();
  pass &= check(player.pos.distanceTo(pos0) < 0.001, 'no walking while drawing');
  // draw a red line across the middle of the screen (the paper fills it)
  d.querySelectorAll('#draw-panel .colors button')[0].click();
  const cv = d.querySelector('canvas'), r = cv.getBoundingClientRect();
  const ev = (type, x, y) => cv.dispatchEvent(new w.PointerEvent(type, { clientX: r.left + x * r.width, clientY: r.top + y * r.height, bubbles: true, pointerType: 'mouse' }));
  ev('pointerdown', 0.4, 0.5);
  for (let k = 1; k <= 10; k++) ev('pointermove', 0.4 + k * 0.02, 0.5);
  w.dispatchEvent(new w.PointerEvent('pointerup', { bubbles: true }));
  const g = drawing.ctx, cx = drawing.canvas.width / 2, cy = drawing.canvas.height / 2;
  const px = g.getImageData(cx - 20, cy - 6, 40, 12).data;
  let red = 0; for (let i = 0; i < px.length; i += 4) if (px[i] > 180 && px[i + 1] < 150) red++;
  pass &= check(drawing.strokes === 1 && red > 30, `a red crayon line on the paper (${red} red pixels)`);
  d.querySelector('#draw-panel [data-act=clear]').click();
  const px2 = g.getImageData(cx - 20, cy - 6, 40, 12).data;
  let red2 = 0; for (let i = 0; i < px2.length; i += 4) if (px2[i] > 180 && px2[i + 1] < 150) red2++;
  pass &= check(red2 === 0, '"Sudda allt" clears it');
  ev('pointerdown', 0.45, 0.45); ev('pointermove', 0.55, 0.55); w.dispatchEvent(new w.PointerEvent('pointerup', { bubbles: true }));
  d.dispatchEvent(new w.KeyboardEvent('keydown', { code: 'KeyE', key: 'e', bubbles: true }));
  step(1 / 60);
  pass &= check(!drawing.active && d.getElementById('draw-panel').hidden && camera.position.distanceTo(before) < 0.01, 'E leaves drawing mode, the camera back where it was');
  pass &= check(!!localStorage.getItem('lunden.drawing'), 'the drawing is saved');
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
