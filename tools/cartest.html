<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Car test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Our Megane (#250): parked outside the door (&car). Open the driver's door, sit in the driver's seat (inside the car,
// looking ahead), get out by the door; the passenger side likewise; the seat is no target while its door is shut;
// the key sends it away — the open doors shut first, then it drives off. Music (#268): seated, the centre screen puts it
// on, ⏭, off; it plays on outside (muffled with the doors shut), not a target from outside; it stops as the car leaves.
// #356: both routes keep the car on asphalt (the road, the drive, the car park), clear of the bus stop and the stalls.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/cartest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html?car&time=12';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, step, car, rest, standUp } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action'), V = camera.position.constructor;
  const look = (p) => { const dx = p.x - camera.position.x, dz = p.z - camera.position.z; camera.rotation.set(Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz)), Math.atan2(-dx, -dz), 0, 'YXZ'); step(1 / 60); };
  const local = (x, y, z) => { car.object.updateMatrixWorld(true); return new V(x, y, z).applyMatrix4(car.object.matrixWorld); };
  let pass = check(car.state === 'parked', 'parked');
  for (const [side, standZ, door, seat] of [[-1, -1.25, /öppna förardörren/i, /sätta dig i förarsätet/i], [1, 1.25, /öppna passagerardörren/i, /sätta dig i passagerarsätet/i]]) {
    const stand = local(0.1, 0, standZ);
    player.spawn(stand.x, stand.z, 0);
    for (let i = 0; i < 3; i++) step(1 / 60);
    look(local(0.5, 0.75, side * 0.86));
    pass &= check(!btn.hidden && door.test(btn.textContent), `the door: "${btn.textContent}"`);
    look(local(-0.05, 0.6, side * 0.37));
    pass &= check(!seat.test(btn.textContent), `the seat is no target while the door is shut ("${btn.hidden ? '' : btn.textContent}")`);
    look(local(0.5, 0.75, side * 0.86)); btn.click();
    for (let i = 0; i < 60; i++) step(1 / 60);
    const dr = car.doors.find((x) => x.front && x.side === side);
    pass &= check(dr.angle > 0.9, `the door opens (${dr.angle.toFixed(2)} rad)`);
    look(local(-0.05, 0.6, side * 0.37));
    pass &= check(!btn.hidden && seat.test(btn.textContent), `now the seat: "${btn.textContent}"`);
    btn.click();
    for (let i = 0; i < 60; i++) step(1 / 60);
    car.object.updateMatrixWorld(true);
    const inCar = camera.position.clone().applyMatrix4(car.object.matrixWorld.clone().invert());
    pass &= check(rest.active && Math.abs(inCar.z - side * 0.37) < 0.05 && inCar.y > 1.1 && inCar.y < 1.42, `sitting inside (local ${inCar.x.toFixed(2)}, ${inCar.y.toFixed(2)}, ${inCar.z.toFixed(2)})`);
    const fwd = new V(0, 0, -1).applyQuaternion(camera.quaternion);
    pass &= check(fwd.x > 0.9, `looking ahead along the car (${fwd.x.toFixed(2)})`);
    pass &= check(car.screenMat.emissiveIntensity > 0.3, 'the screens are awake');
    if (side < 0) { // music (#268): the centre screen while seated — on, next song, off, on again
      const R = car.radio, scr = (x, y) => { car.object.updateMatrixWorld(true); return car.musicTarget.pickable.localToWorld(new V(x, y, 0)); };
      look(scr(0, 0.04));
      pass &= check(!btn.hidden && /sätta på musik/i.test(btn.textContent), `seated: the centre screen "${btn.textContent}"`);
      btn.click(); for (let i = 0; i < 10; i++) step(1 / 60);
      pass &= check(R.playing && !!R.ch && car.shown?.startsWith(R.name), `music on: "${R.name}", the channel running (${!!R.ch}), on the screen (${car.shown})`);
      pass &= check(R.k?.gain === 1, 'heard clear inside the car');
      const first = R.channel;
      look(scr(0.1, -0.01));
      pass &= check(/nästa låt/i.test(btn.textContent), `the ⏭ button: "${btn.textContent}"`);
      btn.click(); for (let i = 0; i < 5; i++) step(1 / 60);
      pass &= check(R.playing && R.channel === (first + 1) % 6 && car.shown.startsWith(R.name), `next song: "${R.name}"`);
      pass &= check(w.__app.stats.carMusic >= 2, `counted (${w.__app.stats.carMusic})`);
      look(scr(0, 0.04));
      pass &= check(/stänga av musiken/i.test(btn.textContent), `now "${btn.textContent}"`);
      btn.click(); for (let i = 0; i < 5; i++) step(1 / 60);
      pass &= check(!R.playing && car.shown === 'map', 'off again: the map is back');
      btn.click(); for (let i = 0; i < 5; i++) step(1 / 60);
      pass &= check(R.playing, 'and on again');
    }
    standUp();
    for (let i = 0; i < 5; i++) step(1 / 60);
    pass &= check(!rest.active && Math.hypot(player.pos.x - stand.x, player.pos.z - stand.z) < 0.05, 'out again where you stood, by the door');
    if (side < 0) { // out of the car: it plays on, through the open door; not a target from outside; muffled with the doors shut
      for (let i = 0; i < 5; i++) step(1 / 60);
      pass &= check(car.radio.playing && car.radio.k?.gain < 1 && car.radio.k?.gain > 0.5, `out: it plays on through the open door (${car.radio.k?.gain})`);
      car.object.updateMatrixWorld(true);
      look(car.musicTarget.pickable.localToWorld(new V(0, 0.04, 0)));
      pass &= check(!/musik/i.test(btn.textContent) || btn.hidden, `the screen is no target from outside ("${btn.hidden ? '' : btn.textContent}")`);
      dr.target = 0; for (let i = 0; i < 90; i++) step(1 / 60);
      pass &= check(car.radio.k?.gain < 0.5 && car.radio.k?.cutoff < 1000, `the door shut: muffled (${car.radio.k?.gain}, ${car.radio.k?.cutoff} Hz)`);
      dr.target = 1.1; for (let i = 0; i < 60; i++) step(1 / 60);
    }
  }
  // the key: the doors shut first, then it leaves
  car.call();
  pass &= check(car.state === 'parked' && car.doors.every((x) => x.target === 0), 'the key: the doors close first');
  for (let i = 0; i < 90; i++) step(1 / 60);
  pass &= check(car.state === 'leaving', `then it drives off (${car.state})`);
  pass &= check(!car.radio.playing && car.shown === 'map', 'the music stops as it leaves (#268)');
  // #356: both routes keep the whole car on asphalt — a road or the car park, never a pavement, curb, lawn or the hedge —
  // clear of the bus stop and of the parked cars' stalls. Every 0.5 m of each path: the body's corners and side middles.
  const mod = (f) => w.eval(`import('${new URL(`../src/${f}`, location.href)}')`); // the page's own instances
  const roads = await mod('roads.js'), cfg = await mod('config.js');
  const S = cfg.SITE, L = cfg.CAR.l / 2, H = cfg.CAR.w / 2, [bx, bz] = S.street.busStop, lot = S.life.lot;
  for (const [name, path] of [['in', car.arrival()], ['out', car.departure()]]) {
    const saved = car.path; car.path = path;
    const total = car.total(), bad = [];
    let nearBus = Infinity, n = 0;
    for (let s = 0; s <= total; s += 0.5, n++) {
      const p = car.at(s), fx = Math.cos(p.yaw), fz = -Math.sin(p.yaw); // the car's +x along the way
      for (const [a, b] of [[L, H], [L, -H], [-L, H], [-L, -H], [0, H], [0, -H], [0, 0]]) {
        const x = p.x + fx * a - fz * b, z = p.z + fz * a + fx * b;
        nearBus = Math.min(nearBus, Math.hypot(x - bx, z - bz));
        const stall = x > lot.x0 && x < lot.x1 && z > lot.z0 && z < lot.z0 + lot.depth;
        if (!roads.onRoad(x, z) || stall) bad.push(`(${x.toFixed(1)}, ${z.toFixed(1)})${stall ? ' stall' : ''}`);
      }
    }
    car.path = saved;
    pass &= check(bad.length === 0, `route ${name}: the whole car on asphalt at ${n} points, ${total.toFixed(0)} m${bad.length ? ` — off at ${bad.length}: ${bad.slice(0, 8).join(' ')}` : ''}`);
    pass &= check(nearBus > 1.5, `route ${name}: clear of the bus stop (${nearBus.toFixed(1)} m)`);
  }
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
