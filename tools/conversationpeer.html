<!doctype html><html lang="sv"><meta charset="utf-8"><title>Conversation peer</title>
<style>body{font:14px system-ui;margin:0;padding:10px;background:#edf2f5;color:#173843}h3{margin:0 0 5px}button{display:block;width:100%;margin:4px 0;padding:8px;font:600 14px system-ui;background:white;border:1px solid #80988c;border-radius:6px}.say{position:fixed;left:50%;top:50%;background:white;padding:8px;border-radius:8px;max-width:270px}.mine{left:10px;top:auto;bottom:8px}.theirs{left:0;top:0}#latest{margin:8px 0;font-size:13px}#speech{position:fixed;inset:0;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<h3>Klient B · riktig lokal Worker</h3><div>Ghosts · Greetings · samtalsmeny</div><div id="state"></div><div id="latest"></div><nav></nav><div id="speech"></div>
<script type="module">
import * as T from 'three';import {Ghosts} from '../src/ghosts.js';import {Greetings} from '../src/greet.js';import {Conversation} from '../src/conversation.js';import {toggleMuted,isMuted} from '../src/audio.js';
const p=JSON.parse(new URLSearchParams(location.search).get('p')||'[-28.85,0,21.6]'),state={p,r:Math.PI},scene=new T.Scene(),camera=new T.PerspectiveCamera(60,340/450,.1,100);camera.position.set(p[0],p[1]+1.62,p[2]);camera.lookAt(p[0],p[1]+1.3,p[2]+1.1);
const ghosts=new Ghosts({scene,camera,url:new URLSearchParams(location.search).get('worker')||'http://localhost:8960',name:()=> 'Olof test',state:()=>({...state}),active:()=>true,weapon:()=>state.h||'',score:()=>0});ghosts.keepConnected=()=>true;
const greet=new Greetings(camera,document.querySelector('#speech'));greet.mineAvatar=()=>ghosts.myGhost?.avatar;const lines=[],events=[],greets=[];
const conversation=new Conversation({net:{ready:()=>ghosts.connected,id:()=>ghosts.me,send:m=>{if(!ghosts.connected)return false;ghosts.lastMove=performance.now();ghosts.outbox.push(m);ghosts.trimOutbox();ghosts.sendShot();return true;}},peer:id=>{const g=ghosts.others.get(id);return g&&{position:g.root.position.toArray(),armed:!!g.h};},position:()=>p,onLine:(m,line)=>{events.push(m);lines.push(line);document.querySelector('#latest').textContent=line;if(m.i===ghosts.me)greet.sayMine(line);else{const g=ghosts.others.get(m.i);if(g)greet.say({head:g.head,s:1},line,{pitch:1.1,rate:1.05,voice:1},undefined,g.avatar);}}});
ghosts.conversation=conversation;ghosts.onWelcome=m=>conversation.welcome(m.conversation);ghosts.onConversation=m=>conversation.receive(m);ghosts.onGreet=(m,g,other)=>{greets.push(m);import('../src/config.js').then(({GHOSTS})=>greet.say({head:g.head,s:1},GHOSTS.hello[m.k]?.replace('{n}',other?.name||'Olof test')||'Hej!',{pitch:1.1,rate:1.05,voice:1},undefined,g.avatar));};ghosts.onChoose=(g,kind)=>{const line=ghosts.greet(g,kind);if(line&&kind==='greet')greet.sayMine(line);};
if(isMuted())toggleMuted();let key='';const timer=setInterval(()=>{ghosts.update(.05);conversation.update();greet.update(.05);const g=[...ghosts.others.values()].find(g=>g.have);document.querySelector('#state').textContent=ghosts.connected?'Ansluten · '+(g?.name||'väntar på A'):'Ansluter';if(!g)return;const rows=ghosts.choices(g),next=rows.map(r=>r.id+':'+r.reason).join('|')+'|'+(conversation.incoming?.id||'');if(next!==key){key=next;const nav=document.querySelector('nav');nav.replaceChildren();for(const row of rows){const b=document.createElement('button');b.textContent=row.label+(row.reason?' – '+row.reason:'');b.dataset.id=row.id;b.onclick=()=>{if(!row.reason)row.run();};nav.append(b);}}},50);
window.peer={ghosts,conversation,greet,scene,camera,state,lines,events,greets,timer,setMuted(value){if(isMuted()!==value)toggleMuted();},stop(){clearInterval(timer);ghosts.disconnect();}};
</script></html>
