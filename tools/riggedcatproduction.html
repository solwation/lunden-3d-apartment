<header><h1>Katter #1910 · produktionsgeometri, rasformer och poser</h1><p id="status">Laddar neutral artikulerad modell …</p><button onclick="catView('front')">Framifrån</button><button onclick="catView('side')">Sida</button><button onclick="catView('quarter')">Snett framifrån</button><button onclick="catConsumers()">CatSpawner</button><button onclick="catBinder()">Pärmens bilder</button></header>
<div class="labels" id="labels"></div><section id="binder"><h2>Pärmens faktiska BestiaryImages · 96 px och 320 px</h2><p>Produktionsmodell och material; hela figurer. Befintliga mötesfoton ändras inte.</p><div id="thumbs" class="row"></div><div id="details" class="row"></div></section>
<script type="module">
import * as T from 'three';
import {CatSpawner,createCatPuppet,loadRiggedCatModel,BREEDS} from '../src/cat.js';
import {OutdoorCats} from '../src/outdoorcats.js';
import {registry} from '../src/bestiary.js';
import {BestiaryImages} from '../src/bestiaryimages.js';
await loadRiggedCatModel();
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1800,880);renderer.setPixelRatio(1);document.body.append(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#edf0f3');scene.add(new T.HemisphereLight(0xffffff,0x747a71,2.5));const light=new T.DirectionalLight(0xfff3df,2);light.position.set(2,4,3);scene.add(light);
const ground=new T.Mesh(new T.PlaneGeometry(10,10),new T.MeshLambertMaterial({color:0xcbd3c1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.002;scene.add(ground);scene.add(new T.GridHelper(2,20,0xadb99d,0xb8c3ad));
const camera=new T.PerspectiveCamera(35,360/440,.01,20);
const cases=[['Huskatt','huskatt',false],['Siames','siames',false],['Maine Coon','maine coon',false],['Kattunge','huskatt',true],['Miele','Miele',false]];
const cats=cases.map(([label,name,kitten])=>{const breed=BREEDS.find(b=>b.name===name),cat=createCatPuppet(breed,breed.coats[0],kitten);cat.hand=cat.parts.hand;scene.add(cat.object);return{label,cat};});
const main=new CatSpawner({levels:[{segments:[]},{segments:[]}],doors:[]},()=>.5);scene.add(main.object);main.nextMeow=Infinity;
const all=[...cats.map(c=>c.cat.object),main.object];
const boxOf=object=>{object.updateMatrixWorld(true);const box=new T.Box3(),v=new T.Vector3();object.traverseVisible(o=>{if(o.isMesh)for(let i=0;i<o.geometry.attributes.position.count;i++){v.fromBufferAttribute(o.geometry.attributes.position,i).applyMatrix4(o.matrixWorld);if(!v.toArray().every(Number.isFinite))throw Error('non-finite posed vertex');box.expandByPoint(v);}});return box;};
const metrics=[];
function reset(c){c.head.rotation.set(0,0,0);c.shoulder.rotation.set(0,0,0);c.leftShoulder.rotation.set(0,0,0);c.headOff.set(0,0,0);c.tailGroup.rotation.set(0,0,0);Object.assign(c,{stand:0,wantStand:0,gaitAmp:0,walked:false,t:1,nextMeow:Infinity,play:null,fish:null,petT:0,tailU:0,hopY:0});for(const e of c.eyes){e.eye.visible=true;e.shut.visible=false;}c.parts.hand.visible=false;}
function pose(c,kind){reset(c);if(kind==='walk'){Object.assign(c,{stand:1,wantStand:1,gaitAmp:1,gaitPhase:1,walked:true});}if(kind==='wash'){c.t=1.7;c.behave(0);}if(kind==='pet'){Object.assign(c,{petT:4,petPhase:.8,photoTaken:true,ownHand:false,petFrom:{x:0,z:1}});c.updatePetting(0);}if(kind==='play'){c.play={kind:'pounce',t:.45,from:0};c.updatePlay(0);}if(kind==='held'){c.heldBehave(0);}if(kind==='eat'){c.fish={phase:'eat',t:.5,chew:1,at:new T.Vector3(0,0,.2),f:{state:'placed',model:new T.Group()}};c.updateFish(0);}c.pose(0);}
function cell(c,i,label,view){all.forEach(o=>o.visible=false);c.object.visible=true;const col=i%5,row=Math.floor(i/5);renderer.setViewport(col*360,(1-row)*440,360,440);renderer.setScissor(col*360,(1-row)*440,360,440);renderer.setScissorTest(true);const look=new T.Vector3(0,.245,.045);camera.position.copy(look).add(view==='front'?new T.Vector3(0,.07,1.25):view==='side'?new T.Vector3(1.25,.07,0):new T.Vector3(.95,.12,1));camera.lookAt(look);scene.updateMatrixWorld(true);renderer.render(scene,camera);const b=boxOf(c.object);metrics.push({label,min:b.min.toArray(),max:b.max.toArray(),calls:renderer.info.render.calls-2,triangles:renderer.info.render.triangles});}
function show(){document.getElementById('binder').style.display='none';renderer.domElement.style.display='block';document.getElementById('labels').style.display='grid';metrics.length=0;}
window.catView=(view='quarter')=>{show();const labels=[];for(let row=0;row<2;row++)for(let i=0;i<5;i++){const {label,cat}=cats[i],kind=row?['walk','wash','pet','play','held'][i]:'sit';pose(cat,kind);labels.push(`${label} · ${kind}`);cell(cat,row*5+i,labels.at(-1),view);}document.getElementById('labels').innerHTML=labels.map(x=>`<div>${x}</div>`).join('');renderer.setScissorTest(false);window.catMetrics=metrics.slice();};
window.catConsumers=()=>{show();const labels=[];for(let row=0;row<2;row++)for(let i=0;i<5;i++){const b=BREEDS.find(b=>b.name===cases[i][1]);main.setCat(b,b.coats[0],cases[i][2]);const kind=row?['walk','wash','pet','play','eat'][i]:'sit';pose(main,kind);labels.push(`CatSpawner · ${cases[i][0]} · ${kind}`);cell(main,row*5+i,labels.at(-1),'quarter');}document.getElementById('labels').innerHTML=labels.map(x=>`<div>${x}</div>`).join('');renderer.setScissorTest(false);window.catConsumerMetrics=metrics.slice();};
window.catBinder=async()=>{all.forEach(o=>o.visible=false);renderer.domElement.style.display='none';document.getElementById('labels').style.display='none';document.getElementById('binder').style.display='block';const images=new BestiaryImages({registry,renderer});for(const kind of ['thumbs','details']){const root=document.getElementById(kind);root.replaceChildren();for(const [label,name,kitten]of cases){const b=BREEDS.find(b=>b.name===name),entry=registry.list().find(e=>e.model?.kind==='cat'&&e.model.breed===name&&e.model.coat===b.coats[0].name&&e.model.kitten===kitten),size=kind==='thumbs'?96:320;const img=new Image();img.src=await images.get(entry.id,size);await img.decode();const card=document.createElement('figure');card.innerHTML=`<figcaption>${label} · ${size}px</figcaption><small>modellversion ${entry.modelVersion}</small>`;card.append(img);root.append(card);}}window.catBinderRenders=images.renders;};
// Construct the actual outdoor consumer with controlled terrain/obstacles; retain
// its own near puppet, baked LODs and real paw contact setup.
const outdoorScene=new T.Scene(),outdoorCamera=new T.PerspectiveCamera();outdoorCamera.position.set(0,1,0);
const outdoor=new OutdoorCats({scene:outdoorScene,camera:outdoorCamera,cat:main,ground:()=>0,walkable:()=>true,free:()=>true});
window.catOutdoor={count:outdoor.cats.length,all:outdoor.cats.every(c=>c.climbContact.paws.length===4&&c.lods.every(l=>l.geometry.attributes.position.count>0)),nearPaws:outdoor.cats[0].climbContact.paws.map(p=>p.isMesh)};
window.catEvidence={renderer,main,cats,scene,boxOf,outdoor};catView('quarter');document.getElementById('status').textContent='Faktiska ras-/pälsrecept och CatSpawner-poser · GLB byter endast geometri · visuell granskning krävs';window.__ready=true;
</script>
