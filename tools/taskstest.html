<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Everyday tasks test (#392)</title></head>
<body><pre id="out">running…</pre>
<script type="module">
const lines = [];
let pass = true;
const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= !!ok; };
const stage = (name) => { window.taskStage = name; console.log('TASK_STAGE '+name); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
try {
  stage('loading iframe');
  const f = document.createElement('iframe');
  f.width = 900; f.height = 600; f.src = '../index.html?life&shot'; document.body.append(f);
  await new Promise((r) => { f.onload = r; });
  stage('iframe loaded, waiting __app');
  while (!f.contentWindow.__app) await wait(100);
  const w = f.contentWindow, d = f.contentDocument, A = w.__app;
  stage('app ready');
  A.renderer.setAnimationLoop(null);
  d.documentElement.requestFullscreen = undefined;
  d.getElementById('start-touch').click(); await wait(50);
  const { tasks, life, stats, totalScore, showTaskNote, step, player, camera, cloth, vacuum } = A, I = life.items;
  const secs = (s) => { let left = s; while (left > 1e-8) { const dt = Math.min(.1, left); step(dt); left -= dt; } };
  const row = (id, it) => life.options(it ? { item: life.view(it) } : { instance: I.held() }).find((o) => o.id === id);
  const cleanTasks = () => tasks.reset();
  const task = (id) => tasks.tasks.find((t) => t.id === id);
  const counter = { x: 5.25, y: 0.93, z: 3 };
  check(tasks.tasks.length === 6 && tasks.activeTasks().length === 3 && !tasks.isShown('tidyHall') && life.worktopAt(Object.values(counter)), 'three active tasks from a larger pool; hidden hall task waits for reading; real worktop');
  const { TASK_POOL, SCORE } = await w.eval("import('/src/config.js')");
  const { taskReward } = await w.eval("import('/src/stats.js')");
  const initialTasks = stats.tasks;
  const sandwichReward = taskReward('makeSandwich');
  life.emit('ate', { type: 'breadSlice', parts: [] }); life.emit('ate', { type: 'apple' });
  life.emit('crumbs', { source: 'cut' });
  check(task('makeSandwich').completedGoals.size === 0, 'plain bread, fruit and cutting do not make a sandwich');
  stage('sandwich cooking');
  // Real cooking actions: assembling and eating, not synthetic completion events.
  const bread = life.create('breadSlice', { at: 'world', pos: Object.values(counter), yaw: 0 });
  life.create('cheeseSlice', { at: 'hand' }); step(1 / 60);
  const topping = row('addTopping', bread);
  check(topping && !topping.reason, 'real topping action is available'); topping?.run(); step(1 / 60);
  check(task('makeSandwich').completedGoals.has('prep') && !task('makeSandwich').isDone, 'assembly completes preparation only');
  life.view(bread).take(); step(1 / 60);
  row('eat')?.run(); secs(0.8);
  check(!task('makeSandwich').isDone, 'one bite is not a finished sandwich');
  for (let i = 0; i < 3; i++) { row('eat')?.run(); secs(0.8); }
  check(!I.get(bread.id) && task('makeSandwich').isDone && stats.tasks === initialTasks + 1, 'last bite completes the real sandwich once');
  check(tasks.activeTasks().length === 3 && !task('makeSandwich').active && task('washDish').active, 'completion immediately fills the slot with another eligible task');
  const savedDone = tasks.save(), scoreDone = totalScore(); tasks.load(savedDone);
  check(task('makeSandwich').isDone && totalScore() === scoreDone, 'restoring a completed task never replays its bonus');
  check(savedDone.tasks.makeSandwich.readyAt > savedDone.elapsed && savedDone.tasks.makeSandwich.completions === 1, 'cooldown and completion count are saved');
  check(!tasks.completeGoal('makeSandwich', 'eat') && totalScore() === scoreDone, 'completed or inactive task cannot award a second time');
  check(d.querySelector('#badges')?.textContent.includes(`+${sandwichReward}`) || [...d.querySelectorAll('[data-text]')].some(e => e.textContent.includes(`Gör en macka · +${sandwichReward}`)), 'completion badge states the actual task reward');
  stage('kitchen goal permutations');
  // All six kitchen permutations, with rubbish present so disposal is genuinely needed.
  const bin = I.all().find((it) => I.has(it, 'bin')); I.setAmount(bin, 1);
  const events = {
    dishes: () => life.emit('dishwasher', { washed: ['plate-fixture'] }),
    wipe: () => life.emit('wipe', { point: counter }),
    rubbish: () => life.emit('rubbishOut', { amount: 1 }),
  };
  for (const order of [['dishes','wipe','rubbish'],['dishes','rubbish','wipe'],['wipe','dishes','rubbish'],['wipe','rubbish','dishes'],['rubbish','dishes','wipe'],['rubbish','wipe','dishes']]) {
    cleanTasks(); const score = totalScore(), count = stats.tasks, reward = taskReward('resetKitchen');
    events[order[0]](); events[order[0]]();
    const saved = life.serialize().x.tasks; tasks.load(saved);
    check(task('resetKitchen').completedGoals.size === 1 && !task('resetKitchen').isDone, `${order.join('/')}: duplicate and reload preserve one goal`);
    events[order[1]](); check(!task('resetKitchen').isDone, 'two goals do not finish kitchen');
    events[order[2]](); events[order[2]]();
    check(task('resetKitchen').isDone && stats.tasks === count + 1 && totalScore() === score + reward, `${order.join('/')}: one task-specific first/repeat bonus`);
  }
  cleanTasks();
  life.emit('dishwasher', { washed: [] }); life.emit('wipe', { point: { x: 1, y: 1, z: 1 } });
  life.emit('rubbishOut', { amount: 0 }); life.emit('vacuumed', { amount: 0 });
  check(tasks.tasks.every((t) => !t.completedGoals.size), 'empty dishwasher, non-worktop wipe and zero amounts do not complete goals');
  stage('cloth worktop');
  // Real cloth wipes must come from the kitchen worktop.
  cloth.take(); cloth.wipe({ x: 1, y: 1, z: 1 });
  check(!task('resetKitchen').completedGoals.has('wipe'), 'real cloth outside the kitchen does not count');
  cloth.wipe(counter); cloth.putBack();
  check(task('resetKitchen').completedGoals.has('wipe'), 'real cloth on worktop completes wiping');
  for (const it of I.all().filter((it) => I.has(it, 'bin') || it.type === 'rubbishBag')) I.setAmount(it, 0);
  const useful = I.all().filter((it) => I.has(it, 'edible')).map((it) => [it.id, it.amount]);
  life.emit('washed', { what: 'koppen' });
  check(task('resetKitchen').isDone && useful.every(([id, amount]) => I.get(id)?.amount === amount), 'empty bins skip disposal without wasting useful food');
  stage('vacuum');
  // The vacuum event must come from removing actual floor mess.
  const kd = A.world.klkDoor;
  if (kd && !kd.isOpen) { kd.toggle(); for (let i = 0; i < 40; i++) kd.update(0.1); }
  vacuum.take(); vacuum.use(); life.mess.clear();
  life.mess.add('crumb', 4.3, 0, 2.6, { surf: 'floor', level: 0, amt: 0.5, room: 'Kök / matplats' });
  player.spawn(4.12, 3.75, 0); camera.rotation.set(0, 0, 0); secs(0.8);
  check(task('snackClean').isDone, 'real vacuum removes crumbs and completes clean-up'); vacuum.putBack();
  stage('pool events');
  // The extra pool candidates consume real domain events, so rotation cannot leave an impossible placeholder.
  cleanTasks();
  life.emit('vacuumed', { amount: 0.2 });
  check(task('washDish').active, 'dish chore enters the vacated slot');
  const dishScore = totalScore(), dishReward = taskReward('washDish');
  life.emit('washed', { what: 'tallriken' });
  check(task('washDish').isDone && totalScore() === dishScore + dishReward && task('makeBed').active, 'washing completes dish chore and bed chore refills immediately');
  const bedScore = totalScore(), bedReward = taskReward('makeBed');
  life.emit('bedMade', { id: 'fixture-bed' }); life.emit('bedMade', { id: 'fixture-bed' });
  check(!task('makeBed').isDone, 'bed chore requires resting too, and duplicate making is one goal');
  life.emit('bedRumpled', { id: 'fixture-bed' }); life.emit('bedRumpled', { id: 'fixture-bed' });
  check(task('makeBed').isDone && totalScore() === bedScore + bedReward, 'bed events finish once in either order');
  stage('UI cooldown persistence reset');
  // UI, cooldown repeats, persistence and input release.
  cleanTasks(); tasks.read();
  check(tasks.activeTasks().length === 3 && task('tidyHall').active && tasks.isShown('tidyHall'), 'reading discovers hall and gives it a slot without exceeding three');
  const hiddenRecord = tasks.save(); tasks.load(hiddenRecord);
  check(task('tidyHall').active && tasks.read().length === 0, 'hidden discovery and selected slots survive save/load, without another discovery');
  check(tasks.tasks.every(t => !t.active || taskReward(t.id) > 0), 'every listed task has its own positive reward');
  showTaskNote(true); tasks.setHints(true); d.getElementById('task-hints-btn').click();
  check(!tasks.hints && !d.querySelector('.task-hint') && w.localStorage.getItem('lunden.taskHints') === 'false', 'hints switch off everywhere and persist');
  check(d.querySelectorAll('.task-card').length === 3 && [...d.querySelectorAll('.task-title')].every(e => /\+\d+/.test(e.textContent)), 'panel lists exactly three tasks and their current rewards');
  check(!d.querySelector('.task-again'), 'no button bypasses the repeat cooldown');
  cleanTasks();
  const firstVacuum = taskReward('snackClean'); const firstScore = totalScore();
  life.emit('vacuumed', { amount: 0.1 });
  check(totalScore() === firstScore + firstVacuum && !task('snackClean').active, 'cleanup reward awarded once and task enters cooldown');
  const record = tasks.save(), beforeReload = totalScore(); tasks.load(record);
  tasks.update(TASK_POOL.cooldown - 1);
  check(task('snackClean').isDone && !task('snackClean').active && totalScore() === beforeReload, 'reload and elapsed time before deadline do not reset cooldown or award points');
  // Free a slot without changing the completed task's deadline.
  tasks.activeTasks().at(-1).active = false;
  tasks.update(1);
  check(task('snackClean').active && !task('snackClean').completedGoals.size, 'eligible repeat enters a free slot only after cooldown');
  const repeatScore = totalScore(), repeatReward = SCORE.tasks.snackClean.again;
  life.emit('vacuumed', { amount: 0.1 }); life.emit('vacuumed', { amount: 0.1 });
  check(totalScore() === repeatScore + repeatReward, 'repeat awards the displayed smaller reward exactly once');
  const confirmBefore = w.confirm; w.confirm = () => true;
  d.getElementById('stats-reset').click(); w.confirm = confirmBefore;
  check(stats.tasks === 0 && !Object.keys(stats.taskCounts).length && stats.legacyTaskPoints === 0 && tasks.activeTasks().length === 3 && !tasks.isShown('tidyHall') && tasks.tasks.every(t => !t.completedGoals.size && !t.completions && !t.readyAt), 'statistics reset clears task progress, discovery, completion and cooldown');
  d.getElementById('task-close').click();
  check(d.getElementById('task-note').hidden, 'close button closes panel');
  player.spawn(4.1, 3.75, 0); step(1 / 60); const before = camera.position.clone();
  A.touch.analog.y = 0.5; secs(0.15); A.touch.analog.y = 0;
  check(camera.position.distanceTo(before) > 0.01, 'movement resumes after closing the panel');
  for (const code of ['KeyE', 'Escape']) {
    showTaskNote(true); d.dispatchEvent(new w.KeyboardEvent('keydown', { code, bubbles: true }));
    check(d.getElementById('task-note').hidden, `${code} closes task panel`);
  }
  tasks.load({ v: 1, goals: { makeSandwich: ['prep', 'unknown', 'prep'], resetKitchen: 'bad' } });
  check(task('makeSandwich').completedGoals.size === 1 && !task('resetKitchen').isDone, 'save loading filters unknown goals and malformed entries');
  stage('world card raycast');
  // The card is accessible through the same raycast and action button as other world items.
  let found = false;
  const cab=A.cups.cabinet,card=tasks.card.object;
  check(card.parent===cab.door && tasks.card.blocked, 'one task card is attached to the closed cup-cabinet door and cannot be used');
  const shut=card.getWorldPosition(new (await w.eval("import('three')")).Vector3());
  let count=0;A.scene.traverse(o=>{if(o===card)count++});check(count===1, 'task card occurs exactly once, with no remaining worktop copy');
  player.spawn(4.5,1.65,0);secs(.05);camera.lookAt(shut);camera.updateMatrixWorld(true);step(1/60);
  check(A.focus().focused?.kind!=='taskNote', 'closed door physically hides the task card from the normal raycast');
  cab.toggle();for(let i=0;i<30;i++)cab.update(.1);
  const p=card.getWorldPosition(new (await w.eval("import('three')")).Vector3());
  check(p.distanceTo(shut)>.1&&!tasks.card.blocked, 'task card follows the real hinge to the opened inside face');
  for (const [x,z] of [[4.5,1.65],[4.5,2],[4.5,1.3],[4.4,1.5]]) {
    player.spawn(x,z,0); secs(0.05);
    const dx = p.x-camera.position.x, dz=p.z-camera.position.z;
    camera.rotation.y=Math.atan2(-dx,-dz); camera.rotation.x=Math.atan2(p.y-camera.position.y,Math.hypot(dx,dz)); step(1/60);
    if (A.focus().focused?.kind === 'taskNote') { found = true; d.getElementById('action').click(); break; }
  }
  check(found && !d.getElementById('task-note').hidden, 'world task card can be aimed at and opened using the touch action');
  tasks.setHints(true);
  stage('finished');
  document.getElementById('out').textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
} catch (e) { document.getElementById('out').textContent = `FAIL ${e.stack}\n${lines.join('\n')}`; }
</script></body></html>
