<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Bottles and glasses test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Bottles and glasses (#152): take a wine bottle out of the rack, stand it on the coffee table, take it again,
// put it back in its place; a glass from the BESTÅ onto the dining table; F sends everything home.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/thingtest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { things, use, heldItem, step, toggleFurniture, camera } = w.__app;
  const V = camera.position.constructor;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const kinds = things.reduce((m, t) => ({ ...m, [t.kind]: (m[t.kind] ?? 0) + 1 }), {});
  let pass = check(kinds.wine + kinds.champagne === 8 && kinds.whisky === 6 && kinds.glass >= 10, `things: ${JSON.stringify(kinds)}`);
  const up = (t) => new V(0, 1, 0).applyQuaternion(t.model.getWorldQuaternion(new w.__app.camera.quaternion.constructor())).y;
  const wine = things.find((t) => t.kind === 'wine');
  pass &= check(Math.abs(up(wine)) < 0.05, 'the wine bottle lies level in the rack');
  use(wine.target); step(1 / 60);
  pass &= check(heldItem() === wine, 'the bottle in the hand');
  wine.placeAt(new V(3.6, 0.47, 10.4)); step(1 / 60);
  pass &= check(wine.placed && up(wine) > 0.99 && Math.abs(wine.model.position.y - 0.47) < 0.01, `standing on the coffee table (y ${wine.model.position.y.toFixed(3)})`);
  use(wine.target); step(1 / 60);
  pass &= check(heldItem() === wine, 'taken again');
  use(wine.backTarget); step(1 / 60);
  pass &= check(!wine.held && !wine.placed && wine.model.position.distanceTo(wine.home.pos) < 1e-4 && Math.abs(up(wine)) < 0.05, 'back in the rack, lying');
  const glass = things.find((t) => t.kind === 'glass');
  use(glass.target); step(1 / 60);
  glass.placeAt(new V(3.5, 0.75, 1.6)); step(1 / 60);
  pass &= check(glass.placed && up(glass) > 0.99, 'a glass on the dining table');
  const whisky = things.find((t) => t.kind === 'whisky');
  use(whisky.target); step(1 / 60);
  pass &= check(heldItem() === whisky, 'a whisky bottle in the hand');
  toggleFurniture(false); step(1 / 60);
  pass &= check(!heldItem() && !glass.placed && glass.model.position.distanceTo(glass.home.pos) < 1e-4 && !whisky.held, 'F: everything goes home');
  toggleFurniture(true); step(1 / 60);
  // pouring (#167): a wine glass on the coffee table, wine from a bottle, drink it empty; then whisky in a tumbler
  const steps = (s) => { for (let t = 0; t < s; t += 1 / 30) step(1 / 30); };
  const wg = things.find((t) => t.name === 'vinglaset'), tumbler = things.find((t) => t.name === 'whiskyglaset');
  use(wg.target); step(1 / 60); wg.placeAt(new V(3.6, 0.47, 10.3)); step(1 / 60);
  use(wine.target); step(1 / 60);
  pass &= check(heldItem() === wine && wg.target.verb === 'hälla vin i' && !wg.target.blocked, `the bottle over the glass: "${wg.target.verb}"`);
  use(wg.target); steps(0.5);
  pass &= check(wg.fill > 0.05 && wg.fill < 0.4 && wine.tilt > 0.5, `filling (${wg.fill.toFixed(2)}), the bottle tipped (${wine.tilt.toFixed(2)})`);
  steps(1);
  pass &= check(Math.abs(wg.fill - 0.45) < 1e-6 && wg.contents.main === 'wine' && wg.liquid.mesh.visible && wine.tilt < 0.1, `wine in the glass (fill ${wg.fill.toFixed(2)}), the bottle upright again`);
  pass &= check(wg.target.blocked && wg.target.blockedText === 'Vinglaset är fullt', `full: "${wg.target.blockedText}"`);
  const red = wg.liquid.material.color.getHexString();
  use(wine.backTarget); step(1 / 60);
  use(wg.target); step(1 / 60);
  pass &= check(heldItem() === wg && wg.useLabel === 'Drick', 'the filled glass in the hand: "Drick"');
  const s0 = w.__app.stats.wine;
  let sips = 0;
  while (wg.fill > 0.01 && sips < 10) { wg.use(); sips++; steps(0.7); }
  pass &= check(wg.fill === 0 && sips === 3 && w.__app.stats.wine === s0 + 3 && !wg.liquid.mesh.visible && wg.useLabel === null, `drunk empty in ${sips} sips`);
  wg.placeAt(new V(3.6, 0.47, 10.3)); step(1 / 60);
  use(tumbler.target); step(1 / 60); tumbler.placeAt(new V(3.3, 0.47, 10.3)); step(1 / 60);
  use(whisky.target); step(1 / 60);
  pass &= check(tumbler.target.verb === 'hälla whisky i', `"${tumbler.target.verb}"`);
  use(tumbler.target); steps(1.5);
  pass &= check(Math.abs(tumbler.fill - 0.2) < 1e-6 && tumbler.contents.main === 'whisky' && tumbler.liquid.material.color.getHexString() !== red, `a splash of whisky (${tumbler.fill.toFixed(2)}, #${tumbler.liquid.material.color.getHexString()} vs wine #${red})`);
  use(tumbler.target); steps(1.5);
  pass &= check(Math.abs(tumbler.fill - 0.4) < 1e-6, `another splash (${tumbler.fill.toFixed(2)})`);
  use(whisky.backTarget); step(1 / 60);
  use(tumbler.target); step(1 / 60); tumbler.use(); steps(0.7);
  pass &= check(Math.abs(tumbler.fill - 0.25) < 1e-6, `a sip of whisky (${tumbler.fill.toFixed(2)})`);
  pass &= check(!tumbler.pourable, 'the held glass can\'t be poured into');
  use(tumbler.backTarget); step(1 / 60);
  pass &= check(tumbler.fill === 0 && !tumbler.liquid.mesh.visible, 'back in the BESTÅ: empty');
  use(wine.target); step(1 / 60); use(wg.target); steps(1.5);
  pass &= check(wg.fill > 0.4, 'wine in the glass again');
  toggleFurniture(false); step(1 / 60);
  pass &= check(!heldItem() && !wg.placed && wg.fill === 0 && !wine.held, 'F: the glass goes home empty, the bottle too');
  toggleFurniture(true); step(1 / 60);
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
