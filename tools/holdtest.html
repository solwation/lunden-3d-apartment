<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Hold test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Holding and putting things down (#102): take a cup, put it on the coffee table; take the lightsaber;
// the cup can't be taken while the saber is in the hand; the saber goes down lying on the dining table;
// then the cup can be taken, and goes down standing on the floor; F sends everything home.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/holdtest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html?time=12&freeze';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, step, cups, saber, world, heldItem, scene } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  const V = camera.position.constructor;
  // look at world point p from one of the stands (or a ring around p) until the button matches
  const lookAt = (p, re, stands) => {
    const up = p.y > 3 ? 3.25 : 0;
    stands ??= [...Array(12)].map((_, i) => [p.x + Math.sin(i / 12 * 6.283) * (0.8 + (i % 2) * 0.3), p.z + Math.cos(i / 12 * 6.283) * (0.8 + (i % 2) * 0.3)]);
    for (const [x, z] of stands) {
      player.spawn(x, z, 0); player.pos.y = up; player.eyeY = up + 1.62;
      for (let i = 0; i < 3; i++) step(1 / 60);
      scene.updateMatrixWorld(true);
      const dx = p.x - camera.position.x, dz = p.z - camera.position.z;
      camera.rotation.y = Math.atan2(-dx, -dz); camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz));
      step(1 / 60);
      if (!btn.hidden && re.test(btn.textContent)) return true;
    }
    return false;
  };
  const at = (o) => { o.updateMatrixWorld(true); return o.getWorldPosition(new V()); };
  let pass = true;
  // a full cup on the worktop (brew, take out, pour — cuptest covers those steps)
  const cup = cups.cups[0], mocca = world.lids.find((l) => l.kind === 'coffee');
  mocca.toggle(); for (let i = 0; i < 20 * 30; i++) mocca.update(1 / 30);
  cup.take(); cup.placeAt(cup.counter); cup.setFill(1); for (let i = 0; i < 10; i++) step(1 / 60); // a full cup on the worktop (#141)
  const cupAt = () => at(cup.model).add(new V(0, 0.05, 0));
  pass &= check(lookAt(cupAt(), /ta koppen/i, [[4.4, 1.7], [4.3, 1.4], [4.5, 2.0]]), `take the cup: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === cup, 'cup in the hand');
  const coffee = { x: 3.64, y: 0.47, z: 10.56 };
  pass &= check(lookAt(coffee, /ställa ner koppen här/i, [[3.6, 9.4], [3.0, 9.6], [4.4, 9.5]]), `coffee table: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(!heldItem() && cup.state === 'placed' && Math.abs(cup.model.position.y - 0.47) < 0.02, `the cup on the coffee table (y ${cup.model.position.y.toFixed(3)})`);
  // the lightsaber
  const sp = at(saber.model);
  pass &= check(lookAt(sp, /ta lightsabern/i), `the saber: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === saber, 'the saber in the hand');
  // the cup is blocked now
  pass &= check(lookAt(cupAt(), /lägg ifrån dig det du håller först/i, [[3.6, 9.4], [3.0, 9.6], [4.4, 9.5]]), `the cup while holding the saber: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === saber && cup.state === 'placed', 'still the saber in the hand, the cup stays');
  // the saber goes down on the dining table, lying flat
  const table = { x: 3.5, y: 0.75, z: 1.6 };
  pass &= check(lookAt(table, /lägga ner lightsabern här/i, [[2.6, 2.2], [2.5, 1.6], [3.5, 2.6]]), `dining table: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  saber.model.updateMatrixWorld(true);
  // the saber's lowest / highest vertex in the world
  let lo = Infinity, hi = -Infinity;
  saber.model.traverse((m) => {
    if (!m.isMesh || !m.visible) return;
    const a = m.geometry.attributes.position;
    for (let k = 0; k < a.count; k++) { const y = m.localToWorld(new V().fromBufferAttribute(a, k)).y; lo = Math.min(lo, y); hi = Math.max(hi, y); }
  });
  pass &= check(!heldItem() && saber.placed && Math.abs(lo - 0.75) < 0.02 && hi - lo < 0.08, `the saber lies on the table (bottom ${lo.toFixed(3)}, ${((hi - lo) * 100).toFixed(1)} cm high)`);
  // now the cup can be taken, and goes down on the floor, standing
  pass &= check(lookAt(cupAt(), /ta koppen/i, [[3.6, 9.4], [3.0, 9.6], [4.4, 9.5]]), `the cup again: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === cup, 'the cup in the hand');
  player.spawn(1.5, 8.6, Math.PI); for (let i = 0; i < 3; i++) step(1 / 60);
  camera.rotation.y = Math.PI; camera.rotation.x = -0.9; step(1 / 60);
  pass &= check(/ställa ner koppen här/i.test(btn.textContent), `the floor: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(!heldItem() && cup.state === 'placed' && Math.abs(cup.model.position.y) < 0.01 && Math.abs(cup.model.rotation.x) < 1e-6, `the cup stands on the floor (y ${cup.model.position.y.toFixed(3)})`);
  // F: everything put down goes home
  w.__app.toggleFurniture(false);
  pass &= check(!world.furnitureOn && !saber.placed && Math.abs(cup.model.position.z - cup.counter.z) < 0.01, 'F: the saber is home, the cup on the worktop');
  w.__app.toggleFurniture(true);
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
