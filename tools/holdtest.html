<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Hold test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Holding and putting things down (#102): take a cup, put it on the coffee table; take the lightsaber;
// the cup can't be taken while the saber is in the hand; the saber goes down lying on the dining table;
// then the cup can be taken, and goes down standing on the floor; F sends everything home. Pingping (#269): in your
// arms, a hug, on the sofa, back in the bed, F. The photo of Miele (#322): take it, look at it up close, on the window board, F.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/holdtest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html?time=12&freeze';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, step, cups, saber, world, heldItem, scene } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  const V = camera.position.constructor;
  // look at world point p from one of the stands (or a ring around p) until the button matches
  const lookAt = (p, re, stands) => {
    const up = p.y > 3 ? 3.25 : 0;
    stands ??= [...Array(12)].map((_, i) => [p.x + Math.sin(i / 12 * 6.283) * (0.8 + (i % 2) * 0.3), p.z + Math.cos(i / 12 * 6.283) * (0.8 + (i % 2) * 0.3)]);
    for (const [x, z] of stands) {
      player.spawn(x, z, 0); player.pos.y = up; player.eyeY = up + 1.62;
      for (let i = 0; i < 3; i++) step(1 / 60);
      scene.updateMatrixWorld(true);
      const dx = p.x - camera.position.x, dz = p.z - camera.position.z;
      camera.rotation.y = Math.atan2(-dx, -dz); camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz));
      step(1 / 60);
      if (!btn.hidden && re.test(btn.textContent)) return true;
    }
    return false;
  };
  const at = (o) => { o.updateMatrixWorld(true); return o.getWorldPosition(new V()); };
  let pass = true;
  // a full cup on the worktop (brew, take out, pour — cuptest covers those steps)
  const cup = cups.cups[0], mocca = world.lids.find((l) => l.kind === 'coffee');
  mocca.toggle(); for (let i = 0; i < 20 * 30; i++) mocca.update(1 / 30);
  cup.take(); cup.placeAt(cup.counter); cup.setFill(1); for (let i = 0; i < 10; i++) step(1 / 60); // a full cup on the worktop (#141)
  const cupAt = () => at(cup.model).add(new V(0, 0.05, 0));
  pass &= check(lookAt(cupAt(), /ta koppen/i, [[4.4, 1.7], [4.3, 1.4], [4.5, 2.0]]), `take the cup: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === cup, 'cup in the hand');
  const coffee = { x: 3.64, y: 0.47, z: 10.56 };
  pass &= check(lookAt(coffee, /ställa ner koppen här/i, [[3.6, 9.4], [3.0, 9.6], [4.4, 9.5]]), `coffee table: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(!heldItem() && cup.state === 'placed' && Math.abs(cup.model.position.y - 0.47) < 0.02, `the cup on the coffee table (y ${cup.model.position.y.toFixed(3)})`);
  // the lightsaber
  const sp = at(saber.model);
  pass &= check(lookAt(sp, /ta lightsabern/i), `the saber: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === saber, 'the saber in the hand');
  // the cup is blocked now
  pass &= check(lookAt(cupAt(), /lägg ifrån dig det du håller först/i, [[3.6, 9.4], [3.0, 9.6], [4.4, 9.5]]), `the cup while holding the saber: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === saber && cup.state === 'placed', 'still the saber in the hand, the cup stays');
  // the saber goes down on the dining table, lying flat
  const table = { x: 3.5, y: 0.75, z: 1.6 };
  pass &= check(lookAt(table, /lägga ner lightsabern här/i, [[2.6, 2.2], [2.5, 1.6], [3.5, 2.6]]), `dining table: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  saber.model.updateMatrixWorld(true);
  // the saber's lowest / highest vertex in the world
  let lo = Infinity, hi = -Infinity;
  saber.model.traverse((m) => {
    if (!m.isMesh || !m.visible) return;
    const a = m.geometry.attributes.position;
    for (let k = 0; k < a.count; k++) { const y = m.localToWorld(new V().fromBufferAttribute(a, k)).y; lo = Math.min(lo, y); hi = Math.max(hi, y); }
  });
  pass &= check(!heldItem() && saber.placed && Math.abs(lo - 0.75) < 0.02 && hi - lo < 0.08, `the saber lies on the table (bottom ${lo.toFixed(3)}, ${((hi - lo) * 100).toFixed(1)} cm high)`);
  // now the cup can be taken, and goes down on the floor, standing
  pass &= check(lookAt(cupAt(), /ta koppen/i, [[3.6, 9.4], [3.0, 9.6], [4.4, 9.5]]), `the cup again: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === cup, 'the cup in the hand');
  player.spawn(1.5, 8.6, Math.PI); for (let i = 0; i < 3; i++) step(1 / 60);
  camera.rotation.y = Math.PI; camera.rotation.x = -0.9; step(1 / 60);
  pass &= check(/ställa ner koppen här/i.test(btn.textContent), `the floor: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(!heldItem() && cup.state === 'placed' && Math.abs(cup.model.position.y) < 0.01 && Math.abs(cup.model.rotation.x) < 1e-6, `the cup stands on the floor (y ${cup.model.position.y.toFixed(3)})`);
  // F: everything put down goes home
  w.__app.toggleFurniture(false);
  pass &= check(!world.furnitureOn && !saber.placed && cup.state !== 'placed' && cups.cups.filter((c) => c.state === 'cabinet').length === 3, 'F: the saber is home, the cup off the floor, three cups in the cabinet (#215)');
  w.__app.toggleFurniture(true);
  // the hand (#195): hidden with nothing in the hand, holding a thing it sits at its grip and follows it
  const { hand } = w.__app;
  step(1 / 60);
  pass &= check(!heldItem() && !hand.visible, 'empty hand: no arm');
  saber.take(); step(1 / 60);
  camera.updateMatrixWorld(); scene.updateMatrixWorld(true);
  const palm = hand.hand.getWorldPosition(new V()), gripW = saber.model.localToWorld(hand.gripOf(saber).clone());
  pass &= check(hand.visible && palm.distanceTo(gripW) < 0.08, `holding the saber: the hand at its grip (${palm.distanceTo(gripW).toFixed(3)} m)`);
  saber.putBack(); step(1 / 60);
  pass &= check(!hand.visible, 'put back: the arm is gone');
  // E on a door: the arm reaches out and comes back
  const door = world.doors.find((d) => d.object.position.y < 1);
  const dp = door.pickable.getWorldPosition(new V());
  hand.reach(dp); step(0.15);
  const out1 = hand.visible, far = hand.hand.getWorldPosition(new V()).distanceTo(camera.position);
  for (let i = 0; i < 20; i++) step(1 / 30);
  pass &= check(out1 && far > 0.3 && !hand.visible, `a reach: out (${far.toFixed(2)} m from the eye), then back out of sight`);
  // Pingping (#269): in the bed between the pillows; take him in your arms (both hands), hug him (pulled in, squashed,
  // counted, hearts), put him on the sofa (a cup can't go there), back in the bed, and F sends him home from the floor
  const { pingping, stats } = w.__app;
  const P = pingping.home.pos.clone();
  pass &= check(Math.abs(P.y - 3.86) < 0.05 && P.x > 5 && P.z > 2 && P.z < 2.6, `Pingping on the mattress between the pillows (${P.x.toFixed(2)}, ${P.y.toFixed(2)}, ${P.z.toFixed(2)})`);
  const bedStands = [[3.3, 2.3], [3.1, 2.0], [3.3, 2.6]];
  pass &= check(lookAt(P.clone().setY(P.y + 0.2), /ta pingping/i, bedStands), `take him: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === pingping && hand.visible && hand.left.hand.visible, 'Pingping in your arms: both hands');
  camera.updateMatrixWorld(); scene.updateMatrixWorld(true);
  const rG = pingping.model.localToWorld(new V(...pingping.hugGrips[0])), lG = pingping.model.localToWorld(new V(...pingping.hugGrips[1]));
  const rH = hand.hand.getWorldPosition(new V()), lH = hand.left.hand.getWorldPosition(new V());
  pass &= check(rH.distanceTo(rG) < 0.1 && lH.distanceTo(lG) < 0.1 && rH.distanceTo(lG) > 0.25, `the hands on his sides (right ${rH.distanceTo(rG).toFixed(3)}, left ${lH.distanceTo(lG).toFixed(3)} m)`);
  camera.rotation.x = 0.4; step(1 / 60); // nothing in front: the touch button hugs
  pass &= check(/krama/i.test(btn.textContent), `the touch button: "${btn.textContent}"`);
  const hugs0 = stats.pingpingHugs ?? 0, z0 = pingping.model.position.z;
  btn.click(); for (let i = 0; i < 15; i++) step(1 / 60);
  const sq = pingping.model.scale.z, pz = pingping.model.position.z;
  pass &= check(sq < 0.9 && pz > z0 + 0.04 && stats.pingpingHugs === hugs0 + 1 && pingping.hearts.points.visible, `a hug: squashed to ${sq.toFixed(2)}, pulled in ${((pz - z0) * 100).toFixed(0)} cm, counted, hearts`);
  for (let i = 0; i < 60; i++) step(1 / 60);
  pass &= check(Math.abs(pingping.model.scale.z - 1) < 1e-6 && Math.abs(pingping.model.position.z - z0) < 1e-6, 'and back to his shape');
  // on the sofa
  const seat = { x: 4.0, y: 0.44, z: 11.5 }, sofaStands = [[4.0, 9.9], [3.6, 9.9], [4.4, 9.9]]; // the middle of the three seats
  pass &= check(lookAt(seat, /sätta ner pingping här/i, sofaStands), `the sofa: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(!heldItem() && pingping.placed && Math.abs(pingping.model.position.y - 0.44) < 0.02 && Math.abs(pingping.model.rotation.x) < 1e-6, `he sits on the sofa (y ${pingping.model.position.y.toFixed(3)})`);
  const cup2 = cups.cups.find((c) => c.state === 'cabinet') ?? cups.cups[1];
  cup2.take(); step(1 / 60);
  player.spawn(4.6, 10.0, 0); for (let i = 0; i < 3; i++) step(1 / 60);
  { const dx = 4.0 - camera.position.x, dz = 11.5 - camera.position.z; camera.rotation.y = Math.atan2(-dx, -dz); camera.rotation.x = Math.atan2(0.44 - camera.position.y, Math.hypot(dx, dz)); }
  step(1 / 60);
  pass &= check(!/koppen här/i.test(btn.textContent), `a cup can't go on the sofa: "${btn.textContent}"`);
  cup2.putBack(); step(1 / 60);
  // back in the bed
  pass &= check(lookAt(at(pingping.model).add(new V(0, 0.2, 0)), /ta pingping/i, sofaStands), `take him from the sofa: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(lookAt(P.clone().setY(P.y + 0.15), /lägga tillbaka pingping i sängen/i, bedStands), `his place in the bed: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(!heldItem() && !pingping.placed && pingping.model.position.distanceTo(P) < 1e-6, 'back between the pillows');
  // on the floor, then F
  pingping.take(); step(1 / 60);
  player.spawn(1.5, 8.6, Math.PI); for (let i = 0; i < 3; i++) step(1 / 60);
  camera.rotation.y = Math.PI; camera.rotation.x = -0.9; step(1 / 60);
  pass &= check(/sätta ner pingping här/i.test(btn.textContent), `the floor: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(pingping.placed && Math.abs(pingping.model.position.y) < 0.01, 'he sits on the floor');
  w.__app.toggleFurniture(false);
  pass &= check(!pingping.placed && pingping.model.position.distanceTo(P) < 1e-6, 'F: Pingping is home in the bed');
  w.__app.toggleFurniture(true);
  // the framed photo of Miele (#322) on Sovrum 1's window board: take it, look at it up close and back, down on the
  // board elsewhere, F home
  try {
  const photo = w.__app.things.find((t) => t.kind === 'photo'), M = photo.home.pos.clone();
  pass &= check(Math.abs(M.y - 3.95) < 0.01 && M.z > 0.2 && M.z < 0.495 && Math.abs(M.x - 4.08) < 0.01, `Miele's photo on the window board (${M.x.toFixed(2)}, ${M.y.toFixed(2)}, ${M.z.toFixed(2)})`);
  const sillStands = [[4.08, 1.2], [3.9, 1.1], [4.3, 1.3], [4.08, 1.5]];
  pass &= check(lookAt(M.clone().setY(M.y + 0.07), /ta fotot av miele/i, sillStands), `take it: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  camera.rotation.x = 1.3; step(1 / 60); // at the ceiling: nothing in focus, the button uses what you hold
  pass &= check(heldItem() === photo && btn.textContent === 'Titta på Miele', `in the hand: "${btn.textContent}"`);
  const far = photo.model.position.z;
  btn.click(); for (let i = 0; i < 30; i++) step(1 / 60);
  pass &= check(photo.looking && photo.model.position.z > far + 0.1 && Math.abs(photo.model.position.x) < 0.02, `up close: z ${far.toFixed(2)} → ${photo.model.position.z.toFixed(2)}`);
  photo.use(); for (let i = 0; i < 40; i++) step(1 / 60);
  pass &= check(!photo.looking && Math.abs(photo.model.position.z - far) < 0.01, 'and back down');
  const spot = new V(3.55, 3.955, 0.42);
  pass &= check(lookAt(spot, /ställa ner fotot av miele här/i, [[3.55, 1.1], [3.4, 1.2], [3.7, 1.0]]), `between the orchid and the speaker: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(photo.placed && Math.abs(photo.model.position.y - 3.95) < 0.01, `it stands on the board (y ${photo.model.position.y.toFixed(3)})`);
  w.__app.toggleFurniture(false);
  pass &= check(!photo.placed && photo.model.position.distanceTo(M) < 1e-6, 'F: back in its place');
  w.__app.toggleFurniture(true);
  } catch (e) { pass = false; lines.push(`FAIL error ${e.stack}`); }
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
