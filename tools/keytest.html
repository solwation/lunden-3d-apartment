<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Key cabinet test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Hall key cabinet test: aim at the Solstickan cabinet, open it with the action button, the car key
// becomes a target only once it is open, pressing it beeps (presses counter + LED) and calls the car (#173), close again.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/keytest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
f.src = '../index.html';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, world, step } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const cab = world.lids.find((l) => l.kind === 'keybox');
  const key = world.carKey;
  const btn = d.getElementById('action');
  const aim = (obj) => { // stand 0.9 m in front of the cabinet (along its facing), look straight at it
    cab.object.updateMatrixWorld(true); // no render runs: refresh the (animated) door's matrices
    const p = obj.getWorldPosition(new obj.position.constructor()); // the iframe's THREE.Vector3
    const ry = cab.object.getWorldQuaternion(new camera.quaternion.constructor()), n = new p.constructor(0, 0, 1).applyQuaternion(ry);
    player.spawn(p.x + n.x * 0.9, p.z + n.z * 0.9, 0);
    for (let i = 0; i < 3; i++) step(1 / 60); // collision may nudge the player off the wall first
    camera.rotation.y = Math.atan2(-(p.x - player.pos.x), -(p.z - player.pos.z));
    camera.rotation.x = Math.atan2(p.y - player.eyeY, Math.hypot(p.x - player.pos.x, p.z - player.pos.z));
    step(1 / 60);
  };
  let pass = check(!!(cab && key), 'cabinet + car key exist');
  const car0 = w.__app.car, garage = w.__app.world.garage;
  pass &= check(car0.state === 'garage' && garage.inside(car0.object.position.x, car0.object.position.z) && car0.object.visible && garage.door.t === 0,
    `#358: the car starts in its stall in the garage (${car0.state} at ${car0.object.position.x.toFixed(2)}, ${car0.object.position.z.toFixed(2)}), the door shut`);
  aim(cab.door.children[0]);
  pass &= check(!btn.hidden && /öppna nyckelskåpet/i.test(btn.textContent), `closed: button "${btn.textContent}"`);
  aim(key.object.children[1]); // the fob, behind the closed door
  pass &= check(!/bilnyckeln/i.test(btn.textContent), `key not reachable while closed ("${btn.textContent}")`);
  aim(cab.door.children[0]);
  btn.click();
  for (let i = 0; i < 90; i++) step(1 / 60);
  pass &= check(cab.isOpen && cab.keyReachable, `cabinet open (t=${cab.t.toFixed(2)})`);
  aim(key.object.children[1]);
  pass &= check(!btn.hidden && /trycka på bilnyckeln/i.test(btn.textContent), `open: button "${btn.textContent}"`);
  btn.click();
  step(1 / 60);
  pass &= check(key.presses === 1 && key.blink > 0, `beep beep (presses=${key.presses}, led blinking=${key.blink > 0})`);
  for (let i = 0; i < 60; i++) step(1 / 60);
  pass &= check(key.blink === 0, 'LED goes out');
  // the car (#173): it came along the street when the key beeped, and stops in front of the entrance
  const car = w.__app.car;
  // #267: the camera stands still at the cabinet while the car drives in; every one of its meshes near enough to be
  // drawn (closer than the detail culler's cut for it) must be on a drawn layer — not left hidden from when it was far
  const items = w.__app.detail().items.filter((it) => { let o = it.o; while (o && o !== car.object) o = o.parent; return !!o; });
  const eye = camera.getWorldPosition(new camera.position.constructor()), c = new eye.constructor();
  let culled = 0, checked = 0;
  const drawn = () => { if (w.__app.world.garage.inside(car.object.position.x, car.object.position.z)) return; /* (#358: underground it is out of sight anyway) */ car.object.updateMatrixWorld(true); /* as a render would */ for (const it of items) { c.copy(it.center).applyMatrix4(it.o.matrixWorld); if (c.distanceTo(eye) > it.cut * 0.95) continue; checked++; if (!it.o.layers.isEnabled(0)) culled++; } };
  pass &= check(car.state === 'arriving' && car.object.visible && garage.door.target === 1, `the car is on its way (${car.state}), the garage door opening`);
  // #356: as it drives, it stays on asphalt (the road, the drive, the car park); cartest checks the whole body
  // (#358: or in the garage)
  const { onRoad } = await w.eval(`import('${new URL('../src/roads.js', location.href)}')`);
  const { SITE } = await w.eval(`import('${new URL('../src/config.js', location.href)}')`);
  const GD = SITE.terrain.garageDoor;
  let offRoad = 0, driven = 0, waited = 0, doorOpenAtPass = true, outAt = null;
  const onAsphalt = () => { driven++; const { x, z } = car.object.position;
    const drive = x >= GD.drive && x <= GD.x + 0.1 && z >= GD.z0 - 0.5 && z <= GD.z1 + 0.5;
    if (!onRoad(x, z) && !garage.inside(x, z) && !drive) offRoad++;
    if (Math.abs(x - GD.x) < 0.3 && z > GD.z0 && z < GD.z1 && garage.door.t < 0.95) doorOpenAtPass = false; };
  for (let i = 0; i < 60 * 120 && car.state === 'arriving'; i++) { step(1 / 60); drawn(); onAsphalt(); if (car.speed === 0) waited++; if (outAt === null && car.object.position.x < GD.x - 3) outAt = i / 60; }
  pass &= check(outAt !== null && doorOpenAtPass, `out of the garage after ${outAt?.toFixed(1)} s, the door open as it passed`);
  pass &= check(driven > 100 && offRoad === 0, `arriving on asphalt all the way (#356; ${offRoad} of ${driven} frames off it)`);
  pass &= check(items.length > 20 && checked > 0 && culled === 0, `arriving with the camera still: every car mesh near enough is drawn (#267; ${items.length} meshes, ${culled} of ${checked} checks hidden)`);
  culled = checked = 0;
  const p = car.object.position;
  pass &= check(car.state === 'parked' && Math.abs(p.x - 2.9) < 0.05 && Math.abs(p.z + 5.4) < 0.05 && Math.abs(car.object.rotation.y) < 0.05 && car.segments().length === 4, `parked right outside our door, heading east (#208), at (${p.x.toFixed(2)}, ${p.z.toFixed(2)}), a collision box`);
  pass &= check(car.plateText === 'FGZ 56D' && car.plates.length === 2, `plates front and back: ${car.plateText}`);
  aim(key.object.children[1]); btn.click(); step(1 / 60);
  pass &= check(car.state === 'leaving' && key.presses === 2, 'beep beep again: it drives off');
  let turned = false;
  offRoad = driven = 0;
  doorOpenAtPass = true;
  for (let i = 0; i < 60 * 120 && car.state === 'leaving'; i++) { step(1 / 60); drawn(); if (car.object.visible) onAsphalt(); if (Math.abs(car.object.rotation.y - Math.PI) < 0.01) turned = true; }
  pass &= check(driven > 100 && offRoad === 0, `leaving on asphalt all the way (#356; ${offRoad} of ${driven} frames off it)`);
  pass &= check(checked > 0 && culled === 0, `leaving: every car mesh near enough is drawn (#267; ${culled} of ${checked} checks hidden)`);
  const cp = car.object.position;
  pass &= check(car.state === 'garage' && car.object.visible && turned && car.segments().length === 0 && Math.abs(cp.x - 1.895) < 0.05 && Math.abs(cp.z - 14.82) < 0.05 && doorOpenAtPass,
    `#358: it U-turned (${turned}) and drove back into its stall (${car.state} at ${cp.x.toFixed(2)}, ${cp.z.toFixed(2)}), through the open door (${doorOpenAtPass})`);
  for (let i = 0; i < 60 * 40 && garage.door.t > 0; i++) step(1 / 60);
  pass &= check(garage.door.t === 0 && garage.door.segments().length === 1, 'the garage door shuts behind it');
  // #267 again: the visitor walked out onto the street while the car was gone far away (its small parts were judged
  // too far to draw), then stands still and calls it from there: they must show up as it comes near
  player.spawn(1.2, -2.2, 0);
  camera.rotation.set(0, 0, 0);
  for (let i = 0; i < 5; i++) step(1 / 60);
  eye.copy(camera.getWorldPosition(c));
  const hiddenFar = items.filter((it) => !it.o.layers.isEnabled(0)).length;
  car.call();
  culled = checked = 0;
  for (let i = 0; i < 60 * 120 && car.state === 'arriving'; i++) { step(1 / 60); drawn(); }
  pass &= check(car.state === 'parked' && checked > 0 && culled === 0, `called from the street, standing still: every car mesh near enough is drawn (#267; ${hiddenFar} hidden while far, ${culled} of ${checked} checks hidden)`);
  car.call();
  for (let i = 0; i < 60 * 120 && car.state === 'leaving'; i++) step(1 / 60);
  cab.toggle();
  for (let i = 0; i < 90; i++) step(1 / 60);
  pass &= check(!cab.isOpen && !cab.keyReachable, 'cabinet closes');
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
