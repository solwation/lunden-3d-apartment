<!doctype html><meta charset="utf-8"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><pre id="out">Native spatial allocation/parity…</pre>
<script type="module">
import * as T from 'three';
const checks=[],rows=[],check=(ok,label)=>{checks.push({ok,label});if(!ok)throw Error(label)},sleep=()=>new Promise(r=>setTimeout(r,0));
let webglCalls=0;const context=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(k,...args){if(/webgl/i.test(k)){webglCalls++;throw Error('No WebGL allowed')}return context.call(this,k,...args)};
const load=(v,instrument,id)=>import(`../src/combatworld.js?spatial=${v}-${instrument}-${id}`);
const equal=(a,b)=>Object.keys(a).every(k=>a[k].length===b[k].length&&a[k].every((x,i)=>x===b[k][i]));
const digest=async bytes=>Object.fromEntries(await Promise.all(Object.entries(bytes).map(async([k,b])=>[k,Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',b))).map(v=>v.toString(16).padStart(2,'0')).join('')])));
function decode(data){const g=new T.BufferGeometry(),typed=x=>{const s=atob(x.data),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new window[x.type](b.buffer)};for(const[n,a]of Object.entries(data.attributes))g.setAttribute(n,new T.BufferAttribute(typed(a),a.itemSize,a.normalized));if(data.index)g.setIndex(new T.BufferAttribute(typed(data.index),1));for(const q of data.groups)g.addGroup(q.start,q.count,q.materialIndex);g.setDrawRange(data.drawRange.start,data.drawRange.count??Infinity);if(data.boundingBox)g.boundingBox=new T.Box3(new T.Vector3(...data.boundingBox.min),new T.Vector3(...data.boundingBox.max));if(data.boundingSphere)g.boundingSphere=new T.Sphere(new T.Vector3(...data.boundingSphere.center),data.boundingSphere.radius);return g;}
async function spatial(mod,g,stopReady=true){const e=mod.spatialProbe.queue(g),times={scan:0,count:0,fill:0},operations={scan:0,count:0,fill:0,bitmap:0},start=performance.now();check(!e.spatial.scratch,'scratch absent at untouched admission');while(!(stopReady?e.spatialReady:e.settled)){const phase=e.scan<e.position.count?'scan':!e.spatialReady?(e.spatial.phase?'fill':'count'):'bitmap',at=performance.now();let n=0;while(n++<1024&&!(stopReady?e.spatialReady:e.settled)&&(e.scan<e.position.count?'scan':!e.spatialReady?(e.spatial.phase?'fill':'count'):'bitmap')===phase){mod.spatialProbe.advance(e);operations[phase]++;}if(phase!=='bitmap')times[phase]+=performance.now()-at;if(performance.now()-start>20000)throw Error('Bounded native build exceeded');await sleep();}return{e,times,operations,arrays:mod.spatialProbe.arrays(),buffers:mod.spatialProbe.bytes(g)}}
function metadata(h){return {distance:h.distance,point:h.point.toArray(),normal:h.normal?.toArray(),uv:h.uv?.toArray(),faceIndex:h.faceIndex,face:h.face}};
function nativeParity(mod,g,label){const scene=new T.Scene(),ghosts=new T.Group(),camera=new T.PerspectiveCamera(),materials=[new T.MeshBasicMaterial({side:T.DoubleSide}),new T.MeshBasicMaterial({side:T.BackSide})],mesh=new T.Mesh(g,g.groups.length?materials:materials[0]);scene.add(mesh,ghosts,camera);scene.updateMatrixWorld(true);const p=g.attributes.position,idx=g.index;let ray;for(let i=g.drawRange.start;i<Math.min(idx?.count??p.count,g.drawRange.start+g.drawRange.count);i+=3){const v=[0,1,2].map(c=>new T.Vector3().fromBufferAttribute(p,idx?idx.getX(i+c):i+c)),normal=v[1].clone().sub(v[0]).cross(v[2].clone().sub(v[0]));if(normal.length()>1e-8){normal.normalize();const centre=v[0].clone().add(v[1]).add(v[2]).multiplyScalar(1/3);ray=new T.Raycaster(centre.clone().addScaledVector(normal,.2),normal.clone().negate(),0,.4);break}}if(!ray)throw Error('No nondegenerate native probe');ray.camera=camera;const expected=ray.intersectObjects(scene.children,true),actual=mod.combatWorldHits(scene,ghosts,camera,ray);check(expected.length>0,label+' independent native positive');check(actual.length===expected.length&&actual.every((h,i)=>h.object===expected[i].object&&JSON.stringify(metadata(h))===JSON.stringify(metadata(expected[i]))),label+' native object/material/normal/point/UV/face/distance parity');}
try{
 const data=await(await fetch('./spatialfixture-data.json')).json();check(data.triangles===49118&&data.positions===147354,'captured actual component49118triangle geometry identity');
 const actual=[];for(const v of ['old','current']){const mod=await load(v,true,'actual'),g=decode(data),r=await spatial(mod,g);check(r.e.spatialReady&&!r.e.spatial.scratch,v+' completed spatial view releases scratch');nativeParity(mod,g,v+' captured actual');actual.push(r);rows.push({version:v,geometry:'captured actual',triangles:data.triangles,times:r.times,operations:r.operations,arrays:r.arrays,buffers:await digest(r.buffers)});g.dispose();check(r.e.cancelled&&!r.e.spatial.scratch,v+' captured disposal releases unfinished bitmap entry');}
 check(equal(actual[0].buffers,actual[1].buffers),'actual completed spatial/private/count/cursor buffers byte-identical');check(JSON.stringify(actual[0].operations)===JSON.stringify(actual[1].operations),'actual scan/count/fill operation counts exact');check(actual[0].arrays===49118*16&&actual[1].arrays===6,'actual785888 array-creation expressions become6 lazy scratch-array expressions (not measured heap allocations)');
 const cases=['native','normalized','interleaved','custom','NaN','bad-index','mutation','dispose','group-drawrange'];
 for(const label of cases){const runs=[];for(const v of ['old','current']){const mod=await load(v,true,label),g=new T.SphereGeometry(1,16,12),p=g.attributes.position,trace=[];
  if(label==='normalized')g.setAttribute('position',new T.BufferAttribute(new Int16Array(Array.from(p.array,x=>Math.round(x*20000))),3,true));
  if(label==='interleaved'){const a=new Float32Array(p.count*4);for(let i=0;i<p.count;i++)for(let c=0;c<3;c++)a[i*4+c+1]=p.array[i*3+c];g.setAttribute('position',new T.InterleavedBufferAttribute(new T.InterleavedBuffer(a,4),3,1));}
  if(label==='custom')for(const name of ['getX','getY','getZ']){const fn=p[name];p[name]=function(i){trace.push(name+':'+i);return fn.call(this,i)}}
  if(label==='NaN')g.attributes.position.array[0]=NaN;if(label==='bad-index')g.index.array[3]=65535;
  if(label==='group-drawrange'){g.clearGroups();g.addGroup(0,g.index.count/2,0);g.addGroup(g.index.count/2,g.index.count/2,1);g.setDrawRange(3,g.index.count-6)}
  if(label==='mutation'||label==='dispose'){const e=mod.spatialProbe.queue(g);while(e.scan<e.position.count)mod.spatialProbe.advance(e);mod.spatialProbe.advance(e);if(label==='mutation'){g.attributes.position.needsUpdate=true;mod.prepareCombatWorld((()=>{const s=new T.Scene();s.add(new T.Mesh(g,new T.MeshBasicMaterial()));return s})(),new T.Group(),new T.PerspectiveCamera());}else g.dispose();check(e.cancelled&&!e.spatial.scratch,v+' '+label+' cancels and releases active scratch');g.dispose();runs.push({cancelled:e.cancelled,trace});continue;}
  const r=await spatial(mod,g,false);check(r.e.settled&&!r.e.spatial.scratch,v+' '+label+' completes/releases scratch');if(!['NaN','bad-index'].includes(label))nativeParity(mod,g,v+' '+label);runs.push({buffers:r.buffers,valid:r.e.valid,ready:r.e.ready,trace,operations:r.operations});g.dispose();}
  check(runs[0].cancelled===runs[1].cancelled&&runs[0].valid===runs[1].valid&&runs[0].ready===runs[1].ready&&(!runs[0].buffers||equal(runs[0].buffers,runs[1].buffers))&&JSON.stringify(runs[0].trace)===JSON.stringify(runs[1].trace),label+' historical/current exact completed buffers/getter order/lifetime');
 }
 // Timings use identical uninstrumented production advance bodies, matched geometry/order, native clocks and yields.
 const timing=[];for(let rep=0;rep<3;rep++)for(const v of rep%2?['current','old']:['old','current']){const mod=await load(v,false,'timing'+rep),g=decode(data),r=await spatial(mod,g);timing.push({rep,version:v,times:r.times,operations:r.operations});g.dispose()}
 check(webglCalls===0,'all native probes used zero WebGL');window.result={pass:true,checks,rows,timing,webglCalls};
}catch(e){window.result={pass:false,checks,rows,error:e.stack}}
document.getElementById('out').textContent=checks.map(c=>(c.ok?'PASS ':'FAIL ')+c.label).join('\n')+'\n'+(window.result.error??JSON.stringify(window.result.rows.map(r=>({version:r.version,arrays:r.arrays,operations:r.operations})),null,2));
</script>
