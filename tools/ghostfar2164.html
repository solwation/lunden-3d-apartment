<script type="importmap">

<style>html,body{margin:0;background:#222}canvas{display:block}</style></head>
<body><script type="module">
// #2164 component page, driven by tools/ghostfar2164browser.cjs: eight players with different looks as the far figure (src/ghostfar.js) at 38 - 80 m through a
// telephoto lens, day and night, standing and walking; and the real figure next to the far one at the same spot and light, to compare their brightness.
// The real GhostFar / Avatar / AvatarLight code is used; sky, ground and lights are a controlled stand-in for the site (no World).
import * as THREE from 'three';
import { Avatar } from '../src/avatar.js';
import { GhostFar } from '../src/ghostfar.js';
import { lodCamera } from '../src/lod.js';
import { lightFactor, sceneLevel } from '../src/avatarlight.js';
import { avatarLook } from '../src/config.js';
const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const hemi = new THREE.HemisphereLight(0xffffff, 0x6f7a5a, 1), sun = new THREE.DirectionalLight(0xfff2e0, 1), fill = null;
scene.add(hemi, sun, sun.target);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: 0x6f9a52 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
const LOOKS = [ // hair style, gender, sleeves, legs (+ colours)
  { style: 1, gender: 1, sleeves: 0, legs: 0, hair: 0x3b2a1e, top: 0xc9503f, pants: 0x2f3e5c, skin: 0xe8b894 },
  { style: 0, gender: 0, sleeves: 1, legs: 1, hair: 0x1f1b18, top: 0x3f7fb0, pants: 0x6b5b45, skin: 0xb98562 },
  { style: 2, gender: 1, sleeves: 1, legs: 4, hair: 0xc9a25a, top: 0x6a8f4e, pants: 0x2f3e5c, skin: 0xf0c6a4 },
  { style: 3, gender: 0, sleeves: 0, legs: 2, hair: 0x4a3626, top: 0xd9b341, pants: 0x3a3f4a, skin: 0x8d5a3b },
  { style: 4, gender: 1, sleeves: 0, legs: 3, hair: 0x15110f, top: 0xe8e4dc, pants: 0x7a3550, skin: 0x6a4230 },
  { style: 0, gender: 1, sleeves: 1, legs: 0, hair: 0x8a3b24, top: 0x7a5fa8, pants: 0x242a36, skin: 0xe2b28e },
  { style: 1, gender: 0, sleeves: 0, legs: 1, hair: 0x2b2118, top: 0x42a39a, pants: 0x4d5a6b, skin: 0xd9a47f },
  { style: 4, gender: 0, sleeves: 1, legs: 0, hair: 0x6b4a2a, top: 0xb04a6e, pants: 0x1f2433, skin: 0xc58e69 }];
const DIST = [38, 42, 48, 54, 60, 66, 72, 80];
const mk = (lk, i) => ({ ...avatarLook(`far${i}`), tall: 1, build: 1, cut: 0, facial: 0, hat: 0, glasses: 0, ...lk });
const camA = new THREE.PerspectiveCamera(8, W / H, 1, 900), camB = new THREE.PerspectiveCamera(22, W / H, 0.1, 100);
let far, ghosts = [], near = [], farB, ghostsB = [], mode = 'day';
const env = () => ({ day: mode === 'day' ? 1 : 0, overcast: 0 });
function lights() {
  const day = mode === 'day';
  hemi.intensity = day ? 1.2 : 0.5; sun.intensity = day ? 2.2 : 0.3; hemi.color.set(day ? 0xffffff : 0x8fa5d8); hemi.groundColor.set(day ? 0x6f7a5a : 0x1a2018);
  scene.background = new THREE.Color(day ? 0xb9d3ee : 0x0b1020); ground.material.color.set(day ? 0x6f9a52 : 0x33482c);
  sun.position.set(-30, 50, 20);
}
const fakeGhost = (av, x, z, ry, speed = 0) => { const root = new THREE.Object3D(); root.position.set(x, 0, z); root.rotation.y = ry; scene.add(root); return { avatar: av, root, speed, pose: 0, gx: null, bikeMesh: null, air: 0, swim: false, dance: 0, jp: 0, crouch: 0, hug: null }; };
const level = () => lightFactor({ kind: 'outdoors' }, env(), sceneLevel({ hemi, ambient: { intensity: 0 }, fill, sun }));
function light(avs, lamp) { const f = level(); for (const a of avs) { a.setLight(f); a.setLamp?.(lamp); } return f; }
function clear() { for (const g of [...ghosts, ...ghostsB]) g.root.removeFromParent(); for (const a of near) a.object.removeFromParent(); far?.dispose(); farB?.dispose(); ghosts = []; ghostsB = []; near = []; far = farB = null; }
window.__ready = true;
/** `view`: 'lineup' (far figures 34 - 80 m, camera A) | 'compare' (real figure left, far figure right of each pair, camera B). `walk`: figures in side view at 1.4 m/s. */
window.__show = async ({ view, m, walk = false, lamp = 0 }) => {
  mode = m; clear(); lights();
  const avs = LOOKS.map((lk, i) => new Avatar(mk(lk, i)));
  let f = 1;
  if (view === 'lineup') {
    camA.position.set(0, 1.5, 0); camA.lookAt(0, 1.0, -60); camA.updateMatrixWorld();
    far = new GhostFar(scene); avs.forEach((a, i) => far.adopt(a));
    ghosts = avs.map((a, i) => fakeGhost(a, (i % 2 ? 1 : -1) * (0.02 + i * 0.012) * DIST[i], -DIST[i], walk ? (i % 2 ? Math.PI / 2 : -Math.PI / 2) : Math.PI, walk ? 1.4 : 0));
    f = light(avs, lamp); lodCamera.value.copy(camA.position);
    for (let k = 0; k < (walk ? 22 : 2); k++) { far.update(ghosts, camA.position); await new Promise((r) => setTimeout(r, 30)); }
    renderer.render(scene, camA);
    const i = renderer.info.render; return { f, calls: i.calls, triangles: i.triangles, far: far.mesh.count, farTri: far.triangles };
  }
  // compare: three pairs at 5 m, the real figure (all of it) and the far figure (the zone forced: fade 1) side by side
  camB.position.set(0, 1.3, 5.2); camB.lookAt(0, 1.0, 0); camB.updateMatrixWorld();
  farB = new GhostFar(scene, { lod: { start: 0.1, end: 0.2, margin: 1 } });
  const pick = [0, 1, 3];
  pick.forEach((k, j) => {
    const lk = mk(LOOKS[k], k), a = new Avatar(lk); a.noIdle = true; a.object.position.set((j - 1) * 1.25 - 0.28, 0, 0); a.object.rotation.y = 0; scene.add(a.object); a.update(1 / 60, {}); near.push(a);
    const b = new Avatar(lk); farB.adopt(b); ghostsB.push(fakeGhost(b, (j - 1) * 1.25 + 0.28, 0, Math.PI));
  });
  f = light([...near, ...ghostsB.map((g) => g.avatar)], lamp); lodCamera.value.copy(camB.position);
  farB.update(ghostsB, camB.position); for (const g of ghostsB) g.avatar.object.visible = false;
  renderer.render(scene, camB);
  // mean colour of the shirt (chest patch) of every figure, as the canvas shows it
  const c2 = document.createElement('canvas'); c2.width = W; c2.height = H; const g2 = c2.getContext('2d'); g2.drawImage(renderer.domElement, 0, 0);
  const lum = [];
  for (const x of near.map((a) => a.object.position.x).concat(ghostsB.map((g) => g.root.position.x))) {
    const p = new THREE.Vector3(x, 1.2, 0.12).project(camB), q = new THREE.Vector3(x + 0.06, 1.12, 0.12).project(camB), r = new THREE.Vector3(x - 0.06, 1.28, 0.12).project(camB);
    const sx = (v) => Math.round((v.x * 0.5 + 0.5) * W), sy = (v) => Math.round((-v.y * 0.5 + 0.5) * H);
    const d = g2.getImageData(Math.min(sx(q), sx(r)), Math.min(sy(q), sy(r)), Math.abs(sx(q) - sx(r)) || 1, Math.abs(sy(q) - sy(r)) || 1).data; let s = [0, 0, 0], n = 0;
    for (let i = 0; i < d.length; i += 4) { s[0] += d[i]; s[1] += d[i + 1]; s[2] += d[i + 2]; n++; }
    const m3 = s.map((v) => v / n); lum.push({ rgb: m3.map(Math.round), y: +(0.2126 * m3[0] + 0.7152 * m3[1] + 0.0722 * m3[2]).toFixed(1) });
  }
  const i = renderer.info.render; return { f, near: lum.slice(0, 3), far: lum.slice(3), calls: i.calls, triangles: i.triangles };
};
window.__png = () => renderer.domElement.toDataURL('image/png');
</script></body></html>
