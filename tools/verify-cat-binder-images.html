<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Kattpärmen Bilder Verifiering (#1900)</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 { font-size: 20px; color: #38bdf8; margin: 0 0 12px 0; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 600; background: #0369a1; color: #e0f2fe; margin-bottom: 12px; }
    #grid {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .cat-thumb {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 12px;
      width: 140px;
      text-align: center;
    }
    .cat-thumb img {
      width: 96px;
      height: 96px;
      border-radius: 6px;
      background: #0b1120;
      display: block;
      margin: 0 auto 8px auto;
    }
    .cat-title { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .cat-coat { font-size: 11px; color: #94a3b8; }
    #detail {
      display: flex;
      gap: 20px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 20px;
      max-width: 600px;
    }
    #detail img {
      width: 200px;
      height: 200px;
      border-radius: 8px;
      background: #0b1120;
    }
    #detail-info { flex: 1; }
    #detail-info h2 { margin: 0 0 4px 0; font-size: 18px; color: #f1f5f9; }
    #detail-info p { margin: 4px 0; font-size: 13px; color: #94a3b8; line-height: 1.4; }
    #status {
      margin-top: 16px;
      font-family: monospace;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px 14px;
      border-radius: 6px;
      max-width: 600px;
      white-space: pre-line;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div class="badge">PRODUKTIONSVERIFIERING #1900</div>
  <h1>Kattpärmens miniatyr- och detaljbilder för hittade katter</h1>

  <div id="grid"></div>

  <div id="detail">
    <img id="detail-img" alt="Katt detalj">
    <div id="detail-info">
      <h2 id="detail-name">Hämtar katt...</h2>
      <p id="detail-variant">Laddar information...</p>
      <p id="detail-desc">Vuxen huskatt i kattpärmens detaljvy med fullständig modellrendering.</p>
    </div>
  </div>

  <div id="status">Initierar rendering av kattbilder...</div>

  <script type="module">
    import * as THREE from 'three';
    import { registry } from '../src/bestiary.js';
    import { BestiaryImages } from '../src/bestiaryimages.js';
    import '../src/cat.js';

    const statusEl = document.getElementById('status');
    const log = (msg) => { statusEl.textContent += '\n' + msg; };

    const gridEl = document.getElementById('grid');
    const detailImg = document.getElementById('detail-img');
    const detailName = document.getElementById('detail-name');
    const detailVariant = document.getElementById('detail-variant');

    async function run() {
      try {
        log('Initierar WebGLRenderer och BestiaryImages...');
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(320, 320);
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const images = new BestiaryImages({ registry, renderer });

        // Välj ett representativt urval av katter (kattunge, vuxen, siames, maine coon, Miele)
        const sampleCats = [
          { id: 'cat:huskatt:svartvit:kitten', label: 'Huskatt', variant: 'Svartvit kattunge' },
          { id: 'cat:huskatt:svartvit:adult',  label: 'Huskatt', variant: 'Svartvit vuxen' },
          { id: 'cat:siames:siames:adult',     label: 'Siames',  variant: 'Klassisk maskad' },
          { id: 'cat:maine coon:rödrandig:adult', label: 'Maine Coon', variant: 'Rödrandig' },
          { id: 'cat:Miele:Miele:adult',       label: 'Miele',   variant: 'Lägenhetens katt' }
        ];

        let loadedCount = 0;

        for (const cat of sampleCats) {
          log(`Renderar 96px miniatyr för ${cat.label} (${cat.variant})...`);
          const dataUrl = await images.get(cat.id, 96);
          if (!dataUrl || !dataUrl.startsWith('data:image/png')) {
            throw new Error(`Ogiltig bilddata för ${cat.id}`);
          }

          const card = document.createElement('div');
          card.className = 'cat-thumb';
          const img = document.createElement('img');
          img.src = dataUrl;
          img.alt = cat.label;
          const t1 = document.createElement('div');
          t1.className = 'cat-title';
          t1.textContent = cat.label;
          const t2 = document.createElement('div');
          t2.className = 'cat-coat';
          t2.textContent = cat.variant;
          card.append(img, t1, t2);
          gridEl.appendChild(card);
          loadedCount++;
        }

        // Rendera 320px detaljvy för Miele
        log('Renderar 320px detaljbild för Miele...');
        const detailData = await images.get('cat:Miele:Miele:adult', 320);
        detailImg.src = detailData;
        detailName.textContent = 'Miele';
        detailVariant.textContent = 'Sköldpaddsfärgad makrillteckning med vitt bröst';

        log(`Alla ${loadedCount} kattminiatyrer samt detaljbild renderade framgångsrikt.`);
        log('RESULT: ALL CHECKS PASSED');
        window.__catBinderImagesReady = true;
      } catch (err) {
        log('FEL: ' + err.message);
        console.error(err);
      }
    }

    run();
  </script>
</body>
</html>
