<!doctype html><meta charset="utf-8"><title>Picknick peer</title>
<script type="importmap">{"imports":{"three":"/__three/build/three.module.js","three/addons/":"/__three/examples/jsm/"}}</script>
<button id="sit0">Sitt vänster</button><button id="sit1">Sitt höger</button><button id="stand">Res dig</button><button id="g0">Ta glas0</button><button id="g1">Ta glas1</button><button id="sip">Drick</button><button id="toast">Skåla</button><button id="eat">Ät ost</button>
<script type="module">
import * as T from 'three';import {Ghosts} from '../src/ghosts.js';import {RoofPicnic} from '../src/roofpicnic.js';import {PicnicClient} from '../src/picnicclient.js';import {ROOF_PICNIC as C} from '../src/config.js';import {Roofs} from '../src/roofs.js';import {Rest} from '../src/rest.js';import {restState} from '../src/remote-pose.js';import {heldCategory} from '../src/heldcategory.js';import {heldItem} from '../src/holdable.js';import {Glass,toastHandler} from '../src/things.js';import {Life} from '../src/life.js';
const scene=new T.Scene(),camera=new T.PerspectiveCamera(),y=C.shared.roofY,world={roofs:new Roofs([{id:'fixture-same-roof-height',x0:C.at[0]-10,x1:C.at[0]+10,z0:C.at[1]-10,z1:C.at[1]+10,y}]),furnitureTargets:[]},life=new Life({scene,camera}),picnic=new RoofPicnic({scene,camera,world,life}),rest=new Rest(camera);camera.position.set(C.at[0],y+1.62,C.at[1]);
const seen=[],notices=[];const ghosts=new Ghosts({scene,camera,url:'http://localhost:8954',name:()=> 'Picknick B',active:()=>true,score:()=>0,state:()=>({p:[C.at[0],y,C.at[1]],r:C.yaw,c:false,hi:heldCategory(heldItem()),...restState(rest,ghosts.avatarCode,ghosts.me)})});ghosts.keepConnected=()=>true;
const savedKey=sessionStorage.getItem('lunden.picnic.fixtureB')??crypto.randomUUID().replaceAll('-','');sessionStorage.setItem('lunden.picnic.fixtureB',savedKey);
const enter=i=>rest.begin(picnic.seat,picnic.seat.spots[i],{x:C.at[0],y,z:C.at[1],yaw:C.yaw});const sync=new PicnicClient({picnic,ghosts,rest,identity:{key:savedKey,n:Number(sessionStorage.getItem('lunden.picnic.n.'+savedKey))||0},enterSeat:enter,stand:()=>rest.end(),say:t=>notices.push(t)});
toastHandler.fn=(g,back=false)=>ghosts.toast(0,back);ghosts.onToast=(m,g)=>{seen.push({m,from:g.id});if(!m.b&&heldItem() instanceof Glass)heldItem().useAlt(true)};
for(let i=0;i<2;i++){document.querySelector('#sit'+i).onclick=()=>sync.sit(picnic.seat.spots[i],()=>enter(i));document.querySelector('#g'+i).onclick=()=>picnic.glasses[i].take();}
document.querySelector('#stand').onclick=()=>{sync.releaseSeat();rest.end()};document.querySelector('#sip').onclick=()=>heldItem()?.use();document.querySelector('#toast').onclick=()=>heldItem()?.useAlt();document.querySelector('#eat').onclick=()=>life.run(picnic.foodTargets[0]);
setInterval(()=>{rest.update(.03);ghosts.update(.03);sync.update();life.runner.update(.03);[...picnic.glasses,picnic.bottle].forEach(g=>g.update(.03))},30);window.picnicPeer={ghosts,rest,picnic,life,sync,seen,notices};
</script>
