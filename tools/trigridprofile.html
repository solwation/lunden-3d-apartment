<!doctype html><html lang="en"><meta charset="utf-8"><title>TriGrid phase profile</title><pre id="out">running…</pre>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';
import { TriGrid } from '../src/trigrid.js?profile=a336e30';
import { buildFurniture } from '../src/furniture.js';
const result={samples:[],checks:[],pass:false};
const check=(ok,label)=>result.checks.push(`${ok?'PASS':'FAIL'} ${label}`);
try{
 const furniture=buildFurniture();furniture.object.updateMatrixWorld(true);
 const meshes=[];furniture.object.traverse(o=>{if(o.isMesh&&!o.isInstancedMesh&&!o.isSkinnedMesh)meshes.push(o);});
 const triangles=o=>(o.geometry.index?.count??o.geometry.attributes.position.count)/3;
 const largest=meshes.sort((a,b)=>triangles(b)-triangles(a)).slice(0,6);
 const sphere=new T.Mesh(new T.SphereGeometry(1,128,64),new T.MeshBasicMaterial({side:T.DoubleSide}));sphere.position.set(4,1.5,9);sphere.rotation.set(.2,.4,.1);sphere.scale.set(1.2,.8,1.3);sphere.updateMatrixWorld(true);
 const cases=[...largest.map((mesh,i)=>({mesh,label:`production furniture largest ${i+1}`})),{mesh:sphere,label:'controlled sphere (not apartment)'}];
 for(const {mesh,label} of cases){for(let repetition=0;repetition<5;repetition++){
  const grid=new TriGrid(mesh);let memberships=0;for(const a of grid.cells.values())memberships+=a.length;
  result.samples.push({label,repetition,triangles:triangles(mesh),copyMs:grid.__phases.copyMs,binMs:grid.__phases.binMs,totalMs:grid.__phases.totalMs,cells:grid.cells.size,memberships,big:grid.big.length});
  check(grid.__phases.copyMs>=0&&grid.__phases.binMs>=0&&grid.__phases.totalMs>=grid.__phases.copyMs+grid.__phases.binMs,'phase intervals fit total '+label+'/'+repetition);
 }}
 result.pass=result.checks.every(x=>x.startsWith('PASS'));
}catch(error){result.checks.push('FAIL '+error.stack);}
window.result=result;document.querySelector('#out').textContent=(result.pass?'ALL PASS':'SOME FAILED')+'\n'+result.checks.join('\n')+'\n'+JSON.stringify(result.samples,null,2);
</script></html>
