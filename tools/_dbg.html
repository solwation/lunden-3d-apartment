<!doctype html>
<html><body><pre id="out">running…</pre>
<script type="module">
const out = document.getElementById('out'); const L = [];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe'); f.width = 600; f.height = 400; f.src = '../index.html?life&shot'; document.body.append(f);
await new Promise((r) => { f.onload = r; });
while (!f.contentWindow.__app) await wait(100);
try {
  const A = f.contentWindow.__app;
  for (const l of A.world.lids) if (l.stock) { const p = l.object.getWorldPosition(new (A.camera.position.constructor)()); L.push(`${l.stock} ${l.name} (${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)}) b ${l.stockFrame ? JSON.stringify(l.stockFrame.b) : ''}`); }
} catch (e) { L.push(e.stack); }
out.textContent = L.join('\n');
</script></body></html>
