<!doctype html><html><meta charset="utf-8"><title>BESTÅ wall placement (#492)</title><pre id="out">running…</pre><script type="module">
const lines=[];let pass=true;const check=(ok,s)=>{lines.push((ok?'PASS':'FAIL')+' '+s);pass&&=!!ok};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
try {
 localStorage.removeItem('lunden.furniture.layout');
 const f=document.createElement('iframe');f.width=480;f.height=300;document.body.append(f);
 async function load(){f.src='../index.html?life&shot&r='+Math.random();await new Promise(r=>f.onload=r);while(!f.contentWindow.__app)await wait(100);f.contentDocument.documentElement.requestFullscreen=undefined;f.contentDocument.getElementById('start-touch').click();const A=f.contentWindow.__app;A.rearrange.unlock('sarah is the goat');return A}
 let A=await load(),R=A.rearrange,T=await f.contentWindow.eval("import('three')");
 const close=(a,b)=>a.elements.every((v,i)=>Math.abs(v-b.elements[i])<.001);
 let p=R.pieces.find(p=>p.item.type==='besta');const id=p.id,home=p.home.clone();
 check(p.picture,'cabinet uses wall placement');
 // Simulate an older floor-placement save. Only this cabinet is changed.
 const old={revision:1,pieces:{[id]:{revision:1,pos:[1,.0,10.55],quat:[0,Math.sin(Math.PI/4),0,Math.cos(Math.PI/4)]}}};
 R.apply(old);check(p.object.matrixWorld.elements[13]===0,'old floor-placement save is read');
 R.begin(p);const at=new T.Vector3(.202,.5,10.55);
 A.camera.position.copy(at).add(new T.Vector3(1.5,0,0));A.camera.lookAt(at);R.update();
 check(R.valid&&R.ghost.visible&&Math.abs(R.candidate.elements[13]-.5)<.01,'real wall provides preview at wall height');
 const before=p.object.matrixWorld.clone(),loose=R.selected.loose.map(h=>({h,m:h.model.matrixWorld.clone()}));
 const doors=p.object.userData.targets,doorHomes=doors.map(d=>d.object.matrixWorld.clone());
 const first=R.candidate.clone();R.rotate();R.update();check(R.valid&&!close(first,R.candidate),'cabinet rotates in wall mode');
 const matrix=R.candidate.clone(),delta=matrix.clone().multiply(before.clone().invert());
 check(await R.confirm(),'wall placement saved');
 A.scene.updateMatrixWorld(true);
 check(doors.every((d,i)=>close(d.object.matrixWorld,delta.clone().multiply(doorHomes[i]))),'all six doors follow exactly once');
 check(loose.every(({h,m})=>close(h.model.matrixWorld,delta.clone().multiply(m))),'loose contents follow exactly once');
 doors.forEach(d=>{d.toggle();for(let i=0;i<40;i++)d.update(.1)});
 check(doors.every(d=>d.isOpen&&d.t===1),'all six doors open after rotation');
 doors.forEach(d=>{d.toggle();for(let i=0;i<40;i++)d.update(.1)});
 const saved=p.object.matrixWorld.clone();A=await load();R=A.rearrange;p=R.byId.get(id);
 check(close(p.object.matrixWorld,saved)&&p.picture,'saved wall pose and wall classification survive reload');
 check(await R.restoreOriginal(p)&&close(p.object.matrixWorld,home),'targeted restore returns original wall pose and 35 cm height');
 R.begin(p);A.camera.position.set(1.702,2,10.55);A.camera.lookAt(.202,2,10.55);R.update();
 check(!R.valid&&!R.ghost.visible,'cabinet cannot extend through ceiling');R.cancel();
 document.getElementById('out').textContent=lines.join('\n')+'\n'+(pass?'ALL PASS':'SOME FAILED');
}catch(e){document.getElementById('out').textContent=lines.join('\n')+'\nFAIL '+e.stack}
</script></html>
