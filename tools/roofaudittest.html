<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Roof audit</title></head>
<body>
<pre id="out">running…</pre>
<script>
// #1294: every building inside WALK has a roof you can land on. For each building drawn from SITE data (the mapped west / east /
// north / south backdrop buildings, the S:t Lars blocks, Hus A/B/C, HepCat, the villa) the test picks the point deepest inside its
// outline, finds the roof actually DRAWN there (a ray down through the scene), drops the real Player from a few metres above it and
// checks that it lands on the roof instead of falling through to the ground; then it flies at the wall at head height (aloft)
// and checks that the wall stops it. The simplified roof plane may differ from the drawn gable/hip by `TOL` (a *guess*). Buildings
// without a roof are listed by name. Run: node tools/runtests.cjs roofaudittest
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
f.src = '../index.html?shot&time=12&month=6&freeze';
document.body.append(f);
f.onload = () => run().catch((e) => { out.textContent = `FAIL ${e}\n${e.stack}\nSOME FAILED`; });
async function run() {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, fall, world, step, scene, renderer, camera } = w.__app;
  const mod = (p) => w.eval(`import('${p.startsWith('.') ? new URL(p, location.href).href : p}')`);
  const { SITE, WALK, PLAYER } = await mod('../src/config.js');
  const THREE = await mod('three');
  const { groundY } = await mod('../src/surroundings.js');
  const lines = [];
  let pass = true;
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= !!ok; return ok; };
  const f2 = (v) => v.toFixed(2);
  d.getElementById('install').hidden = true;
  Object.defineProperty(d, 'pointerLockElement', { get: () => renderer.domElement, configurable: true });
  d.dispatchEvent(new w.Event('pointerlockchange'));
  const dt = 1 / 60, TOL = 1.6; // m: the simplified roof surface vs the drawn roof (*guess*: a hip plane for a gable's end)
  const inRing = (p, x, z) => { let yes = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) if ((p[i][1] > z) !== (p[j][1] > z) && x < (p[j][0] - p[i][0]) * (z - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) yes = !yes; return yes; };
  const ringDist = (rings, x, z) => { let m = Infinity; for (const p of rings) for (let i = 0; i + 1 < p.length; i++) { const [ax, az] = p[i], [bx, bz] = p[i + 1], dx = bx - ax, dz = bz - az, l2 = dx * dx + dz * dz || 1, t = Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / l2)); m = Math.min(m, Math.hypot(x - ax - t * dx, z - az - t * dz)); } return m; };
  // every building from the data: { name, outer, holes }
  const buildings = [];
  for (const g of ['west', 'east', 'north', 'south']) SITE[g].buildings.forEach((b, i) => buildings.push({ name: `${g}/${b.name ?? b.source ?? i}`, outer: b.polygon, holes: b.holes ?? [] }));
  for (const b of SITE.blocks) buildings.push({ name: `block/${b.name}`, outer: [[b.x0, b.z0], [b.x1, b.z0], [b.x1, b.z1], [b.x0, b.z1], [b.x0, b.z0]], holes: [] });
  const inWalk = (b) => b.outer.some(([x, z]) => x > WALK.x0 && x < WALK.x1 && z > WALK.z0 && z < WALK.z1);
  const list = buildings.filter(inWalk);
  // the point deepest inside the outline (not in a courtyard)
  const deepest = (b) => {
    const xs = b.outer.map((q) => q[0]), zs = b.outer.map((q) => q[1]), x0 = Math.min(...xs), x1 = Math.max(...xs), z0 = Math.min(...zs), z1 = Math.max(...zs);
    let best = null;
    for (let i = 0; i <= 16; i++) for (let j = 0; j <= 16; j++) {
      const x = x0 + (x1 - x0) * (i + 0.5) / 17, z = z0 + (z1 - z0) * (j + 0.5) / 17;
      if (!inRing(b.outer, x, z) || b.holes.some((h) => inRing(h, x, z)) || x < WALK.x0 + 2 || x > WALK.x1 - 2 || z < WALK.z0 + 2 || z > WALK.z1 - 2) continue;
      const dd = ringDist([b.outer, ...b.holes], x, z);
      if (!best || dd > best.d) best = { x, z, d: dd };
    }
    return best;
  };
  const rc = new THREE.Raycaster(); rc.layers.enableAll(); rc.camera = camera; // Sprite.raycast needs a camera
  const drawnTop = (x, z) => {
    rc.set(new THREE.Vector3(x, 150, z), new THREE.Vector3(0, -1, 0));
    const hits = rc.intersectObjects(scene.children, true).filter((h) => h.object.isMesh && h.object.visible !== false && !h.object.material?.transparent && h.point.y < 100);
    return hits.length ? hits[0].point.y : null;
  };
  const settle = async () => { for (let i = 0; i < 200 && fall.pending; i++) await wait(10); while (fall.t >= 0) step(dt); };
  /** Drop the Player 2.5 m over the drawn roof `top` at (x, z): does it stand on it (within TOL)? A fall-through is given up at once (no fall damage / respawn). */
  const land = (x, z, top) => {
    player.spawn(x, z, 0);
    player.pos.y = top + 2.5; player.eyeY = player.pos.y + PLAYER.eye; player.vy = 0;
    let still = 0, last = player.pos.y;
    for (let i = 0; i < 400 && still < 8 && player.pos.y > top - TOL - 0.3; i++) { step(dt); still = Math.abs(player.pos.y - last) < 1e-4 ? still + 1 : 0; last = player.pos.y; }
    const y = player.pos.y;
    return { y, ok: still >= 8 && y > top - TOL && y < top + 0.4 && Math.hypot(player.pos.x - x, player.pos.z - z) < 1.5 };
  };
  const missing = [], rows = [], walled = [], leaks = [];
  for (const b of list) {
    const c = deepest(b);
    if (!c) { rows.push(`skip ${b.name}: no interior point inside WALK`); continue; }
    const top = drawnTop(c.x, c.z), gy = groundY(c.x, c.z);
    if (top === null || top < gy + 1.5) { rows.push(`skip ${b.name}: nothing drawn over ${f2(gy)} m (top ${top})`); continue; }
    const { ok, y } = land(c.x, c.z, top);
    rows.push(`${ok ? 'ok  ' : 'MISS'} ${b.name} at (${f2(c.x)}, ${f2(c.z)}): drawn roof ${f2(top)} m, landed ${f2(y)} m (ground ${f2(gy)})`);
    if (!ok) missing.push(b.name);
    // the walls: hover 3 m up (aloft, below the roof) just outside the longest edge and fly at the building: it must stay out
    if (top - gy > 5.5) {
      const ring = b.outer; let best = null;
      for (let i = 0; i + 1 < ring.length; i++) { const l = Math.hypot(ring[i + 1][0] - ring[i][0], ring[i + 1][1] - ring[i][1]); if (!best || l > best.l) best = { l, i }; }
      const [ax, az] = ring[best.i], [bx, bz] = ring[best.i + 1], mx = (ax + bx) / 2, mz = (az + bz) / 2;
      let nx = -(bz - az) / best.l, nz = (bx - ax) / best.l;
      if (inRing(ring, mx + nx * 0.5, mz + nz * 0.5)) { nx = -nx; nz = -nz; } // outward
      const ex = mx - nx * 1.2, ez = mz - nz * 1.2, etop = drawnTop(ex, ez); // 1.2 m in from the edge: the slope of a gable / hip
      if (inRing(ring, ex, ez) && !b.holes.some((h) => inRing(h, ex, ez)) && etop > gy + 1.5) {
        const e = land(ex, ez, etop);
        rows.push(`${e.ok ? 'ok  ' : 'MISS'} ${b.name} 1.2 m from the edge (${f2(ex)}, ${f2(ez)}): drawn ${f2(etop)} m, landed ${f2(e.y)} m`);
        if (!e.ok) missing.push(`${b.name} (edge)`);
      }
      const sx = mx + nx * 2.5, sz = mz + nz * 2.5;
      if (!(sx > WALK.x0 + 3 && sx < WALK.x1 - 3 && sz > WALK.z0 + 3 && sz < WALK.z1 - 3) || inRing(ring, sx, sz) || drawnTop(sx, sz) > groundY(sx, sz) + 1) continue; // (not from inside another building / a tree)
      player.spawn(sx, sz, 0);
      const fy = groundY(sx, sz) + 3.0;
      camera.rotation.y = Math.atan2(nx, nz); // facing the building (yaw 0 = −z)
      player.keys = new Set(['KeyW']);
      for (let i = 0; i < 150; i++) { player.pos.y = fy; player.vy = 0; step(dt); }
      player.keys = new Set();
      const inside = inRing(ring, player.pos.x, player.pos.z);
      walled.push(b.name);
      if (inside) { leaks.push(b.name); rows.push(`LEAK ${b.name}: flew into the building at ${f2(player.pos.x)}, ${f2(player.pos.z)}`); }
    }
  }
  lines.push(...rows.map((r) => `INFO ${r}`));
  check(list.length >= 55, `${list.length} buildings inside WALK audited`);
  check(walled.length >= 30 && leaks.length === 0, `walls stop a body flying into the building: ${walled.length} tried, ${leaks.length} got in: ${leaks.join(', ')}`);
  check(missing.length === 0, `every roof can be landed on; ${missing.length} without: ${missing.join(', ')}`);
  out.textContent = lines.join('\n') + `\n${pass ? 'ALL PASS' : 'SOME FAILED'}`;
}
</script>
</body>
</html>
