<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Poster test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Drawings taped up (#176): draw on the paper in Sovrum 3, "Ta teckningen" (the drawing in the hand, a fresh
// sheet on the desk), tape it up on a wall in the hall and on the fridge door, open the fridge (the poster swings
// with the door), no tape prompt on the kitchen window, reload: both are back up (IndexedDB).
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/postertest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const lines = [];
let pass = true;
const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= !!ok; return ok; };
localStorage.removeItem('lunden.drawing');
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
document.body.append(f);
const load = () => new Promise((res) => { f.onload = async () => { while (!f.contentWindow.__app) await wait(100); res(f.contentWindow); }; f.src = '../index.html?v=' + Math.random(); });
const deg = (d) => (d * Math.PI) / 180;

(async () => {
  // a fresh start: no saved posters
  await new Promise((res) => { const r = indexedDB.deleteDatabase('lunden'); r.onsuccess = r.onerror = r.onblocked = res; });
  let w = await load(), d = f.contentDocument;
  let app = w.__app;
  const { player, camera, step, drawing, scene, posters, heldDrawing, world } = app;
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  const stand = (x, z, yaw, pitch, feet = 0) => {
    player.spawn(x, z, deg(yaw)); player.pos.y = feet; player.eyeY = feet + 1.62;
    camera.position.y = player.eyeY; camera.rotation.x = deg(pitch);
    for (let i = 0; i < 3; i++) step(1 / 60);
    camera.rotation.y = deg(yaw); camera.rotation.x = deg(pitch); step(1 / 60);
  };
  // 1. draw something and take it
  scene.updateMatrixWorld(true);
  const p = drawing.paper.position;
  stand(p.x, p.z + 0.9, 0, 0, 3.25);
  camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(p.x - camera.position.x, p.z - camera.position.z));
  step(1 / 60);
  btn.click();
  for (let i = 0; i < 40; i++) step(1 / 60);
  const take = d.querySelector('#draw-panel [data-act=take]');
  check(drawing.active && take.disabled, 'drawing mode; "Ta teckningen" disabled on a blank sheet');
  const cv = d.querySelector('canvas'), r = cv.getBoundingClientRect();
  const ev = (type, x, y) => cv.dispatchEvent(new w.PointerEvent(type, { clientX: r.left + x * r.width, clientY: r.top + y * r.height, bubbles: true, pointerType: 'mouse' }));
  d.querySelectorAll('#draw-panel .colors button')[0].click();
  ev('pointerdown', 0.4, 0.5); for (let k = 1; k <= 10; k++) ev('pointermove', 0.4 + k * 0.02, 0.5 + k * 0.01);
  w.dispatchEvent(new w.PointerEvent('pointerup', { bubbles: true }));
  check(!take.disabled, '"Ta teckningen" enabled after drawing');
  take.click();
  step(1 / 60);
  check(!drawing.active && app.heldItem() === heldDrawing && heldDrawing.held, 'the drawing is in the hand');
  check(drawing.blank, 'a fresh, blank sheet on the desk');
  // E on the desk while holding it puts it back; take it again
  camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(p.x - camera.position.x, p.z - camera.position.z));
  step(1 / 60);
  check(/lägga tillbaka teckningen/i.test(btn.textContent), `desk prompt while holding: "${btn.textContent}"`);
  btn.click(); await wait(200);
  check(!heldDrawing.held && !drawing.blank, 'E on the desk: the drawing is back on it');
  btn.click(); for (let i = 0; i < 40; i++) step(1 / 60);
  take.click(); step(1 / 60);
  check(heldDrawing.held, 'taken again');

  // 2. a wall in the hall: turn round until the tape prompt shows
  const tapeAt = (x, z, feet, pitch) => {
    for (let yaw = 0; yaw < 360; yaw += 15) {
      stand(x, z, yaw, pitch, feet);
      if (/tejpa upp/i.test(btn.textContent) && !btn.hidden) return yaw;
    }
    return null;
  };
  const yaw = tapeAt(1.17, 1.6, 0, 0);
  check(yaw !== null, `hall: a wall to tape on (yaw ${yaw})`);
  btn.click(); await wait(300);
  check(posters.list.length === 1 && posters.list[0].rec.surface === 'wall' && !heldDrawing.held, 'taped up on the hall wall');

  // 3. the fridge door: a second drawing
  const fridge = world.lids.find((l) => l.kind === 'fridge' && !l.freezer);
  check(!!fridge, 'the fridge is there');
  stand(p.x, p.z + 0.9, 0, 0, 3.25);
  camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(p.x - camera.position.x, p.z - camera.position.z));
  step(1 / 60);
  btn.click(); for (let i = 0; i < 40; i++) step(1 / 60);
  ev('pointerdown', 0.45, 0.4); for (let k = 1; k <= 10; k++) ev('pointermove', 0.45, 0.4 + k * 0.02);
  w.dispatchEvent(new w.PointerEvent('pointerup', { bubbles: true }));
  take.click(); step(1 / 60);
  fridge.door.updateMatrixWorld(true);
  const dp = fridge.door.localToWorld(fridge.door.position.clone().set(0.3, 1.3, -0.06));
  stand(dp.x, dp.z - 1.2, 180, 0);
  camera.rotation.x = Math.atan2(dp.y - camera.position.y, 1.2); step(1 / 60);
  check(/tejpa upp/i.test(btn.textContent) && !btn.hidden, `fridge door prompt: "${btn.textContent}"`);
  btn.click(); await wait(300);
  const fp = posters.list.find((q) => q.rec.surface === 'fridge');
  check(!!fp && fp.mesh.parent?.parent === fridge.door, 'taped on the fridge door (a child of the door)');
  const before = fp.mesh.getWorldPosition(dp.clone());
  fridge.toggle(); for (let i = 0; i < 60; i++) fridge.update(0.05);
  fridge.door.updateMatrixWorld(true);
  const after = fp.mesh.getWorldPosition(dp.clone());
  check(after.distanceTo(before) > 0.2, `it swings with the door (${after.distanceTo(before).toFixed(2)} m)`);
  fridge.toggle(); for (let i = 0; i < 60; i++) fridge.update(0.05);

  // 4. no tape prompt on the kitchen window
  stand(p.x, p.z + 0.9, 0, 0, 3.25);
  camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(p.x - camera.position.x, p.z - camera.position.z));
  step(1 / 60);
  btn.click(); for (let i = 0; i < 40; i++) step(1 / 60);
  ev('pointerdown', 0.5, 0.5); ev('pointermove', 0.6, 0.6); w.dispatchEvent(new w.PointerEvent('pointerup', { bubbles: true }));
  take.click(); step(1 / 60);
  let onWindow = false;
  for (const pitch of [-5, 0, 5, 10]) for (const x of [3.6, 3.85, 4.1]) { stand(x, 1.4, 0, pitch); if (/tejpa upp/i.test(btn.textContent) && !btn.hidden) onWindow = true; }
  check(!onWindow, 'no tape prompt on the kitchen window');
  // 5. the limit: when full, the prompt says so
  const max = posters.full;
  check(!max, 'not full with 2');

  // 6. reload: both back up
  w = await load(); d = f.contentDocument; app = w.__app;
  for (let i = 0; i < 80 && app.posters.list.length < 2; i++) await wait(100);
  const kinds = app.posters.list.map((q) => q.rec.surface).sort().join(',');
  const n = await new Promise((res) => { const q = indexedDB.open('lunden'); q.onsuccess = () => { try { const c = q.result.transaction('drawings').objectStore('drawings').count(); c.onsuccess = () => res(c.result); } catch (e) { res(String(e)); } }; q.onerror = () => res('err'); });
  check(app.posters.list.length === 2 && kinds === 'fridge,wall', `after reload: ${kinds} (stored: ${n})`);
  // 7. look at a poster (#177): the panel, no walking, × closes without throwing
  d = f.contentDocument;
  const b2 = d.getElementById('action');
  d.getElementById('start-touch').click(); await wait(50);
  const view = (q) => {
    const m = q.mesh; m.updateMatrixWorld(true);
    const c = m.getWorldPosition(m.position.clone()), n = m.getWorldDirection(m.position.clone()).setY(0).normalize();
    const e = c.clone().addScaledVector(n, 1.0);
    app.player.spawn(e.x, e.z, Math.atan2(n.x, n.z)); app.player.pos.y = 0; app.player.eyeY = 1.62;
    for (let i = 0; i < 3; i++) app.step(1 / 60);
    app.camera.rotation.y = Math.atan2(n.x, n.z); app.camera.rotation.x = Math.atan2(c.y - app.camera.position.y, 1.0);
    app.step(1 / 60);
  };
  const wallQ = app.posters.list.find((q) => q.rec.surface === 'wall');
  view(wallQ);
  check(/titta på teckningen/i.test(b2.textContent) && !b2.hidden, `poster prompt: "${b2.textContent}"`);
  b2.click(); app.step(1 / 60);
  const panel = d.getElementById('poster-panel');
  check(!panel.hidden && /Ritad \d+ \w+ \d\d:\d\d/.test(panel.querySelector('.when').textContent), `the panel: "${panel.querySelector('.when').textContent}"`);
  const pos0 = app.player.pos.clone();
  app.player.keys = new Set(['KeyW']); for (let i = 0; i < 20; i++) app.step(1 / 60); app.player.keys = new Set();
  check(app.player.pos.distanceTo(pos0) < 0.001, 'no walking while it is open');
  panel.querySelector('[data-act=close]').click(); app.step(1 / 60);
  check(panel.hidden && app.posters.list.length === 2, '× closes it, nothing thrown');
  b2.click(); app.step(1 / 60);
  app.showNote(false); app.step(1 / 60); // what E / Esc do
  check(panel.hidden && app.posters.list.length === 2, 'E / Esc close it, nothing thrown');
  // Släng: gone from the wall and from storage, a ball flies, lands and vanishes after ballSeconds
  b2.click(); app.step(1 / 60);
  panel.querySelector('[data-act=throw]').click();
  await wait(300);
  const stored = await new Promise((res) => { const q = indexedDB.open('lunden'); q.onsuccess = () => { const c = q.result.transaction('drawings').objectStore('drawings').count(); c.onsuccess = () => res(c.result); }; });
  check(panel.hidden && app.posters.list.length === 1 && stored === 1, `thrown: off the wall and out of storage (stored ${stored})`);
  check(app.balls.balls.length === 1 && app.balls.balls[0].phase === 'crumple', 'it is crumpled into a ball');
  const shot = () => { if (!location.search.includes('shots')) return; app.renderer.render(app.scene, app.camera); const img = document.createElement('img'); img.className = 'shot'; img.src = app.renderer.domElement.toDataURL('image/png'); document.body.append(img); };
  for (let i = 0; i < 18; i++) app.step(1 / 60);
  shot();
  for (let i = 0; i < 42; i++) app.step(1 / 60);
  const ball = app.balls.balls[0];
  check(ball?.phase === 'fly' || ball?.phase === 'rest', `thrown (${ball?.phase})`);
  for (let i = 0; i < 400; i++) app.step(1 / 60);
  if (ball) { app.camera.lookAt(ball.ball.position); shot(); }
  check(ball?.phase === 'rest' && Math.abs(ball.ball.position.y - 0.036) < 0.05, `lies on the floor (y ${ball?.ball.position.y.toFixed(3)})`);
  check(app.stats.thrown >= 1, 'counted: drawings thrown');
  for (let i = 0; i < 200; i++) app.balls.update(1);
  check(app.balls.balls.length === 0, 'the ball is gone after ballSeconds');
  // Ta ner: the fridge poster into the hand, taped up on the hall wall instead (same id)
  const fq = app.posters.list[0], fid = fq.rec.id;
  view(fq);
  b2.click(); app.step(1 / 60);
  panel.querySelector('[data-act=down]').click(); await wait(200);
  check(app.heldItem() === app.heldDrawing && app.posters.list.length === 0, 'taken down into the hand');
  let ok = false;
  for (let yaw = 0; yaw < 360 && !ok; yaw += 15) {
    app.player.spawn(1.17, 1.6, yaw * Math.PI / 180); app.player.pos.y = 0; app.player.eyeY = 1.62;
    for (let i = 0; i < 3; i++) app.step(1 / 60);
    app.camera.rotation.y = yaw * Math.PI / 180; app.camera.rotation.x = 0; app.step(1 / 60);
    ok = /tejpa upp/i.test(b2.textContent) && !b2.hidden;
  }
  if (ok) { b2.click(); await wait(300); }
  check(ok && app.posters.list.length === 1 && app.posters.list[0].rec.id === fid && app.posters.list[0].rec.surface === 'wall', 'taped up again on the wall, the same drawing');

  if (location.search.includes('panel')) { view(app.posters.list[0]); b2.click(); app.step(1 / 60); out.textContent = pass ? 'ALL PASS' : 'SOME FAILED'; return; }
  // ?shots: pictures of both posters (data URLs in <img> tags, for a look by hand)
  if (location.search.includes('shots')) {
    await wait(1500);
    for (const q of app.posters.list) {
      const m = q.mesh, c = m.getWorldPosition(m.position.clone()), n = m.getWorldDirection(m.position.clone());
      app.camera.position.copy(c).addScaledVector(n, 1.1); app.camera.position.y = c.y; app.camera.lookAt(c);
      app.renderer.render(app.scene, app.camera);
      const img = document.createElement('img'); img.className = 'shot'; img.src = app.renderer.domElement.toDataURL('image/png'); document.body.append(img);
    }
  }
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
})().catch((e) => { out.textContent = `SOME FAILED\n${lines.join('\n')}\nERROR ${e.stack}`; });
</script>
</body>
</html>
