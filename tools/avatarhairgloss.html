<!doctype html>
<html><head><meta charset="utf-8"><title>Avatar hair gloss</title><link rel="icon" href="data:,">
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
</script>
<style>html,body{margin:0;background:#8795a3}canvas{display:block}</style></head>
<body><script type="module">
// #2052 component page, driven by tools/avatarhairglosstest.cjs: the anisotropic gloss along the hair strands (src/avatarhairgloss.js).
// Each look is built twice: from the checkout (`after`) and, when the driver serves the baseline under /base/ (page.route), from the
// baseline src/avatar.js + src/config.js (`before`). __sheet(rows, cols) draws a contact sheet; __orbit() a short camera orbit with the
// frame-to-frame change on the hair; __cost() ms/frame before vs after. `?aa=0` renders without MSAA.
import * as THREE from 'three';
const after = await import('../src/avatar.js'), cfg = await import('../src/config.js');
let before = null;
try { before = await import('../base/src/avatar.js'); } catch { before = null; }
const T = 300, aa = new URLSearchParams(location.search).get('aa') !== '0';
const renderer = new THREE.WebGLRenderer({ antialias: aa, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(T, T); document.body.appendChild(renderer.domElement);
renderer.toneMapping = THREE.NeutralToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8795a3);
const hemi = new THREE.HemisphereLight(0xdfe8f2, 0x6b625a, 1.4); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0dc, 2.6); scene.add(sun, sun.target);
const cam = new THREE.PerspectiveCamera(30, 1, 0.02, 80);
const base = { tall: 1, build: 1, glasses: 0, phones: 0, earrings: 0, necklace: 0, ring: 0, bracelet: 0, watch: 0, hat: 0, facial: 0, hairLength: undefined };
const looks = {
  'kort svart': { style: 0, gender: 0, hair: 0x1b1714, skin: 0x9a6a48 },
  'kort brunt': { style: 0, gender: 0, hair: 0x4a3426, skin: 0xe0b089 },
  'långt blont': { style: 1, gender: 1, hair: 0xc9a46a, skin: 0xf0cdb2 },
  'lockigt svart': { style: 4, gender: 0, hair: 0x231a15, skin: 0x6e4a33 },
  'knut rött': { style: 2, gender: 1, hair: 0x8a3a1c, skin: 0xf0cdb2 },
  'skägg grått': { style: 0, gender: 0, facial: 3, hair: 0x9a948c, beard: 0x9a948c, brows: 0x8a847c, skin: 0xd6a07c },
};
const figures = {};
for (const [name, o] of Object.entries(looks)) for (const [phase, mod] of [['after', after], ['before', before]]) {
  if (!mod) continue;
  const a = new mod.Avatar({ ...cfg.avatarLook('gloss-' + name), ...base, top: 0x3d6b8f, pants: 0x30343a, ...o });
  scene.add(a.object); a.update(1 / 60); a.object.visible = false;
  figures[`${name}-${phase}`] = a;
}
const show = (key) => { for (const [k, a] of Object.entries(figures)) a.object.visible = k === key; return figures[key]; };
const at = (a, bone, off = [0, 0, 0]) => a.bones[bone].localToWorld(new THREE.Vector3(...off));
// The figure faces −z. front / near (three-quarter) / side / back close-ups of the head; m3: 3 m (fov 12°); far: 12 m (fov 12°).
const views = {
  front: (a) => { const h = at(a, 'head', [0, 0.04, 0]); return { eye: h.clone().add(new THREE.Vector3(0, 0.12, -0.72)), look: h, fov: 30 }; },
  near: (a) => { const h = at(a, 'head', [0, 0.05, 0]); return { eye: h.clone().add(new THREE.Vector3(0.38, 0.14, -0.6)), look: h, fov: 30 }; },
  side: (a) => { const h = at(a, 'head', [0, 0.04, 0]); return { eye: h.clone().add(new THREE.Vector3(0.72, 0.08, 0.05)), look: h, fov: 30 }; },
  back: (a) => { const h = at(a, 'head', [0, 0.02, 0]); return { eye: h.clone().add(new THREE.Vector3(-0.25, 0.16, 0.68)), look: h, fov: 30 }; },
  m3: (a) => { const h = at(a, 'head', [0, -0.02, 0]); return { eye: h.clone().add(new THREE.Vector3(1.2, 0.3, -2.75)), look: h, fov: 12 }; },
  far: (a) => { const h = at(a, 'head', [0, -0.3, 0]); return { eye: h.clone().add(new THREE.Vector3(4, 0.3, -11.3)), look: h, fov: 12 }; },
};
function light(kind, v, a) {
  const toCam = v.eye.clone().sub(v.look).setY(0).normalize(), side = new THREE.Vector3(-toCam.z, 0, toCam.x);
  for (const f of Object.values(figures)) f.setLamp?.(0);
  if (kind === 'day') { scene.background.set(0x8795a3); hemi.intensity = 1.4; sun.intensity = 2.6; sun.color.set(0xfff0dc); sun.position.copy(v.look).addScaledVector(toCam, 2).addScaledVector(side, 1.4).add(new THREE.Vector3(0, 3, 0)); }
  else if (kind === 'back') { scene.background.set(0x8795a3); hemi.intensity = 0.6; sun.intensity = 3.2; sun.color.set(0xffd9a8); sun.position.copy(v.look).addScaledVector(toCam, -3).add(new THREE.Vector3(0.3, 0.9, 0)); }
  else { scene.background.set(0x10141c); hemi.intensity = 0.12; sun.intensity = 0.15; sun.color.set(0x9fb4ff); sun.position.copy(v.look).add(new THREE.Vector3(-2, 3, 1)); a?.setLamp?.(1); }
  sun.target.position.copy(v.look);
}
function draw(key, view, kind, turn = 0) {
  const a = show(key); if (!a) return false;
  const v = typeof view === 'function' ? view(a) : views[view](a);
  if (turn) v.eye.sub(v.look).applyAxisAngle(new THREE.Vector3(0, 1, 0), turn).add(v.look);
  cam.fov = v.fov; cam.updateProjectionMatrix(); cam.position.copy(v.eye); cam.lookAt(v.look); light(kind, v, a);
  scene.updateMatrixWorld(true); renderer.render(scene, cam);
  return true;
}
const sheetCanvas = document.createElement('canvas'), sctx = sheetCanvas.getContext('2d');
const label = { front: 'rakt', near: 'snett', side: 'profil', back: 'bakifrån', m3: '3 m', far: '12 m', day: 'dagsljus', back_: 'motljus', night: 'gatlampa', before: 'före', after: 'efter' };
const lightLabel = (k) => (k === 'back' ? 'motljus' : label[k]);
/** rows: look names; cols: [phase, view, light]. Returns a JPEG data URL. */
window.__sheet = (rows, cols) => {
  const pad = 22;
  sheetCanvas.width = cols.length * T; sheetCanvas.height = rows.length * T + pad;
  sctx.fillStyle = '#222'; sctx.fillRect(0, 0, sheetCanvas.width, sheetCanvas.height);
  sctx.font = '13px sans-serif'; sctx.fillStyle = '#fff';
  cols.forEach(([phase, view, kind], i) => sctx.fillText(`${label[phase]} – ${lightLabel(kind)}, ${label[view]}`, i * T + 6, 16));
  rows.forEach((name, r) => cols.forEach(([phase, view, kind], i) => {
    if (draw(`${name}-${phase}`, view, kind)) sctx.drawImage(renderer.domElement, i * T, pad + r * T);
    if (i === 0) { sctx.fillStyle = '#fff'; sctx.fillText(name, 6, pad + r * T + T - 8); }
  }));
  return sheetCanvas.toDataURL('image/jpeg', 0.92);
};
/** A camera orbit (`n` frames, `step` rad apart) round a look at `view`, before and after: a strip (rows before / after) and the mean
 * absolute frame-to-frame change of the pixels (0 … 255) and its largest single-pixel jump share (> 48), as a flicker measure. */
window.__orbit = (name, view, kind, n = 8, step = 0.035) => {
  const gl = renderer.getContext(), px = new Uint8Array(T * T * 4), prev = new Uint8Array(T * T * 4), res = {};
  const phases = ['before', 'after'].filter((p) => figures[`${name}-${p}`]);
  sheetCanvas.width = n * T; sheetCanvas.height = phases.length * T;
  phases.forEach((phase, r) => {
    let sum = 0, jumps = 0, count = 0;
    for (let i = 0; i < n; i++) {
      draw(`${name}-${phase}`, view, kind, i * step);
      sctx.drawImage(renderer.domElement, i * T, r * T);
      gl.readPixels(0, 0, T, T, gl.RGBA, gl.UNSIGNED_BYTE, px);
      if (i) for (let k = 0; k < px.length; k += 4) { const d = (Math.abs(px[k] - prev[k]) + Math.abs(px[k + 1] - prev[k + 1]) + Math.abs(px[k + 2] - prev[k + 2])) / 3; sum += d; if (d > 48) jumps++; count++; }
      prev.set(px);
    }
    res[phase] = { meanChange: +(sum / count).toFixed(3), jumpShare: +(jumps / count).toFixed(5) };
  });
  res.image = sheetCanvas.toDataURL('image/jpeg', 0.9);
  return res;
};
window.__info = () => {
  const res = { msaa: renderer.getContextAttributes().antialias, samples: renderer.getContext().getParameter(renderer.getContext().SAMPLES) };
  for (const [k, a] of Object.entries(figures)) {
    renderer.info.reset(); renderer.info.autoReset = false; draw(k, 'near', 'day'); res[k] = { tris: a.mesh.geometry.attributes.position.count / 3, calls: renderer.info.render.calls }; renderer.info.autoReset = true;
  }
  return res;
};
/** ms per frame (a 1-pixel read for gl finish), before vs after, alternating: `crowd` nine figures at 3 – 6 m, `close` one head filling
 * the 640 × 640 view (the hair's fragments dominate). */
window.__cost = (frames = 20, kind = 'crowd') => {
  const gl = renderer.getContext(), one = new Uint8Array(4), res = { before: [], after: [] };
  renderer.setSize(640, 640);
  for (const phase of ['before', 'after', 'before', 'after', 'before', 'after']) {
    const mod = phase === 'after' ? after : before; if (!mod) continue;
    show(null); const crowd = [], n = kind === 'crowd' ? 9 : 1;
    for (let i = 0; i < n; i++) { const c = new mod.Avatar({ ...cfg.avatarLook('crowd' + i), ...base, ...Object.values(looks)[i % 6] }); c.object.position.set((i % 3 - 1) * 0.9, 0, Math.floor(i / 3) * 1.2); c.update(1 / 60); scene.add(c.object); crowd.push(c); }
    const look = kind === 'crowd' ? new THREE.Vector3(0, 1.3, 1) : at(crowd[0], 'head', [0, 0.06, 0]);
    cam.fov = kind === 'crowd' ? 40 : 30; cam.updateProjectionMatrix();
    cam.position.copy(kind === 'crowd' ? new THREE.Vector3(0.8, 1.6, -4) : look.clone().add(new THREE.Vector3(0.2, 0.08, -0.45))); cam.lookAt(look);
    light('day', { eye: cam.position.clone(), look });
    scene.updateMatrixWorld(true); renderer.render(scene, cam); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, one);
    const t0 = performance.now(); for (let f = 0; f < frames; f++) { renderer.render(scene, cam); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, one); }
    res[phase].push(+((performance.now() - t0) / frames).toFixed(2));
    for (const c of crowd) { c.object.removeFromParent(); c.dispose?.(); }
  }
  renderer.setSize(T, T);
  if (res.before.length) res.ratio = +(Math.min(...res.after) / Math.min(...res.before)).toFixed(3);
  return res;
};
window.__lab = { THREE, after, before, cfg, scene, renderer, cam, light, base, looks, show, draw, figures };
window.__ready = true;
</script></body></html>
