<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Nerf target test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// The Nerf target on the lawn (#99): ring points × a distance bonus; a real dart into the bullseye scores 10,
// the board shows the total and best shot, E on the target clears it. It is down in the ground unless something
// that can hit it is in the hand (#144, #179).
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/targettest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 480; f.height = 300; f.src = '../index.html?test';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, step, toys, target, use } = w.__app;
  const V = camera.position.constructor;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  // empty-handed the target is visible on its place (#1018)
  for (let i = 0; i < 10; i++) step(1 / 60);
  let pass = check(target.object.visible && Math.abs(target.object.position.y - target.ground) < 1e-3, `empty hand: the target is visible on the landing (y ${target.object.position.y.toFixed(2)}, ground ${target.ground.toFixed(2)})`);
  // something tested the marks against everything (a wand, the saber, a dart in flight): the
  // target must keep its correct shape for hit tests (#179)
  w.__app.marks.hit(new V(2.8, 1, 18), new V(2.8, 1, 21));
  toys.blasters[0].take();
  for (let i = 0; i < 60; i++) step(1 / 60);
  pass &= check(target.object.visible && Math.abs(target.object.position.y - target.ground) < 1e-3 && target.object.scale.y === 1, 'a blaster in the hand: the target is visible (not scaled)');
  target.object.updateMatrixWorld(true);
  target.reset();
  const c = target.face.getWorldPosition(new V());
  const front = new V(0, 0, -1).transformDirection(target.object.matrixWorld);
  const right = new V(1, 0, 0).transformDirection(target.object.matrixWorld);
  const at = (dz) => c.clone().addScaledVector(front, dz);
  for (const [dz, want] of [[1, 10], [3, 20], [5, 30], [8, 40]]) pass &= check(target.points(c, at(dz)) === want, `bullseye from ${dz} m: ${target.points(c, at(dz))} (want ${want})`);
  pass &= check(target.points(c.clone().addScaledVector(right, 0.35), at(1)) === 1, `the outer ring: ${target.points(c.clone().addScaledVector(right, 0.35), at(1))}`);
  pass &= check(target.points(c.clone().addScaledVector(right, 0.5), at(1)) === 0, 'outside the face: 0');
  // a real dart from 1 m, straight at the middle (it drops ~4 cm on the way: still the bullseye)
  const sc0 = w.__app.totalScore(), st0 = w.__app.stats.target;
  const standing = at(1.3); player.spawn(standing.x, standing.z, 0); step(1 / 60);
  toys.darts.fire(at(1), front.clone().negate().add(new V(0, 0.02, 0)).normalize(), 0xff7a1a);
  for (let i = 0; i < 30; i++) step(1 / 60);
  pass &= check(target.score.total === 10 && target.score.best === 10 && target.score.hits === 1, `a dart in the bullseye: total ${target.score.total}, best ${target.score.best}`);
  pass &= check(w.__app.marks.live.some((l) => l.kind === 'splash'), 'a paint mark on the board');
  // #1708: the statistic counts all 10 board points; the game score gets only a few
  pass &= check(w.__app.stats.target - st0 === 10 && w.__app.totalScore() - sc0 <= 2, `a bullseye: stats +${w.__app.stats.target - st0}, game score +${w.__app.totalScore() - sc0} (#1708)`);
  use(target.target);
  pass &= check(target.score.total === 0 && target.score.best === 0, 'E on the target clears the score');
  toys.blasters[0].putBack();
  for (let i = 0; i < 60; i++) step(1 / 60);
  pass &= check(target.object.visible && Math.abs(target.object.position.y - target.ground) < 1e-3, 'blaster back: the target remains visible (#1018)');
  // the target remains visible with any held item (lightsaber, wand, flashlight, or empty) (#1018)
  for (const [name, item] of [['the lightsaber', w.__app.saber], ['a wand', toys.wands[0]], ['the flashlight', toys.flashlight]]) {
    item.take();
    for (let i = 0; i < 60; i++) step(1 / 60);
    pass &= check(target.object.visible && Math.abs(target.object.position.y - target.ground) < 1e-3, `${name} in the hand: the target remains visible`);
    item.putBack();
    for (let i = 0; i < 60; i++) step(1 / 60);
    pass &= check(target.object.visible && Math.abs(target.object.position.y - target.ground) < 1e-3, `${name} put back: the target remains visible`);
  }
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
