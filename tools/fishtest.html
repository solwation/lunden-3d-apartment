<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Fish finger test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Fish fingers (#162): open the freezer, take one out of the carton and eat it (three bites), take another and put
// it down on the dining table and on the floor, a third goes back into the carton; the carton counts down and F
// clears everything away and fills it again.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/fishtest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, step, fish, world, heldItem, scene, stats, toggleFurniture } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  const V = camera.position.constructor;
  const lookAt = (p, stands, re) => {
    for (const [x, z] of stands) {
      player.spawn(x, z, 0);
      for (let i = 0; i < 3; i++) step(1 / 60);
      scene.updateMatrixWorld(true);
      const dx = p.x - camera.position.x, dz = p.z - camera.position.z;
      camera.rotation.y = Math.atan2(-dx, -dz); camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz));
      step(1 / 60);
      if (!btn.hidden && re.test(btn.textContent)) return true;
    }
    return false;
  };
  const kitchen = [[4.3, 4.1], [4.1, 4.0], [4.4, 3.9], [4.0, 3.8]];
  let pass = check(!!fish && fish.left === 15, `a carton with ${fish?.left} fish fingers`);
  const fz = fish.freezer;
  pass &= check(lookAt(fz.door.children[0].getWorldPosition(new V()).setY(1.0), kitchen, /öppna frysen/i), `freezer: "${btn.textContent}"`);
  btn.click(); for (let i = 0; i < 90; i++) step(1 / 60);
  pass &= check(fz.isOpen, 'freezer open');
  const boxAt = () => fish.object.getWorldPosition(new V()).add(new V(0, 0.03, 0));
  pass &= check(lookAt(boxAt(), kitchen, /ta en fiskpinne ur paketet/i), `the carton: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  const one = heldItem();
  pass &= check(one?.isFish && one.model.parent === camera && fish.left === 14, `a fish finger in the hand, ${fish.left} left`);
  // eat it: three bites
  const eatenBefore = stats.fish;
  for (let b = 0; b < 3; b++) { one.use(); for (let i = 0; i < 40; i++) step(1 / 60); }
  pass &= check(!heldItem() && one.state === 'box' && fish.eatenCount === 1 && stats.fish === eatenBefore + 1, `eaten in three bites (hand empty, stats ${stats.fish})`);
  // another one onto the dining table, then onto the floor
  pass &= check(lookAt(boxAt(), kitchen, /ta en fiskpinne ur paketet/i), 'the carton again');
  btn.click(); step(1 / 60);
  const two = heldItem();
  pass &= check(two?.isFish && fish.left === 13, `the second one, ${fish.left} left`);
  const table = { x: 3.5, y: 0.75, z: 1.6 }, tableStands = [[2.6, 2.2], [2.5, 1.6], [3.5, 2.6]];
  pass &= check(lookAt(table, tableStands, /lägga ner fiskpinnen/i), `dining table: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(two.state === 'placed' && !heldItem() && Math.abs(two.middle(new V()).y - 0.75) < 0.03, `on the dining table (y ${two.middle(new V()).y.toFixed(3)})`);
  pass &= check(lookAt(two.middle(new V()), tableStands, /^ta fiskpinnen/i), `pick it up: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === two, 'in the hand again');
  const floor = { x: 3.9, y: 0, z: 3.4 };
  pass &= check(lookAt(floor, [[3.9, 2.6], [3.6, 2.4], [4.2, 2.5]], /lägga ner fiskpinnen/i), `the floor: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(two.state === 'placed' && Math.abs(two.middle(new V()).y) < 0.02, `on the floor (y ${two.middle(new V()).y.toFixed(3)})`);
  // a third one back into the carton
  pass &= check(lookAt(boxAt(), kitchen, /ta en fiskpinne ur paketet/i), 'the carton a third time');
  btn.click(); step(1 / 60);
  pass &= check(heldItem()?.isFish && fish.left === 12, `the third one, ${fish.left} left`);
  pass &= check(lookAt(boxAt(), kitchen, /lägga tillbaka fiskpinnen i paketet/i), `back: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(!heldItem() && fish.left === 13 && fish.placed.length === 1, `back in the carton, ${fish.left} left, ${fish.placed.length} lying out`);
  // F: cleared away, a full carton
  toggleFurniture(false); step(1 / 60);
  pass &= check(fish.left === 15 && fish.placed.length === 0 && !two.model.visible, `F: ${fish.left} in the carton, nothing lying out`);
  toggleFurniture(true); step(1 / 60);
  pass &= check(fish.fingers.every((x) => !x.model.visible) && fish.object.visible, 'furniture back: the carton is there, no stray fish fingers');
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
