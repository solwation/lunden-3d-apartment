<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Plant test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Pot plants you can lift (#185): a pot from the kitchen window onto the dining table (the window's merged meshes
// lose it, its own model shows), the shelf's pot plant; the removed café flower (#490) and side-table flower (#1248) stay absent.
// F sends them all home (and the pot melts into the merged meshes again).
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/planttest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 480; f.height = 300; f.src = '../index.html?test';
document.body.append(f);
f.onload = async () => {
 try {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const A=w.__app;
  const { player, camera, step, world, scene, sillPots, things, heldItem, toggleFurniture } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.documentElement.requestFullscreen=undefined;
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  const V = camera.position.constructor;
  const aim = (p, from, feet = 0) => {
    player.spawn(from[0], from[1], 0);
    if (feet) { player.pos.y = feet; player.eyeY = feet + 1.62; }
    for (let i = 0; i < 3; i++) step(1 / 60);
    scene.updateMatrixWorld(true);
    const dx = p.x - camera.position.x, dz = p.z - camera.position.z;
    camera.rotation.set(Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz)), Math.atan2(-dx, -dz), 0, 'YXZ');
    step(1 / 60);
    return btn.hidden ? '(hidden)' : btn.textContent;
  };
  const sill = world.sillPlants;
  const verts = () => sill.children.reduce((n, m) => n + m.geometry.attributes.position.count, 0);
  let pass = check(sillPots.length >= 11, // (#409: the Sovrum 1 orchid made way for the Hue Go)
    `${sillPots.length} pots on the window boards, ${sill.children.length} merged meshes`);
  // (1) a pot from the kitchen window (z < 0.6, Entréplan) onto the dining table
  const required=(value,name)=>{if(!value)throw new Error('Missing required '+name);return value;};
  const pot = sillPots.find((p) => p.home.pos.z < 0.6 && p.home.pos.y < 1);
  required(pot,'kitchen sill plant');
  const v0 = verts();
  let label = aim(pot.home.pos.clone().add(new V(0, 0.08, 0)), [pot.home.pos.x, 1.2]);
  pass &= check(/ta blomkrukan/i.test(label)&&A.focus().focused===pot.takeTarget, `at the kitchen window: "${label}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === pot && verts() < v0 && pot.model.children.every((m) => m.visible), `in the hand: the merged meshes without it (${v0} → ${verts()} vertices), its own model shows`);
  const at = (m) => m.getWorldPosition(new V());
  const table = world.cupSurfaces.find((m) => Math.abs(m.userData.surface - 0.75) < 0.01 && at(m).z > 0.8 && at(m).z < 3 && at(m).x > 2.5);
  required(table,'dining table surface');
  const tp = at(table).setY(table.userData.surface);
  label = aim(tp, [tp.x - 0.9, tp.z + 0.3]);
  pass &= check(/^Ställ ner$/i.test(label)&&A.focus().focused?.kind==='place', `at the dining table: "${label}"`);
  btn.click(); step(1 / 60);
  pass &= check(pot.placed && Math.abs(pot.model.position.y - table.userData.surface) < 0.01, `standing on the table (y ${pot.model.position.y.toFixed(3)})`);
  // (2) #1248: side-table flower intentionally absent; the tray table remains
  pass &= check(!things.some((t) => t.kind === 'plant' && /sidobordet/.test(t.backTarget.name)), 'side-table flower intentionally absent');
  // (3) the shelf's pot plant
  const shelfPot = required(things.find(t=>t.kind==='plant'&&/hyllan/.test(t.backTarget.name)&&t.name==='blomkrukan'&&t.home.pos.y>1.7),'upper-shelf plant');
  label = aim(shelfPot.where().add(new V(0, 0.05, 0)), [shelfPot.home.pos.x + 0.9, shelfPot.home.pos.z]);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === shelfPot, `the shelf's pot plant ("${label}")`);
  // (4) the face pot with glasses (#343): off the lower shelf, onto the dining table, back on the shelf with E, then off again for F
  if (heldItem()) { heldItem().putBack?.(); step(1 / 60); }
  const face = things.find((t) => t.kind === 'plant' && /glasögonen/.test(t.name));
  pass &= check(!!face && Math.abs(face.home.pos.y - 1.923) < 0.01, `the face pot on the String shelf's lowest board (#1298: 1.84 + 0.075 + 0.008) (y ${face?.home.pos.y.toFixed(3)})`);
  required(face,'face pot');
  label = aim(face.where().add(new V(0, 0.06, 0)), [face.home.pos.x + 0.9, face.home.pos.z]);
  pass &= check(/ta krukan med glasögonen/i.test(label)&&A.focus().focused===face.takeTarget, `at the shelf: "${label}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === face, 'the face pot in the hand');
  const tp2 = tp.clone().add(new V(0, 0, 0.35));
  label = aim(tp2, [tp2.x - 0.9, tp2.z + 0.3]);
  pass &= check(/^Ställ ner$/i.test(label)&&A.focus().focused?.kind==='place', `at the dining table: "${label}"`);
  btn.click(); step(1 / 60);
  pass &= check(face.placed && Math.abs(face.model.position.y - table.userData.surface) < 0.01, `the face pot on the table (y ${face.model.position.y.toFixed(3)})`);
  label = aim(face.where().add(new V(0, 0.06, 0)), [tp2.x + 0.9, tp2.z]);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === face, `taken again ("${label}")`);
  label = aim(face.home.pos.clone().add(new V(0, 0.06, 0)), [face.home.pos.x + 0.9, face.home.pos.z]);
  pass &= check(/ställa tillbaka krukan med glasögonen/i.test(label)&&A.focus().focused===face.backTarget, `at its place: "${label}"`);
  btn.click(); step(1 / 60);
  pass &= check(!face.held && !face.placed && face.model.position.distanceTo(face.home.pos) < 0.001, 'back on the shelf');
  required(face,'face pot');
  label = aim(face.where().add(new V(0, 0.06, 0)), [face.home.pos.x + 0.9, face.home.pos.z]);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === face, 'taken once more (F sends it home)');
  // #490 / 436fb82 intentionally removed the café flower; the set remains.
  if (heldItem()) { heldItem().putBack?.(); step(1 / 60); }
  const C=await w.eval("import('/src/config.js')");
  pass &= check(!things.some(t=>t.kind==='plant'&&/cafébordet/.test(t.backTarget.name))&&C.FURNITURE.filter(t=>t.type==='aborgtable').length===1&&C.FURNITURE.filter(t=>t.type==='aborgchair').length===2,'café flower intentionally absent, table and two chairs retained');
  required(face,'face pot');
  label = aim(face.where().add(new V(0, 0.06, 0)), [face.home.pos.x + 0.9, face.home.pos.z]);
  btn.click(); step(1 / 60);
  // F: all home, the pot back in the merged meshes
  toggleFurniture(); toggleFurniture();
  pass &= check(!pot.placed && !pot.held && verts() === v0 && pot.model.children.every((m) => !m.visible), `F: the window pot home (${verts()} vertices)`);
  pass &= check(!shelfPot.held && shelfPot.model.position.distanceTo(shelfPot.home.pos) < 0.001, 'F: the shelf plant home');
  pass &= check(!face.held && !face.placed && face.model.position.distanceTo(face.home.pos) < 0.001, 'F: the face pot home');
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
 } catch(e) { out.textContent='SOME FAILED\nFAIL '+(e.stack||e.message); }
};
</script>
</body>
</html>
