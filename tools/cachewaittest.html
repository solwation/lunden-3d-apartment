<!doctype html><meta charset="utf-8"><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script><pre id="out">Running actual native cache wait…</pre>
<script type="module">
import * as T from 'three';
const lines=[],cases=[];let serial=0;const check=(v,s)=>{lines.push((v?'PASS ':'FAIL ')+s);if(!v)throw Error(s)},sleep=ms=>new Promise(r=>setTimeout(r,ms));
const get=HTMLCanvasElement.prototype.getContext;HTMLCanvasElement.prototype.getContext=function(t,...args){if(/webgl/i.test(t))throw Error('No WebGL permitted');return get.call(this,t,...args)};
function native(scene,camera,points){const hits=[];for(let i=1;i<points.length;i++){const d=points[i].clone().sub(points[i-1]);const r=new T.Raycaster(points[i-1],d.clone().normalize(),0,d.length());r.camera=camera;r.layers.mask=camera.layers.mask;hits.push(...r.intersectObjects(scene.children,true))}return hits.map(h=>({distance:h.distance,point:h.point.toArray(),face:h.faceIndex,material:h.face.materialIndex}));}
async function run(kind,mode){const W=await import('/src/combatworld.js?waitprobe='+kind+'-'+serial++),scene=new T.Scene(),camera=new T.PerspectiveCamera(),ghosts=new T.Group(),g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute([8,-1,-1,8,1,-1,8,0,1],3));const triangles=mode==='disjoint'?100000:8000,indices=new Uint16Array(triangles*3);for(let i=0;i<indices.length;i++)indices[i]=i%3;g.setIndex(new T.BufferAttribute(indices,1));g.boundingSphere=new T.Sphere(new T.Vector3(8,0,0),20);const mesh=new T.Mesh(g,new T.MeshBasicMaterial({side:T.DoubleSide}));scene.add(mesh);scene.updateMatrixWorld(true);const points=mode==='floor'?[new T.Vector3(0,1,0),new T.Vector3(0,-1,0)]:[new T.Vector3(0,.25,0),new T.Vector3(2,.25,0)];if(mode==='floor'){mesh.rotation.z=Math.PI/2;mesh.position.y=-8;scene.updateMatrixWorld(true)}if(mode==='shared'){const other=new T.Mesh(g,mesh.material);other.position.x=-7;scene.add(other);scene.updateMatrixWorld(true)}
W.prepareCombatWorld(scene,ghosts,camera);let cancel=false,done=false;const started=performance.now(),promise=W.combatWorldPathBlocked(scene,ghosts,camera,points,camera.layers,{deadline:performance.now()+(mode==='disjoint'?250:2000),cancelled:()=>cancel}).then(value=>{done=true;return value});await sleep(0);W.waitProbe.pump();const scanned=W.waitProbe.state(g);check(scanned.scan===3&&!scanned.ready&&scanned.urgentUsers===1,kind+' '+mode+' scanned cold bounds while spatial triangles remain');
if(mode==='transform'){mesh.position.x=-7;scene.updateMatrixWorld(true)}if(mode==='membership'){const other=new T.Mesh(g,mesh.material);other.position.x=-7;scene.add(other);scene.updateMatrixWorld(true)}if(mode==='version'){g.attributes.position.needsUpdate=true;W.waitProbe.pump()}if(mode==='dispose')g.dispose();if(mode==='cancel')cancel=true;
await sleep(45);const partial=W.waitProbe.state(g),operationsBefore=W.waitProbe.operations();
if(mode==='shared'||mode==='transform'||mode==='floor'||mode==='membership'&&kind==='reference'){check(!done&&partial.urgentUsers===1,kind+' '+mode+' potential collider retains urgency/wait');let n=0;while(!W.waitProbe.state(g).ready&&n++<500){W.waitProbe.pump();if(n%10===0)await sleep(0)}check(W.waitProbe.state(g).ready,kind+' '+mode+' bounded pumping completes spatial cache')}
const value=await promise,oracle=native(scene,camera,points),metrics=W.combatWorldMetrics(),final=W.waitProbe.state(g);cases.push({kind,mode,value,oracle,scanned,partial,final,operationsBefore,elapsedMs:performance.now()-started,metrics});
if(mode==='disjoint'){check(!oracle.length,kind+' exact native disjoint arc has no hit');check(value===(kind==='reference'?null:false),kind+' disjoint '+(kind==='reference'?'retains old deadline':'prunes scanned bounds before full spatial build'));check(metrics.lastPath.reason===(kind==='reference'?'deadline':'clear'),kind+' exact completed reason');if(kind==='current')check(!final.ready&&final.urgentUsers===0,'current clears while unfinished spatial cache urgency releases exactly once')}
if(mode==='shared'||mode==='transform'||mode==='floor')check(value===true&&oracle.length>0,kind+' '+mode+' native wall positive preserved');
if(mode==='membership')check(value===true&&oracle.length>0,kind+' newly added shared-geometry collider cannot false-clear');
if(['version','dispose','cancel'].includes(mode))check(value===null,kind+' '+mode+' invalidation/cancellation remains null');
check((final?.urgentUsers??0)===0,kind+' '+mode+' urgentUsers never leak/go negative');g.dispose();}
async function concurrent(kind){const W=await import('/src/combatworld.js?waitprobe='+kind+'-'+serial++),s=new T.Scene(),c=new T.PerspectiveCamera(),ghosts=new T.Group(),g=new T.BoxGeometry(.1,2,2,1,1,2000);g.translate(8,0,0);g.boundingSphere=new T.Sphere(new T.Vector3(8,0,0),20);const m=new T.Mesh(g,new T.MeshBasicMaterial({side:T.DoubleSide}));s.add(m);s.updateMatrixWorld(true);W.prepareCombatWorld(s,ghosts,c);let firstDone=false,secondDone=false;const a=[new T.Vector3(0,0,0),new T.Vector3(2,0,0)],b=[new T.Vector3(7,0,0),new T.Vector3(9,0,0)],first=W.combatWorldPathBlocked(s,ghosts,c,a,c.layers,{deadline:performance.now()+2000}).then(v=>{firstDone=true;return v}),second=W.combatWorldPathBlocked(s,ghosts,c,b,c.layers,{deadline:performance.now()+2000}).then(v=>{secondDone=true;return v});await sleep(0);for(let n=0;n<50&&W.waitProbe.state(g).scan<W.waitProbe.state(g).positions;n++)W.waitProbe.pump();await sleep(45);const partial=W.waitProbe.state(g);check(partial.urgentUsers===(kind==='current'?1:2)&&!secondDone,kind+' concurrent shared entry retains the genuine collider owner');check(firstDone===(kind==='current'),kind+' concurrent only disjoint owner may finish early');for(let n=0;n<500&&!W.waitProbe.state(g).ready;n++){W.waitProbe.pump();if(n%10===0)await sleep(0)}check(await first===false&&await second===true,kind+' concurrent outcomes match independent native clear/wall');check(!native(s,c,a).length&&native(s,c,b).length>0,kind+' independent concurrent native arcs agree');check(W.waitProbe.state(g).urgentUsers===0,kind+' concurrent releases exactly once');cases.push({kind,mode:'concurrent',partial,final:W.waitProbe.state(g)});g.dispose();}
async function cancelAfterDrop(){const W=await import('/src/combatworld.js?waitprobe=current-'+serial++),s=new T.Scene(),c=new T.PerspectiveCamera(),g=new T.BoxGeometry(1,1,1,1,1,1000);g.translate(8,0,0);g.boundingSphere=new T.Sphere(new T.Vector3(8,0,0),20);s.add(new T.Mesh(g,new T.MeshBasicMaterial()));s.updateMatrixWorld(true);W.prepareCombatWorld(s,new T.Group(),c);let dropped=false;W.waitProbe.onDrop(()=>{dropped=true;g.dispose()});const promise=W.combatWorldPathBlocked(s,new T.Group(),c,[new T.Vector3(0,0,0),new T.Vector3(2,0,0)],c.layers,{deadline:performance.now()+2000});await sleep(0);for(let n=0;n<50&&W.waitProbe.state(g)?.scan<W.waitProbe.state(g)?.positions;n++)W.waitProbe.pump();const value=await promise;check(dropped&&value===null&&W.combatWorldMetrics().lastPath.reason==='cache-invalidated','real dispose immediately after early drop retains original-entry null cancellation');cases.push({kind:'current',mode:'dispose-after-drop',value,metrics:W.combatWorldMetrics()});}
try{for(const mode of ['disjoint','shared','transform','floor','membership','version','dispose','cancel'])for(const kind of ['reference','current'])await run(kind,mode);for(const kind of ['reference','current'])await concurrent(kind);await cancelAfterDrop();window.result={pass:true,lines,cases};}catch(e){lines.push('FAIL '+e.stack);window.result={pass:false,lines,cases};}document.getElementById('out').textContent=lines.join('\n');
</script>
