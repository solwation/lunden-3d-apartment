<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Power cut test</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
// The power cut (#604, src/power.js), on touch, in the evening: the fuse box is only a target with the EL/C cabinet
// open; "Pilla på elcentralen" buzzes (the lamps flicker), then bangs; Kv. Lunden is dark (the flat's lamps, pool lights
// and washes, Hus A–C's lit windows, Hus L's lit glass, the stairwell, the garage, the TV and its LED) while the rest of
// the site keeps its lit windows; the switches keep their state; the TV says "Strömmen är borta". Mending: the action
// button held (pointerdown … pointerup) on the fuse box, letting go pauses, a click does not hold; after POWER.repair s
// in all the power is back and the lamps that were on are on. The flashlight lies in the cabinet. A reload during a
// cut starts with power.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/powertest.html
import { SITE, POWER } from '../src/config.js';
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html?time=21&month=10&day=9&weather=clear&freeze'; // (the clock stands: the windows' routines stay put)
document.body.append(f);
const lines = [];
const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
let pass = true;
const loaded = () => new Promise((res) => { f.onload = async () => { while (!f.contentWindow.__app?.power) await wait(100); res(f.contentWindow.__app); }; });
const app = await loaded();
const w = f.contentWindow, d = f.contentDocument;
const { player, camera, step, world, power, lights, toys, scene } = app;
d.getElementById('start-touch').click();
await wait(50);
world.object.updateMatrixWorld(true);
const btn = d.getElementById('action');
const V = camera.position.constructor;
const aim = (obj, stands, re) => { // stand somewhere listed, look at obj, until the button matches
  obj.updateMatrixWorld(true);
  const p = obj.getWorldPosition(new V());
  for (const [x, z] of stands) {
    player.spawn(x, z, 0);
    for (let i = 0; i < 3; i++) step(1 / 60);
    const dx = p.x - camera.position.x, dz = p.z - camera.position.z;
    camera.rotation.y = Math.atan2(-dx, -dz); camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz));
    step(1 / 60);
    if (!btn.hidden && re.test(btn.textContent)) return true;
  }
  return false;
};
const run = (secs, dt = 1 / 20) => { for (let t = 0; t < secs; t += dt) step(dt); };
const ptr = (type) => btn.dispatchEvent(new w.PointerEvent(type, { bubbles: true, pointerType: 'touch' }));
// the window lights: lit instances inside / outside Kv. Lunden's Hus A–C
const houses = SITE.blocks.filter((b) => /^Hus [A-C]$/.test(b.name));
const win = world.windowLights.object;
const litWindows = () => {
  const m = new (camera.matrix.constructor)(), p = new V(), c = new (lights.pool[0].color.constructor)();
  let lunden = 0, other = 0;
  for (let i = 0; i < win.count; i++) {
    win.getMatrixAt(i, m); p.setFromMatrixPosition(m); win.getColorAt(i, c);
    if (c.r + c.g + c.b < 0.05) continue;
    if (houses.some((b) => p.x > b.x0 - 1 && p.x < b.x1 + 1 && p.z > b.z0 - 1 && p.z < b.z1 + 1)) lunden++; else other++;
  }
  return { lunden, other };
};
let litGlass = null; scene.traverse((o) => { if (o.name === 'neighborLitGlass') litGlass = o.material; });

// --- before: a lamp on in the hall, the living-room TV on
const cab = world.lids.find((l) => l.fuse);
const hall = [...lights.rooms.entries()].find(([k]) => /^0:Hall/.test(k))?.[1];
if (hall && !hall.on) hall.toggle();
const tv = world.furnitureTargets.find((t) => t.kind === 'tv');
if (!tv.isOpen) tv.toggle();
run(0.5);
const w0 = litWindows();
pass &= check(w0.lunden > 0 && w0.other > 0, `evening: lit windows in Kv. Lunden ${w0.lunden}, elsewhere ${w0.other}`);
pass &= check(power.on && lights.supply === 1, 'power at the start');
// --- the fuse box only with the cabinet open
const stands = [[1.4, 0.66], [1.3, 0.72], [1.5, 0.6], [1.2, 0.66]];
if (cab.isOpen) { cab.toggle(); for (let i = 0; i < 90; i++) cab.update(1 / 60); }
pass &= check(!aim(power.target.pickable, stands, /elcentralen/i), `cabinet shut: no fuse box (“${btn.textContent}”)`);
cab.toggle(); for (let i = 0; i < 90; i++) cab.update(1 / 60); cab.object.updateMatrixWorld(true);
// --- the flashlight lies in the cabinet (#604)
pass &= check(aim(toys.flashlight.model, stands, /ta ficklampan/i), `the flashlight in the open EL/C cabinet: “${btn.textContent}”`);
pass &= check(aim(power.target.pickable, stands, /pilla på elcentralen/i), `cabinet open: “${btn.textContent}”`);
// --- trip it: buzz (flicker), then the bang
btn.click();
pass &= check(power.state === 'buzz', `buzzing (${power.state})`);
let lo = 1, hi = 0;
for (let t = 0; t < POWER.buzz - 0.2; t += 1 / 30) { step(1 / 30); lo = Math.min(lo, lights.supply); hi = Math.max(hi, lights.supply); }
pass &= check(lo < 0.5 && hi === 1 && power.on, `the lamps flicker while it buzzes (supply ${lo.toFixed(2)} … ${hi})`);
run(0.5, 1 / 30);
pass &= check(power.state === 'off' && lights.supply === 0, `bang: no power (${power.state}, supply ${lights.supply})`);
run(0.3);
const w1 = litWindows();
pass &= check(w1.lunden === 0 && w1.other === w0.other, `Kv. Lunden's windows dark (${w1.lunden}), the rest lit (${w1.other} / ${w0.other})`);
pass &= check(lights.pool.every((l) => l.intensity === 0), 'no pool light anywhere');
pass &= check(hall?.on === true && hall.mats.every((m) => !m.emissiveIntensity && !(m.userData.glow && m.visible)), 'the hall switch still on, its lamp dark');
const auto = lights.floorLamps.find((l) => l.room.on);
pass &= check(!auto || auto.spec.shade.emissiveIntensity < 0.05, `a small lamp that was on is dark (${auto?.name})`);
pass &= check(!litGlass || litGlass.emissiveIntensity === 0, 'Hus L\'s lit windows dark');
pass &= check(Math.abs(world.core.mats.wall.color.r - POWER.emergency) < 1e-6 && world.garage.powerOff, 'the stairwell on emergency light, the garage tubes off');
pass &= check(!tv.isOpen, 'the TV went off');
const tp = tv.pickable.getWorldPosition(new V());
pass &= check(aim(tv.pickable, [[1.5, 0], [-1.5, 0], [0, 1.5], [0, -1.5], [1, 1], [-1, -1], [1, -1], [-1, 1]].map(([dx, dz]) => [tp.x + dx, tp.z + dz]), /strömmen är borta/i), `the TV: “${btn.textContent}”`);
pass &= check(!lights.roomLit(0, 'Hall'), 'no room counts as lit');
// --- mending: held, paused when let go, a click does not mend
pass &= check(aim(power.target.pickable, stands, /laga elcentralen/i), `in the cut: “${btn.textContent}”`);
ptr('pointerdown');
run(10);
const p10 = power.progress;
pass &= check(power.holding && Math.abs(p10 - 10) < 0.3, `held 10 s: ${p10.toFixed(2)} s`);
pass &= check(/\d+ %/.test(btn.textContent) && !d.getElementById('prompt').hidden, `progress shown: “${btn.textContent}”`);
ptr('pointerup'); btn.click();
run(3);
pass &= check(!power.holding && Math.abs(power.progress - p10) < 1e-6, `let go: paused at ${power.progress.toFixed(2)} s, the click did not mend`);
player.spawn(3, 3, 0); ptr('pointerdown'); run(2); // held, but elsewhere
pass &= check(Math.abs(power.progress - p10) < 1e-6, 'held but looking away: no progress');
ptr('pointerup');
pass &= check(aim(power.target.pickable, stands, /laga elcentralen/i), 'back at the fuse box');
ptr('pointerdown');
run(POWER.repair - p10 + 0.5);
ptr('pointerup');
pass &= check(power.state === 'on' && lights.supply === 1, `mended after ${POWER.repair} s held in all (${power.state})`);
run(0.5);
const w2 = litWindows();
pass &= check(w2.lunden === w0.lunden && w2.other === w0.other, `windows lit again (${w2.lunden} / ${w0.lunden})`);
pass &= check(hall?.on === true && hall.mats.some((m) => m.emissiveIntensity > 0 || (m.userData.glow && m.visible)), 'the hall lamp is lit again');
pass &= check(!auto || auto.spec.shade.emissiveIntensity > 0.5, 'the small lamp is lit again');
pass &= check(world.core.mats.wall.color.r === 1 && !world.garage.powerOff, 'the stairwell and garage have power');
// --- a reload in a cut starts with power
power.trip(); run(POWER.buzz + 0.5, 1 / 30);
pass &= check(power.state === 'off', 'cut again before the reload');
const again = loaded();
w.location.reload();
const app2 = await again;
pass &= check(app2.power.state === 'on' && app2.lights.supply === 1, `after a reload: power (${app2.power.state})`);
out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
</script>
</body>
</html>
