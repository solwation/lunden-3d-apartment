<p>Begränsad riktig Room/Ghosts/Rest/Glass-klient B – ingen andra full värld</p><button id="glass">Ta glas B</button><button id="toast">Skåla B</button>
<script type="module">
import * as T from 'three';import {Ghosts} from '../src/ghosts.js';import {RoofPicnic} from '../src/roofpicnic.js';import {ROOF_PICNIC as C} from '../src/config.js';import {Roofs} from '../src/roofs.js';import {Rest} from '../src/rest.js';import {restState} from '../src/remote-pose.js';import {heldCategory} from '../src/heldcategory.js';import {heldItem} from '../src/holdable.js';import {Glass,toastHandler} from '../src/things.js';import {Life} from '../src/life.js';
const scene=new T.Scene(),camera=new T.PerspectiveCamera(),y=Number(new URL(location.href).searchParams.get('y')),world={roofs:new Roofs([{id:'fixture-same-roof-height',x0:C.at[0]-10,x1:C.at[0]+10,z0:C.at[1]-10,z1:C.at[1]+10,y}]),furnitureTargets:[]},life=new Life({scene,camera}),picnic=new RoofPicnic({scene,camera,world,life}),rest=new Rest(camera);camera.position.copy(picnic.seat.spots[1].pos);rest.begin(picnic.seat,picnic.seat.spots[1],{x:C.at[0],y,z:C.at[1],yaw:C.yaw});rest.update(1);

toastHandler.fn=(g,back=false)=>ghosts.toast(0,back);ghosts.onToast=(m,g)=>{seen.push({m,from:g.id});if(!m.b&&heldItem() instanceof Glass)heldItem().useAlt(true);};document.querySelector('#glass').onclick=()=>picnic.glasses[1].take();document.querySelector('#toast').onclick=()=>picnic.glasses[1].useAlt();
setInterval(()=>{rest.update(.03);ghosts.update(.03);picnic.glasses.forEach(g=>g.update(.03));},30);window.picnicPeer={ghosts,rest,picnic,seen};
</script>
