<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Life test (M1)</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
// The life simulator's first milestone, M1 (epic #364): the sandwich flow, one section per issue.
//  #373 the kitchen's food in its places from the start (named in the prompt), the cucumber taken out and put back, a thing
//       used up is back on the next opening (never while the old one is out), a new visit keeps the amounts.
//  #374 the tools in the utensil drawer and the board on the splashback: taken and put back with E; the wrong tool says so
//       ("Osthyveln skär inte gurka") and nothing is used.
//  #375 the cutting board as a station: no cut until it lies on a worktop, a full board blocks before anything is used,
//       carried it carries the slices, held at a plate it pushes them over.
//  #376 cutting the cucumber: one slice / three (the knife chops), an exact mass balance, fast presses give nothing extra,
//       slices taken one by one, the end (no slice, "gurkänden"), a reload keeps what is left.
//  #377 the bread bag: closed → "Öppna brödpåsen först", opened (no clip), slices one at a time into the hand down to 0 and
//       no further, the empty bag stays; a slice on a plate; a slice eaten plain in four bites.
//  #378 butter (open the pack, a dab on the butter knife, spread: −8 g exactly, a yellow layer, a double press = one
//       portion) and cheese (the slicer: −12 g exactly, a slice on the board / beside the block); the tools used; the last bits.
//  #379 a sandwich: a plate from the plate cabinet, toppings onto the bread move exactly once, free combinations named from
//       what is on them, the layer limit, carried on the plate to the dining table, a half-built one through a reload.
//  #380 eating it: sitting at the dining table, taken off the plate in reach, bites step by step, put back half eaten (it
//       stays), the last bite leaves a used plate (crumbs), the 'ate' event, counted once per sandwich.
//  #381 the bin under the sink ("Avfall"): its front opened first, the cucumber's end and an empty package go in and it
//       fills up, full it keeps the waste in the hand, a knife / a plate is never thrown away; then the WHOLE M1 flow in
//       the visitor's own home with a page-made reload in the middle.
//   chromium --headless=new --dump-dom http://localhost:8137/tools/lifetest.html
import { LIFE_FOOD, LIFE_TOOLS } from '../src/config.js';
const out = document.getElementById('out');
const lines = [];
let pass = true;
const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= !!ok; return ok; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function load(q) {
  const f = document.createElement('iframe');
  f.width = 900; f.height = 600; f.src = `../index.html?${q}`;
  document.body.append(f);
  await new Promise((r) => { f.onload = r; });
  while (!f.contentWindow.__app) await wait(100);
  f.contentDocument.getElementById('start-touch').click();
  await wait(50);
  return f;
}
/** The test's tools for one page: aim the eye at a world point from a few stands until the action button matches. */
function kit(f) {
  const A = f.contentWindow.__app, d = f.contentDocument, btn = d.getElementById('action');
  const { player, camera, step, scene } = A;
  const settle = (o) => { for (let i = 0; i < 40; i++) o.update(0.1); scene.updateMatrixWorld(true); };
  const ring = (p) => [...Array(16)].map((_, i) => [p.x + Math.sin(i / 16 * 6.283) * (0.75 + (i % 2) * 0.3), p.z + Math.cos(i / 16 * 6.283) * (0.75 + (i % 2) * 0.3)]);
  const aim = (p, re, stands = []) => {
    for (const [x, z] of [...stands, ...ring(p)]) {
      player.spawn(x, z, 0); for (let i = 0; i < 3; i++) step(1 / 60);
      const dx = p.x - camera.position.x, dz = p.z - camera.position.z;
      camera.rotation.y = Math.atan2(-dx, -dz); camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz)); step(1 / 60);
      const text = btn.hidden ? [...d.querySelectorAll('#choices button')].map((b) => b.textContent).join(' | ') : btn.textContent;
      if (re.test(text)) return text;
    }
    return null;
  };
  const shut = () => { for (const o of A.world.lids) if (o.isOpen && o.kind !== 'flush') { o.toggle(); settle(o); } };
  return { A, d, btn, settle, aim, shut, life: A.life, I: A.life.items, step };
}

// --- #373: the food from the start, taken out and put back, refilled, kept ---------------------------------------
try {
  const f = await load('life&shot');
  const { A, settle, aim, shut, life, I, step } = kit(f);
  const lid = (k) => A.world.lids.find(k);
  const fridge = lid((l) => l.kind === 'fridge' && !l.freezer), freezer = lid((l) => l.kind === 'fridge' && l.freezer), pantry = lid((l) => l.stock === 'pantry');
  const opener = { fridge, freezer, pantry };
  const home = (type) => I.all().find((i) => i.type === type && i.home?.at === 'slot' && LIFE_FOOD.stock.some(([t, s, k]) => t === type && i.home.store === s && i.home.slot === k));
  // every starting thing in its home slot, named in the prompt once its store is open
  for (const [type, store, slot] of LIFE_FOOD.stock) {
    const it = home(type), v = life.view(it);
    check(it && it.place.at === 'slot' && it.place.store === store && it.place.slot === slot && it.amount === LIFE_FOOD.amounts[type], `${type}: in ${store} slot ${slot}, ${it?.amount} ${it?.unit}`);
    const o = opener[store]; o.toggle(); settle(o);
    const p = v.where(); p.y += 0.02;
    const name = I.name(it), stands = store === 'pantry' ? [[4.6, p.z], [4.5, p.z - 0.3], [4.5, p.z + 0.3]] : [[p.x, 3.9], [p.x - 0.2, 3.8], [p.x + 0.2, 3.75], [p.x, 4.15]];
    const text = aim(p, new RegExp(`Ta ${name}`), stands);
    check(!!text, `${type} in the open ${store}: "${text}"`);
    o.toggle(); settle(o);
  }
  // the cucumber out of the fridge and back
  fridge.toggle(); settle(fridge);
  const cuc = home('cucumber'), cv = life.view(cuc);
  cv.take(); step(1 / 60);
  check(A.heldItem() === cv && cuc.place.at === 'hand', 'the cucumber taken out of the fridge');
  const n0 = I.all().length;
  fridge.toggle(); settle(fridge); fridge.toggle(); settle(fridge); step(1 / 60);
  check(I.all().length === n0 && I.ofType('cucumber').filter((c) => c.home?.store === 'fridge').length === 1, 'shut and opened with it in the hand: no second cucumber');
  check(I.move(cuc, { at: 'slot', store: 'fridge', slot: 1 }) === null && cuc.place.slot === 1 && !A.heldItem(), 'and back on its shelf');
  // used up and thrown away: a fresh one on the next opening, not before
  cv.take(); step(1 / 60);
  cv.placeAt(new (A.camera.position.constructor)(5.25, 0.93, 3.0), 0); step(1 / 60);
  I.setAmount(cuc, 0);
  fridge.toggle(); settle(fridge); fridge.toggle(); settle(fridge); step(1 / 60);
  check(I.ofType('cucumber').filter((c) => c.home?.store === 'fridge').length === 1, 'an empty one still lying out: no new one');
  I.remove(cuc); step(1 / 60);
  check(!I.ofType('cucumber').some((c) => c.home?.store === 'fridge' && c.place.at === 'slot'), 'thrown away while the fridge is open: nothing yet');
  fridge.toggle(); settle(fridge); step(1 / 60); fridge.toggle(); settle(fridge); step(1 / 60);
  const fresh = home('cucumber');
  check(fresh && fresh !== cuc && fresh.place.store === 'fridge' && fresh.place.slot === 1 && fresh.amount === 300, `shut and opened again: a fresh cucumber on its shelf (${fresh?.id})`);
  for (let k = 0; k < 3; k++) { fridge.toggle(); settle(fridge); step(1 / 60); }
  check(I.ofType('cucumber').filter((c) => c.home?.store === 'fridge').length === 1 && I.audit().length === 0, 'more openings: still one');
  shut(); step(1 / 60);
  f.remove();
} catch (e) { pass = false; lines.push(`FAIL #373 error ${e.stack}`); }

// --- #374: the utensil drawer, the board's place, the right tool ------------------------------------------------
try {
  const f = await load('life&shot');
  const { A, settle, aim, shut, life, I, step } = kit(f);
  const drawer = A.world.lids.find((l) => l.stock === 'utensils'), fridge = A.fridge;
  const tool = (type) => I.all().find((i) => i.type === type && i.home?.store);
  const [knife, bknife, slicer, board] = ['knife', 'butterKnife', 'cheeseSlicer', 'board'].map(tool);
  check(LIFE_TOOLS.stock.every(([t, s, k]) => I.all().some((it) => it.type === t && it.home?.store === s && it.home.slot === k && it.place.at === 'slot' && it.place.store === s && it.place.slot === k)), 'the knife, the butter knife and the cheese slicer in the drawer, the board on the splashback (the plates in their cabinet)');
  // shut drawer: no tool; open: each taken with E and put back with E (the drawer's box)
  const kp = life.view(knife).where();
  check(life.view(knife).target.blockedText === 'Öppna lådan först', `the shut drawer: "${life.view(knife).target.blockedText}"`);
  drawer.toggle(); settle(drawer);
  for (const it of [knife, bknife, slicer]) {
    const v = life.view(it), p = v.where(); p.y += 0.01;
    const name = I.name(it);
    const t1 = aim(p, new RegExp(`^Ta ${name}`), [[4.35, p.z], [4.45, p.z - 0.15], [4.45, p.z + 0.15]]);
    if (t1) { f.contentDocument.getElementById('action').click(); step(1 / 60); }
    check(t1 && A.heldItem() === v && it.place.at === 'hand', `${name}: "${t1}", in the hand`);
    const box = A.lifeStores.stores.utensils.box; box.updateWorldMatrix(true, false);
    const bp = box.getWorldPosition(new (A.camera.position.constructor)()); bp.y += 0.02;
    const t2 = aim(bp, new RegExp(`^Lägga ${name} i lådan`), [[4.35, bp.z], [4.4, bp.z - 0.1], [4.4, bp.z + 0.1]]);
    if (t2) { f.contentDocument.getElementById('action').click(); step(1 / 60); }
    check(t2 && it.place.at === 'slot' && it.place.store === 'utensils' && !A.heldItem(), `back with E: "${t2}" → slot ${it.place.slot}`);
  }
  // the wrong tool: the reason, nothing used
  fridge.toggle(); settle(fridge);
  const cuc = I.all().find((i) => i.type === 'cucumber' && i.home?.store === 'fridge'), cheese = I.all().find((i) => i.type === 'cheese' && i.home?.store === 'fridge');
  const butter = I.all().find((i) => i.type === 'butter' && i.home?.store === 'fridge');
  const why = (held, target) => { life.view(held).take(); step(1 / 60); const r = life.options({ item: life.view(target) }).find((o) => o.id === 'wrongTool'); const ran = r ? r.run() : null; life.view(held).putBack(); step(1 / 60); return [r?.reason, ran]; };
  const g0 = [cuc.amount, cheese.amount, butter.amount];
  const [r1, ran1] = why(slicer, cuc), [r2] = why(knife, cheese), [r3] = why(slicer, butter), [r4] = why(knife, butter);
  check(r1 === 'Osthyveln skär inte gurka' && ran1 === false, `the cheese slicer at the cucumber: "${r1}"`);
  check(r2 === 'Kökskniven hyvlar inte ost' && r3 === 'Osthyveln kan inte bre smör' && r4 === 'Kökskniven kan inte bre smör', `the knife at the cheese: "${r2}"; the slicer / knife at the butter: "${r3}" / "${r4}"`);
  check([cuc.amount, cheese.amount, butter.amount].join() === g0.join() && [knife, bknife, slicer].every((t) => t.place.store === 'utensils' && t.clean === 'clean'), 'nothing used, the tools back and clean');
  check(!life.options({ item: life.view(cuc) }).some((o) => o.id === 'wrongTool') && (life.view(knife).take(), step(1 / 60), !life.options({ item: life.view(cuc) }).some((o) => o.id === 'wrongTool')), 'the knife at the cucumber: no wrong-tool row (it is the right tool)');
  life.view(knife).putBack(); step(1 / 60);
  // the board: off its place and back (only the board goes there)
  const bv = life.view(board), bp0 = bv.where();
  check(bp0.x > 5.3 && bp0.y > 0.95 && bp0.y < 1.2, `the board stands against the splashback (${bp0.x.toFixed(2)}, ${bp0.y.toFixed(2)}, ${bp0.z.toFixed(2)})`);
  const tb = aim(bp0.clone().setY(bp0.y + 0.05), /^Ta skärbrädan/, [[4.4, bp0.z], [4.5, bp0.z + 0.2]]);
  if (tb) { f.contentDocument.getElementById('action').click(); step(1 / 60); }
  check(tb && board.place.at === 'hand', `"${tb}": in the hand`);
  const tb2 = aim(bp0.clone().setY(bp0.y + 0.05), /^Ställa skärbrädan på sin plats/, [[4.4, bp0.z], [4.5, bp0.z + 0.2]]);
  if (tb2) { f.contentDocument.getElementById('action').click(); step(1 / 60); }
  check(tb2 && board.place.at === 'slot' && board.place.store === 'boardRack', `"${tb2}": back on its place`);
  check(/inte hemma|får inte plats/.test(I.check(cuc, { at: 'slot', store: 'boardRack', slot: 0 }, { ignoreShut: true }) ?? ''), 'nothing else goes on the board\'s place');
  check(I.audit().length === 0, `audit: ${I.audit().join('; ') || 'ok'}`);
  shut();
  f.remove();
} catch (e) { pass = false; lines.push(`FAIL #374 error ${e.stack}`); }

// --- #375: the cutting board as a station ----------------------------------------------------------------------
try {
  const f = await load('life&shot');
  const { A, settle, aim, shut, life, I, step } = kit(f);
  const V = A.camera.position.constructor;
  const drawer = A.world.lids.find((l) => l.stock === 'utensils'), fridge = A.fridge;
  const find = (type) => I.all().find((i) => i.type === type && i.home?.store);
  const board = find('board'), knife = find('knife'), cuc = find('cucumber'), bv = life.view(board), kv = life.view(knife), cv = life.view(cuc);
  const plate = I.ofType('plate')[0];
  const row = (id, it) => life.options({ item: life.view(it) }).find((o) => o.id === id);
  // the board onto the dining table, the cucumber onto it
  bv.take(); step(1 / 60);
  bv.placeAt(new V(3.5, 0.754, 1.65), 0); step(1 / 60);
  fridge.toggle(); settle(fridge);
  cv.take(); step(1 / 60);
  const put = row('putOn', board);
  check(put?.label === 'lägga gurkan på skärbrädan' && !put.reason && put.run() && cuc.place.parent === board.id && cuc.place.slot === 0, `"${put?.label}": on its spot 0`);
  drawer.toggle(); settle(drawer);
  kv.take(); step(1 / 60);
  const c1 = row('cut', cuc), c1b = row('cut', board);
  check(c1?.reason === 'Lägg skärbrädan på arbetsbänken först' && c1b?.reason === c1.reason && c1.run() === false && cuc.amount === 300, `on the dining table: "${c1?.reason}" (at the board too), nothing cut`);
  // onto the worktop, carrying the cucumber along
  kv.putBack(); step(1 / 60);
  bv.take(); step(1 / 60);
  check(cuc.place.parent === board.id && life.view(cuc).model.parent?.parent === bv.model, 'the board in the hand carries the cucumber');
  bv.placeAt(new V(5.22, 0.93, 3.0), Math.PI / 2); step(1 / 60);
  kv.take(); step(1 / 60);
  const p = cv.where(); p.y += 0.02;
  const text = aim(p, /^Skära en skiva/, [[4.4, 3.0], [4.5, 2.9], [4.5, 3.1]]);
  check(!!text, `on the worktop, the knife at the cucumber: "${text}"`);
  row('cut', cuc).run(); row('cut', cuc).run();
  for (let i = 0; i < 50; i++) step(1 / 60);
  const slices = () => I.children(board).filter((k) => k.place.slot > 0);
  check(!life.runner.busy && cuc.amount === 290 && slices().length === 1 && slices()[0].amount === 10, `one cut (a double press): the cucumber ${cuc.amount} g, ${slices().length} slice of ${slices()[0]?.amount} g`);
  // a full board blocks before anything is used
  while (I.freeSpot(board, { type: 'cucumberSlice' }) >= 0) life.create('cucumberSlice', { at: 'on', parent: board.id, slot: I.freeSpot(board, { type: 'cucumberSlice' }) });
  const full = row('cut', cuc);
  check(full?.reason === 'Brädan är full' && full.run() === false && cuc.amount === 290 && slices().length === 8, `a full board: "${full?.reason}", the cucumber still ${cuc.amount} g`);
  // carried with what is on it
  kv.putBack(); step(1 / 60);
  const rel = () => slices().map((k) => life.view(k).where().sub(bv.where()).length());
  const r0 = rel();
  bv.take(); step(1 / 60);
  bv.placeAt(new V(5.25, 0.93, 2.7), 0); step(1 / 60);
  const r1 = rel();
  check(slices().length === 8 && r0.every((d, i) => Math.abs(d - r1[i]) < 1e-4) && life.view(slices()[0]).where().distanceTo(bv.where()) < 0.25, 'put down elsewhere: the eight slices came along, in their spots');
  // the board in the hand at a plate: the slices pushed over (as many as fit)
  bv.take(); step(1 / 60);
  const push = row('pushSlices', plate);
  check(push?.label === 'skjuta över skivorna på tallriken' && !push.reason && push.run(), `at the plate: "${push?.label}"`);
  check(I.children(plate).length === 6 && slices().length === 2 && cuc.place.parent === board.id, `on the plate: ${I.children(plate).length} (full), on the board: ${slices().length} slices + the cucumber`);
  check(row('pushSlices', plate)?.reason === 'Tallriken är full', 'a full plate says so');
  check(I.audit().length === 0, `audit: ${I.audit().join('; ') || 'ok'}`);
  bv.placeAt(new V(5.25, 0.93, 2.7), 0); step(1 / 60);
  shut();
  f.remove();
} catch (e) { pass = false; lines.push(`FAIL #375 error ${e.stack}`); }

// --- #376: cutting a cucumber into slices ----------------------------------------------------------------------
try {
  const f = await load('life&shot');
  const { A, settle, shut, life, I, step } = kit(f);
  const V = A.camera.position.constructor;
  const drawer = A.world.lids.find((l) => l.stock === 'utensils'), fridge = A.fridge;
  const find = (type) => I.all().find((i) => i.type === type && i.home?.store);
  const board = find('board'), knife = find('knife'), cuc = find('cucumber'), bv = life.view(board), kv = life.view(knife);
  const row = (id, it = cuc) => life.options({ item: life.view(it) }).find((o) => o.id === id);
  bv.take(); step(1 / 60); bv.placeAt(new V(5.22, 0.93, 3.0), Math.PI / 2); step(1 / 60);
  fridge.toggle(); settle(fridge); drawer.toggle(); settle(drawer);
  life.view(cuc).take(); step(1 / 60); row('putOn', board).run();
  kv.take(); step(1 / 60);
  const cut = () => I.ofType('cucumberSlice').filter((k) => k.place.at === 'on' && (k.place.parent === board.id || I.get(k.place.parent)?.type === 'plate') || k.place.at === 'hand' || k.place.at === 'world');
  const balance = () => cuc.amount + I.ofType('cucumberSlice').filter((k) => !k.preexisting).reduce((a, k) => a + k.amount, 0);
  for (const k of I.ofType('cucumberSlice')) k.preexisting = true; // (the &life scenario's own slice on the table)
  const s0 = A.stats.cucumberSlices ?? 0;
  const three = row('cut3');
  check(three?.label === 'skära tre skivor' && !three.reason && row('cut')?.label === 'skära en skiva', `two actions: "${row('cut')?.label}", "${three?.label}"`);
  const y0 = kv.model.position.y;
  three.run(); for (let k = 0; k < 4; k++) row('cut3')?.run(); row('cut')?.run(); // fast presses
  let dip = 0;
  for (let i = 0; i < 40; i++) { step(1 / 60); dip = Math.max(dip, y0 - kv.model.position.y); }
  check(life.runner.busy && dip > 0.03, `the knife chops down (${(dip * 100).toFixed(1)} cm)`);
  for (let i = 0; i < 120; i++) step(1 / 60);
  const new3 = I.ofType('cucumberSlice').filter((k) => !k.preexisting);
  check(!life.runner.busy && Math.abs(kv.model.position.y - y0) < 1e-6 && cuc.amount === 270 && new3.length === 3 && new3.every((k) => k.amount === 10 && k.place.parent === board.id), `three slices of 10 g on the board, the cucumber 270 g, the knife back up (${new3.length} slices; fast presses: nothing extra)`);
  check(balance() === 300 && (A.stats.cucumberSlices ?? 0) - s0 === 3, `the mass balance: ${balance()} g; counted ${(A.stats.cucumberSlices ?? 0) - s0}`);
  check(life.view(cuc).view.object.children[0].scale.x < 0.95 && life.view(cuc).view.object.children[1].visible, 'the cucumber is shorter, its cut face shows');
  // one slice more, taken up one by one onto the plate
  row('cut').run(); for (let i = 0; i < 60; i++) step(1 / 60);
  kv.putBack(); step(1 / 60);
  const plate = I.ofType('plate')[0], slices = I.children(board).filter((k) => k.place.slot > 0);
  for (const k of slices.slice(0, 3)) { life.view(k).take(); step(1 / 60); life.options({ item: life.view(plate) }).find((o) => o.id === 'putOn').run(); step(1 / 60); }
  check(slices.length === 4 && I.children(plate).filter((k) => k.type === 'cucumberSlice').length === 3 && I.children(board).length === 2 && balance() === 300, `taken one by one: 3 on the plate, 1 left on the board; still ${balance()} g in all`);
  // the end: too little for a slice
  kv.take(); step(1 / 60);
  I.setAmount(cuc, 25); for (const k of I.ofType('cucumberSlice')) k.preexisting = true;
  check(row('cut3')?.reason === 'Det räcker bara till en skiva', `25 g: three slices? "${row('cut3')?.reason}"`);
  row('cut').run(); for (let i = 0; i < 60; i++) step(1 / 60);
  check(cuc.amount === 15 && life.isEnd(cuc) && I.name(cuc) === 'gurkänden', `one more cut: ${cuc.amount} g left — "${I.name(cuc)}"`);
  check(row('cut')?.reason === 'Bara gurkänden är kvar – släng den' && row('cut').run() === false && cuc.amount === 15, `then: "${row('cut')?.reason}", nothing cut`);
  // a reload keeps what is left (keep.js's life part)
  I.setAmount(cuc, 180);
  const rec = A.keepWorld().life;
  life.load(rec);
  const c2 = I.get(cuc.id);
  check(c2?.amount === 180 && c2.place.parent === board.id && I.children(I.get(board.id)).filter((k) => k.type === 'cucumberSlice').length === 2 && I.children(I.get(plate.id)).length >= 3, `after a reload: the cucumber ${c2?.amount} g on the board, its slices where they were`);
  check(I.audit().length === 0, `audit: ${I.audit().join('; ') || 'ok'}`);
  shut();
  f.remove();
} catch (e) { pass = false; lines.push(`FAIL #376 error ${e.stack}`); }

// --- #377: the bread bag and a slice of bread -----------------------------------------------------------------
try {
  const f = await load('life&shot');
  const { A, d, btn, settle, aim, shut, life, I, step } = kit(f);
  const pantry = A.world.lids.find((l) => l.stock === 'pantry');
  const bag = I.all().find((i) => i.type === 'breadBag' && i.home?.store === 'pantry'), bagv = life.view(bag);
  const row = (id, it = bag) => life.options({ item: life.view(it) }).find((o) => o.id === id);
  pantry.toggle(); settle(pantry);
  check(row('dispense')?.reason === 'Öppna brödpåsen först', `the closed bag: "${row('dispense')?.reason}"`);
  const p = bagv.where(); p.y += 0.06;

try {
  localStorage.removeItem('lunden.life');
  let f = await load('shot&time=12&freeze');
  let K = kit(f);
  const lid = (A, k) => A.world.lids.find(k);
  const open = (A, o) => { if (!o.isOpen) { o.toggle(); for (let i = 0; i < 40; i++) o.update(0.1); A.scene.updateMatrixWorld(true); } };
  const wait = (step, s) => { for (let i = 0; i < Math.ceil(s * 60); i++) step(1 / 60); };
  const run = (K, id, target, secs = 0) => { const r = K.life.options(target ? { item: K.life.view(target) } : { instance: K.I.held() }).find((o) => o.id === id); const ok = !!r && !r.reason && r.run(); wait(K.step, secs + 0.1); return ok ? true : r?.reason ?? `no ${id}`; };
  const home = (K, type, store) => K.I.all().find((i) => i.type === type && i.home?.store === store);
  let { A, I, life, step } = K;
  const V = A.camera.position.constructor;
  A.player.spawn(4.35, 2.75, -Math.PI / 2); wait(step, 0.1);
  // the board onto the worktop; the cucumber from the fridge onto it; the knife from the drawer
  const board = home(K, 'board', 'boardRack');
  life.view(board).take(); step(1 / 60); life.view(board).placeAt(new V(5.22, 0.93, 3.0), Math.PI / 2); step(1 / 60);
  open(A, A.fridge);
  const cuc = home(K, 'cucumber', 'fridge');
  life.view(cuc).take(); step(1 / 60);
  const s1 = run(K, 'putOn', board);
  open(A, lid(A, (l) => l.stock === 'utensils'));
  const knife = home(K, 'knife', 'utensils');
  life.view(knife).take(); step(1 / 60);
  I.setAmount(cuc, 40); // (a short cucumber: three slices and then only the end is left)
  const s2 = run(K, 'cut3', cuc, 2);
  check(s1 === true && s2 === true && cuc.amount === 10 && life.isEnd(cuc) && I.children(board).filter((k) => k.type === 'cucumberSlice').length === 3, `flow: the board, the cucumber, three slices, the end left (${s1}, ${s2}, ${cuc.amount} g)`);
  life.view(knife).putBack(); step(1 / 60);
  // a page-made reload in the middle (keep.js's life part: everything, the hand too)
  const pick = life.view(I.children(board).find((k) => k.type === 'cucumberSlice'));
  pick.take(); step(1 / 60);
  const rec = { x: A.player.pos.x, z: A.player.pos.z, feetY: 0, yaw: A.camera.rotation.y, pitch: A.camera.rotation.x, mode: 'touch', build: null, world: A.keepWorld(), ts: Date.now() };
  sessionStorage.setItem('lunden.resume', JSON.stringify(rec));
  const ids = { board: board.id, cuc: cuc.id, held: pick.item.id };
  f.remove();
  f = await load('shot&time=12&freeze');
  K = kit(f); ({ A, I, life, step } = K);
  const b2 = I.get(ids.board), c2 = I.get(ids.cuc);
  check(b2?.place.at === 'world' && c2?.amount === 10 && c2.place.parent === b2.id && I.held()?.id === ids.held && I.children(b2).filter((k) => k.type === 'cucumberSlice').length === 2, 'after the reload: the board with the end and two slices, one slice still in the hand');
  life.view(I.held()).placeAt(new V(5.25, 0.93, 2.55), 0); step(1 / 60);
  // a plate from the cabinet onto the worktop; bread out of the bag onto it
  open(A, lid(A, (l) => l.stock === 'platesLife'));
  const plate = I.all().filter((i) => i.type === 'plate' && i.place.store === 'plates').sort((a, b) => b.place.slot - a.place.slot)[0];
  life.view(plate).take(); step(1 / 60); life.view(plate).placeAt(new V(5.25, 0.93, 2.3), 0); step(1 / 60);
  open(A, lid(A, (l) => l.stock === 'pantry'));
  const bag = home(K, 'breadBag', 'pantry');
  const s3 = run(K, 'open', bag), s4 = run(K, 'dispense', bag, 0.4);
  const bread = I.held();
  const s5 = run(K, 'putOn', plate);
  // butter: the butter knife, the pack from the fridge onto the worktop, opened, a dab, spread
  open(A, A.fridge);
  const butter = home(K, 'butter', 'fridge');
  life.view(butter).take(); step(1 / 60); life.view(butter).placeAt(new V(5.3, 0.93, 2.75), 0); step(1 / 60);
  const s6 = run(K, 'open', butter);
  open(A, lid(A, (l) => l.stock === 'utensils'));
  const bk = home(K, 'butterKnife', 'utensils');
  life.view(bk).take(); step(1 / 60);
  const s7 = run(K, 'dab', butter, 0.5), s8 = run(K, 'spread', bread, 1);
  life.view(bk).putBack(); step(1 / 60);
  // cheese: the block from the fridge onto the board, the slicer, a slice, onto the bread
  const cheese = home(K, 'cheese', 'fridge');
  life.view(cheese).take(); step(1 / 60); life.view(cheese).placeAt(new V(5.3, 0.93, 3.35), 0); step(1 / 60);
  const slicer = home(K, 'cheeseSlicer', 'utensils');
  life.view(slicer).take(); step(1 / 60);
  const s9 = run(K, 'slice', cheese, 0.7);
  life.view(slicer).putBack(); step(1 / 60);
  const cs = I.ofType('cheeseSlice')[0];
  life.view(cs).take(); step(1 / 60);
  const s10 = run(K, 'addTopping', bread);
  for (const k of I.children(I.get(ids.board)).filter((x) => x.type === 'cucumberSlice')) { life.view(k).take(); step(1 / 60); run(K, 'addTopping', bread); }
  check([s3, s4, s5, s6, s7, s8, s9, s10].every((x) => x === true) && I.name(bread) === 'ost- och gurkmackan' && bread.parts.length === 4, `flow: bread, butter, cheese, cucumber → "${I.name(bread)}" (${[s3, s4, s5, s6, s7, s8, s9, s10].join(', ')})`);
  // the plate to the dining table, sit, eat
  life.view(plate).take(); step(1 / 60); life.view(plate).placeAt(new V(3.45, 0.754, 1.0), 0); step(1 / 60);
  const n0 = A.stats.sandwiches ?? 0;
  life.view(bread).take(); step(1 / 60);
  for (let k = 0; k < 4; k++) run(K, 'eat', null, 0.6);
  check(!I.get(bread.id) && I.get(plate.id)?.clean === 'dirty' && (A.stats.sandwiches ?? 0) === n0 + 1, 'flow: eaten at the table, a dirty plate left (#383), counted');
  // the cucumber's end and the empty bread bag into the bin
  open(A, lid(A, (l) => l.bin));
  const bin = I.ofType('bin')[0];
  life.view(I.get(ids.cuc)).take(); step(1 / 60);
  const t1 = run(K, 'throwAway', bin);
  I.setAmount(bag, 1); run(K, 'dispense', bag, 0.4);
  run(K, 'eat', null, 0.6); for (let k = 0; k < 3; k++) run(K, 'eat', null, 0.6); // (the last slice eaten plain)
  life.view(bag).take(); step(1 / 60);
  const t2 = run(K, 'throwAway', bin);
  check(t1 === true && t2 === true && !I.get(ids.cuc) && !I.get(bag.id) && bin.amount === 4 && !A.heldItem(), `flow: the end and the empty bag in the bin (${t1}, ${t2}; ${bin.amount}/12)`);
  // and the kitchen restocks what was used up, on the next opening
  for (const o of [A.fridge, lid(A, (l) => l.stock === 'pantry')]) { o.toggle(); for (let i = 0; i < 40; i++) o.update(0.1); step(1 / 60); o.toggle(); for (let i = 0; i < 40; i++) o.update(0.1); step(1 / 60); }
  check(home(K, 'cucumber', 'fridge')?.amount === 300 && home(K, 'breadBag', 'pantry')?.amount === 12, 'flow: a fresh cucumber and bread bag next time');
  check(I.audit().length === 0 && I.all().every((i) => i.amount >= 0), `flow audit: ${I.audit().join('; ') || 'ok'}`);
  f.remove();
  localStorage.removeItem('lunden.life');
} catch (e) { pass = false; lines.push(`FAIL M1 flow error ${e.stack}`); }

// a new visit keeps the amounts (lunden.life, #371): not the &life scenario, the visitor's own home
try {
  localStorage.removeItem('lunden.life');
  let f = await load('shot');
  let { life, I } = kit(f);
  const cheese = I.all().find((i) => i.type === 'cheese' && i.home?.store === 'fridge');
  const bread = I.all().find((i) => i.type === 'breadBag' && i.home?.store === 'pantry');
  check(cheese && bread && LIFE_FOOD.stock.every(([t, s]) => I.all().some((i) => i.type === t && i.home?.store === s)), `a fresh home: the whole stock (${I.all().length} things)`);
  I.consume(cheese, 120); I.consume(bread, 3); I.set(bread, { pkg: 'open' });
  life.flush();
  f.remove();
  f = await load('shot');
  ({ life, I } = kit(f));
  const c2 = I.get(cheese.id), b2 = I.get(bread.id);
  check(c2?.amount === 380 && b2?.amount === 9 && b2.pkg === 'open', `a new visit: the cheese ${c2?.amount} g, the bread ${b2?.amount} slices, open`);
  check(LIFE_FOOD.stock.every(([t, s]) => I.all().filter((i) => i.type === t && i.home?.store === s).length === 1), 'no second of anything');
  f.remove();
  localStorage.removeItem('lunden.life');
} catch (e) { pass = false; lines.push(`FAIL #373 visit error ${e.stack}`); }

lines.push(pass ? 'ALL PASS' : 'SOME FAILED');
out.textContent = lines.join('\n');
</script>
