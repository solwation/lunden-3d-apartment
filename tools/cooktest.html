<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Cook test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// The kitchen's cooking (#156): (1) the induction hob (#158) — aim at it → "Slå på hällen", on (the zone glows),
// off again; F switches it off and it stays a target with F. (2) the frying pan (#159): open the drawer under
// the hob, take the pan, stand it on the hob, take it again, back in the drawer, the drawer closes; F sends it home.
// (5) fish fingers (#214): into the pan, golden, out, eaten; burnt left on; F.
// (3) the chicken (#160): no smoke in the fridge; taken, into the pan on the lit hob, it smokes after cookSeconds;
// back in the fridge with the door shut the smoke stops; fried again it stops by itself after smokeSeconds; F.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/cooktest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, step, world, scene, toggleFurniture, pan, heldItem, chicken } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  const aim = (p, from) => {
    player.spawn(from[0], from[1], 0);
    for (let i = 0; i < 3; i++) step(1 / 60);
    scene.updateMatrixWorld(true);
    const dx = p.x - camera.position.x, dz = p.z - camera.position.z;
    camera.rotation.set(Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz)), Math.atan2(-dx, -dz), 0, 'YXZ');
    step(1 / 60);
    return btn.hidden ? '(hidden)' : btn.textContent;
  };
  const hob = world.hob;
  let pass = check(!!hob && hob.zone.y > 0.85 && hob.zone.y < 0.95, `world.hob with its zone (${hob?.zone.toArray().map((v) => v.toFixed(2))})`);
  const from = [hob.zone.x - 0.9, hob.zone.z];
  let label = aim(hob.zone, from);
  pass &= check(/slå på hällen/i.test(label), `aimed at the hob: "${label}"`);
  btn.click(); for (let i = 0; i < 90; i++) step(1 / 60);
  pass &= check(hob.on && hob.glowMat.opacity > 0.5 && hob.digitMat.opacity > 0.5, `on: the zone glows (${hob.glowMat.opacity.toFixed(2)})`);
  label = aim(hob.zone, from);
  pass &= check(/stänga av hällen/i.test(label), `"${label}"`);
  btn.click(); for (let i = 0; i < 90; i++) step(1 / 60);
  pass &= check(!hob.on && hob.glowMat.opacity < 0.01, 'off again, the glow gone');
  // F: the hob stays (Peab's kitchen) but is switched off
  hob.set(true);
  toggleFurniture();
  label = aim(hob.zone, from);
  pass &= check(!hob.on && /slå på hällen/i.test(label), `F switches it off, still a target ("${label}")`);
  toggleFurniture();
  // (2) the pan
  const drawer = world.panDrawer;
  const V = camera.position.constructor;
  const front = () => drawer.object.getWorldPosition(new V()).add(new V(0, 0.08, 0));
  pass &= check(!!pan && !!drawer && pan.model.parent === drawer.object, 'the pan lies in the drawer under the hob');
  label = aim(front(), from);
  pass &= check(/öppna lådan/i.test(label), `the drawer: "${label}"`);
  btn.click(); for (let i = 0; i < 60; i++) step(1 / 60);
  label = aim(pan.model.getWorldPosition(new V()), [hob.zone.x - 0.75, hob.zone.z]);
  pass &= check(/ta stekpannan/i.test(label), `in the open drawer: "${label}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === pan, 'the pan in the hand');
  label = aim(hob.zone, from);
  pass &= check(/ställa stekpannan på hällen/i.test(label), `at the hob: "${label}"`);
  btn.click(); step(1 / 60);
  pass &= check(!pan.held && pan.onHob && pan.model.getWorldPosition(new V()).distanceTo(hob.zone) < 0.03, 'standing on the front zone');
  label = aim(pan.model.getWorldPosition(new V()).add(new V(0, 0.03, 0)), from);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === pan && !pan.onHob, `taken again ("${label}")`);
  label = aim(pan.holder.children.at(-1).getWorldPosition(new V()), [hob.zone.x - 0.75, hob.zone.z]);
  pass &= check(/lägga tillbaka stekpannan/i.test(label), `at its place in the drawer: "${label}"`);
  btn.click(); step(1 / 60);
  pass &= check(!pan.held && pan.model.parent === drawer.object, 'back in the drawer');
  label = aim(front(), from);
  btn.click(); for (let i = 0; i < 60; i++) step(1 / 60);
  pass &= check(!drawer.isOpen && drawer.t === 0, `the drawer closes ("${label}")`);
  // F sends it home from the hob
  drawer.toggle(); for (let i = 0; i < 60; i++) step(1 / 60);
  pan.take(); pan.placeAt(hob.zone);
  toggleFurniture(); toggleFurniture();
  pass &= check(pan.model.parent === drawer.object && !pan.placed, 'F sends it home to the drawer');
  drawer.toggle(); for (let i = 0; i < 60; i++) step(1 / 60);
  // (3) the chicken
  const fridge = chicken.fridge, C = { cook: 10, smoke: 60 };
  const smokes = () => chicken.smoke.some((s) => s.visible && s.material.opacity > 0.01);
  const run = (sec) => { for (let i = 0; i < sec * 10; i++) step(0.1); };
  const fridgeFrom = [chicken.home.pos.x, chicken.home.pos.z - 1.0];
  label = aim(chicken.home.pos.clone().add(new V(0, 0.1, 0)), fridgeFrom);
  pass &= check(/öppna kylskåpet/i.test(label), `the fridge: "${label}"`);
  btn.click(); run(2);
  pass &= check(!smokes(), 'no smoke in the open fridge');
  label = aim(chicken.home.pos.clone().add(new V(0, 0.08, 0)), fridgeFrom);
  pass &= check(/ta kycklingen/i.test(label), `"${label}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === chicken && !smokes(), 'the chicken in the hand, no smoke');
  chicken.putBack(); drawer.toggle(); run(1); // the pan onto the hob (as above), the hob on
  pan.take(); pan.placeAt(hob.zone); hob.set(true); chicken.take();
  label = aim(hob.zone.clone().add(new V(0, 0.03, 0)), from);
  pass &= check(/lägga kycklingen i pannan/i.test(label), `at the pan: "${label}"`);
  btn.click();
  step(1 / 60);
  pass &= check(chicken.inPan && chicken.model.parent === pan.model && heldItem() === null, `in the pan, the hand free`);
  run(C.cook - 2);
  pass &= check(!smokes(), `no smoke yet after ${C.cook - 2} s`);
  run(3);
  pass &= check(smokes(), `smoking after ${C.cook + 1} s`);
  // into the fridge, shut the door: no smoke
  chicken.take(); run(0.5);
  pass &= check(smokes(), 'still smoking in the hand');
  chicken.putBack(); run(0.5);
  pass &= check(smokes(), 'still smoking in the open fridge');
  fridge.toggle(); run(0.3);
  pass &= check(!fridge.isOpen && !smokes() && !chicken.smoking, 'the fridge door shut: no smoke');
  // fry again, take it off the heat: the smoke stops by itself after smokeSeconds
  fridge.toggle(); run(2);
  chicken.take(); chicken.intoPan(); run(C.cook + 1);
  chicken.take(); chicken.placeAt(hob.zone.clone().add(new V(0, 0, -0.5)));
  run(C.smoke - 5);
  pass &= check(smokes(), `on the worktop, still smoking after ${C.smoke - 5} s`);
  run(6);
  pass &= check(!smokes(), `stopped after ${C.smoke + 1} s`);
  chicken.take(); chicken.intoPan(); run(C.cook + 1);
  toggleFurniture(); toggleFurniture();
  pass &= check(!chicken.placed && !chicken.inPan && !smokes() && chicken.model.position.distanceTo(chicken.home.pos) < 0.001, `F: home to the fridge, no smoke (${chicken.placed} ${chicken.inPan} ${smokes()} ${chicken.model.position.distanceTo(chicken.home.pos).toFixed(3)})`);
  // (4) #194: raw it is pale; frying without the hood → the smoke alarm; the hood on → quiet; cooked: break a leg off, eat it
  const { smokeAlarm, stats } = w.__app, hood = world.hood;
  const hex = () => chicken.skins[0].m.color.getHex();
  pass &= check(!!hood && hex() === chicken.skins[0].raw.getHex(), `raw: pale skin (#${hex().toString(16)})`);
  pan.take(); pan.placeAt(hob.zone); hob.set(true); chicken.take(); chicken.intoPan();
  run(C.cook + 4);
  pass &= check(chicken.smoking && !smokeAlarm.ringing, `smoking ${C.cook + 4} s in, ${smokeAlarm.smokyFor.toFixed(1)} s of smoke: not yet`);
  run(3);
  pass &= check(smokeAlarm.ringing, 'no hood: the smoke alarm goes off');
  label = aim(hood.intake.clone().add(new V(0, 0.04, 0)), from);
  pass &= check(/slå på köksfläkten/i.test(label), `the hood: "${label}"`);
  btn.click(); run(1);
  pass &= check(hood.on && !smokeAlarm.ringing && chicken.smoking && !chicken.freeSmoke, 'the hood on: the smoke goes up into it, the alarm stops');
  pass &= check(hex() !== chicken.skins[0].raw.getHex(), `cooked: golden (#${hex().toString(16)})`);
  run(10);
  pass &= check(!smokeAlarm.ringing, 'still quiet with the hood running');
  // eat: a leg
  const leg = chicken.parts[0], legAt = leg.meshes[0].getWorldPosition(new V());
  label = aim(legAt, from);
  pass &= check(/bryta loss kycklingbenet/i.test(label), `the leg: "${label}"`);
  const before = stats.chicken;
  btn.click(); step(1 / 60);
  const piece = heldItem();
  pass &= check(piece?.isChickenPiece && leg.gone && !leg.meshes[0].visible, 'the leg in the hand, gone from the bird');
  for (let b = 0; b < 3; b++) { piece.use(); run(0.5); }
  pass &= check(!heldItem() && stats.chicken === before + 1, `eaten (stats ${stats.chicken})`);
  // everything else: three more limbs, then the body in pieces → just the plate
  for (const p of chicken.parts.slice(1)) { chicken.breakOff(p); for (let b = 0; b < 3; b++) { heldItem()?.use(); run(0.5); } }
  for (let k = 0; k < 3; k++) { chicken.breakOff(null); for (let b = 0; b < 3; b++) { heldItem()?.use(); run(0.5); } }
  pass &= check(chicken.body.every((m) => !m.visible) && stats.chicken === before + 7 && chicken.plate.visible === false, `all eaten: ${stats.chicken - before} pieces, nothing left in the pan`);
  toggleFurniture(); toggleFurniture();
  pass &= check(!hood.on && !smokeAlarm.ringing && chicken.body.every((m) => m.visible) && chicken.parts.every((p) => !p.gone) && hex() === chicken.skins[0].raw.getHex(), 'F: the fan off, quiet, the chicken whole and raw again');
  // (5) #214: fish fingers fry in the pan too — frozen pale, golden after FISH.fry.seconds, burnt later; not back in the carton
  const { fish } = w.__app, FRY = { seconds: 6, burnAt: 18 };
  const white = (x) => x.bread.color.getHex() === 0xffffff;
  pan.take(); pan.placeAt(hob.zone); hob.set(true);
  fish.press();
  const f1 = heldItem();
  pass &= check(f1?.isFish && white(f1), 'a frozen fish finger in the hand (pale)');
  label = aim(hob.zone.clone().add(new V(0, 0.03, 0)), from);
  pass &= check(/lägga fiskpinnen i pannan/i.test(label), `at the pan: "${label}"`);
  btn.click(); step(1 / 60);
  pass &= check(f1.state === 'pan' && f1.model.parent === pan.model && !heldItem(), 'in the pan, the hand free');
  fish.press(); fish.fryHeld();
  const f2 = fish.inPan.find((x) => x !== f1);
  pass &= check(fish.inPan.length === 2 && f2 && f2.slot !== f1.slot, `a second one beside it (slots ${f1.slot}, ${f2?.slot})`);
  chicken.take();
  label = aim(hob.zone.clone().add(new V(0, 0.03, 0)), from);
  pass &= check(!/kycklingen i pannan/i.test(label), `the chicken does not go in with them ("${label}")`);
  chicken.putBack(); if (fridge.isOpen) fridge.toggle();
  const fried0 = stats.fried;
  run(FRY.seconds - 2);
  pass &= check(!f1.fried && !white(f1), `frying: no longer frozen, not done yet (#${f1.bread.color.getHex().toString(16)})`);
  run(3);
  pass &= check(f1.fried && f2.fried && !f1.burnt && stats.fried === fried0 + 2, `golden after ${FRY.seconds + 1} s (stats +${stats.fried - fried0})`);
  label = aim(f1.middle(new V()), from);
  pass &= check(/ta fiskpinnen/i.test(label), `"${label}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === f1 && f1.fried && f1.hot > 0, 'out of the pan into the hand, fried and hot (steaming)');
  pass &= check(fish.target.blocked && /stekt/i.test(fish.target.blockedText), `not back in the carton: "${fish.target.blockedText}"`);
  const eaten0 = stats.fish;
  for (let b = 0; b < 3; b++) { f1.use(); run(0.5); }
  pass &= check(!heldItem() && stats.fish === eaten0 + 1, 'eaten');
  run(FRY.burnAt - FRY.seconds);
  const smoking = f2.puffs.some((sp) => sp.visible && sp.material.opacity > 0.01);
  pass &= check(f2.burnt && smoking, `left on the heat: burnt and smoking (#${f2.bread.color.getHex().toString(16)})`);
  toggleFurniture(); toggleFurniture();
  pass &= check(!fish.inPan.length && fish.left === 15 && !hob.on, 'F: the pan is cleared, the carton full, the hob off');
  hob.set(false); pan.goHome(); if (fridge.isOpen) fridge.toggle(); if (drawer.isOpen) drawer.toggle();
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
