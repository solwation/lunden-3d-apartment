<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Olof test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// #900: legacy ?olof=0 cannot create an indoor actor. Olof exists only in the car;
// shared geometry, free apartment seats, driver greeting and saved-car restoration remain.
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html?time=12&month=6&olof=0';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { step, olofDriver: driver, car, world, cat, use, stats } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  try {
    d.documentElement.requestFullscreen = undefined;
    d.getElementById('start-touch').click();
    await wait(50);
    for (let i = 0; i < 3; i++) step(1 / 60);
    let pass = check(w.__app.olof === undefined, 'legacy ?olof=0 exposes no indoor actor');
    const mod = await w.eval("import('/src/olof.js')");
    pass &= check(mod.Olof === undefined, 'no indoor constructor or force/appear API');
    const seats = world.furnitureTargets.filter(t => t.kind === 'rest' && ['soffan', 'fåtöljen'].includes(t.name)).flatMap(t => t.spots);
    pass &= check(seats.length >= 4 && seats.every(s => !s.taken?.()), 'sofa and armchair are not reserved');
    pass &= check(cat.seatTaken === undefined, 'no indoor Olof reservation callback for cat');
    for (let i = 0; i < 60; i++) step(1);
    pass &= check(w.__app.olof === undefined && seats.every(s => !s.taken?.()), 'normal updates cannot create indoor Olof');
    const fig = driver.fig, tris = fig.mesh.geometry.attributes.position.count / 3;
    pass &= check(fig.object.children.filter(x => x.isSkinnedMesh).length === 1 && tris <= 8000, `shared driver figure: one mesh, ${tris} triangles`);
    pass &= check(car.state === 'garage' && !driver.visible, 'garage has no driver');
    use(world.carKey);
    pass &= check(car.state === 'arriving' && driver.visible && fig.object.parent === car.object, 'key calls car with its driver');
    for (let i = 0; i < 4000 && !car.parked; i++) step(1 / 30);
    pass &= check(car.state === 'parked' && driver.visible, 'car arrives and parks with Olof');
    const n = stats.olof ?? 0;
    use(driver.interact);
    for (let i = 0; i < 60; i++) step(1 / 60);
    pass &= check((stats.olof ?? 0) === n + 1 && d.querySelector('.say.theirs')?.textContent.length > 20, 'driver greeting keeps score and dad joke');
    for (let i = 0; i < 420; i++) step(1 / 60);
    pass &= check(driver.state === 'drive' && driver.visible, 'driver stays after greeting');
    const saved = JSON.parse(JSON.stringify(car.saveState()));
    driver.hide(); car.toGarage(); car.loadState(saved); step(1 / 60);
    pass &= check(car.state === 'parked' && driver.visible && w.__app.olof === undefined, 'saved parked car restores only its driver');
    pass &= check(!JSON.stringify(saved).includes('olof'), 'save has no separate indoor actor representation');
    out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
  } catch (e) { out.textContent = `SOME FAILED\n${lines.join('\n')}\nFAIL ${e.stack}`; }
};
</script>
</body>
</html>
