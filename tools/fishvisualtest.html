<!doctype html><html lang="sv"><meta charset="utf-8"><title>Fiskarnas faktiska modeller</title><style>body{margin:0;background:#edf0f3;font:16px system-ui}header{padding:14px 24px}h1{margin:0 0 6px;font-size:22px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script><header><h1>Fiskar i produktionskomponenterna</h1><span id="caption"></span></header><script type="module">
import * as T from 'three';import{RiverFish,loadFishModel}from'../src/riverfish.js';import{Shark,loadSharkModel}from'../src/shark.js';import{CaughtFish}from'../src/fishing.js';import{RIVER_FISH}from'../src/config.js';import{fishSpec,fishAt}from'../src/riverfishswim.js';
await Promise.all([loadFishModel(),loadSharkModel()]);const scene=new T.Scene();scene.background=new T.Color(0xd3e3ed);scene.add(new T.HemisphereLight(0xe2f1ff,0x635d41,2));const sun=new T.DirectionalLight(0xfff3dd,2.5);sun.position.set(4,8,5);scene.add(sun);const camera=new T.PerspectiveCamera(40,1500/800,.01,1000);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1500,800);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);
const river=new RiverFish({scene,camera});const sync={t:0,seed:RIVER_FISH.seed,shark:{p:[0,0,0],r:.1},sharkWindow:()=>null,sharkPhase:()=>mode};let mode='body';const shark=new Shark({scene,camera,sync});shark.build();
const catches=RIVER_FISH.species.map((s,i)=>{const f=new CaughtFish(scene,camera,{dropSpot:()=>new T.Vector3()},{species:s.name,cm:s.name==='ål'?70:40},new T.Vector3());f.held=true;f.placeAt(new T.Vector3((i%3-1)*.75,0,(Math.floor(i/3)-.5)*.5),Math.PI/2);return f});
const plane=new T.Mesh(new T.PlaneGeometry(50,50),new T.MeshStandardMaterial({color:0x87916c,roughness:1}));plane.rotation.x=-Math.PI/2;scene.add(plane);
function show(next){mode=next;river.hide();if(river.shark.built)for(const k of ['fin','shadow','wake','rings','body','bones'])river.shark[k].visible=false;for(const k of ['fin','shadow','wake','rings','body','bones'])shark[k].visible=false;catches.forEach(f=>f.model.visible=next==='caught');plane.position.set(0,-.003,0);plane.material.color.setHex(0x87916c);
if(next==='river'){const f=fishSpec(0,0,RIVER_FISH.seed);let time=0;for(;time<600;time++)if(fishAt(f,time).rise>.9)break;const p=fishAt(f,time);river.sync.now=()=>1000*(RIVER_FISH.epoch+time);camera.position.set(p.x+.8,p.water+.7,p.z+1.1);camera.lookAt(p.x,p.water,p.z);plane.position.set(p.x,p.water-.004,p.z);plane.material.color.setHex(0x537e8c);river.update(0,false,1)}else if(next==='caught'){camera.position.set(1.1,1.7,1.6);camera.lookAt(0,0,0)}else{camera.position.set(3,2.1,4);camera.lookAt(0,.2,0);shark.update(0,false,1)}
document.querySelector('#caption').textContent=next==='caught'?'Verkliga CaughtFish · mört, abborre, braxen / gädda, öring, ål · oförändrade artformer och verkliga längdskalor på kontrollerat underlag.':next==='river'?'Verklig RiverFish: en instansbatch, artmått och naturligt beräknad uppstigning över en kontrollerad vattenyta.':`Verklig Shark · ${next} · befintlig bank-/fångstfas på kontrollerat underlag.`;scene.updateMatrixWorld(true);renderer.render(scene,camera)}
show('caught');window.fishVisual={river,shark,catches,show,scene,renderer,camera,ready:true};
