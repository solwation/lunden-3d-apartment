<!doctype html><html lang="sv"><meta charset="utf-8"><title>Cold drawers</title><pre id="out">running…</pre><iframe id="f" src="../index.html?life&shot&cloud=" width="900" height="600"></iframe>
<script>
const f=document.getElementById('f'),out=document.getElementById('out'),lines=[];let pass=true;
const check=(ok,name)=>{lines.push(`${ok?'PASS':'FAIL'} ${name}`);pass&&=!!ok;out.textContent=lines.join('\n');};
f.onload=async()=>{f.onload=null;try{let w=f.contentWindow;while(!w.__app)await new Promise(r=>setTimeout(r,100));const A=w.__app,{life,scene,player,camera,step}=A,V=camera.position.constructor,d=f.contentDocument;
d.documentElement.requestFullscreen=undefined;d.getElementById('start-touch').click();const owners=A.world.lids.filter(l=>l.kind==='fridge'),drawers=owners.flatMap(o=>o.drawers),saved=[];
const pose=(o,open)=>{o.isOpen=open;for(let i=0;i<60;i++)o.update(1/60);scene.updateMatrixWorld(true);};
const aim=(p,target)=>{for(let i=0;i<32;i++){const a=i/32*Math.PI*2,r=.75+(i%2)*.3;player.spawn(p.x+Math.sin(a)*r,p.z+Math.cos(a)*r,0);step(0);scene.updateMatrixWorld(true);camera.lookAt(p);camera.updateMatrixWorld(true);step(0);if(A.focus().focused===target)return true;}return false;};
check(drawers.length===5&&new Set(drawers.map(o=>o.storeId)).size===5,'one fridge drawer and four freezer drawers have independent stable stores');
for(const drawer of drawers){const owner=drawer.coldOwner,st=life.items.store(drawer.storeId),target=A.lifeStores.stores[drawer.storeId].target;pose(owner,false);check(drawer.blocked&&!st.isOpen(),`${drawer.name} cannot open/load behind its closed appliance door`);pose(owner,true);const front=drawer.bounds.getCenter(new V());front.z=drawer.bounds.min.z;check(aim(front,drawer),`${drawer.name} is reached on its actual transparent front`);d.getElementById('action').click();for(let i=0;i<60;i++)step(1/60);check(drawer.isOpen&&st.isOpen(),`${drawer.name} draws out through the touch action`);
const food=life.create('cucumber',{at:'hand'},{amount:125});step(0);const centre=target.pickable.getWorldPosition(new V());check(aim(centre,target),`held food reaches ${drawer.name} loading target`);A.use(target);step(0);check(food.place.store===drawer.storeId&&!A.heldItem(),`food is stored in ${drawer.name} through its normal action`);
const other=life.create('butter',{at:'hand'},{amount:87});A.use(target);step(0);check(aim(life.view(food).model.children[0].getWorldPosition(new V()),life.view(food).target),`${drawer.name} transparent walls leave the stored food selectable`);d.getElementById('action').click();step(0);check(A.heldItem()===life.view(food),`${drawer.name} food is taken through its visible action`);A.use(target);step(0);const extra=life.create('cheese',{at:'hand'},{amount:45});const refused=life.options(target).find(r=>r.id==='putIn');check(refused?.reason?.includes('full')&&extra.place.at==='hand',`${drawer.name} full capacity keeps the extra item in hand`);life.view(extra).placeAt(new V(3.35,.755,1.75),0);step(0);
const p=life.view(food).where();check(owner.blocked&&owner.toggle()===false&&owner.isOpen,`${owner.name} cannot close over an extended drawer`);
const movingFront=front.clone().add(drawer.out);check(aim(movingFront,drawer),`${drawer.name} front remains selectable after moving`);A.click(0);for(let i=0;i<60;i++)step(1/60);const q=life.view(food).where();check(!drawer.isOpen&&Math.abs(p.distanceTo(q)-drawer.out.length())<1e-6,`${drawer.name} mouse action carries the same food back inside`);check(life.view(food).shutReason()?.includes('Dra ut'),`closed ${drawer.name} blocks taking its contents`);saved.push({id:food.id,other:other.id,store:drawer.storeId,amount:125});}
const freezer=owners.find(o=>o.freezer),legacy=life.create('cheese',{at:'slot',store:'freezer',slot:0},{amount:321});check(legacy&&Math.abs(life.view(legacy).where().y-freezer.shelves[1])<.01,'legacy freezer slot zero now has a real shelf instead of an anonymous block');
const stockPeas=life.items.ofType('peas').find(i=>i.home?.store==='freezer');check(stockPeas?.home.slot===3,'original pea shelf home retains its store and slot id');
// Fresh normal visit: same persisted instances, empty hands, closed fronts, no duplicate restocking.
w.localStorage.setItem('lunden.life',JSON.stringify(life.serialize()));await new Promise(resolve=>{f.onload=resolve;f.src='../index.html?shot&cloud=';});w=f.contentWindow;while(!w.__app)await new Promise(r=>setTimeout(r,100));const B=w.__app;f.contentDocument.documentElement.requestFullscreen=undefined;f.contentDocument.getElementById('start-touch').click();
for(const s of saved){const item=B.life.items.get(s.id),other=B.life.items.get(s.other),drawer=B.world.lids.find(l=>l.storeId===s.store);check(item?.place.store===s.store&&item.amount===s.amount&&other?.place.store===s.store,`${s.store} reload retains exact instances and amounts`);check(!drawer.isOpen&&!drawer.coldOwner.isOpen&&!!B.life.view(item).shutReason(),`${s.store} fresh visit closes the fronts and retains access rules`);}
check(B.life.items.get(legacy.id)?.amount===321&&B.life.items.get(legacy.id)?.place.store==='freezer','legacy shelf contents survive the real reload');
for(const owner of B.world.lids.filter(o=>o.kind==='fridge')){owner.isOpen=true;for(let i=0;i<60;i++)owner.update(1/60);for(const drawer of owner.drawers){drawer.isOpen=true;for(let i=0;i<60;i++)drawer.update(1/60);}}
B.toggleFurniture();check(B.world.lids.filter(l=>l.coldDrawer).every(l=>!l.isOpen&&l.t===0)&&B.world.lids.filter(l=>l.kind==='fridge').every(l=>!l.isOpen),'F closes drawers before their appliance doors');check(saved.every(s=>B.life.items.get(s.id)?.place.store===s.store&&B.life.items.get(s.id)?.amount===125),'F preserves the stored food without restocking copies');check(B.life.items.audit().length===0,'saved cold storage inventory audit passes');
w.localStorage.removeItem('lunden.life');
}catch(e){check(false,e.stack);}out.textContent=lines.join('\n')+'\n'+(pass?'ALL PASS':'SOME FAILED');};
</script></html>
