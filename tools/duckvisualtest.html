<!doctype html><html lang="sv"><meta charset="utf-8"><title>Ändernas faktiska modell</title><style>body{margin:0;background:#edf0f3;font:16px system-ui}header{padding:14px 24px}h1{margin:0 0 6px;font-size:22px}canvas{display:block}</style><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script><header><h1>Gräsänder i produktionskomponenten</h1><span id="caption"></span></header><script type="module">
import * as T from 'three';import {Ducks,loadRiggedDuckModel} from '../src/ducks.js';import{DUCKS}from'../src/config.js';
const gltf=await loadRiggedDuckModel(),scene=new T.Scene();scene.background=new T.Color(0xd3e3ed);scene.add(new T.HemisphereLight(0xe2f1ff,0x635d41,2));const sun=new T.DirectionalLight(0xfff3dd,2.5);sun.position.set(4,8,5);scene.add(sun);const camera=new T.PerspectiveCamera(40,1500/800,.01,1000);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(1500,800);renderer.setPixelRatio(1);renderer.toneMapping=T.ACESFilmicToneMapping;document.body.append(renderer.domElement);

arrange();window.duckVisual={ducks,scene,camera,renderer,arrange,ready:true};
