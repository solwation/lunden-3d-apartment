<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Popcorn cart test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// The popcorn cart in the playhouse's secret room (#1567), driven through the real action button (touch) as a visitor:
// into the room, press the pop button (the case fills while it pops), take a tub from the stack, fill it at the case,
// sit in a cinema seat and eat it empty in bites ("Ät", fewer kernels each time), stand up and fill it again, throw it in
// the bin (full or not), the stack refills itself below its minimum, an emptied case pops again, everything is inside the
// room's group (nothing draws outside) and a page-made reload keeps the case, the stack, a tub on the floor and one in the hand.
//   chrome --headless=new --dump-dom http://localhost:8158/tools/popcorntest.html   (?shots keeps the reloaded page)
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const shots = new URLSearchParams(location.search).has('shots');
async function load(q = 'life&shot&cloud=') {
  const fr = document.createElement('iframe');
  fr.width = shots ? 900 : 480; fr.height = shots ? 600 : 300;
  fr.src = `../index.html?${q}${shots ? '' : '&test'}`;
  document.body.append(fr);
  await new Promise((r) => { fr.onload = r; });
  while (!fr.contentWindow.__app) await wait(100);
  if (fr.contentWindow.__app.testMode) fr.contentDocument.documentElement.requestFullscreen = undefined;
  fr.contentDocument.getElementById('start-touch').click();
  await wait(50);
  return fr;
}
(async () => {
  const lines = [];
  let pass = true;
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= !!ok; return ok; };
  try {
    const f = await load(), d = f.contentDocument;
    const A = f.contentWindow.__app, { player, camera, step, heldItem, scene, world } = A;
    const { PLAYROOM: R, POPCORN: P } = await import('../src/config.js');
    const room = world.playroom, pc = room.popcorn, tubs = A.popcornTubs, btn = d.getElementById('action'), V = camera.position.constructor;
    const secs = (s) => { for (let i = 0; i < Math.ceil(s * 60); i++) step(1 / 60); };
    const kernels = () => pc.batch.shown.slice(0, P.kernels).filter(Boolean).length;
    const stackShown = () => pc.batch.shown.slice(P.kernels).filter(Boolean).length;
    const tubKernels = (t) => t.batch.shown.slice(1).filter(Boolean).length;
    const lookAt = (p, re, offs = [[0, -0.9], [0.2, -1.0], [-0.2, -0.8], [0, -1.2], [0.4, -0.9], [-0.4, -0.9], [0, -0.7]]) => {
      for (const [dx0, dz0] of offs) {
        player.spawn(p.x + dx0, p.z + dz0, 0); for (let i = 0; i < 3; i++) step(1 / 60);
        scene.updateMatrixWorld(true);
        const dx = p.x - camera.position.x, dz = p.z - camera.position.z;
        camera.rotation.y = Math.atan2(-dx, -dz); camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz));
        step(1 / 60);
        if (!btn.hidden && re.test(btn.textContent)) return true;
      }
      return false;
    };
    const centre = (t) => t.pickable.getWorldPosition(new V());
    A.showOverlay?.(false);
    A.use({ kind: 'playhouse' }); await wait(700); step(1 / 60);
    check(player.inPlayroom && room.inside && room.object.visible, 'into the playhouse room');
    check(tubs?.length === P.tub.loose && tubs.every((t) => t.away && !t.model.visible), `${tubs?.length} tubs, all in the stack's pool`);
    check(stackShown() === P.stack.count && kernels() === 0 && pc.portions === 0, `the stack ${stackShown()} tubs, the case empty`);
    // the cart stands in the entry, left of the door against the south wall, clear of the door and the light switch
    const cartX = R.x + P.cart.x, door = R.door.w / 2;
    check(P.cart.x + P.cart.w / 2 + 0.06 < -door - 0.4 && P.cart.z > R.clubhouse.front + 2 && P.bin.x < P.cart.x, `cart at x ${P.cart.x} (door ±${door}), bin west of it`);
    check(room.footprints.some((q) => Math.abs(q[0][0] - (cartX - P.cart.w / 2 - 0.06)) < 1e-6), 'the cart has a collision footprint');
    // walking into the cart is stopped
    player.spawn(cartX, R.z + P.cart.z - 0.9, 0); camera.rotation.set(0, Math.PI, 0); player.keys.add('KeyW');
    secs(1.5); player.keys.delete('KeyW');
    check(player.pos.z < R.z + P.cart.z - P.cart.d / 2, `walking south into the cart stops at z ${(player.pos.z - R.z).toFixed(2)}`);
    // pop
    check(lookAt(centre(pc.button), /^trycka på popkornsknappen/i), `the button: "${btn.textContent}"`);
    btn.click(); step(1 / 60);
    check(pc.popping, 'it pops');
    secs(P.popSeconds / 2);
    const half = kernels();
    check(half > 0 && half < P.kernels, `the case is filling (${half}/${P.kernels} kernels)`);
    check(lookAt(centre(pc.button), /Popkornen poppar/), `the button while popping: "${btn.textContent}"`);
    secs(P.popSeconds / 2 + 0.3);
    check(!pc.popping && kernels() === P.kernels && pc.portions === P.fills, `the case is full (${kernels()} kernels, ${pc.portions} portions)`);
    // a tub from the stack, filled at the case
    check(lookAt(centre(pc.stackTarget), /^ta en popkornsbytta/i), `the stack: "${btn.textContent}"`);
    btn.click(); step(1 / 60);
    const tub = heldItem();
    check(tubs.includes(tub) && tub.bites === 0 && !tub.away && tub.model.visible && stackShown() === P.stack.count - 1, `a tub in the hand, the stack ${stackShown()}`);
    check(lookAt(centre(pc.case), /^fylla byttan ur glaslådan/i), `the case with the tub: "${btn.textContent}"`);
    btn.click(); step(1 / 60);
    check(tub.bites === P.tub.bites && tubKernels(tub) === P.tub.kernels && pc.portions === P.fills - 1 && kernels() < P.kernels, `filled: ${tub.bites} bites, the case ${pc.portions} portions / ${kernels()} kernels`);
    check(lookAt(centre(pc.case), /Byttan är redan full/), `a full tub at the case: "${btn.textContent}"`);
    // eat it in a cinema seat
    const seat = room.targets.find((t) => /biostol 1$/.test(t.name ?? ''));
    player.spawn(R.x + R.furniture.cinema.seat.rowX[0] + 0.8, R.z + R.furniture.cinema.seat.z[0], -Math.PI / 2); step(1 / 60);
    A.use(seat); secs(2);
    check(A.rest.active && heldItem() === tub, `sitting in ${seat?.name} with the tub`);
    step(1 / 60); // (looking at the screen: the button eats, it does not choose a film while you hold something to eat)
    check(!btn.hidden && btn.textContent === 'Ät', `seated with the tub: "${btn.textContent}"`);
    let bites = 0, fewer = true, prev = tubKernels(tub);
    while (tub.useLabel && bites < 20) { btn.click(); bites++; secs(0.6); const n = tubKernels(tub); fewer &&= n < prev || n === 0; prev = n; }
    check(bites === P.tub.bites && tub.bites === 0 && tubKernels(tub) === 0 && fewer, `eaten in ${bites} bites, emptier each time`);
    check(tub.name === 'den tomma popkornsbyttan' && !tub.useLabel && heldItem() === tub, `"${tub.name}" still in the hand`);
    A.standUp(); secs(0.3);
    // back to the cart: fill it again
    check(lookAt(centre(pc.case), /^fylla byttan ur glaslådan/i), `back at the case: "${btn.textContent}"`);
    btn.click(); step(1 / 60);
    check(tub.bites === P.tub.bites && pc.portions === P.fills - 2, `refilled (${pc.portions} portions left)`);
    // the bin takes it, full
    check(lookAt(centre(pc.bin), /^slänga popkornsbyttan i soptunnan/i, [[0.3, -0.9], [0.5, -0.8], [0, -0.9], [0.3, -1.2]]), `the bin: "${btn.textContent}"`);
    btn.click(); step(1 / 60);
    check(!heldItem() && tub.away && !tub.model.visible && tub.bites === 0, 'thrown in the bin, back in the pool');
    check(lookAt(centre(pc.bin), /Soptunnan är till popkornsbyttorna/, [[0.3, -0.9], [0.5, -0.8], [0, -0.9]]), `the bin, empty-handed: "${btn.textContent}"`);
    // the stack never runs out: it refills below its minimum
    const counts = [];
    for (let i = 0; i < P.stack.count + 2; i++) {
      pc.stackTarget.use(); step(1 / 60);
      counts.push(pc.stack);
      if (!(heldItem() instanceof tub.constructor)) { check(false, `take ${i}: no tub`); break; }
      pc.bin.use(); step(1 / 60);
    }
    check(counts.every((n) => n >= P.stack.min) && counts.includes(P.stack.count) && Math.min(...counts) === P.stack.min && stackShown() === pc.stack, `the stack over ${counts.length} takes: ${counts.join(',')}`);
    // empty the case, then it pops again
    while (pc.portions > 0) { pc.stackTarget.use(); pc.case.use(); pc.bin.use(); }
    pc.stackTarget.use(); step(1 / 60);
    check(kernels() === 0 && /Glaslådan är tom/.test(pc.case.blockedText), `the case empty: "${pc.case.blockedText}"`);
    pc.button.use(); secs(P.popSeconds + 0.3);
    check(pc.portions === P.fills && kernels() === P.kernels, 'popped full again');
    pc.case.use(); step(1 / 60);
    check(heldItem().bites === P.tub.bites, 'a tub filled from the new batch');
    // nothing of it draws outside the room: every part is in the room's group, hidden while outside
    const inRoom = (o) => { for (let p = o; p; p = p.parent) if (p === room.object) return true; return false; };
    const parts = [pc.batch.mesh, pc.glass, ...pc.pickables];
    check(parts.every(inRoom) && tubs.filter((t) => !t.held).every((t) => inRoom(t.model)), 'the cart, case, stack and loose tubs are in the room\'s group');
    let lights = 0; room.object.traverse((o) => { if (o.isLight) lights++; });
    check(lights === 0, 'no lights in the room');
    // put one tub down on the hall floor half eaten, keep one full in the hand; a page-made reload keeps them and the cart
    const t1 = heldItem(); t1.use(); secs(0.6); t1.use(); secs(0.6);
    const spot = new V(R.x - 1, 0, R.z + 3.4);
    t1.placeAt(spot, 0); step(1 / 60);
    check(t1.placed && inRoom(t1.model) && t1.model.visible && t1.bites === P.tub.bites - 2, `a tub on the hall floor (${t1.bites} bites)`);
    pc.stackTarget.use(); pc.case.use(); step(1 / 60);
    const t2 = heldItem(), portions = pc.portions, stack = pc.stack, i1 = tubs.indexOf(t1), i2 = tubs.indexOf(t2);
    check(t2 !== t1 && t2.bites === P.tub.bites, 'another one full in the hand');
    const world0 = A.keepWorld();
    check(world0?.life?.x?.popcorn?.p === portions, `saved: the case ${JSON.stringify(world0?.life?.x?.popcorn)}`);
    sessionStorage.setItem('lunden.resume', JSON.stringify({ x: R.x - 1, z: R.z + 4, feetY: 0, yaw: 0, pitch: 0, mode: 'touch', build: null, world: world0, ts: Date.now() }));
    f.remove();
    const f2 = await load('cloud=');
    const B = f2.contentWindow.__app, pc2 = B.world.playroom.popcorn, u1 = B.popcornTubs[i1], u2 = B.popcornTubs[i2];
    check(pc2.portions === portions && pc2.stack === stack, `after a reload: the case ${pc2.portions} portions, the stack ${pc2.stack}`);
    const inRoom2 = (o) => { for (let p = o; p; p = p.parent) if (p === B.world.playroom.object) return true; return false; };
    check(u1.placed && u1.model.getWorldPosition(new V()).distanceTo(spot) < 0.05 && u1.bites === P.tub.bites - 2 && inRoom2(u1.model), `after a reload: the tub on the hall floor in the room's group, ${u1.bites} bites`);
    check(B.heldItem() === u2 && u2.bites === P.tub.bites, `after a reload: the full tub in the hand (${u2.bites} bites)`);
    check(B.popcornTubs.filter((t) => t !== u1 && t !== u2).every((t) => t.away), 'the other tubs in the pool');
    sessionStorage.removeItem('lunden.resume'); sessionStorage.removeItem('lunden.session');
    if (!shots) f2.remove();
  } catch (e) { check(false, e.stack); }
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
})();
</script>
</body>
</html>
