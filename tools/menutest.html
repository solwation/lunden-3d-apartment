<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Pause and start menu options test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Menu test:
//   - Verify menu buttons are present with descriptive text (to-start, reset-home, stats-reset, quit)
//   - Verify instructions toggle expands and collapses #instructions
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/menutest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const lines = [];
const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };

(async () => {
  let pass = true;

  const f = document.createElement('iframe');
  f.width = 900; f.height = 600;
  f.src = '../index.html';
  document.body.append(f);

  while (!f.contentWindow?.__app) await wait(50);
  const d = f.contentDocument;

  // 1. Check menu buttons
  const toStart = d.getElementById('to-start');
  const resetHome = d.getElementById('reset-home');
  const statsReset = d.getElementById('stats-reset');
  const quit = d.getElementById('quit');
  const toggleInst = d.getElementById('toggle-instructions');
  const instructions = d.getElementById('instructions');

  pass &= check(toStart && !toStart.hidden && /startplatsen/.test(toStart.textContent), 'to-start button exists with description');
  pass &= check(resetHome && !resetHome.hidden && /Återställ/.test(resetHome.textContent), 'reset-home button exists with description');
  pass &= check(statsReset && !statsReset.hidden && /statistiken/.test(statsReset.textContent), 'stats-reset button exists with description');
  pass &= check(quit && !quit.hidden && /Avsluta/.test(quit.textContent), 'quit button exists');

  // 2. Instructions toggle
  pass &= check(toggleInst && instructions && instructions.hidden, 'instructions collapsed by default');
  toggleInst.click();
  pass &= check(!instructions.hidden && /Dölj instruktioner/.test(toggleInst.textContent), 'clicking toggle expands instructions');
  pass &= check(/E eller vänsterklick/.test(instructions.textContent), 'instructions mention E eller vänsterklick');
  toggleInst.click();
  pass &= check(instructions.hidden && /Visa instruktioner/.test(toggleInst.textContent), 'clicking toggle again collapses instructions');

  // 3. Test to-start action feedback and auto-closing menu (#522)
  const app = f.contentWindow.__app;
  const overlay = d.getElementById('overlay');
  toStart.click();
  const toStartDone = d.getElementById('to-start-done');
  pass &= check(toStartDone && !toStartDone.hidden, 'to-start shows feedback notice');
  pass &= check(overlay.hidden, 'to-start closes menu automatically');
  pass &= check(app.player.pos.z < -5, 'to-start moves player to start position');

  // Test to-start closes menu even when already at start
  app.showOverlay(true);
  pass &= check(!overlay.hidden, 'menu reopened for at-start check');
  toStart.click();
  pass &= check(overlay.hidden, 'to-start closes menu even when already at start');

  // 4. Test reset-home confirmation and cancellation auto-closing menu (#522)
  app.showOverlay(true);
  const resetConfirm = d.getElementById('reset-confirm');
  const resetYes = d.getElementById('reset-yes');
  const resetNo = d.getElementById('reset-no');

  resetHome.click();
  pass &= check(!resetConfirm.hidden && !overlay.hidden, 'reset-home ask shows confirmation modal');
  resetNo.click();
  pass &= check(resetConfirm.hidden && !overlay.hidden, 'reset cancellation preserves menu visibility');

  let goUrl = null;
  app.resetHome.go = (u) => { goUrl = u; };
  resetHome.click();
  resetYes.click();
  pass &= check(resetConfirm.hidden, 'reset confirmation hides confirmation dialog');
  pass &= check(overlay.hidden, 'reset confirmation closes menu automatically');
  pass &= check(f.contentWindow.sessionStorage.getItem('lunden.resetHideMenu') !== null, 'reset stores resetHideMenu flag');

  f.remove();
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
})();
</script>
</body>
</html>
