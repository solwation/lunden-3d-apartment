<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Jump-on test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// #693 (with #696): the plain jump (PLAYER.jump, ~0.7 m) lands on top of low seats — the courtyard's benches, the sofa, the
// armchair, the ottoman (STAND_ON, world.platforms) — and stands there stably; Space from there jumps on; walking off the
// edge falls with ordinary gravity (no hurt); a 4 m drop onto the seat is hurt by the existing fall damage. Walking alone
// does not climb onto them, higher furniture (a table) and a wall cannot be jumped onto / through. #696: the apex of the plain
// jump and the suit's.
//   node runtest.cjs http://localhost:8137/tools/jumpontest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
f.src = '../index.html?shot&time=12&month=6&freeze';
document.body.append(f);
f.onload = () => run().catch((e) => { out.textContent = `FAIL ${e}\n${e.stack}\nSOME FAILED`; });
async function run() {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const A = w.__app, { player, fall, world, step, camera, renderer, suit } = A;
  const mod = (p) => w.eval(`import('${new URL(p, location.href).href}')`);
  const { PLAYER, SPIDER, STAND_ON, COURTYARD, FURNITURE, SITE, LEVELS } = await mod('../src/config.js');
  const { inPoly } = await mod('../src/player.js');
  const lines = [];
  let pass = true;
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= !!ok; return ok; };
  const f2 = (v) => v.toFixed(2);
  d.getElementById('install').hidden = true;
  Object.defineProperty(d, 'pointerLockElement', { get: () => renderer.domElement, configurable: true });
  d.dispatchEvent(new w.Event('pointerlockchange'));
  const landings = [];
  const land0 = player.onLand;
  player.onLand = (drop, gap) => { const r = land0(drop, gap); landings.push({ drop, gap, r }); return r; };
  const dt = 1 / 60;
  const place = (x, z, yawDeg, feet) => {
    player.spawn(x, z, yawDeg * Math.PI / 180);
    if (feet !== undefined) { player.pos.y = feet; player.eyeY = feet + PLAYER.eye; }
    camera.rotation.x = 0;
    landings.length = 0;
    for (let i = 0; i < 10; i++) step(dt);
    for (let i = 0; i < 300 && player.glide; i++) step(dt);
  };
  const run2 = (secs, keys = []) => { player.keys = new Set(keys); for (let t = 0; t < secs; t += dt) { step(dt); if (fall.active) break; } player.keys = new Set(); };
  const yawTo = (dx, dz) => Math.atan2(-dx, -dz) * 180 / Math.PI; // forward = (−sin yaw, −cos yaw)

  // the apexes (#696)
  const apex = (secs = 1.5) => { const y0 = player.pos.y; let hi = y0; player.keys = new Set(['Space']); step(dt); player.keys = new Set(); for (let t = 0; t < secs; t += dt) { step(dt); hi = Math.max(hi, player.pos.y); } return hi - y0; };
  suit.goHome();
  place(-30, 38, 0); // (open street ground, as the other jump tests)
  const C = SITE.blocks.find((b) => b.name === 'Hus C'), cx = (C.x0 + C.x1) / 2;
  place(cx, C.z1 + 8, 0);
  const plain = apex();
  suit.putOn(); place(cx, C.z1 + 8, 0);
  const high = apex();
  suit.goHome();
  check(plain > 0.5 && plain < 0.85 && high > 2 && high > 3 * plain, `apex: plain jump ${f2(plain)} m (just over a seat), the suit's ${f2(high)} m`);

  // jump from touching a platform, towards its middle, until standing on it (the keys let go over it)
  const jumpOn = (q, dirDeg, floorY = 0) => {
    const cxp = (q.x0 + q.x1) / 2, czp = (q.z0 + q.z1) / 2, a = dirDeg * Math.PI / 180;
    // start 1.2 m + half the platform's size away, on the line through its middle, free to stand
    for (let r = 0.8; r < 3; r += 0.2) {
      const x = cxp + Math.sin(a) * r, z = czp + Math.cos(a) * r;
      if (!player.isFree(x, z)) continue;
      const base = player.groundAt(x, z, floorY);
      place(x, z, yawTo(cxp - x, czp - z), base);
      run2(2, ['KeyW']); // walking alone: held at the edge
      const walkedOn = player.pos.y > base + 0.1;
      const edge = { x: player.pos.x, z: player.pos.z };
      player.keys = new Set(['KeyW', 'Space']); step(dt);
      let landed = false, t = 0;
      for (; t < 1.5 && !landed; t += dt) {
        const over = inPoly(q.pts, player.pos.x, player.pos.z);
        player.keys = new Set(over ? [] : ['KeyW']);
        step(dt);
        landed = over && !player.fall && player.pos.y > base + 0.2;
      }
      player.keys = new Set();
      return { ok: landed, walkedOn, dist: Math.hypot(edge.x - x, edge.z - z), base };
    }
    return null;
  };

  // (1) every platform: which of them can be reached from some side
  const plats = world.platforms;
  check(plats.length >= 3, `${plats.length} platforms (STAND_ON ${JSON.stringify(STAND_ON)} + the courtyard's benches)`);
  const bench = COURTYARD.benches[0];
  const onBench = plats.filter((q) => Math.abs((q.x0 + q.x1) / 2 - bench.x) < 0.05 && Math.abs((q.z0 + q.z1) / 2 - bench.z) < 0.05)[0];
  check(!!onBench && Math.abs(onBench.top - 0.46) < 0.01, `the first bench is a platform, its seat at ${onBench && f2(onBench.top)} m`);
  let res = null;
  for (const dir of [90, 270, 0, 180]) { res = jumpOn(onBench, dir); if (res?.ok) break; }
  check(res && !res.walkedOn, `bench: walking into it does not climb it`);
  check(res?.ok && Math.abs(player.pos.y - onBench.top) < 0.01, `bench: a jump lands on it (feet ${f2(player.pos.y)} m, seat ${f2(onBench.top)} m)`);
  const sx = player.pos.x, sz = player.pos.z;
  run2(1.5);
  check(Math.abs(player.pos.y - onBench.top) < 0.01 && Math.hypot(player.pos.x - sx, player.pos.z - sz) < 0.01 && !fall.active && !player.glide, `bench: stands stably on it (not unstuck, y ${f2(player.pos.y)})`);
  const up2 = apex();
  check(up2 > plain * 0.9 && up2 < plain * 1.1 && Math.abs(player.pos.y - onBench.top) < 0.01, `bench: jumps on from there, ${f2(up2)} m higher, back on the seat`);
  landings.length = 0;
  // walk off the edge: ordinary gravity down to the ground, no hurt
  const ex = [Math.sign(player.pos.x - (onBench.x0 + onBench.x1) / 2) || 1, Math.sign(player.pos.z - (onBench.z0 + onBench.z1) / 2) || 1];
  const longX = onBench.x1 - onBench.x0 > onBench.z1 - onBench.z0;
  player.yaw = undefined;
  const ctr = { x: (onBench.x0 + onBench.x1) / 2, z: (onBench.z0 + onBench.z1) / 2 };
  const off = longX ? [0, ex[1]] : [ex[0], 0];
  place(ctr.x, ctr.z, yawTo(off[0], off[1]), onBench.top); // (placed on the seat, feet at its top)
  check(Math.abs(player.pos.y - onBench.top) < 0.02, `bench: placed on the seat stays up (${f2(player.pos.y)} m)`);
  run2(3, ['KeyW']);
  for (let i = 0; i < 90; i++) step(dt);
  const gnd = player.groundAt(player.pos.x, player.pos.z, 0);
  check(Math.abs(player.pos.y - gnd) < 0.02 && !landings.some((l) => l.r === 'hurt') && !fall.active, `bench: walking off the edge falls to the ground (${f2(player.pos.y)} m, ${JSON.stringify(landings.map((l) => l.r))})`);
  // a high drop onto the seat hurts (the existing fall damage)
  place(ctr.x, ctr.z, 0, onBench.top);
  player.pos.y = onBench.top + 4; player.eyeY = player.pos.y + PLAYER.eye;
  run2(3);
  check(landings.some((l) => l.r === 'hurt'), `a 4 m drop onto the seat hurts (${JSON.stringify(landings.map((l) => `${f2(l.drop)} ${l.r}`))})`);
  for (let i = 0; i < 600 && fall.t >= 0; i++) step(dt);

  // (2) the furniture: the sofa, the armchair, the ottoman, the TV bench (level 0), the bed and the daybed (level 1, #699)
  const reach = {};
  // the piece's standable rectangles (a rug under the piece lifts them by a few cm: top within 8 cm of the table's height)
  const platsOf = (it) => plats.filter((p) => Math.abs(it.x - (p.x0 + p.x1) / 2) < 1.6 && Math.abs(it.z - (p.z0 + p.z1) / 2) < 1.6 && p.top - (LEVELS[it.level].floor + STAND_ON[it.type]) > -0.001 && p.top - (LEVELS[it.level].floor + STAND_ON[it.type]) < 0.08)
    .sort((a, b) => (b.x1 - b.x0) * (b.z1 - b.z0) - (a.x1 - a.x0) * (a.z1 - a.z0)); // the biggest first
  const platOf = (it) => platsOf(it)[0];
  const KINDS = ['sofa', 'armchair', 'ottoman', 'byas', 'bed', 'daybed', 'veronasofa', 'slattable']; // (#701: the patio's lounge + table)
  const pieces = FURNITURE.filter((i) => STAND_ON[i.type] !== undefined && KINDS.includes(i.type));
  const keyOf = (it) => it.type + (it.part ? '-' + it.part : '');
  for (const it of pieces) {
    const cands = platsOf(it), floorY = LEVELS[it.level].floor;
    if (!cands.length) { reach[keyOf(it)] = 'no platform'; continue; }
    let r = null, q = null;
    for (const c of cands) { // any of its standable rectangles (the sofa's arms and back wall off the sides)
      for (const dir of [0, 90, 180, 270, 45, 135, 225, 315]) { r = jumpOn(c, dir, floorY); if (r?.ok) break; }
      if (r?.ok) { q = c; break; }
    }
    reach[keyOf(it)] = r?.ok ? `landed ${f2(player.pos.y - floorY)} m` : r ? 'not reached' : 'no free start';
    if (r?.ok) {
      run2(1); reach[keyOf(it)] += Math.abs(player.pos.y - q.top) < 0.01 && !player.glide ? ', stable' : ', UNSTABLE';
      // stands on, jumps on from there (under a sloping ceiling as far as the head room allows), walks off some side unhurt
      const cap = player.ceilingAt(player.pos.x, player.pos.z, player.pos.y) - PLAYER.headroom - player.pos.y;
      const up = apex(); reach[keyOf(it)] += Math.abs(player.pos.y - q.top) < 0.01 && up > Math.min(plain * 0.9, cap - 0.03) ? ', jumps on' : `, NO JUMP (${f2(up)} m, ceiling allows ${f2(cap)})`;
      let off = false;
      for (const k of [['KeyW'], ['KeyS'], ['KeyA'], ['KeyD']]) { // (the pieces stand among walls: some side is open)
        place(q.x0 + (q.x1 - q.x0) / 2, q.z0 + (q.z1 - q.z0) / 2, 0, q.top);
        landings.length = 0; fall.t = -1;
        player.keys = new Set(k); for (let i = 0; i < 150; i++) step(dt); player.keys = new Set();
        for (let i = 0; i < 90; i++) step(dt);
        if (Math.abs(player.pos.y - player.groundAt(player.pos.x, player.pos.z, floorY)) < 0.02 && player.pos.y < q.top - 0.2 && !landings.some((l) => l.r === 'hurt')) { off = true; break; }
      }
      reach[keyOf(it)] += off ? ', walks off' : ', STUCK/HURT';
    }
    reach[keyOf(it) + '_walk'] = r?.walkedOn;
    reach[keyOf(it) + '_top'] = f2((q ?? cands[0]).top - floorY);
  }
  lines.push(`info furniture: ${JSON.stringify(reach)}`);
  const keys = [...new Set(pieces.map(keyOf))];
  for (const type of keys) check(/landed .*stable, jumps on, walks off/.test(reach[type] ?? ''), `${type}: a jump lands on it, stands stably, jumps on, walks off (${reach[type]})`);
  check(keys.length >= 8 && keys.some((k) => k.startsWith('veronasofa')) && keys.includes('slattable') , `the patio's lounge and its table are among the pieces (${keys.join(', ')})`);
  check(!keys.some((t) => reach[t + '_walk']), 'furniture: walking into it does not climb it');

  // (2b) the sofa's backrest / arms, the bed's headboard and the daybed's back are no seats (#699): walls up to their own height
  const solidAt = (it, lx, lz) => { // a local point of the piece (+ rotation) is inside a footprint without a top
    const a = (it.rot ?? 0) * Math.PI / 180 + Math.PI, wx = it.x + lx * Math.cos(a) + lz * Math.sin(a), wz = it.z - lx * Math.sin(a) + lz * Math.cos(a);
    const fp = world.levels[it.level].footprints.filter((q) => inPoly(q, wx, wz));
    return { n: fp.length, solid: fp.length > 0 && fp.every((q) => q.top === undefined), stand: fp.some((q) => q.top !== undefined) };
  };
  const sofa = FURNITURE.find((i) => i.type === 'sofa' && i.level === 0);
  const sofaBack = solidAt(sofa, 0, -0.89 / 2 + 0.1), sofaSeat = solidAt(sofa, 0, 0.1);
  check(sofaBack.solid && sofaSeat.stand, `sofa: the backrest strip is a wall (${JSON.stringify(sofaBack)}), the seat can be stood on (${JSON.stringify(sofaSeat)})`);
  const bedIt = FURNITURE.find((i) => i.type === 'bed'), bedHead = solidAt(bedIt, 0, -bedIt.l / 2 - 0.1), bedMat = solidAt(bedIt, 0, 0);
  check(bedHead.solid && bedMat.stand, `bed: the headboard is a wall (${JSON.stringify(bedHead)}), the mattress can be stood on (${JSON.stringify(bedMat)})`);
  const dayIt = FURNITURE.find((i) => i.type === 'daybed'), dayBack = solidAt(dayIt, 0, -0.89 / 2 + 0.03), dayEnd = solidAt(dayIt, 2.07 / 2 - 0.04, 0), dayMat = solidAt(dayIt, 0, 0);
  check(dayBack.solid && dayEnd.solid && dayMat.stand, `daybed: the back and the ends are walls, the mattress can be stood on`);
  // the TV on the bench has no footprint of its own and so cannot block the bench top
  const tvIt = FURNITURE.find((i) => i.type === 'tv' && i.level === 0 && i.y === 0.45), benchIt = FURNITURE.find((i) => i.type === 'byas');
  const onTv = solidAt(tvIt, 0, 0);
  check(onTv.n === 1 && onTv.stand, `the TV on the TV bench blocks nothing: one footprint under it, the bench's standable one (${JSON.stringify(onTv)})`);
  // walk the length of the bench top past the TV (a platform stays under the feet the whole way)
  const bq = platOf(benchIt);
  place((bq.x0 + bq.x1) / 2, (bq.z0 + bq.z1) / 2, 0, bq.top);
  const bx0 = player.pos.x; player.keys = new Set(['KeyD']); for (let i = 0; i < 100; i++) step(dt); player.keys = new Set();
  const moved = Math.abs(player.pos.x - bx0) + Math.abs(player.pos.z - (bq.z0 + bq.z1) / 2);
  check(Math.abs(player.pos.y - bq.top) < 0.02 && moved > 0.4, `the bench top: walking along it past the TV (${f2(moved)} m), still on it (${f2(player.pos.y)} m, top ${f2(bq.top)} m)`);

  // (2c) the patio lounge's backs and arms are walls, its seats standable (#701); the raised beds are platforms (0.5 m); a kerb is walked up on
  const lounge = FURNITURE.find((i) => i.type === 'veronasofa' && i.part === 'sofa');
  const loungeBack = solidAt(lounge, 0, -0.66 / 2 + 0.05), loungeArm = solidAt(lounge, -1.5 * 0.685 + 0.02, 0.1), loungeSeat = solidAt(lounge, 0, 0.1);
  check(loungeBack.solid && loungeArm.solid && loungeSeat.stand, `lounge: the backs and the arm are walls, the seat can be stood on (${JSON.stringify([loungeBack, loungeArm, loungeSeat])})`);
  const bedBox = COURTYARD.beds[1], bedPlat = plats.find((q) => Math.abs((q.x0 + q.x1) / 2 - (bedBox.x0 + bedBox.x1) / 2) < 0.05 && Math.abs((q.z0 + q.z1) / 2 - (bedBox.z0 + bedBox.z1) / 2) < 0.05);
  check(!!bedPlat && Math.abs(bedPlat.top - 0.5) < 0.01, `a raised bed is a platform, its rim at ${bedPlat && f2(bedPlat.top)} m`);
  let bres = null;
  if (bedPlat) for (const dir of [0, 90, 180, 270]) { bres = jumpOn(bedPlat, dir); if (bres?.ok) break; }
  check(bres?.ok && !bres.walkedOn && Math.abs(player.pos.y - bedPlat.top) < 0.01, `raised bed: walking does not climb it, a jump lands on it (feet ${f2(player.pos.y)} m, rim ${bedPlat && f2(bedPlat.top)} m)`);
  { // the street's granite kerbs (15 cm, 10 cm proud) and the car park's concrete edges (5 cm) are under PLAYER.stepUp: no collision, walked over
    check(0.1 < PLAYER.stepUp && !plats.some((q) => q.top < 0.2), `kerbs (10 cm proud) and edges (5 cm) are under the step-up (${PLAYER.stepUp} m): no platform needed`);
  }

  // (3) too high / walls: a table (0.75 m) is no platform and holds the jumper; the south façade of Hus C is no way up
  const table = FURNITURE.find((i) => i.type === 'aborgtable');
  check(!plats.some((p) => Math.hypot((p.x0 + p.x1) / 2 - table.x, (p.z0 + p.z1) / 2 - table.z) < 0.4), `the table at (${table.x}, ${table.z}) is no platform`);
  const tf = world.levels[0].footprints.find((q) => !q.top && Math.hypot(q.reduce((s, c) => s + c[0], 0) / q.length - table.x, q.reduce((s, c) => s + c[1], 0) / q.length - table.z) < 0.5);
  const tx = tf.reduce((s, c) => s + c[0], 0) / tf.length, tz = tf.reduce((s, c) => s + c[1], 0) / tf.length;
  let heldOk = false, hi = 0;
  for (const dir of [0, 90, 180, 270]) {
    const a = dir * Math.PI / 180;
    for (let r = 1.0; r < 2.6; r += 0.2) {
      const x = tx + Math.sin(a) * r, z = tz + Math.cos(a) * r;
      if (!player.isFree(x, z)) continue;
      place(x, z, yawTo(tx - x, tz - z), player.groundAt(x, z, 0));
      const base = player.pos.y;
      run2(1.5, ['KeyW']);
      player.keys = new Set(['KeyW', 'Space']); step(dt); player.keys = new Set(['KeyW']);
      for (let t = 0; t < 1.5; t += dt) { step(dt); hi = Math.max(hi, player.pos.y - base); if (inPoly(tf, player.pos.x, player.pos.z)) break; }
      heldOk = !inPoly(tf, player.pos.x, player.pos.z) && Math.abs(player.pos.y - base) < 0.3;
      break;
    }
    if (heldOk) break;
  }
  player.keys = new Set();
  check(heldOk, `table: running + jumping at it, the jumper stays out of its footprint (feet up to ${f2(hi)} m)`);
  place(cx, C.z1 + 2, 0);
  run2(1.5, ['KeyW']);
  player.keys = new Set(['KeyW', 'Space']); step(dt); player.keys = new Set(['KeyW']);
  for (let t = 0; t < 1.5; t += dt) step(dt);
  player.keys = new Set();
  check(player.pos.z > C.z1 && player.pos.y < 0.3, `Hus C's wall: running + jumping into it gets nowhere (z ${f2(player.pos.z)} > ${f2(C.z1)}, feet ${f2(player.pos.y)} m)`);

  out.textContent = lines.join('\n') + `\n${pass ? 'ALL PASS' : 'SOME FAILED'}`;
}
</script>
</body>
</html>
