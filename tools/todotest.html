<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>TODO post-its test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// The TODO post-its on the fridge door (#340): the sample list loads (locally there is no data/todo.json), sorted by
// priority (#431), the notes ride on the fridge door, they are no E target and open no panel (#431), a drawing is
// not taped over them, F keeps them, and the title-cleaning fallback makes long issue titles short.
//   /root/bin/runtest http://localhost:8166/tools/todotest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const lines = [];
const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
let pass = true;
const cases = [
  ['Sovrum 1: flytta NORDLI-byrån så långt till höger som möjligt (bort med glappet)', /^Flytta NORDLI-byrån/],
  ['Bugg: en del kuddar ser glitchiga ut grafiskt sedan lakan och kuddar blev "mjukare" (#308/#309)', /^En del kuddar/],
  ['Kaffeburk med sked bredvid Moccamastern – fyll på vatten och kaffe innan man kan brygga', /^Kaffeburk med sked bredvid Moccamastern$/],
  ['Köket: mörkare kaffe, mer rostat', /^Mörkare kaffe$/],
];
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
f.src = '../index.html';
document.body.append(f);
f.onload = () => run().catch((e) => { out.textContent = `SOME FAILED\nFAIL ${e?.stack ?? e}\n${lines.join('\n')}`; });
async function run() {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { cleanTitle } = await w.eval(`import('${new URL('../src/todo.js', location.href).href}')`); // the page's own module
  for (const [t, re] of cases) {
    const c = cleanTitle(t);
    pass &= check(re.test(c) && c.length <= 41 && !/[()#:]/.test(c), `cleanTitle → "${c}"`);
  }
  const { player, camera, step, todo, world, use, posters } = w.__app;
  const fridge = world.lids.find((l) => l.kind === 'fridge' && !l.freezer);
  pass &= check(!!todo && todo.items.length >= 3, `the sample list loads (${todo?.items.length} notes)`);
  pass &= check(!!todo && todo.object.parent === fridge?.door, 'the notes are on the fridge door');
  // sorted by priority (#431): high → medium → low, oldest first within a level, no label = low (the sample: 327)
  const order = todo.items.map((t) => t.n).join(',');
  pass &= check(order === '335,339,322,331,340,327,334' && todo.items.find((t) => t.n === 327)?.prio === 'low',
    `sorted by priority (${order})`);
  const { byPriority } = await w.eval(`import('${new URL('../src/todo.js', location.href).href}')`);
  const sorted = [{ n: 5 }, { n: 9, prio: 'high' }, { n: 2, prio: 'low' }, { n: 7, prio: 'medium' }, { n: 3, prio: 'high' }]
    .sort(byPriority).map((t) => t.n).join(',');
  pass &= check(sorted === '3,9,7,2,5', `byPriority, a missing prio = low (${sorted})`);
  pass &= check(!d.getElementById('todo-list'), 'no "Att göra" list in the page');
  d.getElementById('start-touch').click();
  await wait(50);
  w.__app.scene.updateMatrixWorld(true);
  const V = todo.object.position.constructor;
  const p = todo.object.getWorldPosition(new V());
  // stand 0.9 m in front of them (the door faces −z), looking at them: no post-it target, E opens no panel
  player.spawn(p.x, p.z - 0.9, Math.PI);
  camera.rotation.x = Math.atan2(p.y - player.eyeY, 0.9);
  for (let i = 0; i < 5; i++) step(1 / 60);
  const btn = d.getElementById('action');
  const noteEl = d.getElementById('note');
  const { focused } = w.__app.focus();
  pass &= check(focused?.kind !== 'note' && !/att göra/i.test(btn.textContent),
    `no post-it target (focus: ${focused?.name ?? 'none'}, button: "${btn.hidden ? '' : btn.textContent}")`);
  pass &= check(noteEl.hidden, 'no panel open');
  // the changelog note still shows its own list
  w.__app.showNote(true);
  pass &= check(!noteEl.hidden && d.querySelector('#note h2').textContent === 'Ändringar' && d.getElementById('note-list').offsetHeight > 0, 'the freezer note still shows the changelog');
  w.__app.showNote(false);
  // no drawing over the notes: the spot right on them is refused, lower down on the door it is fine
  const ray = (y) => { const o = new V(p.x, y, p.z - 0.6); return { origin: o, direction: new V(0, 0, 1) }; };
  const on = posters.spot(ray(p.y), 0, () => false), low = posters.spot(ray(0.75), 0, () => false);
  pass &= check(!on && !!low && low.surface === 'fridge', `no drawing over the notes (on them: ${!!on}, lower: ${low?.surface})`);
  // the fridge opens: the notes swing with the door
  use(fridge);
  for (let i = 0; i < 120; i++) step(1 / 60);
  w.__app.scene.updateMatrixWorld(true);
  const q = todo.object.getWorldPosition(new V());
  pass &= check(fridge.isOpen && q.distanceTo(p) > 0.15, `fridge open, the notes moved ${q.distanceTo(p).toFixed(2)} m`);
  use(fridge);
  for (let i = 0; i < 120; i++) step(1 / 60);
  w.__app.scene.updateMatrixWorld(true);
  pass &= check(!fridge.isOpen && todo.object.getWorldPosition(new V()).distanceTo(p) < 0.005, 'closed, the notes back in place');
  // F keeps them (part of the fridge)
  w.__app.toggleFurniture();
  w.__app.scene.updateMatrixWorld(true);
  let shown = true;
  for (let o = todo.object; o; o = o.parent) shown &&= o.visible;
  pass &= check(shown, 'F keeps the notes');
  w.__app.toggleFurniture();
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
}
</script>
</body>
</html>
