<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Street light test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// The front's outdoor light at night (#434): the street lamps' pools on the ground are hidden by day, fade in after
// dusk with the lamp heads, lie on the ground under each head and fade out again in the morning. #433: a wall light by
// each of Hus L's eight street-side front doors (on the latch side), its wash on the façade and pool on the ground, the
// same way; the pools stay outside the house. #1078: a wall light with a socket by each courtyard patio door (8) and
// roof-terrace door (9): their washes / pools join the same two meshes after the portik's, and go out in a power cut;
// the same fixture by every Å-hus loggia door (A/B/C), its wash / pool kept inside the loggia.
// #1092: the front-door and patio washes are cut round the façade's openings (light on the brick, not on the glass).
//   chromium --headless=new --virtual-time-budget=30000 --dump-dom http://localhost:8137/tools/streetlighttest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 480; f.height = 300; f.src = '../index.html?test&shot&time=12&month=10&freeze';
document.body.append(f);
f.onload = () => run().catch((e) => { out.textContent = `FAIL ${e}\n${e.stack}\nSOME FAILED`; });
async function run() {
  const w = f.contentWindow;
  while (!w.__app) await wait(100);
  const { world, scene } = w.__app;
  const { SITE, HUS_L } = await w.eval(`import('${new URL('../src/config.js', location)}')`);
  const { husLLayout } = await w.eval(`import('${new URL('../src/exterior.js', location)}')`);
  const { groundY, lampGroundY } = await w.eval(`import('${new URL('../src/surroundings.js', location)}')`);
  const lines = [];
  let pass = true;
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= !!ok; return ok; };
  // drive the lights' update the way the loop does (night = 1 − daylight), with real (virtual) time between calls
  // (the loop's own calls get the forced night too)
  const orig = world.windowLights.update.bind(world.windowLights);
  let forced = 0, powered = true;
  world.windowLights.update = (h) => orig(h, forced, powered);
  const run = async (night, secs) => { forced = night; for (let t = 0; t < secs; t += 0.1) { world.windowLights.update(12); await wait(100); } };
  const pools = scene.getObjectByName('streetLampPools');
  const wash = scene.getObjectByName('doorLampWash'), doorPools = scene.getObjectByName('doorLampPools');
  check(!!pools, 'the street lamps\' pools exist');
  const DL = HUS_L.doorLamp, PL = HUS_L.portikLamp, PT = HUS_L.patioLamp, PATIO = 8 + 9, layout = husLLayout(world.size.x);
  const frontDoor = world.openings.north.find(o => o.y0 < 0.05 && o.y1 > 2);
  // exterior appends one complete primitive per front door, then the portik parts.
  // Verify each interval's own center/bounds: count alone cannot detect a missing or duplicated door.
  const poolCount = rings => (2 * rings - 1) * 20 * 3; // only one triangle at the center (groundglow.js)
  const frontVertices = poolCount(5), ceilingVertices = poolCount(4);
  const wp = wash.geometry.attributes.position, dp = doorPools.geometry.attributes.position;
  const near = (a, b) => Math.abs(a - b) < 1e-4;
  // #1092: each wash is cut round the façade's openings, so its vertex count varies: the mesh lists them per lamp
  const parts = wash.userData.parts ?? [], off = parts.map((_, i) => parts.slice(0, i).reduce((a, b) => a + b, 0));
  const washOf = (i) => bounds(wp, off[i], parts[i]);
  const bounds = (pos, start, count) => {
    const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
    for (let i = start; i < start + count; i++) for (let axis = 0; axis < 3; axis++) {
      const value = pos.getComponent(i, axis); min[axis] = Math.min(min[axis], value); max[axis] = Math.max(max[axis], value);
    }
    return { min, max, center: min.map((value, axis) => (value + max[axis]) / 2) };
  };
  check(!!frontDoor && layout.units.length === 8 && new Set(layout.units.map(u => u.lower)).size === 8 &&
    parts.length === 8 + PL.z.length * 2 + PATIO && parts.every((n) => n >= 6 && n % 6 === 0) && off.at(-1) + parts.at(-1) === wp.count && dp.count === 8 * frontVertices + PL.z.length * (frontVertices + ceilingVertices) + PATIO * frontVertices,
    'eight distinct front doors plus separately sized portik geometry intervals plus 17 patio/terrace lamps');
  { // #1078: after the portik, 8 patio lamps (wash on the brick at the courtyard face, pool on the patio) then 9 terraces
    const D = world.size.z, wash0 = 8 + PL.z.length * 2, pool0 = 8 * frontVertices + PL.z.length * (frontVertices + ceilingVertices);
    let ok = true, xs = [];
    for (let i = 0; i < PATIO; i++) {
      const wb = washOf(wash0 + i), pb = bounds(dp, pool0 + i * frontVertices, frontVertices), ground = i < 8;
      xs.push(wb.center[0]);
      ok &&= near(wb.min[2], wb.max[2]) && near(wb.max[0] - wb.min[0], PT.wash.w) && near(pb.center[0], wb.center[0]) && pb.min[2] > wb.max[2]
        && (ground ? Math.abs(wb.center[2] - D) < 0.05 && near(wb.center[1], PT.wash.y) : wb.center[2] < D - 1 && wb.center[1] > 8)
        && (ground ? pb.max[1] < 1 : near(pb.min[1], pb.max[1]) && pb.min[1] > 8);
    }
    check(ok && new Set(xs.map((x) => x.toFixed(2))).size === PATIO, 'patio and terrace lamps: one wash and pool each, in front of their own doors');
  }
  { // #1092: the front-door and patio washes light the brick round the doors and windows, never their glass
    const last = layout.units.at(-1).ox, holes = (list, north) => layout.units.flatMap((u) => list
      .filter((o) => !(north && u.ox === last && HUS_L.endUnitNorthHidden.some(([a, b]) => (o.x0 + o.x1) / 2 > a && (o.x0 + o.x1) / 2 < b)))
      .map((o) => ({ x0: u.ox + o.x0, x1: u.ox + o.x1, y0: o.y0, y1: o.y1 })));
    const street = holes(world.openings.north, true), court = holes(world.openings.south, false);
    let clear = true, cut = 0;
    for (const [i, list] of [...Array(16)].map((_, k) => (k < 8 ? [k, street] : [8 + PL.z.length * 2 + k - 8, court]))) {
      if (parts[i] > 6) cut++;
      for (let v = off[i]; v < off[i] + parts[i]; v += 3) {
        const t = bounds(wp, v, 3);
        clear &&= !list.some((o) => t.max[0] > o.x0 + 1e-3 && t.min[0] < o.x1 - 1e-3 && t.max[1] > o.y0 + 1e-3 && t.min[1] < o.y1 - 1e-3);
      }
    }
    check(clear && cut === 16, `front-door and patio washes are cut round every façade opening they reach (${cut}/16 cut)`);
  }
  let frontInside = 0, frontGroundError = 0;
  for (const [i, unit] of layout.units.entries()) {
    const x = unit.ox + frontDoor.x1 + DL.dx, wb = washOf(i), pb = bounds(dp, i * frontVertices, frontVertices);
    check(near(wb.center[0], x) && near(wb.center[1], DL.wash.y) && wb.max[2] < -0.01 && near(wb.min[2], wb.max[2]) &&
      near(wb.max[0] - wb.min[0], DL.wash.w) && near(wb.max[1] - wb.min[1], DL.wash.h),
      `${unit.lower}: complete façade wash at its own front door's latch side`);
    check(near(dp.getX(i * frontVertices), x - 0.3) && near(dp.getZ(i * frontVertices), DL.pool.z) &&
      near(pb.center[0], x - 0.3) && near(pb.center[2], DL.pool.z) && near(pb.max[0] - pb.min[0], DL.pool.rx * 2) && near(pb.max[2] - pb.min[2], DL.pool.rz * 2),
      `${unit.lower}: complete ground pool below its own door lamp`);
    for (let j = i * frontVertices; j < (i + 1) * frontVertices; j++) {
      if (dp.getZ(j) > -0.01) frontInside++;
      frontGroundError = Math.max(frontGroundError, Math.abs(dp.getY(j) - groundY(dp.getX(j), dp.getZ(j)) - 0.05));
    }
  }
  const [pk0, pk1] = layout.portik, pkx = (pk0 + pk1) / 2;
  let portikOK = true;
  for (const [i, z] of PL.z.entries()) {
    for (const side of [0, 1]) {
      const b = washOf(8 + i * 2 + side), edge = side ? pk1 : pk0;
      portikOK &&= Math.abs(b.center[0] - edge) < 0.05 && b.center[0] > pk0 && b.center[0] < pk1 && near(b.min[0], b.max[0]) &&
        near(b.center[1], PL.wash.y) && near(b.center[2], z) && near(b.max[2] - b.min[2], PL.wash.w) && near(b.max[1] - b.min[1], PL.wash.h);
    }
    const start = 8 * frontVertices + i * (frontVertices + ceilingVertices);
    portikOK &&= near(dp.getX(start), pkx) && near(dp.getZ(start), z) && near(dp.getX(start + frontVertices), pkx) && near(dp.getZ(start + frontVertices), z);
    for (let j = start; j < start + frontVertices + ceilingVertices; j++) {
      const expectedY = j < start + frontVertices ? groundY(dp.getX(j), dp.getZ(j)) + 0.05 : HUS_L.core.portikHeight - 0.012;
      portikOK &&= Math.abs(dp.getY(j) - expectedY) < 1e-3;
    }
  }
  check(portikOK, 'portik wall, ground and ceiling glows are separate legitimate geometry');
  const lw = scene.getObjectByName('loggiaLampWash'), lp = scene.getObjectByName('loggiaLampPools');
  check(lw && lp && lw.geometry.attributes.position.count === lp.geometry.attributes.position.count / frontVertices * 6 && lw.geometry.attributes.position.count >= 6 * 20,
    `the Å-husen's loggia doors have their lamps (${lw ? lw.geometry.attributes.position.count / 6 : 0})`);
  await run(0, 1);
  check(!pools.visible, 'by day the pools are hidden');
  check(!lw.visible && !lp.visible, 'by day the loggia lamps are off');
  check(!wash.visible && !doorPools.visible, 'by day the door lights are off');
  await run(1, 2.5);
  check(wash.visible && doorPools.visible && Math.abs(wash.material.opacity - DL.wash.peak) < 1e-6 && Math.abs(doorPools.material.opacity - DL.pool.peak) < 1e-6,
    `after dusk the door lights are lit (wash ${wash.material.opacity.toFixed(2)}, pool ${doorPools.material.opacity.toFixed(2)})`);
  check(frontInside === 0, `the eight front-door pools stay in front of the façade (${frontInside} vertices behind it)`);
  check(frontGroundError < 1e-3, `all front-door pool vertices follow the actual ground (${frontGroundError.toFixed(4)} m off)`);
  const P = SITE.street.lamps.pool;
  check(pools.visible && Math.abs(pools.material.opacity - P.peak) < 1e-6, `at night they are lit (opacity ${pools.material.opacity.toFixed(2)} of ${P.peak})`);
  // every pool vertex lies just over the ground
  const pos = pools.geometry.attributes.position;
  let worst = 0;
  for (let i = 0; i < pos.count; i += 7) {
    // #1363: road pools retain their original support; appended path pools use the actual terrain triangle surface.
    const ground = i < (pools.userData.pathStart ?? pos.count) ? groundY : lampGroundY;
    worst = Math.max(worst, Math.abs(pos.getY(i) - ground(pos.getX(i), pos.getZ(i)) - 0.05));
  }
  check(worst < 1e-3, `the pools lie on the ground, slopes too (worst ${worst.toFixed(4)} m off)`);
  await run(0.32, 1);
  check(pools.visible, 'just under the switching level they stay on (no flicker at dusk)');
  await run(0, 2);
  check(!pools.visible, 'in the morning they fade out');
  check(!wash.visible && !doorPools.visible, 'and the door lights too');
  await run(1, 2.5);
  check(lw.visible && lp.visible && Math.abs(lp.material.opacity - DL.pool.peak) < 1e-6, 'after dusk the loggia lamps are lit');
  powered = false;
  await run(1, 2.5);
  check(!wash.visible && !doorPools.visible && !lw.visible && !lp.visible, 'a power cut puts the door, patio, terrace and loggia lights out at night (#604, #1078)');
  powered = true;
  out.textContent = lines.join('\n') + `\n${pass ? 'ALL PASS' : 'SOME FAILED'}`;
}
</script>
</body>
</html>
