// customizer draws it) of the same look with the skin variation off / low / high, and a larger mirror-distance close-up of the three side by
// side. The "before" pass serves the base revision's modules (the look fields are then unknown and ignored).
import * as THREE from 'three';
import { AvatarPreview } from '../src/avatarpreview.js';
import { Avatar } from '../src/avatar.js';
import { decodeAvatarLook, avatarEyeHeight, SKIN } from '../src/config.js';
const LEVELS = { off: {}, low: { freckles: 1 }, high: { freckles: 3, marks: 1, blotch: 1 } };
const look = (level, skin) => ({ ...decodeAvatarLook('210000100c5', 'skinvar'), tall: 1, build: 1, style: 1, skin: SKIN[skin], skinSeed: 2, ...LEVELS[level] });
const out = document.createElement('canvas'); document.body.appendChild(out);
let preview = null;
window.__preview = (level, skin = 1, yaw = 0) => {
  preview ??= new AvatarPreview(out);
  preview.draw(look(level, skin), { closeup: true, yaw });
  const i = preview.renderer.info; return { calls: i.render.calls, tris: i.render.triangles, textures: i.memory.textures, w: out.width, h: out.height };
};
// mirror distance: a 0.45 m wide view of three faces from about 0.6 m
const W = 960, H = 600, renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x263747);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f72, 1.6));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2); sun.position.set(2, 4, 3); scene.add(sun);

window.__mirror = (skin = 1, yaw = 0) => {
  for (const a of row) { a.object.removeFromParent(); a.dispose(); }
  row = Object.keys(LEVELS).map((lv, i) => {
    const a = new Avatar(look(lv, skin)); a.object.position.set((i - 1) * 0.24, 1.62 - avatarEyeHeight(a.look), 0); a.object.rotation.y = yaw; a.update(0, {}); scene.add(a.object); return a;
  });

  const t = row[1].bones.head.getWorldPosition(new THREE.Vector3()); t.x = 0; t.y += 0.08;
  cam.position.copy(t).add(new THREE.Vector3(0, 0, 0.95)); cam.lookAt(t);
  renderer.info.reset(); renderer.render(scene, cam);
  out.width = W; out.height = H; out.getContext('2d').drawImage(renderer.domElement, 0, 0);

  }

};
