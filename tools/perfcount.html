<!doctype html><html lang="sv"><head><meta charset="utf-8"><title>Draw call count</title></head><body><pre id="out">running…</pre><script>
// Draw calls / triangles / geometries at a few spots (one render each) — the numbers to compare when
// optimising (#48). Timings are meaningless under --virtual-time-budget, so none are taken.
//   google-chrome --headless=new --use-angle=swiftshader --enable-unsafe-swiftshader \
//     --virtual-time-budget=60000 --dump-dom http://localhost:8137/tools/perfcount.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const spots = [['start', 2.875, -12, 180, 8, 0], ['kitchen', 3.5, 3, 0, 0, 0], ['living', 2.8, 9, 180, 0, 0], ['upstairs', 3.0, 6.2, 90, 0, 3.25], ['patio', 2.9, 16, 180, 5, 0],
  // around the block (#355): the courtyard, Karpvägen by Hus C, the garage drive, the park level south of Hus B / A, Sankt Lars väg's east leg
  ['courtyard', -30, 25, 180, 0, 0], ['karpvagen', -74, 0, 180, 0, 0], ['garage', -76, 44, -90, 0, 0], ['park', -20, 60, 0, 0, 0], ['east', 20, 30, 180, 0, 0],
  // under the courtyard (#357, #417): the big hall looking east, Hus L's basement
  ['big hall', -46, 21, -90, 0, -3], ['basement', -30, 10, -90, 0, -3]];
// ?month=12&day=10 etc. override the game URL's parameters (the Christmas tree, #571); ?w=390&h=844 a phone-sized frame
const own = new URLSearchParams(location.search), game = new URLSearchParams({ shot: '', time: '12', month: '7' });
for (const [k, v] of own) if (k !== 'w' && k !== 'h') game.set(k, v);
const f = document.createElement('iframe'); f.width = +(own.get('w') ?? 1280); f.height = +(own.get('h') ?? 800); f.src = '../index.html?' + game.toString().replace(/=(&|$)/g, '$1');
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow;
  while (!w.__app) await wait(100);
  const { player, camera, step } = w.__app;
  const r = w.__app.renderer;
  const lines = [];
  for (const [name, x, z, yaw, pitch, feet] of spots) {
    player.spawn(x, z, yaw * Math.PI / 180);
    if (feet) { player.pos.y = feet; player.eyeY = feet + 1.62; camera.position.y = player.eyeY; }
    camera.rotation.x = pitch * Math.PI / 180;
    step(1 / 60);
    r.render(w.__app.scene, camera);
    const i = r.info;
    lines.push(`${name}: calls ${i.render.calls} tris ${i.render.triangles} geoms ${i.memory.geometries} tex ${i.memory.textures}`);
  }
  // the mess's cap (#388): far more crumbs and dust than it draws — one call per kind with any, the instances at the cap
  const mess = w.__app.life.mess;
  if (mess) {
    const at = () => { player.spawn(2.6, 9, Math.PI); camera.rotation.x = -0.5; step(1 / 60); r.render(w.__app.scene, camera); return r.info.render.calls; };
    mess.clear(); const c0 = at();
    for (let i = 0; i < 400; i++) mess.add(i % 2 ? 'crumb' : 'dust', 0.6 + Math.random() * 4.5, 0, 7.3 + Math.random() * 5, { amt: 0.4 });
    const c1 = at(), M = mess.meshes;
    lines.push(`mess cap: calls ${c0} → ${c1} with 400 added, drawn crumb ${M.crumb.count}/${M.crumb.instanceMatrix.count} dust ${M.dust.count}/${M.dust.instanceMatrix.count} spots ${mess.spots.length}`);
    mess.clear();
  }

  // Quality scaling comparison (#460)
  const app = w.__app;
  if (app.detail) {
    app.detail().setQuality(1.0);
    player.spawn(3.5, 3, 0); step(1 / 60); r.render(w.__app.scene, camera);
    const callsHigh = r.info.render.calls;
    app.detail().setQuality(0.7);
    step(1 / 60); r.render(w.__app.scene, camera);
    const callsLow = r.info.render.calls;
    lines.push(`quality scale: kitchen calls high ${callsHigh} → low ${callsLow}`);
    lines.push(callsLow <= callsHigh ? 'PASS quality scale reduced draw calls' : 'FAIL quality scale');
  }

  // Adaptive quality level (#460, #592: src/quality.js)
  const q = app.quality;
  if (q) {
    const top = q.max, feed = (dt, n) => { for (let i = 0; i < n; i++) q.update(dt); };
    q.set(top); feed(1 / 60, 120); feed(1 / 25, 60);
    lines.push(q.level < top ? 'PASS adaptive level drops on a low frame rate' : 'FAIL adaptive level drop');
    q.set(top); feed(1 / 60, 120); const t0 = q.clock;
    for (let i = 0; i < 6 && q.level === top; i++) { feed(1 / 60, 3); q.update(0.07); } // a 70 ms hitch every ~120 ms
    lines.push(q.level === top - 1 && q.clock - t0 < 0.6 ? `PASS repeated hitches drop a level within ${(q.clock - t0).toFixed(2)} s` : 'FAIL repeated hitches');
    feed(1 / 60, 60 * 10);
    lines.push(q.level === top - 1 ? 'PASS no step up right after a step down' : 'FAIL stepped up too soon');
    feed(1 / 60, 60 * 30);
    lines.push(q.level === top ? 'PASS adaptive level recovers on a high frame rate' : 'FAIL adaptive level recover');
    q.set(0); const knobs = [...q.knobs.keys()];
    lines.push(`level 0: ${q.describe().replace(/\n/g, ' · ')}`);
    q.set(top);
    lines.push(`level ${top}: ${q.describe().replace(/\n/g, ' · ')}`);
    lines.push(['resolution', 'shadows', 'mirrors', 'detail', 'weather'].every((k) => knobs.includes(k)) ? 'PASS quality knobs registered' : 'FAIL knobs ' + knobs);
  }

  lines.push('ALL PASS');
  out.textContent = lines.join('\n');
};
</script></body></html>
