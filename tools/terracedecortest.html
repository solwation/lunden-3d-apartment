<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Terrace decor test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// The furnished roof terraces (#605, src/terracedecor.js, TERRACE_DECOR in config): L1201's terrace is EMPTY (#573), every
// other terrace has its own style with plants, somewhere to sit and railing boxes; every item stays on its own deck and
// clear of its terrace door; everything is three merged meshes (finite, a triangle budget); the gate hides them from the
// street (behind Hus L) and far away and shows them from the courtyard and above.
//   node runtest.cjs terracedecortest.html  (Playwright, real time)
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 400; f.height = 300; f.src = '../index.html?time=12&month=6&shot&freeze';
document.body.append(f);
f.onload = () => run().catch((e) => { out.textContent = `FAIL ${e}\n${e.stack}\nSOME FAILED`; });
const MAX_TRIS = 50000; // budget for all the terraces together (measured ~37 k, #605)
async function run() {
  const w = f.contentWindow;
  while (!w.__app?.world) await wait(100);
  const { scene, camera, renderer } = w.__app;
  const { TERRACE_DECOR: T, HUS_L } = await w.eval(`import('${new URL('../src/config.js', location)}')`);
  const lines = [];
  let pass = true;
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= !!ok; return ok; };

  let ext = null;
  scene.traverse((o) => { if (o.userData.terraces) ext = o; });
  const U = ext.userData.terraces, gate = scene.getObjectByName('terrace-decor');
  check(gate && gate.meshes.length === 3, `three merged meshes: ${gate?.meshes.map((m) => m.name).join(', ')}`);
  const D = U.list[0].poly[2][1], zs = D - HUS_L.court.setback;
  const recs = gate.userData.records, byId = Object.fromEntries(recs.map((r) => [r.id, r]));

  // L1201 stays empty: no record, and no vertex of any decor mesh over its deck
  const l1201 = U.list.find((t) => t.id === 'L1201');
  check(!byId.L1201, 'L1201 has no decor record (#573: a visitable empty flat)');
  let inside = 0, tris = 0, bad = 0;
  for (const m of gate.meshes) {
    const p = m.geometry.attributes.position;
    tris += p.count / 3;
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      if (![x, y, z].every(Number.isFinite)) bad++;
      if (x > l1201.x0 - 0.01 && x < l1201.x1 + 0.01 && z > zs - 0.01 && y > U.deck - 0.01) inside++;
    }
  }
  check(inside === 0, `no decor vertex over L1201's terrace (${inside})`);
  check(bad === 0, `all positions finite (${bad} bad)`);
  check(tris > 5000 && tris < MAX_TRIS, `${Math.round(tris)} triangles in all (budget ${MAX_TRIS})`);

  // every other terrace: furnished, its own style, plants + seats + a railing box, everything on its own deck, door clear
  const others = U.list.filter((t) => t.id !== 'L1201');
  const styles = new Set(recs.map((r) => r.style));
  check(styles.size === others.length, `${styles.size} styles for ${others.length} terraces: ${[...styles].join(', ')}`);
  const PLANTS = ['palm', 'banana', 'agave', 'olive', 'bush', 'potflowers', 'raised'], SEATS = ['chair', 'lounger', 'sofa'];
  const FLAT = ['rug', 'railbox', 'lights']; // allowed in front of the door: flat on the deck or up on the railing / overhead
  for (const t of others) {
    const r = byId[t.id];
    if (!check(r, `${t.id} is furnished`)) continue;
    const kinds = r.items.map((i) => i.k);
    check(kinds.length >= 6 && kinds.some((k) => PLANTS.includes(k)) && kinds.some((k) => SEATS.includes(k)),
      `${t.id} (${r.style}): ${kinds.length} items with plants and somewhere to sit`);
    const eps = 0.035, g0 = t === U.list[0] ? 0.13 : 0, g1 = t === U.list.at(-1) ? 0.13 : 0; // (the gable's railing 0.1 inside it)
    const off = r.items.filter((i) => i.k !== 'lights' && (i.x0 < t.x0 + g0 + eps - 0.01 || i.x1 > t.x1 - g1 - eps + 0.01 || i.z0 < zs - 0.005 || i.z1 > D - (i.k === 'railbox' ? 0 : 0.1)));
    check(!off.length, `${t.id}: every item stands on the deck, clear of the screens and the railing ${off.map((i) => `${i.k} ${i.x0.toFixed(2)}…${i.x1.toFixed(2)} / ${i.z0.toFixed(2)}…${i.z1.toFixed(2)}`).join('; ')}`);
    const through = r.items.filter((i) => i.k !== 'lights' && (i.crown.x0 < t.x0 + g0 - 0.005 || i.crown.x1 > t.x1 - g1 + 0.005 || i.crown.z0 < zs - 0.005));
    check(!through.length, `${t.id}: no leaf or parasol through a screen or the wall ${through.map((i) => `${i.k} ${i.crown.x0.toFixed(2)}…${i.crown.x1.toFixed(2)} / ${i.crown.z0.toFixed(2)}`).join('; ')}`);
    const dm = T.door.margin, blocked = r.items.filter((i) => !FLAT.includes(i.k)
      && i.x1 > r.door.x0 - dm && i.x0 < r.door.x1 + dm && i.z0 < zs + T.door.depth);
    check(!blocked.length, `${t.id}: the terrace door (${r.door.x0.toFixed(2)}…${r.door.x1.toFixed(2)}) is clear ${blocked.map((i) => i.k).join(', ')}`);
  }
  check(recs.some((r) => r.items.some((i) => i.k === 'railbox')) && recs.filter((r) => r.items.some((i) => i.k === 'railbox')).length >= 6, 'railing boxes on most terraces');
  for (const k of ['palm', 'lounger', 'table', 'parasol', 'grill', 'lights', 'rug']) check(recs.some((r) => r.items.some((i) => i.k === k)), `somewhere: ${k}`);

  // the gate: hidden from the street (Hus L in between) and far away, shown from the courtyard and from above
  const V = camera.position.constructor, cam = camera.clone();
  const seen = (x, y, z) => { cam.position.set(x, y, z); cam.lookAt(-10, U.deck, zs + 0.8); cam.updateMatrixWorld(true); gate.update(cam); return gate.meshes.every((m) => m.layers.test(camera.layers)); };
  check(!seen(-5, 1.7, -15), 'not drawn from the street (behind Hus L)');
  check(!seen(-5, 7.9, -1), 'not drawn from the loftgång');
  check(seen(-5, 1.7, 35), 'drawn from the courtyard');
  check(seen(-5, 30, -10), 'drawn from above the roof (jetpack)');
  check(seen(-60, 1.7, 5), 'drawn from beside the gable');
  check(!seen(-5, 1.7, 300), `not drawn beyond ${T.far} m`);
  gate.update(camera);
  // the bulbs glow after dusk
  const bulbs = gate.meshes.find((m) => m.name === 'terraceDecorBulbs');
  ext.userData.update(1); const night = bulbs.material.color.getHex();
  ext.userData.update(0); const day = bulbs.material.color.getHex();
  ext.userData.update(1, false); const cut = bulbs.material.color.getHex(); ext.userData.update(0);
  check(cut === T.bulbs.day, `the bulbs go out in a power cut (#604)`);
  check(night === T.bulbs.night && day === T.bulbs.day, `string lights warm at night (${night.toString(16)}), plain by day (${day.toString(16)})`);
  renderer.render(scene, camera);
  lines.push(`\n${pass ? 'ALL PASS' : 'SOME FAILED'}`);
  out.textContent = lines.join('\n');
}
</script>
</body>
</html>
