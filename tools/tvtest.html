<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>TV channels and power</title></head>
<body><pre id="out">running…</pre><script>
// Local programme renderer regression. Shared E/remote/media integration is tools/tvmediatest.cjs.
const out=document.getElementById('out'),f=document.createElement('iframe');f.width=900;f.height=600;
f.src='../?shot&test=lazy&cloud=&mp=0';document.body.append(f);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
f.onload=async()=>{try{
 const w=f.contentWindow;while(!w.__app)await wait(100);
 const a=w.__app;a.showOverlay(false);a.touch.enabled=true;
 const checks=[],check=(ok,name)=>{checks.push(`${ok?'PASS':'FAIL'} ${name}`);if(!ok)throw Error(name);};
 const tvs=a.world.furnitureTargets.filter(t=>t.kind==='tv');check(tvs.length===3,'three TVs');
 for(const tv of tvs){
  if(tv.isOpen)tv.toggle();check(!tv.mesh.material.map,`${tv.mediaId}: standby`);
  tv.toggle();const v=tv.screen.texture.version;tv.update(1);check(tv.isOpen&&!!tv.mesh.material.map&&tv.screen.texture.version>v,`${tv.mediaId}: moving local programme`);
  const ch=tv.screen.channel;tv.toggle();tv.toggle();check(tv.screen.channel!==ch,`${tv.mediaId}: next programme`);
  const original=tv.videoMaterial;tv.videoMaterial=tv.mesh.material;tv.video(true);tv.toggle();check(tv.videoActive,`${tv.mediaId}: ordinary toggle retains shared surface`);tv.video(false);tv.videoMaterial=original;check(!tv.mesh.material.map,`${tv.mediaId}: restore standby`);
 }
 check([...a.tvMedia.sessions].length===3,'all TVs connected to shared media');
 out.textContent=checks.join('\n')+'\nALL PASS';
}catch(e){out.textContent+='\nFAIL '+e.message;}};
</script></body></html>
