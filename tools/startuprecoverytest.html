<!doctype html><html lang="sv"><meta charset="utf-8"><title>Startup recovery test</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<pre id="out">running…</pre>
<div id="loading"><div class="loading-card"><h1>Loading</h1><p>Waiting</p><div class="loading-bar"></div></div></div>
<script type="module">
import { fetchStartupJSON, watchStartup, startupCause, startupErrorText, recordStartupFailure, takeStartupFailure } from '../src/startuprecovery.js';
import { loadTodo } from '../src/todo.js';
import { loadBeerShelf } from '../src/beershelfdata.js';
const lines=[], check=(ok,text)=>lines.push(`${ok?'PASS':'FAIL'} ${text}`);
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const response=value=>({ok:true,json:async()=>value});
try {
  let signal;
  try { await fetchStartupJSON('stall',{timeout:30,fetcher:(_,opts)=>{signal=opts.signal;return new Promise(()=>{});}});check(false,'request must time out'); }
  catch { check(signal.aborted,'stalled request ignoring abort still rejects and aborts'); }
  try { await fetchStartupJSON('stall-body',{timeout:30,fetcher:async()=>({ok:true,json:()=>new Promise(()=>{})})});check(false,'body must time out'); }
  catch { check(true,'stalled JSON body has the same bounded deadline'); }
  check((await fetchStartupJSON('retry',{fetcher:async()=>response({ready:true})})).ready,'a subsequent successful fetch works');
  let calls=[];
  const notes=await loadTodo({timeout:30,fetcher:async url=>{calls.push(url);return calls.length===1?new Promise(()=>{}):response([{n:2,text:'Note',prio:'high'}]);}});
  check(calls.length===2&&notes.length===1&&notes[0].n===2,'stalled published notes fall back to local sample');
  check((await loadTodo({timeout:30,fetcher:()=>new Promise(()=>{})})).length===0,'two stalled optional note sources continue with empty notes');
  const cacheDescriptor=Object.getOwnPropertyDescriptor(globalThis,'caches');
  Object.defineProperty(globalThis,'caches',{configurable:true,value:{open:async()=>({match:async()=>({json:()=>new Promise(()=>{})}),put:()=>new Promise(()=>{})})}});
  const shelf=await loadBeerShelf({timeout:1000,refresh:false,fetcher:(_,options)=>fetch('../data/beer-shelf-default.json',options)});
  check(shelf.record.beers.length===4&&shelf.images.length===4,'stalled cached body and cache write still return complete local beer labels');
  if(cacheDescriptor)Object.defineProperty(globalThis,'caches',cacheDescriptor);else delete globalThis.caches;
  const loading=document.getElementById('loading');
  const key='lunden.startupRecoveryTest';sessionStorage.setItem(key,'saved-place');localStorage.setItem(key,'saved-home');
  document.documentElement.classList.add('resuming');let retries=0;
  watchStartup({timeout:30,retry:()=>{retries++;}});
  await wait(80);
  const button=loading.querySelector('button');
  check(!!button&&!loading.hidden&&!document.documentElement.classList.contains('resuming'),'stalled resumed startup exposes recovery while keeping scene covered');
  check(sessionStorage.getItem(key)==='saved-place'&&localStorage.getItem(key)==='saved-home','recovery preserves saved position and home');
  button.click();check(retries===1,'visible retry button invokes retry');
  loading.querySelector('h1').textContent='Loading';button.remove();loading.hidden=false;
  const guard=watchStartup({timeout:30});guard.fail();guard.fail();
  check(loading.querySelectorAll('button').length===1,'import failure offers one immediate retry');
  loading.querySelector('button').remove();loading.querySelector('h1').textContent='Ready';
  watchStartup({timeout:30});loading.classList.add('done');await wait(80);
  check(!loading.querySelector('button')&&loading.querySelector('h1').textContent==='Ready','normal loading dismissal cancels recovery deadline');
  loading.classList.remove('done');watchStartup({timeout:30});loading.hidden=true;await wait(80);
  check(!loading.querySelector('button'),'hidden loading cover also cancels recovery');
  // #1131: the real index card and its inline step/heartbeat/stall script, with a short stall time and a real blocking loop.
  const index=new DOMParser().parseFromString(await (await fetch('../index.html')).text(),'text/html');
  const source=[...index.scripts].find(s=>s.textContent.includes('__lundenLoading ='));
  loading.replaceWith(document.importNode(index.getElementById('loading'),true));
  new Function(source.textContent)();
  const api=window.__lundenLoading,real=document.getElementById('loading'),slow=real.querySelector('[data-startup-slow]');
  const config=await import('../src/config.js');
  check(api.stallMs===config.STARTUP.stallSeconds*1000&&config.STARTUP.stallSeconds<config.STARTUP.recoveryTimeout/1000,'inline stall time matches STARTUP.stallSeconds and stays below the hard limit');
  api.stallMs=600;api.step('Bygger huset',0.25);await wait(300);
  const beat=api.beat,shown=real.querySelector('[data-loading-elapsed]').textContent;
  const end=performance.now()+900;while(performance.now()<end){/* simulated hang inside a step */}
  check(api.beat===beat&&slow.hidden,'a blocking loop freezes the heartbeat and the notice cannot appear during it');
  await wait(700);
  check(!slow.hidden&&api.stalled?.name==='Bygger huset'&&api.beat>beat,'after the block releases the notice appears and the heartbeat resumes');
  check(slow.textContent.includes('Det här tar ovanligt lång tid')&&slow.querySelector('button').textContent==='Försök igen'&&!real.querySelector('[data-startup-retry]'),'stall notice offers Försök igen without the hard failure card');
  check(real.querySelector('[data-loading-step]').textContent==='Bygger huset'&&!real.hidden,'loading continues underneath the notice');
  check(sessionStorage.getItem(key)==='saved-place'&&localStorage.getItem(key)==='saved-home','stall notice preserves saved position and home');
  real.hidden=true;
  sessionStorage.removeItem(key);localStorage.removeItem(key);
  // Startup error view (#1132): cause classes, step text, failure record and the fixture's error line.
  const causes=[[new TypeError('Failed to fetch dynamically imported module: http://x/src/main.js'),'import'],[Error('Bootstrap module failed'),'import'],
    [TypeError('Importing a module script failed.'),'import'],[Error('Startup data: 503'),'network'],[Error('Startup data timeout'),'network'],
    [TypeError('Failed to fetch'),'network'],[Error('Error creating WebGL context.'),'webgl'],[TypeError("Cannot read properties of undefined (reading 'map')"),'scene']];
  check(causes.every(([e,c])=>startupCause(e)===c),'startup errors classify as import / network / webgl / scene');
  check(startupErrorText('Hämtar planritningen','network')==='Fel i steget ”Hämtar planritningen”: nätverket svarade inte.'&&startupErrorText('','scene')==='Fel vid starten: ett oväntat fel uppstod.','error text names the failed step');
  recordStartupFailure(Error('Error creating WebGL context.'),'Startar 3D-grafiken');
  const record=takeStartupFailure();
  check(record?.step==='Startar 3D-grafiken'&&record.cause==='webgl'&&takeStartupFailure()===null,'failure record keeps step and cause once');
  const card=document.getElementById('loading');card.classList.remove('done');card.hidden=false;
  globalThis.__lundenLoading={name:'Bygger huset'};
  const view=watchStartup({timeout:1e6,retry:()=>{}});view.fail(TypeError('boom'));
  const line=card.querySelector('[data-startup-error]');
  check(line?.textContent==='Fel i steget ”Bygger huset”: ett oväntat fel uppstod.'&&line.nextElementSibling===card.querySelector('[data-startup-retry]'),'fixture failure shows the step line above one retry');
  delete globalThis.__lundenLoading;sessionStorage.removeItem('lunden.startupFailure');
}catch(error){check(false,error.stack);}
document.getElementById('out').textContent=lines.join('\n')+'\n'+(lines.some(line=>line.startsWith('FAIL'))?'SOME FAILED':'ALL PASS');
</script></html>
