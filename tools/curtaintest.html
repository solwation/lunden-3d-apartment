<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Curtain test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Curtains test (#342, #362): Sovrum 1's two panels on one ceiling track (from the west wall) start open, parked one at
// each side: the west stack against its end stop by the west wall (#403: the RÅGRUND chair moved south out of its way),
// the east one at the track's end, both clear of the glass; E on one opens the strip (#blind-panel, sideways); no walking then; ◀ held
// draws both together symmetrically (the same share of their way) until they meet in the middle and no further, D / ▶
// parts them back to the parked spots; A moves the east leading edge at speed; the first draw scores; drawn shut they
// cut some of the room's daylight (less than the blackout blind) and glow teal by day; × / E close the strip; the state
// survives a reload.
//   /root/bin/runtest http://localhost:8168/tools/curtaintest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
try { localStorage.removeItem('lunden.blinds'); } catch { /* */ }
const lines = [];
let pass = true;
const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= !!ok; return ok; };
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
const URL0 = '../index.html?time=12&month=6&day=21&freeze&weather=clear';
f.src = URL0;
document.body.append(f);
const loaded = () => new Promise((r) => { f.onload = r; });

async function run() {
  await loaded();
  let w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { CURTAINS, BLINDS, LEVELS } = await import('../src/config.js');
  const THREE = await w.eval("import('three')");
  let app = w.__app;
  const { player, camera, step, blinds, blindPanel, day, stats } = app;
  const S = CURTAINS[0];
  const c = blinds.curtains[0];
  check(blinds.curtains.length === CURTAINS.length && c, `curtains built (${blinds.curtains.length})`);
  check(c.room === 'Sovrum 1', `in Sovrum 1 (${c.room})`);
  check(c.t === 0, 'open at the start');
  check(blinds.curtains.find((c) => c.spec.style === 'valance')?.t === 1, 'kitchen valance starts spread across the rail');
  const [g0, g1] = S.glass;
  const glassFree = () => c.freeGlass(c.west.b, c.east.a);
  const clear = () => c.east.a >= g1 - 1e-6 && c.west.b <= g0 + 1e-6;
  check(clear() && c.cover === 0 && glassFree() >= g1 - g0 - 1e-6, `parked one each side (west ${c.west.a.toFixed(2)}–${c.west.b.toFixed(2)}, east ${c.east.a.toFixed(2)}–${c.east.b.toFixed(2)}; glass ${g0}–${g1}, ${glassFree().toFixed(2)} m of it free)`);
  check(S.west <= 2.72 && c.spec.z > 0.5, `one track from the west wall (x ${S.west}) to ${S.east}`);
  // the west stack clear of the RÅGRUND chair (it stands south of the stack's strip, #403), the stop by the west wall
  const chair = app.world.furnitureTargets.find((t) => t.kind === 'rest' && t.name === 'stolen' && t.level === 1 && t.spots[0].pos.x < 3.3 && t.spots[0].pos.z < 1.2);
  const cb = new THREE.Box3().setFromObject(chair.object ?? chair.pickable ?? chair.mesh);
  const pw = c.west.mesh.geometry.attributes.position.array;
  let wx0 = Infinity, wz0 = Infinity, wz1 = -Infinity;
  for (let i = 0; i < pw.length; i += 3) { wx0 = Math.min(wx0, pw[i]); wz0 = Math.min(wz0, pw[i + 2]); wz1 = Math.max(wz1, pw[i + 2]); }
  check(wz1 <= cb.min.z - 0.005 && S.stop - S.west < 0.03, `the west stack parks by the west wall (stop x ${S.stop}), clear of the RÅGRUND chair (cloth z ${wz0.toFixed(3)}–${wz1.toFixed(3)}, chair z ${cb.min.z.toFixed(3)}–${cb.max.z.toFixed(3)})`);
  const fl = LEVELS[1].floor;
  const pos = c.west.mesh.geometry.attributes.position.array;
  let ymin = Infinity, ymax = -Infinity;
  for (let i = 1; i < pos.length; i += 3) { ymin = Math.min(ymin, pos[i]); ymax = Math.max(ymax, pos[i]); }
  check(ymin - fl > 0.005 && ymin - fl < 0.05 && ymax - fl < 2.4, `floor-length under the soffit (${(ymin - fl).toFixed(3)} … ${(ymax - fl).toFixed(3)} m)`);
  check(c.west.mesh.castShadow && c.east.mesh.castShadow, 'the fabric casts the sun\'s shadow');

  d.getElementById('start-touch').click();
  await wait(50);
  // stand in front of the parked stacks and look at them
  const up = fl;
  let px = 4.6, pz = 1.1;
  for (const [x, z] of [[4.6, 1.1], [4.4, 1.0], [4.8, 1.05], [4.3, 1.2], [4.6, 0.95]]) if (player.isFree(x, z, 1)) { px = x; pz = z; break; }
  const tx = (c.east.a + c.east.b) / 2, ty = fl + 1.4, tz = S.z;
  player.spawn(px, pz, 0); player.pos.y = up; player.eyeY = up + 1.62;
  const aim = () => {
    for (let i = 0; i < 3; i++) step(1 / 60);
    const e = camera.position;
    camera.rotation.order = 'YXZ';
    camera.rotation.y = Math.atan2(-(tx - e.x), -(tz - e.z));
    camera.rotation.x = Math.atan2(ty - e.y, Math.hypot(tx - e.x, tz - e.z));
    player.yaw = camera.rotation.y; player.pitch = camera.rotation.x;
    app.world.object.updateMatrixWorld(true);
    for (let i = 0; i < 3; i++) step(1 / 60);
  };
  aim();
  const btn = d.getElementById('action');
  check(!btn.hidden && /gardinerna/i.test(btn.textContent), `action button "${btn.textContent}" (at ${player.pos.x.toFixed(2)}, ${player.pos.z.toFixed(2)})`);
  const seen0 = stats.seen?.curtains ? Object.keys(stats.seen.curtains).length : 0;
  btn.click();
  const panel = d.getElementById('blind-panel');
  check(!panel.hidden && blinds.active === c && panel.classList.contains('curtain'), 'E opens the strip, sideways (#blind-panel.curtain)');
  check(panel.querySelector('[data-act=up]').dataset.hudIcon === 'left' && panel.querySelector('[data-act=down]').dataset.hudIcon === 'right', 'the buttons show horizontal curtain controls');
  const before = { x: player.pos.x, z: player.pos.z };
  app.touch.analog.y = 1;
  for (let i = 0; i < 30; i++) step(1 / 60);
  app.touch.analog.y = 0;
  check(Math.hypot(player.pos.x - before.x, player.pos.z - before.z) < 0.01, 'no walking in the curtain mode');
  const press = (act, type) => d.querySelector(`#blind-panel [data-act=${act}]`).dispatchEvent(new w.PointerEvent(type, { bubbles: true, pointerId: 1 }));
  press('up', 'pointerdown');
  for (let i = 0; i < 30; i++) step(1 / 30);
  const t1 = c.t, wb1 = c.west.b, ea1 = c.east.a;
  const secs = c.travel / S.speed;
  const share = (k, x) => (x - c.ends[k].open[k === 'west' ? 1 : 0]) / (c.ends[k].shut[k === 'west' ? 1 : 0] - c.ends[k].open[k === 'west' ? 1 : 0]);
  check(t1 > 0.05 && t1 < 1 && wb1 > c.ends.west.open[1] && ea1 < c.ends.east.open[0], `◀ draws both panels together (${(t1 * 100).toFixed(0)} % after 1 s: west edge ${wb1.toFixed(2)}, east edge ${ea1.toFixed(2)})`);
  check(Math.abs(share('west', wb1) - share('east', ea1)) < 1e-6 && wb1 < S.meet && ea1 > S.meet, `symmetric: both edges the same share of their way (${share('west', wb1).toFixed(3)} / ${share('east', ea1).toFixed(3)})`);
  for (let i = 0; i < Math.ceil(secs * 30) + 30; i++) step(1 / 30);
  check(c.t === 1 && Math.abs(c.west.b - S.meet) < 1e-6 && Math.abs(c.east.a - S.meet) < 1e-6, `shut, meeting in the middle and no further (${c.west.b.toFixed(3)} | ${c.east.a.toFixed(3)}, meet ${S.meet})`);
  check(Math.abs(S.meet - (g0 + g1) / 2) < 0.01 && c.cover === 1 && glassFree() === 0, `they meet at the window's middle, the glass covered (cover ${c.cover})`);
  check(c.west.a === S.stop, `shut, the west panel's end stays at its stop by the wall (x ${c.west.a.toFixed(3)})`);
  press('up', 'pointerup');
  check(blinds.dir === 0, '◀ released: they stop');
  check(/fördragna/.test(panel.querySelector('.pct').textContent), `the panel says "${panel.querySelector('.pct').textContent}"`);
  const seen1 = stats.seen?.curtains ? Object.keys(stats.seen.curtains).length : 0;
  check(seen1 === seen0 + 1 && stats.curtains >= 1, `the first draw scores (${seen1})`);
  // gathered vs spread: the fold spacing shrinks as a panel is pushed to its end
  // daylight: the room loses some, less than with the blackout blind
  for (let i = 0; i < 120; i++) step(1 / 30);
  const dimC = day.dim;
  check(dimC > c.daylightCut * 0.85 && dimC < BLINDS.dim.dark, `Sovrum 1 with the curtains drawn: daylight cut ${dimC.toFixed(2)} (blackout ${BLINDS.dim.dark})`);
  check(c.mat.emissive.g > 0.04 && c.mat.emissive.b > c.mat.emissive.r, `they glow teal by day (${c.mat.emissive.toArray().map((v) => v.toFixed(2)).join(', ')})`);
  // D opens them again, back to the parked spots
  blindPanel.key('KeyD', true);
  for (let i = 0; i < Math.ceil(secs * 30) + 30; i++) step(1 / 30);
  blindPanel.key('KeyD', false);
  check(c.t === 0 && clear() && c.west.b === c.ends.west.open[1] && c.east.a === c.ends.east.open[0], `D parts them back to the parked spots (west to ${c.west.b.toFixed(2)}, east from ${c.east.a.toFixed(2)})`);
  for (let i = 0; i < 120; i++) step(1 / 30);
  check(day.dim < 0.02, `open: no cut (${day.dim.toFixed(3)})`);
  blindPanel.key('KeyA', true);
  for (let i = 0; i < 30; i++) step(1 / 30);
  blindPanel.key('KeyA', false);
  const moved = c.t * c.travel;
  check(Math.abs(moved - S.speed) < 0.03, `A held 1 s: the edge moves ${(moved * 100).toFixed(0)} cm (speed ${S.speed} m/s)`);
  check(!blindPanel.key('KeyW', true), 'W does nothing for the curtains');
  d.getElementById('blind-close').click();
  check(panel.hidden && !blinds.active, '× leaves the mode');
  // a blind afterwards gets its own upright strip back
  const b = blinds.list.find((x) => x.room === 'Sovrum 1');
  app.showBlind(b);
  check(!panel.classList.contains('curtain') && panel.querySelector('[data-act=up]').dataset.hudIcon === 'up', 'the blind keeps its vertical control strip');
  app.showNote(false);
  check(panel.hidden, 'E leaves the mode');
  // remembered over a reload
  c.set(0.6); blinds.curtains.slice(1).forEach((c,i)=>c.set(.15+i*.1)); const remembered=blinds.curtains.map(c=>c.t); blinds.save();
  f.src = URL0 + '&r=1';
  await loaded();
  w = f.contentWindow; d = f.contentDocument;
  while (!w.__app) await wait(100);
  app = w.__app;
  const c2 = app.blinds.curtains[0];
  check(app.blinds.curtains.every((c,i)=>Math.abs(c.t-remembered[i])<.002), 'all six saved curtain/valance positions survive a real reload');
  check(Math.abs(c2.t - 0.6) < 0.002 && Math.abs(c2.east.a - (c2.ends.east.open[0] + (S.meet - c2.ends.east.open[0]) * 0.6)) < 1e-3, `the state survives a reload (${c2.t})`);

  // Verify all 6 rooms have curtains with proper configuration and themes (#459)
  check(app.blinds.curtains.length === 6, `total 6 curtains in all rooms (${app.blinds.curtains.length})`);
  const expectedRooms = ['Sovrum 1', 'Sovrum 2', 'Sovrum 3', 'Sovrum 4', 'Kök / matplats', 'Vardagsrum'];
  const roomsFound = app.blinds.curtains.map(curt => curt.room);
  for (const expected of expectedRooms) {
    const found = app.blinds.curtains.find(curt => curt.room === expected);
    check(!!found, `curtains found in ${expected}`);
  }
  for (const curt of app.blinds.curtains) {
    curt.set(1);
    check(curt.t === 1 && curt.panels.every((p, i, ps) => !i || Math.abs(ps[i - 1].b - p.a) < 1e-6), `${curt.room} closes cleanly at meet ${curt.spec.meet}`);
    curt.set(0);
    check(curt.t === 0, `${curt.room} opens cleanly`);
  }
  const wallFaces = [[2.7017, 5.5514], [2.7517, 5.5514], [0.202, 2.6067], [0.202, 2.6317], [2.1516, 5.5512], [0.2018, 5.5512]];
  app.blinds.curtains.forEach((c, i) => check(c.spec.rail.every((x, side) => Math.abs(x - wallFaces[i][side]) < 0.001), `${c.room}: rail reaches both room walls`));
  const kitchen = app.blinds.curtains.find((c) => c.room === 'Kök / matplats');
  check(kitchen.panels.length === 1 && kitchen.name === 'gardinkappan', 'kitchen has one continuous valance');
  const hem = kitchen.panels[0].y0, top = kitchen.panels[0].y1;
  check(hem >= 2.4 && top - hem < 0.6 && Math.abs(top - 2.96) < 0.001, 'short valance hangs from original ceiling rail; window below stays free');
  kitchen.set(1);
  check(kitchen.panels[0].a === kitchen.spec.stop && kitchen.panels[0].b === kitchen.spec.east && kitchen.spec.dim < 0.05, 'spread valance covers rail width with only a small daylight cut');
  check(kitchen.panels[0].a - kitchen.spec.rail[0] < 0.03 && kitchen.spec.rail[1] - kitchen.panels[0].b < 0.03, 'kitchen cloth reaches both side walls with end-stop clearance');
  kitchen.set(0.4); app.blinds.save();
  check(JSON.parse(w.localStorage.getItem('lunden.blinds'))[kitchen.id] === 0.4 && kitchen.id.endsWith('-valance'), 'valance position saves under its own key, independent of old long curtains');
  const living = app.blinds.curtains.find((c) => c.room === 'Vardagsrum');
  // #566: inspect actual texture pixels; a sparse kitchen print or a brown/cream
  // palette must not pass merely because the theme's config name changed.
  const print = living.tex.image, pixels = print.getContext('2d').getImageData(0, 0, print.width, print.height).data;
  let green = 0, white = 0;
  for (let i = 0; i < pixels.length; i += 4) {
    const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
    if (g > r * 1.3 && g > b * 1.15 && g < 110) green++;
    if (r > 230 && g > 230 && b > 230) white++;
  }
  const area = pixels.length / 4;
  check(green / area > .60 && green / area < .9 && white / area > .10,
    `living room: dense dark-green print on white (${(green / area * 100).toFixed(1)}% ink, ${(white / area * 100).toFixed(1)}% white)`);
  check(kitchen.spec.theme === 'linen_kitchen' && kitchen.spec.colors.ground === '#ede7dc', 'kitchen keeps its original light botanical fabric');
  const clothUVs = living.panels.map(p => Array.from(p.mesh.geometry.attributes.uv.array));
  check(living.panels.length === 3 && living.spec.west <= 0.21 && living.spec.east + 0.02 >= 5.55, 'living room: three panels on a wall-to-wall track');
  for (const t of [0, 0.5, 1]) {
    living.set(t);
    check(living.panels.every((p, i) => p.mesh.geometry.attributes.uv.array.every((v, j) => v === clothUVs[i][j])), `living room: print stays attached to fabric at ${t}`);
    check(living.panels.every((p) => p.a >= 0.20 && p.b <= 5.55 && p.a < p.b) && Math.abs(living.cover - t) < 0.2, `living room: valid fabric and daylight at ${t}`);
  }
  living.set(0);
  check(living.panels.every((p) => p.b <= 0.9517 || p.a >= 1.9616), 'parked cloth leaves patio doorway clear');
  check(living.panels.every((p) => p.b <= 2.88 || p.a >= 4.81), 'parked cloth leaves living-room window clear');
  check(living.panels.every((p) => {
    const a = p.mesh.geometry.attributes.position.array;
    return Array.from({ length: a.length / 3 }, (_, i) => a[i * 3 + 2]).every((z) => z > 12.06 && z < 12.2337);
  }), 'cloth folds stay between sofa back and window wall');
  const { CURTAIN_LIGHT } = await import('../src/config.js');
  for(const cloth of app.blinds.curtains) {
    const m=cloth.mat;
    check(!m.alphaHash && m.transparent && m.forceSinglePass && m.depthWrite && m.opacity===CURTAIN_LIGHT.opacity && m.opacity<1 && m.opacity>.9, `${cloth.room}: slight transparency in one depth-tested cloth pass`);
    check(m.roughness>.9 && m.map===m.emissiveMap && cloth.panels.every(p=>p.mesh.castShadow), `${cloth.room}: print, rough fabric and solid sun-blocking shadow retained`);
    cloth.glow(1,false);const glowDay=m.emissive.clone();cloth.glow(0,false);const glowDark=m.emissive.clone();cloth.glow(0,true);
    check((glowDay.r+glowDay.g+glowDay.b>0 && glowDark.r+glowDark.g+glowDark.b===0 && m.emissive.r+m.emissive.g+m.emissive.b>0), `${cloth.room}: daylight backlighting and warm room-lit glow, dark when unlit`);
    check(cloth.spec.style==='valance' ? cloth.daylightCut<.05 : Math.abs(1-cloth.daylightCut-CURTAIN_LIGHT.diffuseTransmission)<1e-6, `${cloth.room}: diffuse transmission controls room fill; valance leaves lower glass free`);
  }
  try { localStorage.removeItem('lunden.blinds'); } catch { /* */ }
}
run().catch((e) => check(false, `ERROR ${e.message}\n${e.stack}`)).finally(() => {
  out.textContent = `${lines.join('\n')}\n${pass ? 'ALL PASS' : 'SOME FAILED'}`;
});
</script>
</body>
</html>
