<!doctype html><html><meta charset="utf-8"><title>Independent secretary mirror (#476)</title><pre id="out">running…</pre><script type="module">

 A.camera.lookAt(at.clone().add(new T.Vector3(0,.25,.3)));R.update();const unturned=R.candidate?.clone();R.rotate();R.update();
 check(R.valid&&unturned&&!close(unturned,R.candidate),'mirror can be placed and rotated on a real wall');
 const moved=R.candidate.clone(),delta=moved.clone().multiply(original.clone().invert());check(await R.confirm(),'mirror move confirmed');A.scene.updateMatrixWorld(true);

 d=f.contentDocument;d.documentElement.requestFullscreen=undefined;d.getElementById('start-touch').click();R.unlock('olof is the goat');
