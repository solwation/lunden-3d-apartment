<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Life test (M2)</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
// The life simulator's second milestone, M2 (epic #364): reset the kitchen, one section per issue.
//  #382 a drinking glass from the glass cabinet: water at the running tap (to the brim, no more), milk from the carton (it
//       runs out; the empty carton goes in the bin and a full one is back next time the fridge is opened), sips lower the
//       level, the glass becomes used, water and milk are not mixed, poured out at the tap; the carton's amount is saved.
//   chromium --headless=new --dump-dom http://localhost:8137/tools/life2test.html
import { LIFE, MILK } from '../src/config.js';
const out = document.getElementById('out');
const lines = [];
let pass = true;
const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= !!ok; return ok; };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function load(q) {
  const f = document.createElement('iframe');
  f.width = 900; f.height = 600; f.src = `../index.html?${q}`;
  document.body.append(f);
  await new Promise((r) => { f.onload = r; });
  while (!f.contentWindow.__app) await wait(100);
  f.contentDocument.getElementById('start-touch').click();
  await wait(50);
  return f;
}
/** The test's tools for one page. */
function kit(f) {
  const A = f.contentWindow.__app, d = f.contentDocument, btn = d.getElementById('action');
  const { player, camera, step, scene } = A;
  const settle = (o) => { for (let i = 0; i < 40; i++) o.update(0.1); scene.updateMatrixWorld(true); };
  const open = (o) => { if (o && !o.isOpen) { o.toggle(); settle(o); } };
  const close = (o) => { if (o && o.isOpen) { o.toggle(); settle(o); } };
  const secs = (s) => { for (let i = 0; i < Math.ceil(s * 60); i++) step(1 / 60); };
  const ring = (p) => [...Array(16)].map((_, i) => [p.x + Math.sin(i / 16 * 6.283) * (0.75 + (i % 2) * 0.3), p.z + Math.cos(i / 16 * 6.283) * (0.75 + (i % 2) * 0.3)]);
  /** Aim the eye at world point p from a few stands until the action button / the menu matches `re`. */
  const aim = (p, re, stands = []) => {
    for (const [x, z] of [...stands, ...ring(p)]) {
      player.spawn(x, z, 0); for (let i = 0; i < 3; i++) step(1 / 60);
      const dx = p.x - camera.position.x, dz = p.z - camera.position.z;
      camera.rotation.y = Math.atan2(-dx, -dz); camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz)); step(1 / 60);
      const text = btn.hidden ? [...d.querySelectorAll('#choices button')].map((b) => b.textContent).join(' | ') : btn.textContent;
      if (re.test(text)) return text;
    }
    return null;
  };
  const life = A.life, I = life.items;
  /** Row `id` of a target's actions (an instance, or a raw target such as a tap). */
  const row = (id, target) => life.options(target?.id ? { item: life.view(target) } : target ?? { instance: I.held() }).find((o) => o.id === id);
  /** Run row `id` and let it finish: true, or the reason. */
  const run = (id, target, s = 0) => { const r = row(id, target); const ok = !!r && !r.reason && r.run(); secs(s + 0.1); return ok ? true : r?.reason ?? `no ${id}`; };
  const lid = (k) => A.world.lids.find(k);
  return { A, d, btn, settle, open, close, secs, aim, life, I, row, run, lid, step, V: camera.position.constructor };
}

// --- #382: water and milk in a drinking glass --------------------------------------------------------------------
try {
  const f = await load('life&shot');
  const K = kit(f), { A, life, I, row, run, open, close, secs, aim, lid, V, step } = K;
  const cab = lid((l) => l.stock === 'glasses'), tap = A.taps.find((t) => t.name === 'köksblandaren'), milk = A.milk;
  const glasses = I.ofType('glass');
  check(glasses.length === 3 && glasses.every((g) => g.place.at === 'slot' && g.place.store === 'glasses' && g.amount === 0 && g.clean === 'clean'), `three clean, empty glasses in the glass cabinet (${glasses.map((g) => `${g.place.store}:${g.place.slot}`).join(', ')})`);
  const g1 = glasses[0];
  check(row('take', g1)?.reason === 'Öppna glasskåpet först', `the cabinet shut: "${row('take', g1)?.reason}"`);
  open(cab);
  const gp = life.view(g1).where(); gp.y += 0.06;
  const t0 = aim(gp, /Ta dricksglaset/, [[4.4, gp.z], [4.3, gp.z - 0.2], [4.3, gp.z + 0.2]]);
  check(!!t0, `the open cabinet: "${t0}"`);
  life.view(g1).take(); step(1 / 60);
  check(I.held() === g1, 'the glass in the hand');
  // the tap off: only "turn on" (the fill row is quiet); on: the glass fills to the brim
  if (tap.isOpen) tap.toggle();
  const rows0 = tap.options();
  check(rows0.find((r) => r.id === 'fillWater')?.reason === 'Sätt på kranen först' && rows0.some((r) => r.id === 'on'), `the tap off: ${rows0.map((r) => r.id + (r.reason ? `(${r.reason})` : '')).join(', ')}`);
  tap.toggle();
  const tp = tap.pickable.getWorldPosition(new V());
  const t1 = aim(tp, /Fylla dricksglaset med vatten/, [[4.45, tp.z], [4.35, tp.z - 0.2], [4.35, tp.z + 0.2]]);
  check(!!t1, `at the running tap: "${t1}"`);
  const r1 = run('fillWater', tap, LIFE.drink.fill * 0.5);
  check(r1 === true && g1.amount === 0 && life.runner.busy, 'half-way: nothing committed yet');
  secs(LIFE.drink.fill);
  check(g1.amount === 250 && g1.machine.drink === 'water' && !life.runner.busy, `filled: ${g1.amount} ml water`);
  check(row('fillWater', tap)?.reason === 'Dricksglaset är fullt', `full: "${row('fillWater', tap)?.reason}"`);
  // a double press gives one fill, never over the brim
  I.setAmount(g1, 100);
  row('fillWater', tap).run(); row('fillWater', tap)?.run(); secs(LIFE.drink.fill + 0.2);
  check(g1.amount === 250, `two presses from 100 ml: ${g1.amount} ml`);
  // drinking: sips lower the level, the glass used, counted
  const w0 = A.stats.water ?? 0;
  check(life.view(g1).useLabel === 'Dricka', `the click with it in the hand: "${life.view(g1).useLabel}"`);
  life.view(g1).use(); secs(LIFE.drink.seconds + 0.2);
  check(g1.amount === 250 - LIFE.drink.sip && g1.clean === 'used' && (A.stats.water ?? 0) === w0 + 1, `a sip: ${g1.amount} ml left, ${g1.clean}, counted`);
  for (let k = 0; k < 10; k++) { life.view(g1).use(); secs(LIFE.drink.seconds + 0.2); }
  check(g1.amount === 0 && g1.machine.drink === null && run('drink') === 'Dricksglaset är tomt', `drunk up: ${g1.amount} ml, "${row('drink')?.reason}"`);
  // put down on the worktop; the milk (the scenario's, on the worktop) pours into it
  life.view(g1).placeAt(new V(5.25, 0.931, 2.4), 0); step(1 / 60);
  check(milk.ml === MILK.ml, `the carton full: ${milk.ml} ml`);
  milk.take(); step(1 / 60);
  check(row('pourIn', g1)?.label === 'hälla mjölk i dricksglaset', `milk in the hand at the glass: "${row('pourIn', g1)?.label}"`);
  const p1 = run('pourIn', g1, LIFE.drink.pour + 0.2);
  check(p1 === true && g1.amount === LIFE.drink.pourMl && g1.machine.drink === 'milk' && milk.ml === MILK.ml - LIFE.drink.pourMl, `poured: ${g1.amount} ml milk, ${milk.ml} ml left in the carton`);
  run('pourIn', g1, LIFE.drink.pour + 0.2);
  check(g1.amount === 250 && milk.ml === MILK.ml - 250, `up to the brim only: ${g1.amount} ml, the carton ${milk.ml} ml`);
  check(row('pourIn', g1)?.reason === 'Dricksglaset är fullt', `full: "${row('pourIn', g1)?.reason}"`);
  // water and milk are not mixed
  const g2 = I.ofType('glass').find((g) => g.place.at === 'slot');
  I.move(g2, { at: 'world', pos: [5.25, 0.931, 2.6], yaw: 0 }); I.set(g2, { machine: { drink: 'water' } }); I.setAmount(g2, 100); step(1 / 60);
  check(row('pourIn', g2)?.reason === 'Häll ut vattnet först', `milk on water: "${row('pourIn', g2)?.reason}"`);
  // the carton runs out: what is left goes in, then "Mjölken är slut"; the empty carton is a package
  I.set(g2, { machine: { drink: null } }); I.setAmount(g2, 0);
  milk.ml = 120;
  run('pourIn', g2, LIFE.drink.pour + 0.2);
  check(g2.amount === 120 && milk.ml === 0 && milk.drink === null && milk.wasteKind === 'package', `the last of it: ${g2.amount} ml in the glass, the carton ${milk.ml} ml (${milk.name})`);
  I.set(g2, { machine: { drink: null } }); I.setAmount(g2, 0);
  check(row('pourIn', g2)?.reason === 'Mjölken är slut', `empty: "${row('pourIn', g2)?.reason}"`);
  // the old glasses and cups get nothing from an empty carton
  const cup = A.cups.cups.find((c) => c.state === 'placed');
  check(cup && !cup.pourable, 'the old cup: nothing pours from the empty carton');
  // into the bin; the fridge opened again: a full carton on its shelf
  const bins = lid((l) => l.bin), bin = I.ofType('bin')[0];
  open(bins);
  const tr = row('throwAway', bin);
  check(tr?.label === 'slänga den tomma mjölkkartongen' && !tr.reason, `the empty carton at the bin: "${tr?.label}" ${tr?.reason ?? ''}`);
  tr.run(); step(1 / 60);
  check(!A.heldItem() && milk.away && !milk.model.visible && bin.amount === 2 && bin.parts.find((p) => p.type === 'package')?.amount === 1, `thrown: the bin ${bin.amount}/12, the carton gone`);
  check(milk.target.kind === 'none', 'no target while it is gone');
  close(bins);
  close(A.fridge); step(1 / 60); open(A.fridge); step(1 / 60);
  check(!milk.away && milk.model.visible && milk.ml === MILK.ml && !milk.held && !milk.placed, `the fridge opened again: a full carton at home (${milk.ml} ml)`);
  // what is left in a glass is poured out at the tap
  life.view(g1).take(); step(1 / 60);
  check(row('fillWater', tap)?.reason === 'Häll ut mjölken först', `milk in the glass at the tap: "${row('fillWater', tap)?.reason}"`);
  const po = run('pourOut', tap, 1);
  check(po === true && g1.amount === 0 && g1.machine.drink === null, `poured out at the tap: ${g1.amount} ml`);
  check(run('fillWater', tap, LIFE.drink.fill + 0.2) === true && g1.amount === 250 && g1.machine.drink === 'water', 'then filled with water');
  tap.toggle();
  // the carton's amount is kept with the life sim's things
  milk.ml = 333;
  const rec = life.serialize();
  check(rec.x?.milk?.ml === 333, `saved: x.milk ${JSON.stringify(rec.x?.milk)}`);
  milk.ml = MILK.ml;
  life.load(rec);
  check(milk.ml === 333 && I.ofType('glass').length === 3, `loaded: the carton ${milk.ml} ml, three glasses`);
  check(I.audit().length === 0, `audit: ${I.audit().join('; ') || 'ok'}`);
  f.remove();
} catch (e) { pass = false; lines.push(`FAIL #382 error ${e.stack}`); }

lines.push(pass ? 'ALL PASS' : 'SOME FAILED');
out.textContent = lines.join('\n');
</script>
</body>
</html>
