<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Milk test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// The milk in the fridge (#168): not reachable through the closed door; open the fridge, take the carton, pour
// into a glass (white, ~3/4), into an empty cup (milk) and into a cup of coffee (lighter brown), put it back in
// the fridge; on the worktop and F sends it home (still visible in the fridge).
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/milktest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, step, cups, things, milk, fridge, use, heldItem, scene, toggleFurniture } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  const V = camera.position.constructor;
  const steps = (s) => { for (let t = 0; t < s; t += 1 / 30) step(1 / 30); };
  const lookAt = (p, stands, re) => {
    for (const [x, z] of stands) {
      player.spawn(x, z, 0);
      for (let i = 0; i < 3; i++) step(1 / 60);
      scene.updateMatrixWorld(true);
      const dx = p.x - camera.position.x, dz = p.z - camera.position.z;
      camera.rotation.y = Math.atan2(-dx, -dz); camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz));
      step(1 / 60);
      if (!btn.hidden && re.test(btn.textContent)) return true;
    }
    return false;
  };
  let pass = check(!!milk && !!fridge, 'the milk and the fridge exist');
  const home = milk.home.pos.clone(), at = home.clone().setY(home.y + 0.1);
  const stands = [[home.x, home.z - 0.9], [home.x + 0.2, home.z - 1.0], [home.x - 0.2, home.z - 0.8], [home.x, home.z - 1.2]];
  pass &= check(!lookAt(at, stands, /mjölken/i), `the fridge closed: "${btn.textContent}"`);
  use(fridge); steps(1.5);
  pass &= check(fridge.isOpen && lookAt(at, stands, /^ta mjölken/i), `the fridge open: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === milk, 'the milk in the hand');
  pass &= check(lookAt(at, stands, /ställa tillbaka mjölken i kylskåpet/i), `its place: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(!milk.held && !milk.placed && milk.model.position.distanceTo(home) < 1e-4, 'back on the shelf');
  // a glass on the dining table, a cup of coffee and an empty cup on the worktop
  const glass = things.find((t) => t.name === 'whiskyglaset');
  use(glass.target); step(1 / 60); glass.placeAt(new V(3.5, 0.75, 1.6)); step(1 / 60);
  const [c1, c2] = cups.cups;
  use(cups.cabinet); steps(1);
  use(c1.target); step(1 / 60); c1.placeAt(c1.counter); c1.setFill(0.7);
  const c2At = c1.counter.clone().add(new V(0, 0, -0.15));
  use(c2.target); step(1 / 60); c2.placeAt(c2At);
  const coffee = c1.coffee.material.color.clone();
  use(milk.target); step(1 / 60);
  pass &= check(heldItem() === milk && glass.target.verb === 'hälla mjölk i' && c1.target.verb === 'hälla mjölk i', `the carton over a glass / cup: "${glass.target.verb}"`);
  use(glass.target); steps(0.5);
  pass &= check(milk.tilt > 0.5, `the carton tips (${milk.tilt.toFixed(2)})`);
  steps(1);
  const gc = glass.liquid.material.color;
  pass &= check(Math.abs(glass.fill - 0.75) < 1e-6 && glass.contents.main === 'milk' && gc.r > 0.85 && gc.g > 0.85 && gc.b > 0.8, `milk in the glass (${glass.fill.toFixed(2)}, #${gc.getHexString()})`);
  use(c2.target); steps(1.5);
  pass &= check(Math.abs(c2.fill - 0.8) < 1e-6 && c2.contents.main === 'milk', `an empty cup: milk (${c2.fill.toFixed(2)})`);
  use(c1.target); steps(1.5);
  const cc = c1.coffee.material.color;
  pass &= check(Math.abs(c1.fill - 0.85) < 1e-6 && c1.contents.has('coffee') && c1.contents.has('milk') && cc.r > coffee.r * 1.5 && cc.r < 0.8 && cc.r > cc.b * 1.5, `a splash in the coffee, light brown (${c1.fill.toFixed(2)}): #${coffee.getHexString()} → #${cc.getHexString()}`);
  use(c1.target); steps(1.5);
  pass &= check(Math.abs(c1.fill - 1) < 1e-6, `another splash, up to full (${c1.fill.toFixed(2)})`);
  pass &= check(c1.target.blocked && c1.target.blockedText === 'Koppen är full', `full: "${c1.target.blockedText}"`);
  // put it down on the worktop, drink the milk from the glass, F sends the carton home
  milk.placeAt(c1.counter.clone().add(new V(0, 0, 0.15))); step(1 / 60);
  pass &= check(milk.placed && !heldItem(), 'the carton on the worktop');
  use(glass.target); step(1 / 60);
  const m0 = w.__app.stats.milk;
  glass.use(); steps(0.7);
  pass &= check(w.__app.stats.milk === m0 + 1 && Math.abs(glass.fill - 0.6) < 1e-6, `a sip of milk (${glass.fill.toFixed(2)})`);
  toggleFurniture(false); step(1 / 60);
  let shown = true; for (let o = milk.model; o; o = o.parent) shown &&= o.visible;
  pass &= check(!milk.placed && milk.model.position.distanceTo(home) < 1e-4 && shown, 'F: the carton is back in the fridge, still there');
  toggleFurniture(true); step(1 / 60);
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
