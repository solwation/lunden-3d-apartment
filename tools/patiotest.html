<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Patio test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Patio seasons: parasol up on summer days and folded at night / in winter (unfolding over
// time), beers on the table on summer afternoons, a snowman in winter; the lounge sofa blocks
// walking.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/patiotest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
f.src = '../index.html?shot';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow;
  while (!w.__app) await wait(100);
  const { day, patio, step, player, world, camera, use } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  const at = (month, hour, secs = 4) => { day.month = month; day.hour = hour; day.paused = true; for (let i = 0; i < secs * 20; i++) step(0.05); return patio.state; };
  let pass = true, s;
  s = at(7, 15);
  pass &= check(s.parasols[0] === 1 && s.beers[0] && !s.snowman, `July 15:00: parasol up, beers, no snowman ${JSON.stringify(s)}`);
  s = at(7, 23.5);
  pass &= check(s.parasols[0] === 0 && !s.beers[0], `July 23:30: parasol folded, no beers ${JSON.stringify(s)}`);
  day.hour = 10; step(0.5);
  pass &= check(patio.state.parasols[0] > 0 && patio.state.parasols[0] < 1, `July 10:00: unfolding (${patio.state.parasols[0].toFixed(2)})`);
  s = at(1, 13);
  pass &= check(s.parasols[0] === 0 && !s.beers[0] && s.snowman, `January 13:00: folded, snowman ${JSON.stringify(s)}`);
  s = at(4, 9);
  pass &= check(s.parasols[0] === 1 && !s.beers[0] && !s.snowman, `April 09:00: parasol up, no beers ${JSON.stringify(s)}`);
  // walk north towards the lounge sofa's short part (#397: along the east screen wall): stopped before its end
  const walk = (x, z, yaw, secs, furniture = true) => {
    world.setFurniture(furniture);
    player.spawn(x, z, yaw);
    player.keys.add('KeyW');
    for (let i = 0; i < secs * 30; i++) player.update(1 / 30);
    player.keys.clear();
    world.setFurniture(true);
    return player.pos;
  };
  let p = walk(5.2, 15.6, 0, 4);
  pass &= check(p.z > 14.6 && p.z < 15.2, `the short part blocks walking north (stopped at z ${p.z.toFixed(2)})`);
  p = walk(5.2, 15.6, 0, 4, false);
  pass &= check(p.z < 13.5, `F off: walks on to the façade (z ${p.z.toFixed(2)})`);
  p = walk(3.0, 14.4, -Math.PI / 2, 4);
  pass &= check(p.x > 3.4 && p.x < 4.0, `the table blocks walking east (stopped at x ${p.x.toFixed(2)})`);
  p = walk(3.3, 15.6, 0, 4);
  pass &= check(p.z < 13.5, `west of the table you walk up to the long part and the window (z ${p.z.toFixed(2)})`);
  // the sofa (#397): the long part under the living-room window, the short part along the east screen wall,
  // the seats face south and west; the patio door's swing and the way to the gap in the hedge stay free
  const sofa = world.furnitureTargets.find((t) => t.name === 'loungesoffan');
  const facing = (yaw) => Math.abs(Math.cos(yaw)) > 0.99 ? (Math.cos(yaw) < 0 ? 'south' : 'north') : (Math.sin(yaw) > 0.99 ? 'west' : Math.sin(yaw) < -0.99 ? 'east' : yaw.toFixed(2));
  const faces = sofa.spots.map((sp) => facing(sp.yaw));
  pass &= check(sofa.spots.length === 5 && faces.filter((f) => f === 'south').length === 3 && faces.filter((f) => f === 'west').length === 2,
    `5 seats: 3 facing south, 2 facing west (${faces.join(', ')})`);
  pass &= check(sofa.spots.every((sp) => sp.pos.z < 14.7 && sp.pos.x > 3.6), `every seat in the NE corner (${sofa.spots.map((sp) => `${sp.pos.x.toFixed(2)},${sp.pos.z.toFixed(2)}`).join(' ')})`);
  const swing = [];
  for (let a = 0; a <= 90; a += 15) for (const r of [0.3, 0.6, 0.92]) swing.push([0.95 + r * Math.cos(a * Math.PI / 180), 12.72 + r * Math.sin(a * Math.PI / 180)]);
  const blockedSwing = swing.filter(([x, z]) => w.__app.world.levels[0].footprints.some((poly) => {
    const xs = poly.map((q) => q[0]), zs = poly.map((q) => q[1]);
    return x > Math.min(...xs) && x < Math.max(...xs) && z > Math.min(...zs) && z < Math.max(...zs);
  }));
  pass &= check(!blockedSwing.length, `nothing stands in the patio door's swing (${blockedSwing.length} points)`);
  const route = [];
  for (let k = 0; k <= 20; k++) route.push([1.4 - 0.75 * k / 20, 13.75 + 3.4 * k / 20]); // door → the gap in the hedge
  const stuck = route.filter(([x, z]) => !player.isFree(x, z, 0));
  pass &= check(!stuck.length, `the way from the patio door to the gap in the hedge is free (${stuck.map((q) => q.map((v) => v.toFixed(2))).join(' ')})`);
  // the LED string lights (#81): off at noon, on at 22, off again after dawn; June and December
  for (const [mon, hours] of [[6, [12, 23.5, 6]], [12, [12, 20, 10]]]) {
    const st = hours.map((h) => at(mon, h, 3).strings);
    pass &= check(st[0] === 0 && st[1] === 1 && st[2] === 0, `string lights month ${mon}: ${hours[0]}:00 off, ${hours[1]}:00 on, ${hours[2]}:00 off (${st.join(', ')})`);
  }
  // E on the parasol (#51): fold it by hand on a summer day, it stays folded while the automatic
  // state stays the same, and the automatic one takes over again after sunset
  // the parasol shades the sofa (#398): in July at 15–18 a ray from a seated eye towards the sun hits the canopy
  const par = patio.targets[0];
  {
    const THREE = await w.eval("import('three')");
    const ray = new THREE.Raycaster();
    ray.layers.enableAll();
    const sofa = world.furnitureTargets.find((t) => t.name === 'loungesoffan');
    const shade = {};
    for (const h of [15, 16, 17, 18]) {
      at(7, h, 2);
      par.pickable.updateMatrixWorld(true);
      const canopy = [];
      par.pickable.traverse((m) => { if (m.isMesh && m.geometry.type === 'ConeGeometry') canopy.push(m); });
      shade[h] = sofa.spots.filter((sp) => { ray.set(sp.pos, day.sunDir.clone().normalize()); return ray.intersectObjects(canopy, false).length > 0; }).length;
    }
    pass &= check(shade[15] >= 1 && shade[16] >= 3 && shade[17] >= 3 && shade[18] >= 3,
      `July: the canopy shades the seats (of ${sofa.spots.length}: ${Object.entries(shade).map(([h, n]) => `${h}:00 ${n}`).join(', ')})`);
    const pole = par.pickable.getWorldPosition(new THREE.Vector3());
    const doorSwing = Math.hypot(pole.x - 0.95, pole.z - 12.7) > 0.92 + 0.5;
    pass &= check(doorSwing && player.isFree(1.0, 15.0, 0), `the pole (${pole.x.toFixed(2)}, ${pole.z.toFixed(2)}) is clear of the patio door's swing`);
  }
  s = at(7, 14);
  const pp = par.pickable.getWorldPosition(new par.pickable.position.constructor());
  w.__app.touch.enabled = true;
  player.spawn(pp.x - 1.2, pp.z, -Math.PI / 2); // 1.2 m west of the pole, facing east (#398: the table is north of it)
  camera.rotation.x = Math.atan2(1.6 - player.eyeY, 1.2);
  for (let i = 0; i < 3; i++) step(1 / 60);
  const btn = w.document.getElementById('action');
  pass &= check(!btn.hidden && /fälla ihop parasollet/i.test(btn.textContent), `action button "${btn.textContent}"`);
  btn.click();
  s = at(7, 14.2, 2);
  pass &= check(s.parasols[0] === 0, `folded by hand on a July afternoon (${s.parasols[0]})`);
  s = at(7, 16, 2);
  pass &= check(s.parasols[0] === 0, `stays folded while it is still day (${s.parasols[0]})`);
  s = at(7, 23.5, 2);
  s = at(7, 10, 4);
  pass &= check(s.parasols[0] === 1, `after the night the automatic state is back: up next morning (${s.parasols[0]})`);
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
