<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Patio test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Patio seasons: parasol up on summer days and folded at night / in winter (unfolding over
// time), beers on the table on summer afternoons, a snowman in winter; the lounge sofa blocks
// walking.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/patiotest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
f.src = '../index.html?shot';
document.body.append(f);
f.onload = async () => {
  try {
  const w = f.contentWindow;
  while (!w.__app) await wait(100);
  const { day, patio, step, player, world, camera, use } = w.__app;
  const lines = [];
  const check = (ok, name) => { const s = `${ok ? 'PASS' : 'FAIL'} ${name}`; lines.push(s); out.textContent = lines.join('\n'); return ok; };
  const at = (month, hour, secs = 4) => { day.month = month; day.hour = hour; day.paused = true; for (let i = 0; i < secs * 20; i++) step(0.05); return patio.state; };
  let pass = true, s;
  s = at(7, 15);
  pass &= check(s.parasols[0] === 1 && s.beers[0] && !s.snowman, `July 15:00: parasol up, beers, no snowman ${JSON.stringify(s)}`);
  s = at(7, 23.5);
  pass &= check(s.parasols[0] === 0 && !s.beers[0], `July 23:30: parasol folded, no beers ${JSON.stringify(s)}`);
  day.hour = 10; step(0.5);
  pass &= check(patio.state.parasols[0] > 0 && patio.state.parasols[0] < 1, `July 10:00: unfolding (${patio.state.parasols[0].toFixed(2)})`);
  s = at(1, 13);
  pass &= check(s.parasols[0] === 0 && !s.beers[0] && s.snowman, `January 13:00: folded, snowman ${JSON.stringify(s)}`);
  s = at(4, 9);
  pass &= check(s.parasols[0] === 1 && !s.beers[0] && !s.snowman, `April 09:00: parasol up, no beers ${JSON.stringify(s)}`);
  // the cushions (#399): on the sofa in July, put away in January and while it rains; F hides them with the sofa
  {
    const { weather } = w.__app;
    weather.force = 'clear';
    const july = at(7, 15, 2).cushions, jan = at(1, 13, 2).cushions;
    weather.force = 'rain';
    const rain = at(7, 15, 2).cushions;
    weather.force = 'clear';
    at(7, 15, 2);
    const sofa = world.furnitureTargets.find((t) => t.name === 'loungesoffan');
    let cushion = null;
    sofa.pickable.traverse((m) => { if (m.isMesh && m.userData.cushion) cushion = m; });
    const shown = (m) => { for (let o = m; o; o = o.parent) if (!o.visible) return false; return true; };
    const before = shown(cushion);
    world.setFurniture(false);
    const hidden = !shown(cushion);
    world.setFurniture(true);
    weather.force = null;
    pass &= check(july.length === 1 && july[0] && !jan[0] && !rain[0] && before && hidden,
      `cushions: July ${july}, January ${jan}, rain ${rain}, shown ${before}, hidden with F ${hidden}`);
  }
  // the cushion box (#400): west of the patio door by the west screen wall; E opens / shuts its lid; in January the
  // cushions lie in it (drawn while the lid is open), in July only the blanket
  {
    const lid = world.furnitureTargets.find((t) => t.name === 'dynboxens lock');
    const bp = lid.object.parent.getWorldPosition(new camera.position.constructor());
    pass &= check(bp.x < 0.95 && bp.x > 0.07 && bp.z > 13.55 && bp.z < 16.0, `the cushion box stands west of the door, by the west screen wall (${bp.x.toFixed(2)}, ${bp.z.toFixed(2)})`);
    w.__app.weather.force = 'clear';
    at(1, 13, 1);
    const opened = (lid.toggle(), lid.isOpen);
    for (let i = 0; i < 40; i++) step(0.05);
    let stack = null;
    lid.contents.traverse((m) => { if (m.isMesh && m.material.vertexColors) stack = m; });
    const inJan = lid.contents.visible && stack?.visible;
    const pivot = lid.object.getWorldPosition(new camera.position.constructor());
    const top = new camera.position.constructor(0, 0.035, 0.6); // the lid's outer front edge, local to its pivot
    lid.object.localToWorld(top);
    const clearWall = top.x > 0.07;
    at(7, 13, 1);
    const inJul = stack.visible;
    lid.toggle();
    for (let i = 0; i < 40; i++) step(0.05);
    w.__app.weather.force = null;
    pass &= check(opened && inJan && !inJul && !lid.isOpen && !lid.contents.visible && clearWall,
      `the lid opens (${opened}), the cushions in the box in January (${inJan}), not in July (${!inJul}), shut again (${!lid.isOpen}), the open lid clear of the screen wall (x ${top.x.toFixed(3)}, pivot ${pivot.x.toFixed(3)})`);
  }
  // walk north towards the lounge sofa's short part (#397: along the east screen wall): stopped before its end
  const walk = (x, z, yaw, secs, furniture = true) => {
    world.setFurniture(furniture);
    player.spawn(x, z, yaw);
    player.keys.add('KeyW');
    for (let i = 0; i < secs * 30; i++) player.update(1 / 30);
    player.keys.clear();
    world.setFurniture(true);
    return player.pos;
  };
  // the Verona L (#408, #429, #489): the three-module row under the window (x 3.605–5.66), both divans end to end along the east screen wall as
  // one long bench (x 4.975–5.66, z 13.42–16.02), the small table in the L's corner
  let p = walk(3.6, 14.9, -Math.PI / 2, 4);
  pass &= check(p.x > 4.5 && p.x < 4.975, `the bench blocks walking east (stopped at x ${p.x.toFixed(2)})`);
  p = walk(3.6, 14.9, -Math.PI / 2, 4, false);
  pass &= check(p.x > 5.2, `F off: walks on to the screen wall (x ${p.x.toFixed(2)})`);
  p = walk(3.7, 14.5, 0, 4);
  pass &= check(p.z > 13.42 && p.z < 13.9, `walking north towards the row stops at the sofa (stopped at z ${p.z.toFixed(2)})`);
  p = walk(3.3, 15.6, 0, 4);
  pass &= check(p.z < 13.5, `where the removed module stood you walk freely past the sofa to the window (z ${p.z.toFixed(2)})`);
  p = walk(4.2, 15.2, 0, 4);
  pass &= check(p.z > 14.25 && p.z < 14.8, `the table blocks walking north (stopped at z ${p.z.toFixed(2)})`);
  p = walk(2.6, 15.6, 0, 4);
  pass &= check(p.z < 13.5, `west of the sofa you walk up to the window (z ${p.z.toFixed(2)})`);
  // the seats: the row's face south, the bench's west (towards the table); the patio door's swing and the way to the gap
  // in the hedge stay free
  const sofa = world.furnitureTargets.find((t) => t.name === 'loungesoffan');
  const facing = (yaw) => Math.abs(Math.cos(yaw)) > 0.99 ? (Math.cos(yaw) < 0 ? 'south' : 'north') : (Math.sin(yaw) > 0.99 ? 'west' : Math.sin(yaw) < -0.99 ? 'east' : yaw.toFixed(2));
  const faces = sofa.spots.map((sp) => facing(sp.yaw));
  pass &= check(sofa.spots.length === 6 && faces.slice(0, 3).every((f) => f === 'south') && faces.slice(3).every((f) => f === 'west'), `6 seats (3 in the row facing south, 3 on the bench facing west: ${faces.join(', ')})`);
  pass &= check(sofa.spots.every((sp) => sp.pos.z < 16.0 && sp.pos.x > 3.6 && sp.pos.x < 5.7) && sofa.spots.slice(3).every((sp) => sp.pos.x > 4.975 && sp.pos.z > 13.42), `every seat in the L (${sofa.spots.map((sp) => `${sp.pos.x.toFixed(2)},${sp.pos.z.toFixed(2)}`).join(' ')})`);
  // the door-end module was removed (#489): the living-room window's opening sash (x 2.79–3.53) has completely free clearance
  {
    const V = camera.position.constructor;
    let nearestSofaX = Infinity;
    sofa.pickable.updateMatrixWorld(true);
    sofa.pickable.traverse((m) => {
      const a = m.isMesh && m.visible && m.geometry.attributes.position;
      if (a) for (let k = 0; k < a.count; k++) { const q = m.localToWorld(new V().fromBufferAttribute(a, k)); if (q.z < 13.5) nearestSofaX = Math.min(nearestSofaX, q.x); }
    });
    pass &= check(nearestSofaX > 3.55, `shortened sofa leaves window sash (up to 3.53) free (nearest sofa at x ${nearestSofaX.toFixed(3)})`);
  }
  const swing = [];
  for (let a = 0; a <= 90; a += 15) for (const r of [0.3, 0.6, 0.92]) swing.push([0.95 + r * Math.cos(a * Math.PI / 180), 12.72 + r * Math.sin(a * Math.PI / 180)]);
  const blockedSwing = swing.filter(([x, z]) => w.__app.world.levels[0].footprints.some((poly) => {
    const xs = poly.map((q) => q[0]), zs = poly.map((q) => q[1]);
    return x > Math.min(...xs) && x < Math.max(...xs) && z > Math.min(...zs) && z < Math.max(...zs);
  }));
  pass &= check(!blockedSwing.length, `nothing stands in the patio door's swing (${blockedSwing.length} points)`);
  const route = [];
  for (let k = 0; k <= 20; k++) route.push([1.4 - 0.75 * k / 20, 13.75 + 3.4 * k / 20]); // door → the gap in the hedge
  const stuck = route.filter(([x, z]) => !player.isFree(x, z, 0));
  pass &= check(!stuck.length, `the way from the patio door to the gap in the hedge is free (${stuck.map((q) => q.map((v) => v.toFixed(2))).join(' ')})`);
  // the LED string lights (#81): off at noon, on at 22, off again after dawn; June and December
  for (const [mon, hours] of [[6, [12, 23.5, 6]], [12, [12, 20, 10]]]) {
    const st = hours.map((h) => at(mon, h, 3).strings);
    pass &= check(st[0] === 0 && st[1] === 1 && st[2] === 0, `string lights month ${mon}: ${hours[0]}:00 off, ${hours[1]}:00 on, ${hours[2]}:00 off (${st.join(', ')})`);
  }
  // E on the parasol (#51): fold it by hand on a summer day, it stays folded while the automatic
  // state stays the same, and the automatic one takes over again after sunset
  // the parasol shades the sofa (#398): in July at 15–18 a ray from a seated eye towards the sun hits the canopy
  const par = patio.targets[0];
  {
    const THREE = await w.eval("import('three')");
    const ray = new THREE.Raycaster();
    ray.layers.enableAll();
    const sofa = world.furnitureTargets.find((t) => t.name === 'loungesoffan');
    const shade = {};
    for (const h of [15, 16, 17, 18]) {
      at(7, h, 2);
      par.pickable.updateMatrixWorld(true);
      const canopy = [];
      par.pickable.traverse((m) => { if (m.isMesh && m.geometry.type === 'ConeGeometry') canopy.push(m); });
      shade[h] = sofa.spots.filter((sp) => { ray.set(sp.pos, day.sunDir.clone().normalize()); return ray.intersectObjects(canopy, false).length > 0; }).length;
    }
    pass &= check(shade[15] >= 1 && shade[16] >= 3 && shade[17] >= 3 && shade[18] >= 3,
      `July: the canopy shades the seats (of ${sofa.spots.length}: ${Object.entries(shade).map(([h, n]) => `${h}:00 ${n}`).join(', ')})`);
    const pole = par.pickable.getWorldPosition(new THREE.Vector3());
    const doorSwing = Math.hypot(pole.x - 0.95, pole.z - 12.7) > 0.92 + 0.5;
    pass &= check(doorSwing && player.isFree(1.0, 15.0, 0), `the pole (${pole.x.toFixed(2)}, ${pole.z.toFixed(2)}) is clear of the patio door's swing`);
  }
  s = at(7, 14);
  const pp = par.pickable.getWorldPosition(new par.pickable.position.constructor());
  w.__app.touch.enabled = true;
  player.spawn(pp.x - 1.2, pp.z, -Math.PI / 2); // 1.2 m west of the pole, facing east (#398: the table is north of it)
  camera.rotation.x = Math.atan2(1.6 - player.eyeY, 1.2);
  for (let i = 0; i < 3; i++) step(1 / 60);
  const btn = w.document.getElementById('action');
  pass &= check(!btn.hidden && /fälla ihop parasollet/i.test(btn.textContent), `action button "${btn.textContent}"`);
  btn.click();
  s = at(7, 14.2, 2);
  pass &= check(s.parasols[0] === 0, `folded by hand on a July afternoon (${s.parasols[0]})`);
  s = at(7, 16, 2);
  pass &= check(s.parasols[0] === 0, `stays folded while it is still day (${s.parasols[0]})`);
  s = at(7, 23.5, 2);
  s = at(7, 10, 4);
  pass &= check(s.parasols[0] === 1, `after the night the automatic state is back: up next morning (${s.parasols[0]})`);
  // #447: the shut cushion box lid is a put-down surface (a cup too); the lid does not open while something stands on it;
  // open, it is no surface; the seats on it (#445) still work
  try {
    const { cups, focus, scene, rest } = w.__app;
    const V = camera.position.constructor;
    const lid = world.furnitureTargets.find((t) => t.name === 'dynboxens lock');
    const lidTop = world.cupSurfaces.find((m) => m.userData.gate && lid.object.parent.getObjectById(m.id));
    if (lid.isOpen) { lid.toggle(); for (let i = 0; i < 40; i++) step(0.05); }
    scene.updateMatrixWorld(true);
    const mid = lidTop.getWorldPosition(new V()); mid.y = lidTop.userData.surface;
    const lookAt = (p) => {
      player.spawn(p.x + 0.8, p.z + 0.25, Math.PI / 2); for (let i = 0; i < 3; i++) step(1 / 60);
      camera.rotation.y = Math.atan2(-(p.x - camera.position.x), -(p.z - camera.position.z));
      camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(p.x - camera.position.x, p.z - camera.position.z));
      step(1 / 60); return btn.textContent;
    };
    const cup = cups.cups.find((c) => c.state === 'cabinet') ?? cups.cups[0];
    cup.take(); step(1 / 60);
    const label = lookAt(mid), pt = focus().focused?.point?.clone();
    pass &= check(/^ställ(a)? ner( koppen här)?$/i.test(label) && Math.abs(pt.y - mid.y) < 0.005, `the shut lid: "${label}" at y ${pt?.y.toFixed(3)} (${mid.y.toFixed(3)})`);
    btn.click(); step(1 / 60); scene.updateMatrixWorld(true);
    pass &= check(cup.state === 'placed' && Math.abs(cup.model.getWorldPosition(new V()).y - mid.y) < 0.01, 'the cup stands on the lid');
    if (new URLSearchParams(location.search).has('shot')) { lookAt(mid); out.textContent = 'SHOT'; return; }
    const blockedLabel = lookAt(mid.clone().add(new V(0, 0.01, -0.25))); // the lid beside the cup
    use(lid); for (let i = 0; i < 40; i++) step(0.05);
    pass &= check(!lid.isOpen && lid.blocked && /ta bort det som står på locket först/i.test(blockedLabel), `the lid does not open under the cup: "${blockedLabel}"`);
    const seat = world.furnitureTargets.find((t) => t.kind === 'rest' && t.name === 'dynboxen');
    pass &= check(seat && !seat.blocked, 'a cup on the lid: you can still sit on it');
    cup.take(); step(1 / 60); scene.updateMatrixWorld(true);
    use(lid); for (let i = 0; i < 40; i++) step(0.05);
    pass &= check(!lid.blocked && lid.isOpen, 'the cup taken: the lid opens');
    lookAt(mid);
    pass &= check(!(focus().focused?.kind === 'place' && Math.abs(focus().focused.point.y - mid.y) < 0.02), `open: no surface on top ("${btn.textContent}")`);
    use(lid); for (let i = 0; i < 40; i++) step(0.05);
    cup.putBack(); step(1 / 60);
  } catch (e) { pass = false; lines.push(`FAIL cushion box surface error ${e.stack}`); }
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
  } catch (err) {
    out.textContent = `FAIL error: ${err.message}\n${err.stack}\n${lines?.join('\n') || ''}`;
  }
};
</script>
</body>
</html>
