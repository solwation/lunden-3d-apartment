<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Secretary test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// The secretary "Bang" (#118): the flap opens with the action button (a desk), the drawers behind it can then be
// aimed at and opened, the big drawer too; the open desk blocks walking into it; closed, the flap hides the
// drawers. F hides it all.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/secretarytest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html?time=12&freeze';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, step, world, scene } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  const V = camera.position.constructor;
  const all = world.furnitureTargets.filter((t) => /sekretären|lådan/.test(t.name));
  const flap = all.find((t) => t.name === 'sekretären'), drawers = all.filter((t) => t !== flap);
  let pass = check(!!flap && drawers.length === 8, `the flap + ${drawers.length} drawers`);
  const aim = (obj, from = 1.0) => {
    scene.updateMatrixWorld(true);
    const box = new (w.__app.camera.position.constructor)();
    const p = obj.getWorldPosition(box);
    const front = obj.children.at(-1) ?? obj; // a drawer's front / knob
    player.spawn(p.x - from, p.z, Math.PI / 2); for (let i = 0; i < 3; i++) step(1 / 60);
    camera.rotation.y = Math.atan2(-(p.x - camera.position.x), -(p.z - camera.position.z));
    camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(p.x - camera.position.x, p.z - camera.position.z));
    step(1 / 60);
    return btn.textContent;
  };
  // the big drawer under the flap (the key is its handle) — before the desk is down over it
  const big = drawers.find((t) => t.name === 'lådan');
  const bigLabel = aim(big.object.children.at(-1), 0.9);
  btn.click(); for (let i = 0; i < 60; i++) step(1 / 60);
  const bigOpen = big.isOpen;
  btn.click(); for (let i = 0; i < 60; i++) step(1 / 60);
  pass &= check(/öppna lådan/i.test(bigLabel) && bigOpen && !big.isOpen, `the big drawer: "${bigLabel}" open=${bigOpen}`);
  // closed: aiming at an inner drawer gives the flap
  const inner = drawers.find((t) => t.name === 'den lilla lådan');
  const knobAt = (t) => t.object.children.find((m) => m.geometry?.type === 'SphereGeometry') ?? t.object;
  pass &= check(/öppna sekretären/i.test(aim(knobAt(inner))), `closed, the drawers behind the flap: "${btn.textContent}"`);
  btn.click(); for (let i = 0; i < 90; i++) step(1 / 60);
  pass &= check(flap.isOpen && Math.abs(flap.object.rotation.x - Math.PI / 2) < 0.01, `the flap is a desk (${flap.object.rotation.x.toFixed(2)})`);
  // every drawer opens and closes
  for (const t of drawers.filter((x) => x !== big)) {
    const label = aim(knobAt(t), 0.9);
    btn.click(); for (let i = 0; i < 60; i++) step(1 / 60);
    const z0 = t.object.position.z;
    const opened = t.isOpen;
    btn.click(); for (let i = 0; i < 60; i++) step(1 / 60);
    pass &= check(new RegExp(`öppna ${t.name}`, 'i').test(label) && opened && !t.isOpen, `${t.name}: "${label}" open=${opened} (out ${(z0 - t.object.position.z).toFixed(3)})`);
  }
  // the open desk blocks: walk east into it from 1.2 m away
  const fp = flap.object.getWorldPosition(new V());
  player.spawn(fp.x - 1.2, fp.z, -Math.PI / 2); camera.rotation.y = -Math.PI / 2;
  player.keys.add('KeyW'); for (let i = 0; i < 120; i++) step(1 / 30); player.keys.clear();
  pass &= check(player.pos.x < fp.x - 0.3 - 0.2, `the open desk stops you (x ${player.pos.x.toFixed(2)}, desk edge ${(fp.x - 0.3).toFixed(2)})`);
  // the little lamp is on
  aim(flap.object, 1.1); camera.rotation.x -= 0.05; step(1 / 60);
  btn.click(); for (let i = 0; i < 90; i++) step(1 / 60);
  pass &= check(!flap.isOpen && Math.abs(flap.object.rotation.x + 0.227) < 0.01, `closed again (${flap.object.rotation.x.toFixed(3)}: "${btn.textContent}")`);
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
