<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Secretary test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// The secretary "Bang" (#118): the flap opens with the action button (a desk), the drawers behind it can then be
// aimed at and opened, the big drawer too; the open desk blocks walking into it; closed, the flap hides the
// drawers. F hides it all.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/secretarytest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html?time=12&freeze';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, step, world, scene } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  const V = camera.position.constructor;
  const flap = world.furnitureTargets.find((t) => t.name === 'sekretären');
  const all = world.furnitureTargets.filter((t) => t.object?.parent === flap.object.parent); // the secretary's own (other furniture has drawers too)
  const drawers = all.filter((t) => t !== flap);
  let pass = check(!!flap && drawers.length === 8, `the flap + ${drawers.length} drawers`);
  const aim = (obj, from = 1.0) => {
    scene.updateMatrixWorld(true);
    const box = new (w.__app.camera.position.constructor)();
    const p = obj.getWorldPosition(box);
    const front = obj.children.at(-1) ?? obj; // a drawer's front / knob
    player.spawn(p.x - from, p.z, Math.PI / 2); for (let i = 0; i < 3; i++) step(1 / 60);
    camera.rotation.y = Math.atan2(-(p.x - camera.position.x), -(p.z - camera.position.z));
    camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(p.x - camera.position.x, p.z - camera.position.z));
    step(1 / 60);
    return btn.textContent;
  };
  // the big drawer under the flap (the key is its handle) — before the desk is down over it
  const big = drawers.find((t) => t.name === 'lådan');
  const bigLabel = aim(big.object.children.at(-1), 0.9);
  btn.click(); for (let i = 0; i < 60; i++) step(1 / 60);
  const bigOpen = big.isOpen;
  btn.click(); for (let i = 0; i < 60; i++) step(1 / 60);
  pass &= check(/öppna lådan/i.test(bigLabel) && bigOpen && !big.isOpen, `the big drawer: "${bigLabel}" open=${bigOpen}`);
  // closed: aiming at an inner drawer gives the flap
  const inner = drawers.find((t) => t.name === 'den lilla lådan');
  const knobAt = (t) => t.object.children.find((m) => m.geometry?.type === 'SphereGeometry') ?? t.object;
  pass &= check(/öppna sekretären/i.test(aim(knobAt(inner))), `closed, the drawers behind the flap: "${btn.textContent}"`);
  btn.click(); for (let i = 0; i < 90; i++) step(1 / 60);
  pass &= check(flap.isOpen && Math.abs(flap.object.rotation.x - Math.PI / 2) < 0.01, `the flap is a desk (${flap.object.rotation.x.toFixed(2)})`);
  // every drawer opens and closes
  for (const t of drawers.filter((x) => x !== big)) {
    const label = aim(knobAt(t), 0.9);
    btn.click(); for (let i = 0; i < 60; i++) step(1 / 60);
    const z0 = t.object.position.z;
    const opened = t.isOpen;
    btn.click(); for (let i = 0; i < 60; i++) step(1 / 60);
    pass &= check(new RegExp(`öppna ${t.name}`, 'i').test(label) && opened && !t.isOpen, `${t.name}: "${label}" open=${opened} (out ${(z0 - t.object.position.z).toFixed(3)})`);
  }
  // the open desk blocks: walk east into it from 1.2 m away
  const fp = flap.object.getWorldPosition(new V());
  player.spawn(fp.x - 1.2, fp.z, -Math.PI / 2); camera.rotation.y = -Math.PI / 2;
  player.keys.add('KeyW'); for (let i = 0; i < 120; i++) step(1 / 30); player.keys.clear();
  pass &= check(player.pos.x < fp.x - 0.3 - 0.2, `the open desk stops you (x ${player.pos.x.toFixed(2)}, desk edge ${(fp.x - 0.3).toFixed(2)})`);
  // the little lamp is on
  aim(flap.object, 1.1); camera.rotation.x -= 0.05; step(1 / 60);
  btn.click(); for (let i = 0; i < 90; i++) step(1 / 60);
  pass &= check(!flap.isOpen && Math.abs(flap.object.rotation.x + 0.227) < 0.01, `closed again (${flap.object.rotation.x.toFixed(3)}: "${btn.textContent}")`);
  // the things in the drawers (#182): their home rides with the drawer, put down elsewhere they stay
  const { things, use, heldItem, toggleFurniture } = w.__app;
  const steps = (s) => { for (let t = 0; t < s; t += 1 / 30) step(1 / 30); };
  const T = (n) => things.find((t) => t.name === n);
  const car = T('leksaksbilen'), crayons = T('kritorna'), owl = T('ugglan');
  const nT = things.filter((t) => t.kind === 'trinket' && !t.secret && !t.isRifle).length; // (the AK-47 in the NORDLI chest is a Trinket too, #196)
  pass &= check(car && crayons && owl && nT === 13, `${nT} trinkets (+ ${things.filter((t) => t.secret).length} secrets)`);
  toggleFurniture(false); toggleFurniture(true); step(1 / 60); // (aiming at knobs above may have taken a thing)
  for (const t of drawers) if (t.isOpen) t.toggle();
  steps(1);
  use(big); steps(1);
  const carLabel = aim(car.model, 0.9);
  pass &= check(/ta leksaksbilen/i.test(carLabel), `the big drawer open: "${carLabel}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === car, 'the car in the hand');
  const table = new V(3.6, 0.47, 10.4);
  car.placeAt(table); step(1 / 60);
  use(big); steps(1);
  const wp = (o) => o.getWorldPosition(new V());
  pass &= check(!big.isOpen && big.t === 0 && car.placed && wp(car.model).distanceTo(table) < 0.01, `drawer closed, the car still on the coffee table (${wp(car.model).toArray().map((v) => v.toFixed(2))})`);
  use(car.target); step(1 / 60);
  pass &= check(car.backTarget.blocked && car.backTarget.blockedText === 'Öppna lådan först', 'its place with the drawer closed: blocked');
  use(big); steps(1);
  use(car.backTarget); step(1 / 60);
  const openAt = wp(car.model);
  pass &= check(!car.held && !car.placed && car.model.parent?.parent === big.object, 'back in the drawer');
  use(big); steps(1);
  scene.updateMatrixWorld(true);
  pass &= check(openAt.distanceTo(wp(car.model)) > 0.15, `it rode in with the drawer (${openAt.distanceTo(wp(car.model)).toFixed(3)} m)`);
  // a small drawer behind the flap: the crayons to the dining table and back
  use(flap); steps(1.5); use(crayons.drawer); steps(1);
  use(crayons.target); step(1 / 60);
  crayons.placeAt(new V(3.5, 0.75, 1.6)); step(1 / 60);
  use(crayons.drawer); steps(1);
  pass &= check(crayons.placed && Math.abs(wp(crayons.model).y - 0.75) < 0.01, 'the crayons stay on the dining table when their drawer closes');
  // the owl from the top onto the floor; F sends everything home
  use(owl.target); step(1 / 60); owl.placeAt(new V(4.2, 0, 10.4)); step(1 / 60);
  use(car.target); step(1 / 60); // (the big drawer is closed, the car in the hand)
  toggleFurniture(false); step(1 / 60);
  pass &= check(!heldItem() && [car, crayons, owl].every((t) => !t.placed && !t.held && t.model.parent === t.homeParent), 'F: everything back home');
  toggleFurniture(true); step(1 / 60);
  // the secret drawer (#183): a new surprise each time it opens, never the same twice in a row (seeded)
  const { secret } = w.__app, sd = secret.drawer;
  let seed = 7; secret.rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  use(flap); steps(1.5);
  const shownAtHome = () => secret.items.filter((t) => !t.placed && !t.held && t.model.visible);
  const seen = [];
  let repeat = false, single = true;
  for (let i = 0; i < 10; i++) {
    use(sd); steps(0.6);
    const cur = secret.current;
    if (seen.at(-1) === cur.name) repeat = true;
    if (shownAtHome().length !== 1 || shownAtHome()[0] !== cur || !cur.model.parent || cur.model.parent.parent !== sd.object) single = false;
    seen.push(cur.name);
    use(sd); steps(0.6);
  }
  pass &= check(!repeat && single && new Set(seen).size >= 5 && w.__app.stats.secrets >= 10, `10 opens: ${seen.join(', ')}`);
  // take the surprise, put it on the coffee table, open again: a new one in the drawer, the old one stays
  use(sd); steps(0.6);
  const first = secret.current;
  use(first.target); step(1 / 60); first.placeAt(table); step(1 / 60);
  use(sd); steps(0.6); use(sd); steps(0.6);
  const second = secret.current;
  pass &= check(second !== first && first.placed && first.model.visible && wp(first.model).distanceTo(table) < 0.01 && second.model.visible && !second.placed, `${first.name} stays on the table, ${second.name} in the drawer`);
  // keep at most SECRET.keep lying around
  const outs = [first];
  for (let i = 0; i < 3; i++) { const t = secret.current; use(t.target); step(1 / 60); t.placeAt(new V(3.3 + i * 0.1, 0.47, 10.5)); outs.push(t); use(sd); steps(0.6); use(sd); steps(0.6); }
  pass &= check(!first.placed && !first.model.visible && outs.slice(1).every((t) => t.placed && t.model.visible), `only ${outs.filter((t) => t.placed).length} left out; the oldest (${first.name}) went home out of sight`);
  toggleFurniture(false); toggleFurniture(true); step(1 / 60);
  pass &= check(shownAtHome().length === 1 && secret.items.every((t) => !t.placed), 'F: all home, one in the drawer');
  use(sd); steps(0.6);
  use(flap); steps(1.5);
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
