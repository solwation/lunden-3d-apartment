<script type="module">

import { Items } from '../src/items.js';

const lines = []; let pass = true;

const json = JSON.stringify, own = (o, k) => Object.hasOwn(o, k);

  grilledBird: t.grilledBird, replenished: t.replenished, failed: t.failed,

  const items = new Items(ITEMS);

  check(saved.items.every(e => ['pkg', 'prep', 'clean', 'moisture'].every(k => !own(e, k))), 'type-default flags omitted from compact record');
  const changed = new Items(ITEMS);
  changed.create('butter', at(1), { amount: 185, pkg: 'open' });
  changed.create('cucumber', at(2), { amount: 280, prep: 'sliced' });
  changed.create('plate', at(3), { clean: 'used' });
  changed.create('laundryClothes', at(4), { clean: 'clean', moisture: 'wet', machine: { left: 12 } });
  const changeRecord = changed.serialize(), changedAgain = new Items(ITEMS); changedAgain.load(changeRecord);
  check(json(changed.all()) === json(changedAgain.all()), 'changed quantities/package/preparation/cleanliness/moisture/machine roundtrip');
  check(changeRecord.items[0].pkg === 'open' && changeRecord.items[1].prep === 'sliced'
    && changeRecord.items[2].clean === 'used' && changeRecord.items[3].moisture === 'wet', 'nondefault item flags retained explicitly');
  const legacyItems = { ...saved, items: items.all().map(i => ({ ...saved.items.find(e => e.id === i.id),
    pkg: i.pkg, prep: i.prep, clean: i.clean, moisture: i.moisture })) };
  const legacyAgain = new Items(ITEMS); legacyAgain.load(legacyItems);

  check(Object.keys(fresh.tasks).length === 0, 'untouched per-task defaults omitted without losing pool');
  const legacy = { v:2, elapsed:20, active:['makeSandwich','resetKitchen','snackClean'], shown:fresh.shown,

  const oldTasks = manager(); oldTasks.load(legacy);
  check(oldTasks.save().v===3 && oldTasks.tasks.find(t=>t.id==='makeSandwich').completedGoals.has('prep'), 'old v2 partial goals migrate into real daily format');
  check(oldTasks.tasks.find(t=>t.id==='snackClean').isDone && oldTasks.selected.length===3, 'old completed task stays completed with no replayed bonus or refill');
  const progress = manager();
  progress.tasks.find(t=>t.id==='makeSandwich').completedGoals.add('prep');
  const bird=progress.tasks.find(t=>t.id==='grillChicken');bird.shown=true;bird.failed=true;bird.placedBird='chicken#4';bird.grilledBird='chicken#4';
  progress.renewChicken=true;

  check(json(state(progress))===json(state(again)) && again.renewChicken, 'daily partial goals, discovery, pending retry and same bird identity roundtrip');
  const goalOnly=manager(),g=goalOnly.tasks.find(t=>t.id==='makeSandwich');g.goals.forEach(goal=>g.completedGoals.add(goal.id));
  const loadedGoal=manager();loadedGoal.load(goalOnly.save());

document.getElementById('out').textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
