<script type="module">
// Independent native data-module regression: controlled world places and a Life

import { ITEMS } from '../src/config.js';

const lines = []; let pass = true;

  const items = new Items(ITEMS);

  const saved = items.serialize(), restored = new Items(ITEMS);

  const changed = new Items(ITEMS);
  changed.create('butter', at(1), { amount: 185, pkg: 'open' });
  changed.create('cucumber', at(2), { amount: 280, prep: 'sliced' });
  changed.create('plate', at(3), { clean: 'used' });
  changed.create('laundryClothes', at(4), { clean: 'clean', moisture: 'wet', machine: { left: 12 } });
  const changeRecord = changed.serialize(), changedAgain = new Items(ITEMS); changedAgain.load(changeRecord);
  check(json(changed.all()) === json(changedAgain.all()), 'changed quantities/package/preparation/cleanliness/moisture/machine roundtrip');
  check(changeRecord.items[0].pkg === 'open' && changeRecord.items[1].prep === 'sliced'
    && changeRecord.items[2].clean === 'used' && changeRecord.items[3].moisture === 'wet', 'nondefault item flags retained explicitly');
  const legacyItems = { ...saved, items: items.all().map(i => ({ ...saved.items.find(e => e.id === i.id),
    pkg: i.pkg, prep: i.prep, clean: i.clean, moisture: i.moisture })) };
  const legacyAgain = new Items(ITEMS); legacyAgain.load(legacyItems);

  check(Object.keys(fresh.tasks).length === 0, 'untouched per-task defaults omitted without losing pool');
  const legacy = { ...fresh, tasks: Object.fromEntries(tasks.tasks.map(t => [t.id, {

    grilledBird: null, replenished: false, failed: false,

  const progress = manager(); progress.elapsed = 20;
  const sandwich = progress.tasks.find(t => t.id === 'makeSandwich'); sandwich.completedGoals.add('prep');
  const hall = progress.tasks.find(t => t.id === 'tidyHall'); hall.shown = true; hall.readyAt = 200;
  const bird = progress.tasks.find(t => t.id === 'grillChicken');
  bird.shown = true; bird.failed = bird.isDone = true; bird.readyAt = 200;
  bird.completions = 0; bird.placedBird = bird.grilledBird = 'chicken#4'; bird.replenished = true;
  const cycle = progress.save(), cycleAgain = manager(); cycleAgain.load(cycle);
  check(json(state(progress)) === json(state(cycleAgain)), 'partial goals/hidden discovery/chicken failure/cooldown/ids/replenishment roundtrip');
  check(cycle.tasks.grillChicken.completions === 0, 'completed task explicit zero count retained against load fallback');
  // A completed task may intentionally have deadline zero. Fill active slots so

  const zero = manager(), z = zero.tasks.find(t => t.id === 'grillChicken');
  z.shown = true; z.failed = z.isDone = true; z.readyAt = 0; z.completions = 0;
  const zeroRecord = zero.save(), zeroAgain = manager(); zeroAgain.load(zeroRecord);
  check(zeroRecord.tasks.grillChicken.readyAt === 0 && json(state(zero)) === json(state(zeroAgain)), 'completed task explicit zero deadline/count preserved');
  // load derives completion from goals even if a transient done flag is stale.

  check(goalRecord.tasks.grillChicken.completions === 0 && goalRecord.tasks.grillChicken.readyAt === 0
