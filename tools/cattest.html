<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Cat test</title>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
<pre id="out">running…</pre>
<script type="module">
// Headless test of the cat: for every interior door and wardrobe, open it from one side and
// check the cat lands on the other side (or inside the wardrobe); then close + reopen.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/cattest.html
import { buildWorld } from '../src/world.js';
import { CatSpawner } from '../src/cat.js';
import { stairHeight, stairUnderside } from '../src/stairs.js';
import { rugLift } from '../src/rugs.js';
import * as THREE from 'three';

const plan = await fetch('../data/plan.json').then((r) => r.json());
const world = buildWorld(plan);
const lines = [];
let pass = true;
// #414: the cat rests on what it is on — its lowest vertex (not a bounding box: the tilted body's box reaches lower) within
// 0.5 cm of its root, and on the floor the root is the floor + a rug under it
const verticalBounds = (cat) => {
  let lo = Infinity, hi = -Infinity; const v = new THREE.Vector3();
  cat.object.updateMatrixWorld(true);
  cat.object.traverse((o) => {
    if (!o.isMesh) return;
    for (let q = o; q !== cat.object; q = q.parent) if (!q.visible) return;
    const pos = o.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const y = v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld).y;
      lo = Math.min(lo, y); hi = Math.max(hi, y);
    }
  });
  return { lo, hi };
};
let rests = 0, restBad = [], onRug = 0, underStairCats = 0;
const rests_ = (cat, where) => {
  cat.update(0);
  const p = cat.object.position, floor = p.y < 1.6 ? 0 : 3.25, lift = cat.on ? 0 : rugLift(p.y < 1.6 ? 0 : 1, p.x, p.z);
  const { lo, hi } = verticalBounds(cat), underside = stairUnderside(p.x, p.z);
  if (p.y < 1.6 && underside !== null) {
    underStairCats++;
    if (hi > underside) restBad.push(`cat intersects stair underside at (${p.x}, ${p.z})`);
  }
  if (!cat.on && p.y > 1.6 && stairHeight(p.x, p.z) !== null) restBad.push('floor cat in upper stair hole');
  const dLow = lo - p.y, dRoot = cat.on || where.kind === 'wardrobe' ? 0 : p.y - floor - lift; // (in a wardrobe: on its raised floor)
  rests++; if (lift > 0) onRug++;
  if (Math.abs(dLow) > 0.005 || Math.abs(dRoot) > 0.002) restBad.push(`${where.name} (${cat.on ?? 'floor'}${lift ? `, rug ${(lift * 100).toFixed(1)} cm` : ''}): lowest ${(dLow * 100).toFixed(2)} cm, root ${(dRoot * 100).toFixed(2)} cm`);
};
for (const door of world.doors) {
  if (door.name === 'ytterdörren') continue;
  let seed = 12345;
  const cat = new CatSpawner(world, () => ((seed = (seed * 16807) % 2147483647) / 2147483647));
  cat.chance = { appear: 1, steal: 1, vanish: 1 }; // always appear, always vanish on reopen
  const { center, normal } = door.opening();
  const from = { x: center[0] + normal[0] * 0.8, z: center[1] + normal[1] * 0.8 };
  cat.onOpen(door, from);
  const p = cat.object.position;
  let ok = cat.visible;
  if (ok) rests_(cat, door);
  if (ok && door.kind !== 'wardrobe') {
    // must be on the far side of the doorway
    const side = (p.x - center[0]) * normal[0] + (p.z - center[1]) * normal[1];
    ok = side < -0.3;
  }
  cat.onClose(door);
  cat.onOpen(door, from); // vanish chance 1 → gone
  const vanished = !cat.visible;
  pass &&= ok && vanished;
  lines.push(`${ok && vanished ? 'PASS' : 'FAIL'} ${door.name} @ (${center.map((v) => v.toFixed(2)).join(', ')}) → cat (${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)}) vanished-on-reopen=${vanished}`);
}
// #200: with chance.furniture = 1 the cat goes up on a seat, bed or table in the room when there is one in view
const ups = [], placements = new Map();
// two seeds: the candidates are shuffled together, so one seed alone hangs on how many seats there are anywhere (#397)
for (const seed0 of [777, 4242])
for (const door of world.doors) {
  if (door.name === 'ytterdörren' || door.kind === 'wardrobe') continue;
  let seed = seed0;
  const cat = new CatSpawner(world, () => ((seed = (seed * 16807) % 2147483647) / 2147483647));
  cat.chance = { appear: 1, steal: 1, vanish: 1, furniture: 1 };
  const { center, normal } = door.opening();
  for (const sgn of [1, -1]) { // from both sides: the room beyond may be either way
  const from = { x: center[0] + sgn * normal[0] * 0.8, z: center[1] + sgn * normal[1] * 0.8 };
  const key = `${door.name}@${center.join(',')}:${sgn}`;
  placements.set(key, placements.get(key) ?? 0);
  cat.hide();
  cat.onOpen(door, from);
  const closetRegression = seed0 === 4242 && sgn === -1 && Math.abs(center[0] - 3.3514) < .001 && Math.abs(center[1] - 6.15435) < .001;
  if (closetRegression) {
    const p = cat.object.position, underside = stairUnderside(p.x, p.z);
    const ok = cat.visible && Math.abs(p.y) < .001 && underside !== null && verticalBounds(cat).hi <= underside;
    pass &&= ok;
    lines.push(`${ok ? 'PASS' : 'FAIL'} closet seed 4242 places a floor cat below the high stair soffit (${p.x.toFixed(2)}, ${p.z.toFixed(2)})`);
  }
  // appear=1 requests a placement; the bounded random search may still find no safe spot.
  // Require coverage across seeds below, while checking every successful placement.
  if (!cat.visible) { lines.push(`INFO no safe sampled spot behind ${key}, seed ${seed0}`); continue; }
  placements.set(key, placements.get(key) + 1);
  rests_(cat, door);
  const p = cat.object.position, floor = p.y < 1.6 ? 0 : 3.25;
  const side = sgn * ((p.x - center[0]) * normal[0] + (p.z - center[1]) * normal[1]);
  const farSide = side < -0.3;
  pass &&= farSide;
  if (!farSide) lines.push(`FAIL cat on wrong side of ${key}, seed ${seed0}`);
  if (cat.on) {
    const ok = side < -0.2 && p.y > floor + 0.3 && p.y < floor + 1.5; // (a top bunk is ~1.3 m up)
    pass &&= ok;
    ups.push(cat.on);
    lines.push(`${ok ? 'PASS' : 'FAIL'} up on the furniture behind ${door.name}: ${cat.on} at (${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)})`);
  }
  }
}
const missed = [...placements].filter(([,count]) => count === 0).map(([key]) => key);
pass &&= !missed.length;
lines.push(`${missed.length ? 'FAIL' : 'PASS'} both seeds together cover every door side (${placements.size} sides)${missed.length ? ': ' + missed.join('; ') : ''}`);
const okUps = ups.length >= 4 && ups.includes('lie') && ups.includes('sit');
pass &&= okUps;
lines.push(`${okUps ? 'PASS' : 'FAIL'} cats up on furniture behind ${ups.length} doors (${[...new Set(ups)].join(', ')})`);
pass &&= underStairCats > 0;
lines.push(`${underStairCats ? 'PASS' : 'FAIL'} cats appear below the high stair soffit (${underStairCats}), including closet seed 4242`);
pass &&= !restBad.length;
lines.push(`${restBad.length ? 'FAIL' : 'PASS'} the cat rests on its floor / rug / furniture, not in it (#414): ${rests} cats, ${onRug} on a rug${restBad.length ? '\n  ' + restBad.join('\n  ') : ''}`);
document.getElementById('out').textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
</script>
</body>
</html>
