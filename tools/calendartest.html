<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Calendar test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// The cat calendar (#95): a visit starts on today's date; aim at the calendar in the kitchen, "Titta på
// almanackan" opens its strip; ▶ pages to the next month (same day), a day button picks a date, ↑ ↓ step a
// day, the date sets the sun (noon in June higher than in December), the time of day stays; E closes.
// Without ?time the clock starts at the browser's time.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/calendartest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, step, day, calendar, calPanel, scene } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  const now = new Date();
  let pass = check(day.date === now.getDate() && day.month === now.getMonth() + 1 && Math.abs(day.hour - (now.getHours() + now.getMinutes() / 60)) < 0.2, `starts at the browser's time and date (${day.clock}, ${day.date}/${day.month})`);
  day.paused = true;
  d.getElementById('start-touch').click();
  await wait(50);
  scene.updateMatrixWorld(true);
  const btn = d.getElementById('action');
  const p = calendar.object.getWorldPosition(new camera.position.constructor());
  player.spawn(p.x + 1.0, p.z, Math.PI / 2);
  for (let i = 0; i < 3; i++) step(1 / 60);
  camera.rotation.y = Math.PI / 2;
  camera.rotation.x = Math.atan2(p.y - camera.position.y, 1.0);
  step(1 / 60);
  pass &= check(!btn.hidden && /titta på almanackan/i.test(btn.textContent), `button "${btn.textContent}"`);
  btn.click();
  pass &= check(calPanel.open, 'the strip is open');
  // pick 21 June: page to June, click the 21st
  const hour = day.hour;
  while (day.month !== 6) d.querySelector('#cal-panel [data-act=next]').click();
  [...d.querySelectorAll('#cal-panel .days button')].find((b) => b.textContent === '21').click();
  step(0);
  const june = day.sunDir.y;
  pass &= check(day.month === 6 && day.date === 21 && Math.abs(day.hour - hour) < 1e-6, `21 June chosen, the time unchanged (${day.clock})`);
  // ↑ steps a day; to 21 December via ▶ ×6 and the 21st
  calPanel.key('ArrowUp', true);
  pass &= check(day.month === 6 && day.date === 22, `↑ = the next day (${day.date}/${day.month})`);
  // WASD (#120): W/S a day, A/D a month; held keys repeat
  calPanel.key('KeyW', true); calPanel.key('KeyW', true);
  pass &= check(day.date === 24, `W W = two days on (${day.date}/${day.month})`);
  calPanel.key('KeyS', true);
  pass &= check(day.date === 23, `S = a day back (${day.date}/${day.month})`);
  const m0 = calendar.view.month;
  calPanel.key('KeyD', true);
  pass &= check(calendar.view.month === m0 + 1, `D = next month page (${calendar.view.month})`);
  calPanel.key('KeyA', true);
  pass &= check(calendar.view.month === m0, `A = previous month page (${calendar.view.month})`);
  [...d.querySelectorAll('#cal-panel .days button')].find((b) => b.textContent === '22').click();
  for (let i = 0; i < 6; i++) d.querySelector('#cal-panel [data-act=next]').click();
  [...d.querySelectorAll('#cal-panel .days button')].find((b) => b.textContent === '21').click();
  day.hour = 12.5; step(0);
  const dec = day.sunDir.y;
  day.month = 6; day.date = 21; step(0);
  const juneNoon = day.sunDir.y;
  pass &= check(juneNoon > dec + 0.5, `the sun follows the date: noon ${Math.round(Math.asin(juneNoon) * 57.3)}° in June, ${Math.round(Math.asin(dec) * 57.3)}° in December`);
  // the calendar page shows the chosen month and redraws on change
  day.month = 3; day.date = 3; calendar.update();
  pass &= check(calendar.shown.endsWith('-3-3'), `the page follows the date (${calendar.shown})`);
  // the day rolls over at midnight while the clock runs
  day.paused = false; day.hour = 23.999; day.month = 1; day.date = 31; for (let i = 0; i < 10; i++) step(0.1);
  pass &= check(day.month === 2 && day.date === 1, `midnight on 31 January → 1 February (${day.date}/${day.month})`);
  d.getElementById('cal-close').click();
  pass &= check(!calPanel.open, 'closed');
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
