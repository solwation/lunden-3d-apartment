<!doctype html>
<html><head><meta charset="utf-8"><title>Ghost props</title><link rel="icon" href="data:,">
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
</script>
<style>html,body{margin:0;background:#bfc6cc}canvas{display:block}</style></head>
<body><script type="module">
// #1126 component page: other players (Ghost) holding each weapon (COMBAT.weapons) with the prop seen by the others,
// front and side views and a close-up per weapon. Driven by tools/ghostpropstest.cjs.
import * as THREE from 'three';
import { Ghost } from '../src/ghosts.js';
const KEYS = ['rifle', 'nerf', 'saber', 'wand', 'bow', 'ball'];
const W = 1500, Hh = 520, renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, Hh); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xbfc6cc);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f72, 1.6));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2); sun.position.set(2, 4, 3); scene.add(sun);
const ghosts = KEYS.map((k, i) => {
  const g = new Ghost(scene, i + 1, 'Spelare ' + (i + 1));
  if (g.tag) g.tag.visible = false;
  g.root.position.set((i - (KEYS.length - 1) / 2) * 1.0, 0, 0);
  scene.add(g.root); g.root.visible = true;
  g.setHeld(k);
  return g;
});
const cam = new THREE.PerspectiveCamera(22, W / Hh, 0.05, 50);
// view: front (they face the camera), side (turned 90° right), close: one ghost's hand
window.__shot = (view = 'front', i = null) => {
  let t = 1000;
  for (const g of ghosts) { g.root.rotation.y = view === 'side' ? Math.PI / 2 : Math.PI; g.have = false; for (let k = 0; k < 30; k++) g.animate(t += 33, 1, 0, 0); }
  const x = i === null ? 0 : ghosts[i].root.position.x;
  cam.fov = i === null ? 22 : 7; cam.updateProjectionMatrix();
  cam.position.set(x + (i === null ? 0 : -0.6), i === null ? 1.3 : 1.25, i === null ? 5.4 : 4.6); cam.lookAt(x - (i === null ? 0 : 0.15), i === null ? 0.95 : 1.1, 0);
  renderer.info.reset(); renderer.render(scene, cam);
  return { calls: renderer.info.render.calls, props: ghosts.map((g) => g.prop?.name ?? null), propTris: ghosts.map((g) => g.prop ? (g.prop.geometry.index ?? g.prop.geometry.attributes.position).count / 3 : 0), tris: renderer.info.render.triangles };
};
window.__ready = true;
</script></body></html>
