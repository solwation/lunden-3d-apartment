<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Coffee cup test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Coffee cups (#90): before brewing a cup in the opened cabinet says "koka kaffe först"; brew; take a cup
// out (it stands on the worktop), pour (the cup fills, the jug drops), take it, put it down on the dining
// table and, picked up again, on the coffee table.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/cuptest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, step, cups, world, heldItem, scene } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  const V = camera.position.constructor;
  const lookAt = (p, stands, re) => {
    for (const [x, z] of stands) {
      player.spawn(x, z, 0);
      for (let i = 0; i < 3; i++) step(1 / 60);
      scene.updateMatrixWorld(true);
      const dx = p.x - camera.position.x, dz = p.z - camera.position.z;
      camera.rotation.y = Math.atan2(-dx, -dz); camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz));
      step(1 / 60);
      if (!btn.hidden && re.test(btn.textContent)) return true;
    }
    return false;
  };
  const kitchen = [[4.4, 1.7], [4.3, 1.4], [4.5, 2.0], [4.2, 1.2]];
  const cab = cups.cabinet, cup = cups.cups[1], mocca = world.lids.find((l) => l.kind === 'coffee');
  let pass = check(lookAt(cab.door.children[0].getWorldPosition(new V()), kitchen, /öppna skåpet/i), `cabinet: "${btn.textContent}"`);
  // the door keeps its hinge by the tall oven unit (z0) and opens left, but no part of it ever goes north
  // of z0, into the tall unit (#116): every vertex of the door, all through the swing
  let minZ = Infinity, maxAng = 0;
  btn.click();
  for (let i = 0; i < 60; i++) {
    step(1 / 60); cab.door.updateMatrixWorld(true);
    maxAng = Math.max(maxAng, -cab.door.rotation.y * 180 / Math.PI);
    cab.door.traverse((m) => {
      const a = m.geometry?.attributes.position;
      if (a) for (let k = 0; k < a.count; k++) minZ = Math.min(minZ, m.localToWorld(new V().fromBufferAttribute(a, k)).z);
    });
  }
  const hinge = cab.door.getWorldPosition(new V());
  pass &= check(cab.isOpen, 'cabinet open');
  pass &= check(Math.abs(hinge.z - cab.z0) < 0.01 && maxAng > 80, `hinged at the tall unit (z ${hinge.z.toFixed(2)}), opens ${maxAng.toFixed(0)}°`);
  pass &= check(minZ > cab.z0 - 0.002, `door never enters the tall unit (min z ${minZ.toFixed(3)} vs ${cab.z0.toFixed(3)})`);
  const cupAt = () => cup.model.getWorldPosition(new V()).add(new V(0, 0.05, 0));
  // #141: a cup comes out empty, brewed or not, and goes down on the worktop by hand
  pass &= check(lookAt(cupAt(), kitchen, /^ta koppen/i), `an empty cup, nothing brewed: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === cup && cup.fill === 0, 'the empty cup in the hand');
  const counter = cup.counter.clone();
  pass &= check(lookAt(counter, kitchen, /ställa ner koppen/i), `the worktop: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(cup.state === 'placed' && Math.abs(cup.model.position.y - counter.y) < 0.02, `on the worktop (y ${cup.model.position.y.toFixed(3)})`);
  mocca.toggle(); for (let i = 0; i < 20 * 30; i++) mocca.update(1 / 30);
  pass &= check(mocca.done > 0 && mocca.fill === 1, 'brewed');
  // the jug: take it, pour, put it back on the hot plate
  const jug = cups.jug, jugAt = () => jug.where().add(new V(0, 0.08, 0));
  pass &= check(lookAt(jugAt(), kitchen, /ta kannan/i), `the jug: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === jug && !jug.atHome, 'the jug in the hand');
  pass &= check(lookAt(cupAt(), kitchen, /hälla kaffe i koppen/i), `pour: "${btn.textContent}"`);
  btn.click(); for (let i = 0; i < 120; i++) step(1 / 60);
  pass &= check(cup.fill === 1 && Math.abs(mocca.fill - 0.75) < 0.01, `a full cup, the jug at ${mocca.fill.toFixed(2)}`);
  pass &= check(lookAt(jug.holder.children[0].getWorldPosition(new V()), kitchen, /ställa tillbaka kannan/i), `the hot plate: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(jug.atHome && !heldItem(), 'the jug back on the plate');
  pass &= check(lookAt(cupAt(), kitchen, /^ta koppen/i), `take: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === cup && cup.model.parent === camera, 'cup in the hand');
  // put it down on the dining table, then on the coffee table
  const table = { x: 3.5, y: 0.75, z: 1.6 }, coffee = { x: 3.64, y: 0.47, z: 10.56 };
  pass &= check(lookAt(table, [[2.6, 2.2], [2.5, 1.6], [3.5, 2.6]], /ställa ner koppen/i), `dining table: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(cup.state === 'placed' && Math.abs(cup.model.position.y - 0.754) < 0.02, `on the dining table (y ${cup.model.position.y.toFixed(3)})`);
  pass &= check(lookAt(cupAt(), [[2.6, 2.2], [2.5, 1.6], [3.5, 2.6]], /ta koppen/i), `pick it up again: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(lookAt(coffee, [[3.6, 9.4], [3.0, 9.6], [4.4, 9.5]], /ställa ner koppen/i), `coffee table: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(cup.state === 'placed' && Math.abs(cup.model.position.y - 0.47) < 0.02, `on the coffee table (y ${cup.model.position.y.toFixed(3)})`);
  // another cup out and back into the cabinet with E on the open cabinet
  const cup2 = cups.cups[0], cup2At = () => cup2.model.getWorldPosition(new V()).add(new V(0, 0.05, 0));
  pass &= check(lookAt(cup2At(), kitchen, /^ta koppen/i), `the second cup: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(lookAt(cab.door.children[0].getWorldPosition(new V()), kitchen, /ställa tillbaka koppen i skåpet/i), `the open cabinet: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(cup2.state === 'cabinet' && !heldItem() && cup2.model.position.distanceTo(cup2.home) < 0.001, 'back on its shelf');
  // whisky in the coffee (#169): a cup of coffee on the worktop, a sip, a splash of whisky, drink it up
  const { use, things, stats } = w.__app, steps = (s) => { for (let t = 0; t < s; t += 1 / 30) step(1 / 30); };
  const spot = cup2.counter.clone().add(new V(0, 0, -0.15)), whisky = things.find((t) => t.kind === 'whisky');
  use(cup2.target); step(1 / 60); cup2.placeAt(spot);
  use(jug.target); step(1 / 60); use(cup2.target); steps(1.5); use(jug.backTarget); step(1 / 60);
  use(cup2.target); step(1 / 60); cup2.use(); steps(0.7); cup2.placeAt(spot);
  pass &= check(Math.abs(cup2.fill - 0.8) < 1e-6 && cup2.contents.main === 'coffee', `coffee, a sip taken (${cup2.fill.toFixed(2)})`);
  const before = cup2.coffee.material.color.clone();
  use(whisky.target); step(1 / 60);
  pass &= check(heldItem() === whisky && cup2.target.verb === 'hälla whisky i' && !cup2.target.blocked, `the whisky bottle over the cup: "${cup2.target.verb}"`);
  use(cup2.target); steps(1.5);
  const after = cup2.coffee.material.color, warm = (c) => (c.r - c.b) / (c.r + c.g + c.b);
  pass &= check(Math.abs(cup2.fill - 0.92) < 1e-6 && cup2.contents.has('whisky') && cup2.kask && cup2.target.name === 'koppen med kaffekask', `a splash of whisky: ${cup2.fill.toFixed(2)}, "${cup2.target.name}"`);
  pass &= check(warm(after) > warm(before), `a warmer colour: #${before.getHexString()} → #${after.getHexString()}`);
  use(cup2.target); steps(1.5);
  pass &= check(Math.abs(cup2.fill - 1) < 1e-6 && cup2.target.blocked && cup2.target.blockedText === 'Koppen är full', `never over full (${cup2.fill.toFixed(2)}): "${cup2.target.blockedText}"`);
  use(whisky.backTarget); step(1 / 60);
  use(cup2.target); step(1 / 60);
  const k0 = stats.kask;
  let sips = 0;
  while (cup2.fill > 0.01 && sips < 10) { cup2.use(); sips++; steps(0.7); }
  pass &= check(cup2.fill === 0 && stats.kask === k0 + sips && sips === 5, `drunk up in ${sips} sips, ${stats.kask - k0} counted as kaffekask`);
  // steam (#216): a fresh cup steams, it cools off over CUP_STEAM.seconds, an empty one never, milk cools it
  if (heldItem()) heldItem().putBack?.();
  const c3 = cups.cups[2];
  if (c3.state === 'cabinet' || c3.held) { c3.take?.(); c3.placeAt(cup2.counter.clone().add(new V(0, 0, 0.12))); }
  c3.contents.clear(); c3.heat = 0; steps(0.2);
  const shows = (c) => c.steam.mesh.visible && c.steam.mesh.material.opacity > 0.01;
  pass &= check(!shows(c3) && c3.steamLevel === 0, 'an empty cup: no steam');
  c3.setFill(0.9); steps(0.5);
  const hot = c3.steamLevel;
  pass &= check(shows(c3) && hot > 0.5, `fresh coffee: steam (${hot.toFixed(2)}, opacity ${c3.steam.mesh.material.opacity.toFixed(2)})`);
  const pos = c3.steam.mesh.geometry.attributes.position.array, top = Math.max(...pos.filter((_, i) => i % 3 === 1));
  pass &= check(top > c3.coffee.position.y + 0.08, `the wisps rise from the surface (${(top - c3.coffee.position.y).toFixed(2)} m)`);
  c3.contents.set('coffee', 0.9); c3.contents.pour('milk', 0.1, 0.01); steps(0.3);
  pass &= check(c3.steamLevel < hot - 0.05, `milk in it: less steam (${hot.toFixed(2)} → ${c3.steamLevel.toFixed(2)})`);
  steps(250);
  pass &= check(!shows(c3) && c3.steamLevel === 0, 'after four minutes it has cooled: no steam');
  // patterns and refills (#215): a missing cup is replaced on opening, never more than CUPS.maxOut out, F fills the cabinet
  try {
  const MAX_OUT = 8;
  if (heldItem()) heldItem().putBack?.();
  w.__app.toggleFurniture(false); w.__app.toggleFurniture(true);
  const inCab = () => cups.cups.filter((c) => c.state === 'cabinet'), outside = () => cups.cups.filter((c) => c.state === 'placed' || c.state === 'held');
  pass &= check(inCab().length === 3 && !outside().length && new Set(inCab().map((c) => c.design)).size === 3, `three cups, three patterns (${inCab().map((c) => c.design).join(', ')})`);
  if (!cab.isOpen) cab.toggle();
  const spot = (i) => cup.counter.clone().add(new V(0, 0, -0.1 - 0.06 * (i % 4))).setX(cup.counter.x - 0.08 * Math.floor(i / 4));
  const a1 = inCab()[0]; a1.take(); a1.placeAt(spot(0));
  cab.toggle(); cab.toggle(); // close, open
  pass &= check(inCab().length === 3 && outside().length === 1 && new Set(inCab().map((c) => c.design)).size === 3, `opened again: a new cup on the empty spot (${inCab().map((c) => c.design).join(', ')}), 1 out`);
  for (let i = 1; i < 12; i++) { const c = inCab()[0]; c.take(); c.placeAt(spot(i)); cab.toggle(); cab.toggle(); }
  pass &= check(inCab().length === 3 && outside().length === MAX_OUT, `after 12 taken out: still 3 in the cabinet, ${outside().length} out (max ${MAX_OUT})`);
  // the cabinet full and a cup in the hand: "Skåpet är fullt"; with a spot free it goes back keeping its pattern
  const b = outside()[0]; b.take();
  pass &= check(cab.blocked && cab.blockedText === 'Skåpet är fullt', `the cabinet full: "${cab.blockedText}"`);
  b.placeAt(spot(0));
  const c1 = inCab()[1]; c1.take(); c1.placeAt(spot(1));
  const back = outside().find((c) => c !== c1); const keep = back.design; back.take(); cab.toggle();
  pass &= check(back.state === 'cabinet' && back.design === keep && inCab().length === 3, `put back on the free spot, still "${keep}"`);
  // a refilled cup pours and drinks like the others
  const fresh = inCab()[0]; fresh.take(); fresh.placeAt(spot(2)); fresh.setFill(0.6); fresh.take();
  fresh.use(); steps(1);
  pass &= check(Math.abs(fresh.fill - 0.4) < 1e-6, `a refilled cup drinks (${fresh.fill.toFixed(2)})`);
  fresh.putBack();
  w.__app.toggleFurniture(false);
  pass &= check(inCab().length === 3 && !outside().length, 'F: none left out, three in the cabinet');
  w.__app.toggleFurniture(true);
  } catch (e) { pass = false; lines.push(`FAIL error ${e.stack}`); }
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
