<!doctype html><html lang="sv"><meta charset="utf-8"><title>Rearrangement UI test</title><pre id="out">running…</pre><script type="module">
const lines=[];let pass=true;const check=(ok,text)=>{lines.push((ok?'PASS':'FAIL')+' '+text);pass&&=!!ok},wait=ms=>new Promise(r=>setTimeout(r,ms));

 const f=document.createElement('iframe');f.width=844;f.height=390;f.src='../index.html?life&shot&cloud=';document.body.append(f);await new Promise(r=>f.onload=r);while(!f.contentWindow.__app)await wait(100);

 click('terminal-btn');d.getElementById('terminal-code').value='olof is the goat';d.getElementById('terminal-form').requestSubmit();A.step(0);
 check(R.enabled&&!d.getElementById('rearrange-help').hidden&&d.getElementById('rearrange-step').textContent==='1. Välj ett föremål','unlock flows straight into clear selection step without an extra menu');

 const piece=R.pieces.find(p=>p.item.type==='coffeetable'),before=piece.object.matrixWorld.clone();R.begin(piece);A.step(0);
 check(d.getElementById('rearrange-step').textContent.includes('2. Placera '+piece.name)&&!d.getElementById('rearrange-rotate').hidden&&!d.getElementById('rearrange-cancel').hidden&&d.getElementById('turn-btn').hidden,'selected step names the item and exposes one consistent rotate/cancel pair');
 const turn=R.turn;click('rearrange-rotate');check(R.turn>turn,'visible rotate button rotates the preview');click('rearrange-cancel');

 click('rearrange-finish');check(!R.enabled&&!R.selected&&!R.ghost.visible&&piece.object.matrixWorld.equals(before)&&d.getElementById('rearrange-help').hidden,'Done exits and discards only the unsaved preview');

 document.getElementById('out').textContent=lines.join('\n')+'\n'+(pass?'ALL PASS':'SOME FAILED');
