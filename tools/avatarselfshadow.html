<script type="module">
// #2143 component page: real avatars (the production rigged body) in a midday sun with the self shadow off / on: no hat, cap, brimmed hat; arms at the
// sides, raised, held forward. Driven by tools/avatarselfshadowbrowser.cjs. __draw(mode, on, view) -> { calls, tris }, __cost() -> CPU us per update.
import * as T from 'three';
import { Avatar, loadRiggedAvatarModel, armTarget } from '../src/avatar.js';
import { avatarLook } from '../src/config.js';
const rigged = await loadRiggedAvatarModel();
const W = 1200, H = 560;

const dir = new T.Vector3().subVectors(sun.position, sun.target.position).normalize();

const avatars = CASES.map((c, i) => {
  const a = new Avatar({ ...avatarLook('2143-' + i), style: i % 5, gender: i % 2, height: 178, bodyBuild: 4, hat: c.hat, phones: 0, glasses: 0, facial: 0 });

});

window.__draw = (on, view = 'body') => {
  avatars.forEach((a) => { a.setSun(dir, on ? 1 : 0); a.selfShadow.kNow = on ? 1 : 0; });
  for (let i = 0; i < 4; i++) step();
  const f = view === 'head' ? { c: [0, 1.62, 0], d: 1.7, fov: 22, y: 0.35 } : { c: [0, 1.0, 0], d: 6.4, fov: 30, y: 0.25 };
  cam.fov = f.fov; cam.updateProjectionMatrix(); cam.position.set(f.c[0] + 0.1 * f.d / 2, f.c[1] + f.y * f.d / 3, f.c[2] + f.d); cam.lookAt(...f.c);
  renderer.info.reset(); renderer.render(scene, cam);

};
/** Side by side, same camera: the self shadow off (left half) and on (right half), figure `i` alone. */
window.__pair = (i, off = [0.15, 0.1, 1.1], lookY = 1.55, fov = 24) => {
  avatars.forEach((a, j) => { a.object.visible = i === j; });
  const p = avatars[i].object.position, w = W / 2; cam.aspect = w / H; cam.fov = fov; cam.updateProjectionMatrix();
  cam.position.set(p.x + off[0], lookY + off[1], p.z + off[2]); cam.lookAt(p.x, lookY, p.z);
  renderer.setScissorTest(true);

    for (let n = 0; n < 4; n++) step();

  });
  renderer.setScissorTest(false); cam.aspect = W / H; cam.updateProjectionMatrix(); avatars.forEach((a) => (a.object.visible = true));
};
window.__cost = (n = 2000) => {
  const a = avatars[1]; a.setSun(dir, 1); a.selfShadow.kNow = 1; step();
  const t0 = performance.now(); for (let i = 0; i < n; i++) a.updateSelfShadow(0.016); return ((performance.now() - t0) / n) * 1000;
