<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Score test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Points (#197, balanced): the score starts at 0 after a reset and is shown top left; opening a door gives SCORE.first.doors
// the first time and SCORE.again.doors after that, the grill likewise, a fish finger the cat eats each.catFish (a stat too),
// a "+N" pops up; cats by breed (+ a new coat once), sips keep counting (no cap: you can grind, it is just little), a
// basket / a three, the secret drawer by kind; easy repeats give far less than skill and rare cats; the reset clears it.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/scoretest.html
const out = document.getElementById('out');
addEventListener('unhandledrejection', (e) => { out.textContent = `ERROR ${e.reason?.message ?? e.reason}`; });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
localStorage.removeItem('lunden.stats');
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { stats, world, use, grill, fish, cat, step, player, heldItem, camera, totalScore, ball } = w.__app;
  const near = (a, b) => Math.abs(a - b) < 1e-6;
  const { SCORE } = await w.eval(`import('${new URL('src/config.js', w.location.href)}')`);
  const { catFound, secretFound, bump, rawScore } = await w.eval(`import('${new URL('src/stats.js', w.location.href)}')`); // the iframe's own module instance
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  w.confirm = () => true;
  d.getElementById('stats-reset').click();
  d.getElementById('start-touch').click();
  await wait(50);
  player.spawn(1.3, -6, Math.PI); // outside, no room to visit
  step(1 / 60);
  const el = d.getElementById('score');
  const shown = () => Number(el.querySelector('b').textContent.replace(/\s/g, ''));
  let pass = check(totalScore() === 0 && shown() === 0 && !el.closest('[hidden]'), `starts at 0, shown top left ("${el.textContent.trim()}")`);
  cat.chance.appear = 0; cat.chance.steal = 0; // no cat (and its points) behind the door
  const door = world.doors.find((x) => x.name === 'dörren');
  use(door);
  const D = SCORE.first.doors;
  pass &= check(totalScore() === D && shown() === D && new RegExp(`\\+${D}`).test(el.textContent), `a door: +${D} ("${el.textContent.trim()}")`);
  let t = rawScore();
  use(door); use(door);
  pass &= check(stats.doors === 2 && near(rawScore() - t, SCORE.again.doors), `the same door again: counted (${stats.doors}), +${(rawScore() - t).toFixed(2)} (a little)`);
  t = rawScore();
  use(grill);
  pass &= check(near(rawScore() - t, SCORE.first.grill) && stats.grill === 1, `the grill lit: +${SCORE.first.grill} (score ${totalScore()})`);
  grill.set(false); t = rawScore(); use(grill); grill.set(false);
  pass &= check(near(rawScore() - t, SCORE.again.grill), `lit again: +${(rawScore() - t).toFixed(2)}`);
  // a fish finger the cat eats: a statistic and its points
  const V = camera.position.constructor;
  cat.object.position.set(4.3, 0, 2.5); cat.object.visible = true; cat.on = null; cat.object.updateMatrixWorld(true);
  t = rawScore();
  fish.press(); heldItem().placeAt(new V(4.0, 0, 3.7));
  for (let i = 0; i < 30 * 12; i++) step(1 / 30);
  pass &= check(stats.catFish === 1 && near(rawScore() - t, SCORE.each.catFish), `the cat ate a fish finger: catFish ${stats.catFish}, +${(rawScore() - t).toFixed(2)}`);
  cat.hide?.();
  // the cat's bum (#262): tail up, the eye behind it → points once (per cat, then `again` per tail-up); from the front or
  // through a wall → none
  const butts = (x, z, yaw, cx, cz, catYaw) => {
    cat.object.position.set(cx, 0, cz); cat.object.rotation.y = catYaw; cat.object.visible = true; cat.on = null;
    cat.nextMeow = 1e9; cat.forceTail = true; cat.stand = 1; cat.tailU = 1;
    cat.tailTurn = { from: catYaw, by: 0, t: 1 }; // no turning round
    cat.object.updateMatrixWorld(true);
    player.spawn(x, z, yaw);
    const c = camera.position, p = cat.object.position;
    camera.rotation.x = -Math.atan2(c.y - 0.2, Math.hypot(c.x - p.x, c.z - p.z)); // look down at it
    const n = stats.catButts, r0 = Object.keys(stats.visited).length;
    for (let i = 0; i < 10; i++) step(1 / 30);
    t += (Object.keys(stats.visited).length - r0) * SCORE.first.visited; // (a room visited on the way is not the cat's)
    return stats.catButts - n;
  };
  cat.catName = 'Testkatten';
  t = rawScore();
  const front = butts(2.8, 8.4, Math.PI, 2.8, 9.8, Math.PI); // the eye in front of it (north), looking south
  pass &= check(front === 0 && cat.tailU > 0.9 && cat.parts.butt.visible, `tail up, seen from the front: no points (${front})`);
  const behind = butts(2.8, 11.0, 0, 2.8, 9.8, Math.PI); // behind it (south), looking north
  pass &= check(behind === 1 && near(rawScore() - t, SCORE.first.catButts), `seen from behind: counted once (${behind}), +${(rawScore() - t).toFixed(2)}`);
  t = rawScore();
  cat.forceTail = false; cat.tailUp = false; cat.raiseTail(); cat.forceTail = true; // a new tail-up of the same cat
  const again2 = butts(2.8, 11.0, 0, 2.8, 9.8, Math.PI);
  pass &= check(again2 === 1 && near(rawScore() - t, SCORE.again.catButts), `the same cat, its next tail-up: +${(rawScore() - t).toFixed(2)} (a little)`);
  // through a wall: the cat just south of a wall on Entréplan, facing south; the eye north of the wall
  const seg = world.levels[0].wallSegments.find(([ax, az, bx, bz]) => Math.abs(az - bz) < 1e-3 && Math.abs(ax - bx) > 1.2 && az > 2 && az < 11
    && ((ax + bx) / 2 < 3.3 || (ax + bx) / 2 > 5.7)); // not over the stair
  cat.catName = 'Väggkatten';
  const mx = (seg[0] + seg[2]) / 2, wz = seg[1];
  const wall = butts(mx, wz - 0.8, Math.PI, mx, wz + 0.3, 0); // the eye north of the wall, looking south at the cat's back (it faces south)
  pass &= check(wall === 0, `behind it but through a wall (x ${mx.toFixed(2)}, z ${wz.toFixed(2)}): none (${wall})`);
  cat.forceTail = false; cat.hide();
  // cats by breed: a huskatt (+ its coat the first time), the same coat again, a sphynx
  t = rawScore(); catFound('huskatt grå', false, 'huskatt');
  const hus = rawScore() - t;
  t = rawScore(); catFound('huskatt grå', false, 'huskatt');
  const again = rawScore() - t;
  t = rawScore(); catFound('sphynx rosa', true, 'sphynx');
  const sph = rawScore() - t;
  pass &= check(near(hus, SCORE.breeds.huskatt + SCORE.first.coats) && near(again, SCORE.breeds.huskatt) && near(sph, SCORE.breeds.sphynx + SCORE.first.coats) && sph > 10 * again,
    `cats: a new huskatt +${hus.toFixed(1)}, the same coat again +${again.toFixed(1)}, a sphynx +${sph.toFixed(1)}`);
  // sips count only up to their cap
  t = rawScore(); for (let i = 0; i < 100; i++) bump('beer');
  pass &= check(near(rawScore() - t, 100 * SCORE.each.beer) && stats.beer === 100, `100 sips of beer: +${(rawScore() - t).toFixed(1)} (no cap, little each)`);
  // the balance: an easy repeat ≪ a basket ≪ a rare cat
  pass &= check(SCORE.again.doors * 20 < SCORE.each.baskets && SCORE.each.beer * 10 < SCORE.each.baskets && SCORE.each.baskets * 10 < SCORE.breeds.perser,
    `balance: a door again ${SCORE.again.doors}, a sip ${SCORE.each.beer} ≪ a basket ${SCORE.each.baskets} ≪ a perser ${SCORE.breeds.perser}`);
  // a basket, a three
  t = rawScore(); ball.onBasket(false); const two = rawScore() - t;
  t = rawScore(); ball.onBasket(true); const three = rawScore() - t;
  pass &= check(near(two, SCORE.each.baskets) && near(three, SCORE.each.baskets + SCORE.each.threes) && stats.baskets === 2 && stats.threes === 1, `a basket +${two}, a three +${three}`);
  // the secret drawer: a new kind, the same again, a rare kind
  t = rawScore(); secretFound('owl', 'Ugglan'); const k1 = rawScore() - t;
  t = rawScore(); secretFound('owl', 'Ugglan'); const k2 = rawScore() - t;
  t = rawScore(); secretFound('gem', 'Ädelstenen', true); const k3 = rawScore() - t;
  pass &= check(near(k1, SCORE.secrets.kinds + SCORE.each.secrets) && near(k2, SCORE.each.secrets) && near(k3, SCORE.secrets.kinds + SCORE.secrets.rare + SCORE.each.secrets),
    `secrets: a new kind +${k1}, the same again +${k2}, a rare kind +${k3}`);
  const row = d.getElementById('stats');
  w.__app.renderStats?.(row);
  d.getElementById('stats-reset').click();
  pass &= check(totalScore() === 0 && shown() === 0, 'reset: back to 0');
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
