<!doctype html><html lang="sv"><meta charset="utf-8"><title>Shared clock peer</title>
<style>body{margin:0;padding:10px;background:#edf2f5;color:#203746;font:14px system-ui}h3{margin:0 0 5px}section{margin:10px 0;padding:8px;background:white;border-radius:8px}.row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}button{padding:6px;border:1px solid #bbb;border-radius:5px;background:#fff;color:#203746}.time{font-size:24px;font-weight:bold}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}.days .on{background:#72b39b}.info{margin-top:5px}small{display:none}input{width:80px}#state{font-size:16px;font-weight:bold}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<h3>Klient B · riktig lokal Worker</h3><div>Produktionspaneler · lokal klocka +3 dygn</div><p id="state"></p><main></main>
<script type="module">
import {initHudIcons} from '../src/hudicons.js';import * as T from 'three';import {TimeSync} from '../src/timesync.js';import {ClockPanel} from '../src/wallclock.js';import {CalendarPanel} from '../src/calendar.js';import {worldNow,setWorldStamp,worldStamp,timeRate} from '../src/worldtime.js';
const originalNow=Date.now.bind(Date);Date.now=()=>originalNow()+3*864e5;
const day={get doy(){return Math.round((Date.UTC(this.year,this.month-1,this.date)-Date.UTC(this.year,0,0))/864e5);},paused:false,spool:0,realAt:Date.now(),update(){const n=Date.now(),dt=Math.max(0,n-this.realAt);this.realAt=n;setWorldStamp(this,worldStamp(this)+dt*timeRate({p:this.paused?1:0,s:this.spool}));},toNow(){setWorldStamp(this,worldNow());this.paused=false;this.spool=0;this.realAt=Date.now();}};setWorldStamp(day,worldNow());
const html=new DOMParser().parseFromString(await(await fetch('/index.html')).text(),'text/html');for(const id of ['clock-panel','cal-panel']){const el=html.getElementById(id);el.hidden=false;document.querySelector('main').append(el);}
initHudIcons();const clock=new ClockPanel(day,document.querySelector('#clock-panel')),cal={day,object:{position:new T.Vector3()},get view(){return{year:day.year,month:day.month};},draw(){}},calendar=new CalendarPanel(cal,document.querySelector('#cal-panel'));
const events=[],sent=[];let ws,id,connected=false;const sync=new TimeSync({day,net:{ready:()=>connected,id:()=>id,send:m=>{sent.push(m);ws.send(JSON.stringify(m));return true;}},notice:t=>events.push(t),onApply:()=>{clock.render();calendar.render();}});clock.onChange=kind=>sync.local(kind);calendar.onChange=()=>sync.local();
async function connect(){connected=false;ws=new WebSocket((new URLSearchParams(location.search).get('worker')||'ws://localhost:8956')+'/players?n=Clock%20B');ws.onmessage=e=>{if(e.data==='q')return;const m=JSON.parse(e.data);if(m.t==='w'){id=m.i;connected=true;sync.welcome();sync.receive(m.tm);}else if(m.t==='tm')sync.receive(m,m.i===id?null:{name:'Clock A'});};ws.onclose=()=>connected=false;}
connect();setInterval(()=>{if(connected)ws.send('p');},10000);setInterval(()=>{day.update();clock.render();document.querySelector('#state').textContent=`${day.date}/${day.month} ${day.year} · ${Math.floor(day.hour)}:${String(Math.floor(day.hour*60)%60).padStart(2,'0')} · rev ${sync.q}`;},100);
window.peer={day,clock,calendar,sync,sent,events,connect,get connected(){return connected;},disconnect(){ws.close();connected=false;}};
</script></html>
