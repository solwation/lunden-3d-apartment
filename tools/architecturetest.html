<!doctype html><html><meta charset="utf-8"><title>Architectural edges (#474)</title><pre id="out">running…</pre><script type="module">
const lines=[];let pass=true;const check=(ok,s)=>{lines.push(`${ok?'PASS':'FAIL'} ${s}`);pass&&=!!ok;};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
try {
 const f=document.createElement('iframe');f.width=480;f.height=300;f.src='../index.html?life&shot';document.body.append(f);
 await new Promise(r=>f.onload=r);while(!f.contentWindow.__app)await wait(100);
 const w=f.contentWindow,d=f.contentDocument,A=w.__app,T=await w.eval("import('three')"),{architectureEdges}=await w.eval("import('../src/architectureedges.js')");
 d.documentElement.requestFullscreen=undefined;d.getElementById('start-touch').click();
 const all=A.world.edgeLines;check(all.length>2&&all.length<150,'architectural lines batched per floor and moving fitting');
 check(all.every(l=>l.parent&&l.material.depthTest&&!l.material.depthWrite),'lines survive static merge and retain depth occlusion');
 let wrong=0;for(const r of A.world.looseItems)r.traverse(o=>{if(o.userData.architectureEdges)wrong++;});
 check(wrong===0,'furniture, plants, curtains and loose decorations have no architectural lines');
 const door=A.world.doors.find(d=>d.kind==='swing'&&d.object.children.some(o=>o.userData.architectureEdges));
 check(!!door,'hinged door has its own edge batch');
 if(door){const l=door.object.children.find(o=>o.userData.architectureEdges);A.scene.updateMatrixWorld(true);const before=l.matrixWorld.clone();door.toggle();door.update(1);A.scene.updateMatrixWorld(true);check(!l.matrixWorld.equals(before)&&l.parent===door.object,'door edges follow its animated hinge');}
 const core=A.world.core;check(core.edgeLines.length>0,'stairwell and lift have architectural lines');
 const liftLine=core.lift.car.children.find(o=>o.userData.architectureEdges);check(!!liftLine,'lift interior edges are attached to moving car');
 const root=new T.Group(),box=new T.Mesh(new T.BoxGeometry(1,1,1),new T.MeshBasicMaterial());root.add(box);
 const batch=architectureEdges(root);check(batch.length===1&&batch[0].geometry.attributes.position.count===24,'box has exactly 12 sharp edges, no triangulation diagonals');
 // #505: construction seams must disappear, while real corners/openings remain.
 const wallMat=new T.MeshBasicMaterial(),wall=new T.Group();
 const block=(root,x0,x1,y0,y1,z0,z1)=>{const m=new T.Mesh(new T.BoxGeometry(x1-x0,y1-y0,z1-z0),wallMat);m.position.set((x0+x1)/2,(y0+y1)/2,(z0+z1)/2);root.add(m);return m;};
 block(wall,-1,0,0,3,-.1,.1);block(wall,0,1,0,3,-.1,.1);
 const segments=root=>architectureEdges(root).flatMap(l=>{const p=l.geometry.attributes.position;return Array.from({length:p.count/2},(_,i)=>[new T.Vector3().fromBufferAttribute(p,i*2),new T.Vector3().fromBufferAttribute(p,i*2+1)]);});
 const seam=segments(wall);
 check(!seam.some(([a,b])=>Math.abs(a.x)<1e-5&&Math.abs(b.x)<1e-5&&Math.abs(a.y-b.y)>1),'coplanar touching blocks have no vertical seam');
 check(seam.some(([a,b])=>Math.abs(a.x+1)<1e-5&&Math.abs(b.x+1)<1e-5&&Math.abs(a.y-b.y)>2.9),'outer wall corner remains');
 const opening=new T.Group();block(opening,-1,0,0,3,-.1,.1);block(opening,0,1,2,3,-.1,.1);
 const jamb=segments(opening).filter(([a,b])=>Math.abs(a.x)<1e-5&&Math.abs(b.x)<1e-5&&Math.abs(a.y-b.y)>1);
 check(jamb.length===2&&jamb.every(([a,b])=>Math.max(a.y,b.y)<=2.00001),'opening jamb remains only below lintel, its artificial continuation disappears');
 const corner=new T.Group();block(corner,-1,1,0,3,-.1,.1);block(corner,-.1,.1,0,3,.1,1);
 check(segments(corner).some(([a,b])=>Math.abs(Math.abs(a.x)-.1)<1e-5&&Math.abs(a.z-.1)<1e-5&&Math.abs(a.y-b.y)>2.9),'real concave inner corner between joined walls remains');
 const step=new T.Group();block(step,-1,0,0,3,-.1,.1);block(step,0,1,0,3,-.1,.12);
 check(segments(step).some(([a,b])=>Math.abs(a.x)<1e-5&&Math.abs(b.x)<1e-5&&Math.abs(a.y-b.y)>2.9),'a genuine projecting wall step retains its vertical edge');
 const hinged=new T.Group(),leaf=new T.Group();block(hinged,-1,0,0,3,-.1,.1);block(leaf,0,1,0,3,-.1,.1);hinged.add(leaf);
 const movingEdges=architectureEdges(hinged,{moving:[leaf]});
 check(movingEdges.some(l=>l.parent===leaf&&l.geometry.attributes.position.count===24),'touching moving door is classified separately and retains its own edges');
 const planeA=new T.PlaneGeometry(1,3).translate(-.5,1.5,0),planeB=new T.PlaneGeometry(1,3).translate(.5,1.5,0);
 const planar=new T.Group(),carrier=new T.Mesh(new T.BoxGeometry(1,1,1),wallMat);carrier.userData.edgeSources=[planeA,planeB];planar.add(carrier);
 const planarEdges=segments(planar);
 check(!planarEdges.some(([a,b])=>Math.abs(a.x)<1e-5&&Math.abs(b.x)<1e-5&&Math.abs(a.y-b.y)>1)&&planarEdges.length>0,'baked open wall planes remove shared seam and preserve their outer boundary');
 const angled=new T.Group();block(angled,-1,0,0,3,-.1,.1);const rotated=block(angled,0,1,0,3,-.1,.1);rotated.rotation.y=.5;
 check(segments(angled).length>0,'rotated solids retain genuine sharp boundaries');
 // Real WebGL depth test: an opaque foreground wall must hide every line of a rear box.
 const scene=new T.Scene();scene.background=new T.Color(0xffffff);scene.add(root);
 const blocker=new T.Mesh(new T.PlaneGeometry(3,3),new T.MeshBasicMaterial({color:0xffffff}));blocker.position.z=1;scene.add(blocker);
 const camera=new T.OrthographicCamera(-1,1,1,-1,.1,10);camera.position.z=3;camera.lookAt(0,0,0);
 const renderer=new T.WebGLRenderer({preserveDrawingBuffer:true});renderer.setSize(64,64);renderer.render(scene,camera);
 const gl=renderer.getContext(),pixels=new Uint8Array(64*64*4);gl.readPixels(0,0,64,64,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
 check(pixels.every((v,i)=>i%4===3||v===255),'architectural edges do not show through an opaque wall');renderer.dispose();
 A.renderer.render(A.scene,A.camera);check(A.renderer.info.render.lines>0,'real apartment render draws architectural lines');
 document.getElementById('out').textContent=lines.join('\n')+'\n'+(pass?'ALL PASS':'SOME FAILED')+`\nApartment batches: ${all.length}; stairwell batches: ${core.edgeLines.length}`;
}catch(e){document.getElementById('out').textContent=lines.join('\n')+'\nFAIL '+e.stack;}
</script></html>
