<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Sit / lie test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Sitting and lying down (#71/#72): for every seat and bed, look at each spot, press the action
// button: the camera ends at the spot (sit: seat + REST.sitEye, lie: mattress + REST.lieEye, looking up),
// walking does nothing, looking is clamped, the button says "Res dig"; press again → back where you stood.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/resttest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
f.src = '../index.html';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, world, step, rest } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  world.object.updateMatrixWorld(true); // no render has run yet in headless
  const court = world.courtyardTargets ?? []; // the courtyard's benches (#438): sat on and got up from like the furniture
  const targets = [...world.furnitureTargets.filter((t) => t.kind === 'rest'), ...court];
  let pass = check(targets.length >= 9, `${targets.length} seats/beds`);
  pass &= check(court.length >= 12 && court.every((t) => t.spots.length >= 3), `#438: ${court.length} courtyard benches, ${court.reduce((n, t) => n + t.spots.length, 0)} spots`);
  { // #453: no courtyard bench stands in front of a loggia's parapet opening or an entrance at the ground (≥ 1 m clear)
    const { groundWaysIn } = await w.eval(`import('${new URL('../src/surroundings.js', location)}')`);
    const { COURTYARD } = await w.eval(`import('${new URL('../src/config.js', location)}')`);
    const ways = groundWaysIn(), bad = [];
    for (const b of COURTYARD.benches) {
      const [hx, hz] = Math.abs(b.rot % 180) === 90 ? [0.3, 0.8] : [0.8, 0.3]; // (as courtyard.js)
      for (const o of ways) {
        let dmin = Infinity;
        for (let t = 0; t <= 1.0001; t += 0.05) {
          const x = o.x0 + (o.x1 - o.x0) * t, z = o.z0 + (o.z1 - o.z0) * t;
          dmin = Math.min(dmin, Math.hypot(Math.max(0, Math.abs(x - b.x) - hx), Math.max(0, Math.abs(z - b.z) - hz)));
        }
        if (dmin < 1.0) bad.push(`(${b.x}, ${b.z}) ${dmin.toFixed(2)} m from ${o.name}'s ${o.kind} at (${o.x0.toFixed(1)}, ${o.z0.toFixed(1)})`);
      }
    }
    pass &= check(ways.filter((o) => o.kind === 'loggia').length >= 2 && !bad.length, `#453: ${COURTYARD.benches.length} benches clear of ${ways.length} ways in${bad.length ? ': ' + bad.join('; ') : ''}`);
  }
  const { people } = w.__app, seatTaken = people.seatTaken;
  people.seatTaken = () => false; // (the bench sitters are out by day: every spot first, the sitters at the end)
  const segsOf = (lv) => world.levels[lv].segments;
  const inQuad = (q, x, z) => { let p = 0, n = 0; for (let i = 0; i < 4; i++) { const [ax, az] = q[i], [bx, bz] = q[(i + 1) % 4], c = (bx - ax) * (z - az) - (bz - az) * (x - ax); if (c > 0) p++; else if (c < 0) n++; } return !(p && n); };
  const feetOf = (lv) => world.levels[lv].footprints ?? []; // furniture footprints (#302): their middle is far from every edge
  const free = (lv, x, z, loose = false) => (loose || !feetOf(lv).some((q) => inQuad(q, x, z))) && segsOf(lv).every(([ax, az, bx, bz]) => {
    const dx = bx - ax, dz = bz - az, t = Math.max(0, Math.min(1, ((x - ax) * dx + (z - az) * dz) / (dx * dx + dz * dz || 1)));
    return Math.hypot(x - ax - t * dx, z - az - t * dz) > 0.225; // PLAYER.radius 0.22
  });
  const standBtn = d.getElementById('stand-btn');
  const { standUp } = w.__app;
  /** Sit down on spot `sp` of `t` from a free place near it (the button must name it); returns the label or null. */
  const sitOn = (t, sp) => {
      // stand on a free spot near it — in front first, then all round — from which the button names it
      const floorY = t.level ? 3.25 : 0;
      const cands = [];
      for (const r of [0.9, 1.2, 1.5]) for (let k = 0; k < 8; k++) cands.push([sp.yaw + (k - 3.5) * 0.3, r]);
      for (const r of [0.5, 0.6, 0.8, 1.1, 1.4]) for (let k = 0; k < 24; k++) cands.push([sp.yaw + k * (Math.PI / 12), r]);
      let label = null;
      for (const [a, r, loose] of [...cands, ...cands.map((c) => [...c, true])]) { // (loose: a chair reached only from over the desk)
        const x = sp.pos.x - Math.sin(a) * r, z = sp.pos.z - Math.cos(a) * r;
        if (!free(t.level, x, z, loose)) continue;
        player.spawn(x, z, 0);
        if (t.level) { player.pos.y = floorY; player.eyeY = floorY + 1.62; }
        for (let i = 0; i < 3; i++) step(1 / 60);
        // (#454) only from the piece's own floor: a place inside furniture keeps the camera where spawn() put it (on
        // Entréplan), and the chair upstairs used to be "reached" from the kitchen through the ceiling (#446)
        if (Math.abs(camera.position.y - player.eyeY) > 0.3) continue;
        // where to look: a little under the eye, else the seat itself (#454: the low kids' chair, seen from behind, is
        // only its back rest under that line)
        const aims = sp.aimPos ? [sp.aimPos] : [sp.pos.clone().setY(sp.pos.y - 0.25), sp.pos.clone().setY(sp.pos.y - ((sp.kind ?? t.rest) === 'lie' ? 0.22 : 0.72) + 0.03)];
        let named = false;
        for (const aim of aims) { // a spot picked by looking elsewhere (sitting up in bed, #213)
          const dx = aim.x - camera.position.x, dz = aim.z - camera.position.z;
          camera.rotation.y = Math.atan2(-dx, -dz);
          camera.rotation.x = Math.atan2(aim.y - camera.position.y, Math.hypot(dx, dz));
          step(1 / 60);
          if ((named = !btn.hidden && btn.textContent.includes(t.name))) break;
        }
        if (!named) continue;
        btn.click();
        if (rest.target === t) { label = btn.textContent; break; }
        w.__app.standUp(); for (let i = 0; i < 3; i++) step(1 / 60); // another chair of the same name: up again, go on
      }
      return label;
  };
  for (const t of targets) {
    for (const [si, sp] of t.spots.entries()) {
      const label = sitOn(t, sp);
      if (!label) { pass &= check(false, `${t.name} #${si} @ (${sp.pos.x.toFixed(2)}, ${sp.pos.z.toFixed(2)}): no free place from which it is a target`); continue; }
      for (let i = 0; i < 60; i++) step(1 / 60);
      const chosen = rest.spot;
      const atSpot = chosen && camera.position.distanceTo(chosen.pos) < 0.02;
      const lying = (chosen?.kind ?? t.rest) === 'lie'; // a spot can differ from its piece (the seat in a bunk)
      const up = !lying || camera.rotation.x > 1.3;
      // walking does nothing, looking is clamped
      const p0 = camera.position.clone();
      player.keys = new Set(['KeyW']);
      for (let i = 0; i < 30; i++) step(1 / 60);
      player.keys = new Set();
      const still = camera.position.distanceTo(p0) < 0.001;
      const before = player.pos.clone(), yawSat = camera.rotation.y;
      (standBtn.hidden ? btn : standBtn).click(); // "Res dig" (the action button, or its own one when something is in reach, #184)
      for (let i = 0; i < 3; i++) step(1 / 60);
      // up where you stood, or (that being behind you) on a free spot in front, looking the way you looked (#202)
      const back = (Math.hypot(player.pos.x - before.x, player.pos.z - before.z) < 0.05 || free(t.level, player.pos.x, player.pos.z)) && !rest.active
        && Math.abs(camera.rotation.y - yawSat) < 1e-6 && (!lying || camera.rotation.x === 0);
      const ok = !!(atSpot && up && still && back && label);
      pass &= check(ok, `${t.name} #${si} (${chosen?.kind ?? t.rest}): "${label}" at spot ${atSpot}, ${lying ? `looking up ${up}, ` : ''}no walking ${still}, back up ${back}`);
    }
  }
  // #213: sitting up in the double bed (both sides) puts the Sovrum 1 TV on, in view; getting up puts it off
  {
    const bed = targets.find((x) => x.name === 'sängen' && x.spots.some((s) => s.tv));
    const tv = w.__app.world.furnitureTargets.find((x) => x.kind === 'tv' && x.room === 'Sovrum 1');
    for (const sp of bed.spots.filter((s) => s.tv)) {
      const label = sitOn(bed, sp);
      for (let i = 0; i < 60; i++) step(1 / 60);
      camera.updateMatrixWorld(); camera.updateProjectionMatrix();
      const THREE = await w.eval("import('three')");
      const fr = new THREE.Frustum().setFromProjectionMatrix(new THREE.Matrix4().multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse));
      tv.pickable.updateMatrixWorld(true);
      const inView = fr.containsPoint(tv.pickable.getWorldPosition(new THREE.Vector3()));
      const sat = rest.spot === sp && rest.kind === 'sit';
      const on = tv.isOpen;
      (standBtn.hidden ? btn : standBtn).click(); for (let i = 0; i < 3; i++) step(1 / 60);
      pass &= check(/sätta dig upp i sängen/i.test(label ?? '') && sat && on && inView && !tv.isOpen, `sitting up in bed (${sp.x > 0 ? 'one' : 'other'} side): "${label}", sat ${sat}, the TV on ${on} and in view ${inView}, off again ${!tv.isOpen}`);
    }
  }
  // #308/#309: in every bed the eye is clear of the bedding — a ray from 25 cm above the eye straight down meets
  // nothing before it is 4 cm below the eye (pillows, duvets; a closed pillow round the eye would be hit from above)
  {
    const THREE = await w.eval("import('three')");
    const ray = new THREE.Raycaster();
    ray.layers.enableAll();
    const scene = w.__app.scene;
    scene.updateMatrixWorld(true);
    for (const t of targets.filter((x) => x.rest === 'lie' || x.spots.some((s) => s.kind === 'lie'))) for (const [si, sp] of t.spots.entries()) {
      if ((sp.kind ?? t.rest) !== 'lie' && !sp.tv) continue; // lying, or sitting up against the pillows (not hunched under a top bunk)
      ray.set(sp.pos.clone().setY(sp.pos.y + 0.25), new THREE.Vector3(0, -1, 0));
      ray.far = 0.6;
      const hit = ray.intersectObject(scene, true).find((h) => h.object.visible !== false && h.object.isMesh && !h.object.isInstancedMesh && h.object.material?.visible !== false);
      const gap = hit ? hit.distance - 0.25 : Infinity;
      pass &= check(gap > 0.04, `${t.name} #${si} (${sp.kind ?? t.rest}): the eye ${gap === Infinity ? 'over nothing within 35 cm' : `${(gap * 100).toFixed(0)} cm over ${hit.object.name || hit.object.material?.name || 'a surface'}`}`);
    }
    // #335: no two bedding surfaces lie on each other (they flicker on a real GPU): seen from above, the two uppermost
    // up-facing surfaces of a bed are more than 1.5 mm apart nearly everywhere (where they cross, a ray or two may not be)
    const beds = [];
    scene.traverse((o) => { const r = o.userData?.rest; if (r && (r.kind === 'lie' || r.spots?.some((s) => s.kind === 'lie'))) beds.push(o); });
    for (const bed of beds) {
      const box = new THREE.Box3().setFromObject(bed), meshes = [], down = new THREE.Vector3(0, -1, 0), n = new THREE.Vector3();
      bed.traverse((o) => { if (o.isMesh && o.visible) meshes.push(o); });
      let rays = 0, close = 0;
      for (let x = box.min.x; x <= box.max.x; x += 0.025) for (let z = box.min.z; z <= box.max.z; z += 0.025) {
        ray.set(new THREE.Vector3(x, box.max.y + 0.1, z), down); ray.far = 5;
        const hits = ray.intersectObjects(meshes, false).filter((h) => h.face && n.copy(h.face.normal).transformDirection(h.object.matrixWorld).y > 0);
        if (hits.length < 2) continue;
        rays++;
        if (hits[1].distance - hits[0].distance < 0.0015) close++;
      }
      pass &= check(close <= rays * 0.01, `${bed.userData.rest.name} at (${box.getCenter(new THREE.Vector3()).x.toFixed(1)}, ${box.getCenter(new THREE.Vector3()).z.toFixed(1)}): ${close} of ${rays} rays meet two surfaces within 1.5 mm`);
    }
    // #402: the same from the side over the IDANÄS frame (its drawer fronts and shadow-line panels): rays level with the
    // floor into all four sides, the two nearest faces turned towards the ray more than 4 mm apart nearly everywhere
    const { IDANAS } = await w.eval("import('../src/config.js')");
    for (const bed of beds.filter((b) => b.userData.rest.name === 'sängen')) {
      const meshes = [], n = new THREE.Vector3(), m = bed.matrixWorld, rot = new THREE.Matrix3().setFromMatrix4(m);
      bed.traverse((o) => { if (o.isMesh && o.visible) meshes.push(o); });
      const hw = IDANAS.W / 2, hl = 1.0; // the frame's half width; the mattress is 2.0 long
      let rays = 0, close = 0;
      for (const [ax, sg] of [['x', 1], ['x', -1], ['z', 1], ['z', -1]]) {
        const span = ax === 'x' ? hl : hw;
        for (let u = -span; u <= span; u += 0.01) for (let y = IDANAS.legH + 0.02; y <= IDANAS.frameH - 0.02; y += 0.01) {
          const o = ax === 'x' ? new THREE.Vector3(sg * (hw + 0.3), y, u) : new THREE.Vector3(u, y, sg * (hl + 0.3));
          const d = ax === 'x' ? new THREE.Vector3(-sg, 0, 0) : new THREE.Vector3(0, 0, -sg);
          ray.set(o.applyMatrix4(m), d.applyMatrix3(rot).normalize()); ray.far = 1;
          const hits = ray.intersectObjects(meshes, false).filter((h) => h.face && n.copy(h.face.normal).transformDirection(h.object.matrixWorld).dot(ray.ray.direction) < -0.9); // faces square to the ray (a rounded edge grazed is no pair)
          if (hits.length < 2) continue;
          rays++;
          if (hits[1].distance - hits[0].distance < 0.004) close++;
        }
      }
      pass &= check(rays > 1000 && close <= rays * 0.01, `the IDANÄS frame's sides: ${close} of ${rays} rays meet two faces within 4 mm (drawer fronts, shadow lines, #402)`);
    }
  }
  // #202: turn your head while seated, get up: you look the same way; the old spot behind you → a spot in front
  {
    const t = targets.find((x) => x.name === 'soffan'), sp = t.spots[1];
    sitOn(t, sp); for (let i = 0; i < 60; i++) step(1 / 60);
    camera.rotation.y = sp.yaw + 0.5; camera.rotation.x = -0.2; step(1 / 60);
    const y0 = camera.rotation.y, x0 = camera.rotation.x;
    rest.standing = { ...rest.standing, x: sp.pos.x + Math.sin(y0) * 0.6, z: sp.pos.z + Math.cos(y0) * 0.6 }; // pretend you came from behind
    w.__app.standUp(); step(1 / 60);
    const fx = -Math.sin(y0), fz = -Math.cos(y0), ahead = (player.pos.x - sp.pos.x) * fx + (player.pos.z - sp.pos.z) * fz;
    pass &= check(Math.abs(camera.rotation.y - y0) < 1e-6 && Math.abs(camera.rotation.x - x0) < 1e-6 && ahead > 0.3 && free(0, player.pos.x, player.pos.z),
      `head turned 0.5 rad in the sofa: up looking the same way (yaw ${camera.rotation.y.toFixed(2)}, pitch ${camera.rotation.x.toFixed(2)}), ${ahead.toFixed(2)} m in front`);
  }
  // #302: getting up never puts you inside a piece of furniture (the dining table's middle) or across one: for every
  // seat / bed spot, looking ahead and turned to both sides, coming from behind or from where you stood, you get up on the
  // floor, clear of every collision segment, outside every footprint, not over a table, and can walk away
  {
    const { REST, LEVELS } = await w.eval("import('../src/config.js')");
    const crosses = (lv, sx, sz, x, z) => { // the way from the seat goes through a wall / window, or enters a footprint the seat is
      // not in, or one again after leaving
      const through = (world.levels[lv].fixedSegments ?? []).some(([ax, az, bx, bz]) => {
        const d = (x - sx) * (bz - az) - (z - sz) * (bx - ax);
        if (Math.abs(d) < 1e-9) return false;
        const t = ((ax - sx) * (bz - az) - (az - sz) * (bx - ax)) / d, u = ((ax - sx) * (z - sz) - (az - sz) * (x - sx)) / d;
        return t > 0 && t < 1 && u >= 0 && u <= 1;
      });
      if (through) return true;
      const own = feetOf(lv).filter((q) => inQuad(q, sx, sz)), n = Math.ceil(Math.hypot(x - sx, z - sz) / 0.05);
      let out = false;
      for (let i = 1; i < n; i++) {
        const px = sx + (x - sx) * i / n, pz = sz + (z - sz) * i / n, hit = feetOf(lv).filter((q) => inQuad(q, px, pz));
        if (!hit.length) out = true; else if (out || hit.some((q) => !own.includes(q))) return true;
      }
      return false;
    };
    let bad = 0, n = 0;
    const dining = [];
    pass &= check(feetOf(0).length > 10, `${feetOf(0).length} furniture footprints downstairs`);
    for (const t of targets) for (const [si, sp] of t.spots.entries()) {
      for (const turn of [0, 1, -1]) for (const came of ['stood', 'behind']) {
        if (!sitOn(t, sp)) { bad++; lines.push(`FAIL #302 ${t.name} #${si}: could not sit`); continue; }
        for (let i = 0; i < 60; i++) step(1 / 60);
        const lim = REST[rest.kind], lv = t.level, floorY = LEVELS[lv].floor;
        camera.rotation.y = rest.spot.yaw + turn * lim.yaw * 0.95; camera.rotation.x = 0; step(1 / 60);
        const yaw = camera.rotation.y, seat = rest.spot.pos.clone();
        if (came === 'behind') rest.standing = { ...rest.standing, x: seat.x + Math.sin(yaw) * 0.6, z: seat.z + Math.cos(yaw) * 0.6 };
        const old = { ...rest.standing };
        standUp(); for (let i = 0; i < 3; i++) step(1 / 60);
        const { x, z, y } = player.pos;
        const onFloor = Math.abs(y - floorY) < 0.01, clear = free(lv, x, z), outside = !feetOf(lv).some((q) => inQuad(q, x, z));
        const direct = Math.hypot(x - old.x, z - old.z) < 0.01 || !crosses(lv, seat.x, seat.z, x, z);
        let walks = false; // can walk away in some direction (not boxed in)
        for (let k = 0; k < 8 && !walks; k++) {
          player.spawn(x, z, k * Math.PI / 4); player.pos.y = floorY; player.eyeY = floorY + 1.62;
          player.keys = new Set(['KeyW']); for (let i = 0; i < 30; i++) step(1 / 60); player.keys = new Set();
          walks = Math.hypot(player.pos.x - x, player.pos.z - z) > 0.3 && !feetOf(lv).some((q) => inQuad(q, player.pos.x, player.pos.z));
        }
        n++;
        const ok = !rest.active && onFloor && clear && outside && direct && walks;
        if (t.name === 'stolen' && lv === 0) dining.push(ok); // (the kids' chair upstairs is 'stolen' too)
        if (!ok) { bad++; lines.push(`FAIL #302 ${t.name} #${si} (turn ${turn}, ${came}): up at (${x.toFixed(2)}, ${z.toFixed(2)}, y ${y.toFixed(2)}) floor ${onFloor}, clear ${clear}, outside furniture ${outside}, not across ${direct}, walks away ${walks}`); }
      }
    }
    pass &= check(dining.length >= 24 && dining.every(Boolean), `#302: ${dining.length} get-ups from the 4 dining chairs, all on free floor`);
    pass &= check(bad === 0, `#302: ${n - bad} / ${n} get-ups (every seat and bed, ahead and turned, from behind) on free floor, able to walk away`);
  }
  // #438: a spot a bench sitter is on is not offered (the next one along is), and nobody turns up on the visitor's spot
  {
    const THREE = await w.eval("import('three')"), { chooseSpot } = await w.eval("import('../src/rest.js')");
    const near = (sp, f) => Math.hypot(sp.pos.x - f.x, sp.pos.z - f.z) < 0.1;
    const sitters = people.figs.filter((f) => f.role === 'sit');
    for (const f of sitters) {
      const t = court.find((x) => x.spots.some((sp) => near(sp, f))), sp = t?.spots.find((s) => near(s, f));
      people.seatTaken = () => false;
      const label = t && sitOn(t, sp); for (let i = 0; i < 60; i++) step(1 / 60);
      people.update(1 / 60, 1, 6, player); // by day
      const away = !!f.away && rest.spot === sp;
      standUp(); for (let i = 0; i < 3; i++) step(1 / 60);
      people.seatTaken = seatTaken; people.update(1 / 60, 1, 6, player); // by day, the visitor up again: the sitter is back
      const ray = new THREE.Ray(sp.pos.clone().setY(sp.pos.y + 1), new THREE.Vector3(0, -1, 0));
      const other = chooseSpot(t, ray, null);
      pass &= check(!!label && away && sp.taken() && other && other !== sp, `#438: the sitter at (${f.x}, ${f.z}): sat there with nobody on the lap ${away}, then taken ${sp?.taken()}, the look picks the spot beside it ${other && other !== sp}`);
    }
    pass &= check(sitters.length >= 1, `#438: ${sitters.length} bench sitters`);
    people.seatTaken = () => false;
  }
  // #445: the ottoman is a seat; the cushion box's shut lid too — open, its spots are taken ("Stäng locket först"), and
  // sitting on it the lid is no target (it does not open under you)
  {
    pass &= check(targets.some((t) => t.name === 'pallen' && t.spots.length === 1 && t.spots[0].pos.y < 1.3), '#445: the ottoman is a seat');
    const box = targets.find((t) => t.name === 'dynboxen'), lid = world.furnitureTargets.find((t) => t.seat === box?.pickable);
    let ok = !!box && !!lid && !lid.isOpen && !box.blocked;
    if (ok) {
      lid.toggle(); for (let i = 0; i < 60; i++) lid.update(1 / 30);
      const blocked = box.blocked && box.blockedText === 'Stäng locket först';
      lid.toggle(); for (let i = 0; i < 60; i++) lid.update(1 / 30);
      const label = sitOn(box, box.spots[0]); for (let i = 0; i < 60; i++) step(1 / 60);
      const V = camera.position.constructor, l = lid.pickable.getWorldPosition(new V()).add(new V(0, 0.05, 0)), n = box.spots[1].pos;
      const at = new V(n.x, l.y, n.z), dx = at.x - camera.position.x, dz = at.z - camera.position.z; // the lid beside you
      camera.rotation.set(Math.max(-1.05, Math.atan2(at.y - camera.position.y, Math.hypot(dx, dz))), Math.atan2(-dx, -dz), 0, 'YXZ'); step(1 / 60);
      const { focus } = w.__app, f = focus().focused;
      const noLid = f !== lid;
      standUp(); for (let i = 0; i < 3; i++) step(1 / 60);
      ok = blocked && !!label && noLid && !lid.isOpen;
      pass &= check(ok, `#445: the cushion box: open = taken ${blocked}, sat on the shut lid "${label}", the lid no target then ${noLid}`);
    } else pass &= check(false, '#445: the cushion box is a seat with its lid');
  }
  // #184: things within reach while sitting — the remote from the sofa, the book from the armchair
  const { remote, book, heldItem } = w.__app;
  const V = camera.position.constructor;
  const look = (p) => { const dx = p.x - camera.position.x, dz = p.z - camera.position.z; camera.rotation.set(Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz)), Math.atan2(-dx, -dz), 0, 'YXZ'); step(1 / 60); return btn.hidden ? '(hidden)' : btn.textContent; };
  const sofa = targets.find((t) => t.name === 'soffan');
  // the seat nearest the remote
  remote.model.updateMatrixWorld(true);
  const rp = remote.where();
  const seat = [...sofa.spots].sort((a, b) => a.pos.distanceTo(rp) - b.pos.distanceTo(rp))[0];
  sitOn(sofa, seat); for (let i = 0; i < 60; i++) step(1 / 60);
  let label = look(remote.where());
  pass &= check(rest.active && /ta fjärrkontrollen/i.test(label) && !standBtn.hidden, `in the sofa (${camera.position.distanceTo(rp).toFixed(2)} m from the remote): "${label}", the "Res dig" button beside it`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === remote && rest.active, 'the remote in the hand, still sitting');
  const tv = world.furnitureTargets.find((t) => t.kind === 'tv' && t.level === 0) ?? world.furnitureTargets.find((t) => t.kind === 'tv');
  if (tv.isOpen) tv.toggle();
  look(tv.pickable.getWorldPosition(new V()));
  remote.use(); step(1 / 60);
  pass &= check(tv.isOpen && rest.active, 'a click: the TV comes on, from the sofa');
  // stand up with it in the hand (Space): you keep it
  d.dispatchEvent(new w.KeyboardEvent('keydown', { code: 'Space', bubbles: true }));
  step(1 / 60);
  const locked = !rest.active; // the key handler only runs with the mouse locked: fall back to the button
  if (!locked) standBtn.click();
  step(1 / 60);
  pass &= check(!rest.active && heldItem() === remote, `up again (${locked ? 'Space' : 'the button'}), the remote still in the hand`);
  remote.putBack(); tv.toggle();
  // the armchair: the book on the side table
  const chair = targets.find((t) => t.name === 'fåtöljen');
  sitOn(chair, chair.spots[0]); for (let i = 0; i < 60; i++) step(1 / 60);
  book.model.updateMatrixWorld(true);
  label = look(book.where());
  pass &= check(rest.active && /ta boken/i.test(label), `in the armchair: "${label}" (${camera.position.distanceTo(book.where()).toFixed(2)} m)`);
  btn.click(); step(1 / 60);
  look(book.where().add(new V(0, 1, 0))); // up, at nothing
  btn.click(); step(1 / 60); // "Läs"
  pass &= check(book.reading && rest.active, 'reading, still sitting');
  btn.click(); step(1 / 60); // close
  pass &= check(!book.reading && rest.active && heldItem() === book, 'closed, still sitting');
  label = look(book.home.pos.clone().add(new V(0, 0.05, 0)));
  btn.click(); step(1 / 60);
  pass &= check(!book.held && rest.active, `back on the side table ("${label}")`);
  // far away (beyond reach): nothing; E / the button with nothing in reach stands you up
  label = look(camera.position.clone().add(new V(0, 0, 0)).add(new V(3, 0, 3)));
  pass &= check(label === 'Res dig' && standBtn.hidden, `looking away: "${label}"`);
  btn.click(); step(1 / 60);
  pass &= check(!rest.active, 'nothing in reach: the button stands you up');
  // #219: lying in each bunk berth, the NYMÅNE reading lamp by the pillow is in reach: on and off without getting up
  {
    const reading = w.__app.lights.targets.filter((t) => t.name === 'läslampan');
    const bunks = targets.filter((t) => t.name === 'våningssängen');
    let n = 0;
    for (const t of bunks) for (const sp of t.spots.filter((s) => s.kind === 'lie')) {
      const lamp = [...reading].sort((a, b) => a.pickable.getWorldPosition(new V()).distanceTo(sp.pos) - b.pickable.getWorldPosition(new V()).distanceTo(sp.pos))[0];
      const o = lamp.pickable.getWorldPosition(new V()), out = o.x < 3 ? 1 : -1;
      sitOn(t, sp); for (let i = 0; i < 60; i++) step(1 / 60);
      const lying = rest.active && rest.kind === 'lie' && rest.spot === sp;
      const lbl = look(o.clone().add(new V(out * 0.12, -0.06, 0))); // the shade
      const was = lamp.isOpen; // lamps start on when arriving in the dark
      btn.click(); step(1 / 60);
      const on = lamp.isOpen !== was && rest.active;
      btn.click(); step(1 / 60);
      const off = lamp.isOpen === was && rest.active;
      n++;
      pass &= check(lying && new RegExp(`${was ? 'släcka' : 'tända'} läslampan`, 'i').test(lbl) && on && off,
        `lying in ${sp.label} (${lamp.spec.room}, ${o.distanceTo(sp.pos).toFixed(2)} m from the eye): "${lbl}", toggled ${on}, back ${off}, still lying`);
      standUp(); for (let i = 0; i < 3; i++) step(1 / 60);
    }
    pass &= check(n === 4, `${n} berths with a reading lamp`);
  }
  // beyond reach while sitting: the TV across the room is no target
  sitOn(sofa, seat); for (let i = 0; i < 60; i++) step(1 / 60);
  label = look(tv.pickable.getWorldPosition(new V()));
  pass &= check(!/tv/i.test(label), `the TV across the room is out of reach: "${label}"`);
  standUp();
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
