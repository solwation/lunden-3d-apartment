<!doctype html><html><meta charset="utf-8"><title>First-focus warm-up #1508/#1514</title><pre id="out">running…</pre>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';
import {InteractionOutline} from '../src/interactionoutline.js';
import {WarmUp} from '../src/warmup.js';
const lines=[];let pass=true;const check=(v,s)=>{pass&&=!!v;lines.push((v?'PASS ':'FAIL ')+s)};
try {
 const scene=new T.Scene(),camera=new T.PerspectiveCamera(50,1,.1,20);camera.position.z=4;
 scene.add(new T.HemisphereLight(0xffffff,0x555555,2));
 const renderer=new T.WebGLRenderer({antialias:false});renderer.setSize(64,64);document.body.append(renderer.domElement);
 const gl=renderer.getContext(),create=gl.createProgram.bind(gl);let programs=0;
 gl.createProgram=(...args)=>{programs++;return create(...args)};
 const geometry=new T.BoxGeometry(.6,.6,.6),a=new T.Mesh(geometry,new T.MeshStandardMaterial({color:0x777777}));
 const b=new T.Mesh(geometry,a.material.clone());a.position.x=-.5;b.position.x=.5;scene.add(a,b);
 const ta={pickable:a},tb={pickable:b};a.userData.door=ta;b.userData.door=tb;
 const hidden=new T.Group(),leaf=new T.Mesh(geometry,new T.MeshBasicMaterial({color:0x999999,transparent:true,side:T.DoubleSide,opacity:.7}));
 hidden.visible=false;hidden.add(leaf);scene.add(hidden);const th={pickable:hidden};leaf.userData.door=th;
 const batch=new T.InstancedMesh(geometry,a.material,2);batch.position.y=1;scene.add(batch);
 const ti=i=>({outlineRoot:batch,outlineInstances:[{object:batch,index:i}]});batch.userData.door=ti(0);
 const outline=new InteractionOutline(scene,camera),target=new T.WebGLRenderTarget(64,64,{type:T.HalfFloatType});
 const children=scene.children.slice(),original=[a.material,b.material,leaf.material,batch.material];
 const warm=new WarmUp({renderer,scene,camera,mirrorTarget:()=>target,compileExtras:outline.warmCompiler(renderer,scene)});
 const late=new T.Mesh(geometry,new T.MeshStandardMaterial({color:0xabcdef,alphaTest:.04})),tl={pickable:late};late.userData.door=tl;scene.add(late);children.push(late);
 const compile=async target=>{const materials=warm.compileObjects(null,target);await warm.whenReady(materials,10000);return materials};
 const screen=await compile(null),mirror=await compile(target),afterWarm=programs;
 check(screen.size>3&&mirror.size>3,'focus materials join screen/mirror readiness sets before first focus');
 check(scene.children.length===children.length&&scene.children.every((o,i)=>o===children[i]),'compilation adds no renderable or scene child');
 check([a.material,b.material,leaf.material,batch.material].every((m,i)=>m===original[i]),'all actual materials remain original during compilation');
 const draw=t=>{outline.update(t);renderer.render(scene,camera)};
 for(const rt of [null,target]) {
  renderer.setRenderTarget(rt);hidden.visible=true;
  for(const t of [ta,tb,th,tl,ti(0),ti(1),null])draw(t);
 }
 check(programs===afterWarm,'first real focus on mesh/late-loaded/hidden/double-side/instance targets adds zero programs for screen and mirror: '+(programs-afterWarm));
 const first=outline.highlight(a.material,null),second=outline.highlight(b.material,null);
 check(first!==second,'sharing a GPU program does not merge independent source appearance state');
 b.material.color.set(0x123456);check(second.color.getHex()===0x123456&&first.color.getHex()!==0x123456,'live source appearance still follows each source separately');
 renderer.setRenderTarget(null);draw(ta);const oldFocus=a.material;let released=0;oldFocus.addEventListener('dispose',()=>released++);original[0].dispose();draw(ta);
 check(released===1&&a.material!==oldFocus,'source disposal releases its cached focus material and permits safe recreation even with shared GPU programs');outline.clear();
 check(a.material===original[0]&&b.material===original[1],'focus clear restores exact originals after disposal');
 // Sliced path compiles originals + extras through the same per-batch API.
 const sliced=new WarmUp({renderer,scene,camera,sliced:true,compileExtras:outline.warmCompiler(renderer,scene)});
 const materials=sliced.compileObjects([a,b,leaf,batch],null);await sliced.whenReady(materials,10000);
 const warmed=programs;for(const t of [ta,tb,th,ti(1),null])draw(t);
 check(programs===warmed,'sliced compileObjects includes first-focus variants too');
 // #1514: a drawing that arrives from IndexedDB after a compile stage has started (its stage's object list is
 // already taken) and is then re-keyed by the lamp-wash patch (prepare) — the real arrival/patch order.
 const wash=(root=scene)=>root.traverse(o=>{for(const m of [o.material].flat()){if(!m||m.userData.washed||m.isRawShaderMaterial)continue;
  m.userData.washed=true;const key=m.customProgramCacheKey;m.customProgramCacheKey=function(){return key.call(this)+'|wash1514'};m.needsUpdate=true;}});
 const poster=(color,opts={})=>{const m=new T.Mesh(new T.PlaneGeometry(.4,.5),new T.MeshStandardMaterial({color,transparent:true,alphaTest:.04,...opts}));
  const t={pickable:m};m.userData.door=t;m.userData.poster=t;m.position.set(Math.random()-.5,-.8,0);return [m,t]};
 const focusAll=(ts,rts=[null,target])=>{const n=programs;for(const rt of rts){renderer.setRenderTarget(rt);for(const t of [...ts,null])draw(t)}renderer.setRenderTarget(null);return programs-n};
 const run=async(w,{at,add,perTick})=>{for(let i=0;i<4000&&!w.done;i++){if(at(w))add();const n=programs;w.tick();perTick?.push(programs-n);await new Promise(r=>setTimeout(r,4))}};
 {
  const w=new WarmUp({renderer,scene,camera,mirrorTarget:()=>target,prepare:wash,compileExtras:outline.warmCompiler(renderer,scene)});
  const [m,t]=poster(0x8899aa);let added=false;
  await run(w,{at:w=>!added&&w.state==='compiling'&&!w.job,add:()=>{added=true;scene.add(m);w.add?.(m)}});
  check(added&&w.done,'desktop: drawing added while the screen programs compile, warm-up still finishes');
  check(m.material.userData.washed,'late drawing gets its final (lamp-wash) material key before it is compiled');
  const fresh=focusAll([t]);check(fresh===0,'desktop late arrival: first screen+mirror focus on the drawing adds zero programs: '+fresh);
  const [m2,t2]=poster(0x445566,{dithering:true});scene.add(m2);w.add?.(m2);
  const n=programs;w.lateSlice?.();const compiled=programs-n;
  const after=focusAll([t2]);check(after===0&&compiled>0,`after warm.done: lateSlice compiles ${compiled} programs, first focus adds ${after}`);
  const [m3]=poster(0x112233,{flatShading:true});scene.add(m3);w.add?.(m3);m3.removeFromParent();const n3=programs;w.lateSlice?.();
  check(programs===n3&&!(w.late?.length),'a drawing taken down before its turn is dropped from the queue, nothing compiled');
  scene.remove(m,m2);
  const skipped=new WarmUp({renderer,scene,camera,skip:true});skipped.add?.(m);check(!(skipped.late?.length)&&!skipped.lateSlice?.(),'skipped warm-up (tests) queues nothing');
 }
 {
  const w=new WarmUp({renderer,scene,camera,mirrorTarget:()=>target,prepare:wash,sliced:true,lazyHidden:true,compileExtras:outline.warmCompiler(renderer,scene)});
  const [m,t]=poster(0x9a7b6c,{vertexColors:true}),perTick=[],calls=[];
  for(const k of ['lateSlice','compileSlice']){const f=w[k];if(f)w[k]=function(){const n=programs,r=f.apply(this,arguments);calls.push({k,n:programs-n,r});return r}}m.geometry.setAttribute('color',new T.Float32BufferAttribute(new Array(12).fill(1),3));let added=false;
  await run(w,{at:w=>!added&&w.state==='compiling'&&w.job?.i>0,add:()=>{added=true;scene.add(m);w.add?.(m)},perTick:{push:()=>{perTick.push(calls.splice(0))}}});
  check(added&&w.done,'phone sliced: drawing added between compile slices, warm-up still finishes');
  const fresh=focusAll([t]);check(fresh===0,'phone sliced late arrival: first screen+mirror focus adds zero programs: '+fresh);
  const lateTicks=perTick.filter(c=>c.some(x=>x.k==='lateSlice'&&x.r));
  check(lateTicks.length>0&&lateTicks.every(c=>!c.some(x=>x.k==='compileSlice')&&c.every(x=>x.n<=8)),`phone sliced: late compile takes its own frame within the slice budget (${lateTicks.map(c=>c.map(x=>x.n).join('+')).join(', ')} programs)`);
  scene.remove(m);
 }
 // #1536: transparent + DoubleSide + !forceSinglePass draws two passes (BackSide, FrontSide) but currentProgram is the FrontSide one,
 // so a single-sided material of the same parameters must not mask the two-pass target's first-focus variants.
 {
  const mk=(x,opts)=>{const m=new T.Mesh(geometry,new T.MeshStandardMaterial({color:0x336699,fog:false,transparent:true,alphaTest:.04,...opts}));const t={pickable:m};m.userData.door=t;m.position.set(x,-1.6,0);scene.add(m);return [m,t]};
  const [,t1]=mk(-.5,{}),[,t2]=mk(.5,{side:T.DoubleSide});
  const w=new WarmUp({renderer,scene,camera,mirrorTarget:()=>target,compileExtras:outline.warmCompiler(renderer,scene)});
  for(const rt of [null,target]){const ms=w.compileObjects(null,rt);await w.whenReady(ms,10000)}
  const fresh=focusAll([t1,t2]);check(fresh===0,'#1536: single-sided + double-sided transparent targets of equal parameters: first screen+mirror focus adds zero programs: '+fresh);
 }
 renderer.dispose();target.dispose();geometry.dispose();
 document.getElementById('out').textContent=lines.join('\n')+'\n'+(pass?'ALL PASS':'SOME FAILED');
}catch(e){document.getElementById('out').textContent=lines.join('\n')+'\nFAIL '+e.stack}
</script></html>
