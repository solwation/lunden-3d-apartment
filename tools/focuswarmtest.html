<!doctype html><html><meta charset="utf-8"><title>First-focus warm-up #1508</title><pre id="out">running…</pre>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<script type="module">
import * as T from 'three';
import {InteractionOutline} from '../src/interactionoutline.js';
import {WarmUp} from '../src/warmup.js';
const lines=[];let pass=true;const check=(v,s)=>{pass&&=!!v;lines.push((v?'PASS ':'FAIL ')+s)};

 const scene=new T.Scene(),camera=new T.PerspectiveCamera(50,1,.1,20);camera.position.z=4;
 scene.add(new T.HemisphereLight(0xffffff,0x555555,2));

 const gl=renderer.getContext(),create=gl.createProgram.bind(gl);let programs=0;

 hidden.visible=false;hidden.add(leaf);scene.add(hidden);const th={pickable:hidden};leaf.userData.door=th;
 const batch=new T.InstancedMesh(geometry,a.material,2);batch.position.y=1;scene.add(batch);
 const ti=i=>({outlineRoot:batch,outlineInstances:[{object:batch,index:i}]});batch.userData.door=ti(0);

 const screen=await compile(null),mirror=await compile(target),afterWarm=programs;

 check(scene.children.length===children.length&&scene.children.every((o,i)=>o===children[i]),'compilation adds no renderable or scene child');

 for(const rt of [null,target]) {
  renderer.setRenderTarget(rt);hidden.visible=true;
  for(const t of [ta,tb,th,tl,ti(0),ti(1),null])draw(t);
 }
 check(programs===afterWarm,'first real focus on mesh/late-loaded/hidden/double-side/instance targets adds zero programs for screen and mirror: '+(programs-afterWarm));

 check(first!==second,'sharing a GPU program does not merge independent source appearance state');
 b.material.color.set(0x123456);check(second.color.getHex()===0x123456&&first.color.getHex()!==0x123456,'live source appearance still follows each source separately');
 renderer.setRenderTarget(null);draw(ta);const oldFocus=a.material;let released=0;oldFocus.addEventListener('dispose',()=>released++);original[0].dispose();draw(ta);
 check(released===1&&a.material!==oldFocus,'source disposal releases its cached focus material and permits safe recreation even with shared GPU programs');outline.clear();
 check(a.material===original[0]&&b.material===original[1],'focus clear restores exact originals after disposal');

 const sliced=new WarmUp({renderer,scene,camera,sliced:true,compileExtras:outline.warmCompiler(renderer,scene)});

 const warmed=programs;for(const t of [ta,tb,th,ti(1),null])draw(t);
 check(programs===warmed,'sliced compileObjects includes first-focus variants too');
 renderer.dispose();target.dispose();geometry.dispose();

}catch(e){document.getElementById('out').textContent=lines.join('\n')+'\nFAIL '+e.stack}
</script></html>
