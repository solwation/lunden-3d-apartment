<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Far walk test</title>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
<pre id="out">running…</pre>
<script type="module">
// #1236: headless walk through the real world beyond the home block: the river (water is an obstacle), the bridges (rails,
// deck ends), the mapped buildings and the outer edge. Same Player/collision as the game; exposes `window.far` for probing.
//   python3 tools/devserve.py 8776 .   then   node tools/farwalktest.cjs http://localhost:8776
import * as THREE from 'three';
import { buildWorld } from '../src/world.js';
import { Player } from '../src/player.js';
import { Garage } from '../src/garage.js';
import { Core } from '../src/core.js';
import { WALK, SITE, PLAYER } from '../src/config.js';
import { groundY, groundBelowDeckY, renderedTerrainY, treeFeet } from '../src/surroundings.js';
import { riverAt, deckAt, bridgeRecords, pierBoxes } from '../src/riverbridge.js';

const out = document.getElementById('out');
const plan = await fetch('../data/plan.json').then((r) => r.json());
const world = buildWorld(plan);
world.garage = new Garage();
world.core = new Core();
const camera = new THREE.PerspectiveCamera();
camera.rotation.order = 'YXZ';
const player = new Player(world, camera);
window.far = { world, player, groundY, renderedTerrainY, riverAt, WALK, SITE };
const dt = 1 / 60;
const log = [];
let pass = true;
const walk = (points, { run = true, step = null } = {}) => { // walks the waypoints; returns the first one it got stuck on, or -1
  for (let i = 0; i < points.length; i++) {
    const [x, z] = points[i];
    const limit = 8 + Math.hypot(player.pos.x - x, player.pos.z - z) / 1.6;
    let t = 0;
    while (Math.hypot(player.pos.x - x, player.pos.z - z) > 0.2) {
      camera.rotation.y = Math.atan2(-(x - player.pos.x), -(z - player.pos.z));
      player.keys = new Set(run ? ['KeyW', 'ShiftLeft'] : ['KeyW']);
      player.update(dt);
      step?.();
      t += dt;
      if (t > limit) { player.keys = new Set(); return i; }
    }
  }
  player.keys = new Set();
  for (let i = 0; i < 30; i++) player.update(dt);
  return -1;
};
const check = (ok, text) => { pass &&= ok; log.push(`${ok ? 'PASS' : 'FAIL'} ${text}`); };
const at = () => `(${player.pos.x.toFixed(1)}, ${player.pos.z.toFixed(1)}) y=${player.pos.y.toFixed(2)}`;
const routes = window.routes = [];
export const route = (name, start, points, expect) => routes.push({ name, start, points, expect });

const R = [
  // [name, start, waypoints, expectation(player) -> bool]
  ['parkplanet → gångstråket ner mot ån (slänten går att gå på)', [-35, 61], [[-30, 66], [-28, 70], [-30, 80], [-39, 95], [-40, 110], [-41, 118]],
    () => player.pos.z > 117 && player.pos.y <= -2.9],
  ['ån är ett hinder: rakt ut i vattnet stoppar vid strandkanten', [-41, 118], [[-41, 150]],
    () => { const r = riverAt(player.pos.x, player.pos.z); return r.distance >= r.width / 2 + 1.5 && player.pos.y > SITE.bridges.waterY - 0.1 && player.pos.y < -4; }],
  ['vägbron: över ån längs Sankt Lars väg till södra stranden', [23.5, 90], [[23.7, 100], [23.5, 125], [23.3, 143], [23.3, 155]],
    () => player.pos.z > 150],
  ['gång- och cykelbron: över ån', [18, 92], [[18.1, 101], [17.9, 125], [17.8, 146], [17.8, 155]], () => player.pos.z > 150],
  // #1271: the river footpath (OSM 44447963) runs UNDER both decks, in the cut; walk it east -> west and back
  ['vägbrons räcke stoppar: ut över sidan', [23.5, 125], [[30, 125]], () => player.pos.x < 27.5 + 0.3 && player.pos.y > -3.05],
  ['HepCat Store: byggnaden stoppar', [24, 0], [[34, 0]], () => player.pos.x < 28],
  ['Villan i parken: väggen stoppar', [-70, 75], [[-55, 75]], () => player.pos.x < -63],
  ['skolområdet: längs Sankt Lars väg norrut till Klockhuset', [20, -10], [[20, -40], [20, -80], [24, -108], [45, -109]], () => player.pos.z < -108 && player.pos.x > 40],
  ['Klockhuset: fasaden med klocktornet stoppar', [45, -109], [[45, -125]], () => player.pos.z > -113.5],
  ['skolområdet: öster om Klockhuset mellan byggnaderna', [45, -109], [[70, -108], [100, -108], [130, -105], [130, -60]], () => player.pos.z > -62 && player.pos.x > 125],
  ['skolbyggnaden öster om Klockhuset stoppar', [100, -108], [[100, -125]], () => player.pos.z > -112.6 && player.pos.z < -111.5],
  ['skolområdet: söderut mellan Höjebroskolan och Kunskapsskolan tillbaka till kvarteret', [130, -60], [[130, -30], [75, -25], [40, -20], [25, -5]], () => player.pos.x < 30],
  ['Realgymnasiet: byggnadens östra vägg stoppar', [66, -30], [[66, -60], [55, -60]], () => player.pos.x > 61 && player.pos.x < 62],
  ['ytterkanten (WALK) stoppar västerut', [-240, 30], [[-290, 30]], () => player.pos.x >= WALK.x0 && player.pos.x < WALK.x0 + 0.6],
  ['ytterkanten (WALK) stoppar österut', [300, 20], [[340, 20]], () => player.pos.x <= WALK.x1 && player.pos.x > WALK.x1 - 0.6],
  ['ytterkanten (WALK) stoppar norrut', [60, -180], [[60, -230]], () => player.pos.z >= WALK.z0],
  ['ytterkanten (WALK) stoppar söderut', [60, 230], [[60, 280]], () => player.pos.z <= WALK.z1],
];

{ // #1271: the river footpath (OSM 44447963) runs UNDER both decks, in the cut: walk it both ways; under the decks the head clears the underside
  const B = SITE.bridges, pts = [[29.2, 110.9], [23.6, 111.1], [18, 111.5], [6.6, 111.8]];
  for (const [name, start, points, endX] of [['öst -> väst', [36.2, 106.4], pts, 8], ['väst -> öst', [6.6, 111.8], [...pts].reverse().slice(1).concat([[36.2, 106.4]]), 35]]) {
    player.spawn(start[0], start[1], 0);
    let low = 0, under = 0, head = Infinity, aboveDeck = 0;
    const stuck = walk(points, { run: false, step: () => {
      if (deckAt(player.pos.x, player.pos.z) !== null) { under++; head = Math.min(head, B.deckY - B.road.slab - (player.pos.y + PLAYER.headroom)); if (player.pos.y > B.deckY - 1) aboveDeck++; }
      low = Math.min(low, player.pos.y);
    } });
    const ok = stuck === -1 && (endX === 8 ? player.pos.x < endX : player.pos.x > endX) && under > 60 && head > 0.1 && !aboveDeck;
    check(ok, `gångvägen vid ån under båda broarna, ${name}: ${under} steg under däcken, minsta fria höjd över huvudet ${head.toFixed(2)} m, lägsta y ${low.toFixed(2)}${ok ? '' : ` — stannade vid ${at()} (hinder vid punkt ${stuck})`}`);
  }
  // a pier of the road bridge stops the body walking along the cut (the deck's rails do not: walked above), and the deck's rails do not stop the walker under it
  const p = pierBoxes()[0]; player.spawn(p.x, p.z - 3, 0); player.pos.y = groundBelowDeckY(p.x, p.z - 3); walk([[p.x, p.z + 3]], { run: false });
  check(Math.abs(player.pos.z - p.z) > p.half - 0.05 && player.pos.z < p.z, `en brostolpe stoppar kroppen under bron (${at()}, stolpe ${p.x.toFixed(1)},${p.z.toFixed(1)})`);
  const gc = bridgeRecords[1]; const cz = gc.z - 12; player.spawn(gc.x - 6, cz, 0); player.pos.y = groundBelowDeckY(gc.x - 6, cz); walk([[gc.x + 6, cz]], { run: false });
  check(player.pos.x > gc.x + 5.5 && player.pos.y < B.deckY - 1.9, `tvärs under GC-bron: räcket på däcket stoppar inte (${at()})`);
}
for (const [name, start, points, ok] of R) {
  player.spawn(start[0], start[1], 0);
  const stuckAt = walk(points);
  const good = ok();
  check(good, `${name}${good ? '' : ` — stannade vid ${at()} (hinder vid punkt ${stuckAt})`}`);
  log.push(`   ended ${at()}`);
}
{ // a tree trunk in the park woods stops the body (a diamond, WALK.trunk)
  const alone = treeFeet.find((t) => t.kind === 'big' && t.patch && t.x > -100 && t.x < 100 && t.z > 70 && t.z < 130 && !treeFeet.some((u) => u !== t && Math.hypot(u.x - t.x, u.z - t.z) < 6));
  player.spawn(alone.x - 3, alone.z, 0); walk([[alone.x + 3, alone.z]]);
  check(player.pos.x < alone.x - 0.2, `trädstammen i parken stoppar (${at()}, stam ${alone.x.toFixed(1)},${alone.z.toFixed(1)})`);
}
{ // landed in a closed courtyard (Realgymnasiet's hole): put out on the street, and told so
  const hole = SITE.east.buildings.find((b) => b.holes?.length).holes[0], cx = hole.reduce((a, p) => a + p[0], 0) / hole.length, cz = hole.reduce((a, p) => a + p[1], 0) / hole.length;
  let told = ''; player.onWaterRescue = (w) => { told = w; };
  player.spawn(cx, cz, 0); player.update(dt);
  const b = SITE.east.buildings.find((q) => q.holes?.length), ins = (x, z, p) => { let y = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) if ((p[i][1] > z) !== (p[j][1] > z) && x < (p[j][0] - p[i][0]) * (z - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) y = !y; return y; };
  check(told === 'building' && !ins(player.pos.x, player.pos.z, b.polygon), `innergården utan väg ut: flyttas ut på gatan (${at()})`);
  player.onWaterRescue = null;
}
{ // the outer wall tells the visitor
  let told = 0; player.onEdge = () => told++; player.edgeAt = undefined;
  player.spawn(WALK.x1 - 3, 20, 0); walk([[WALK.x1 + 20, 20]]);
  check(told === 1, `ytterkanten säger ifrån en gång (${told})`);
}
{ // ended up in the water (a fall off a bridge, a jetpack drop): put back on the bank, dry
  const r0 = riverAt(-41, 143), side = [r0.x + r0.nx * 0.2, r0.z + r0.nz * 0.2];
  player.spawn(...side, 0); player.pos.y = SITE.bridges.bedY; player.update(dt);
  const r = riverAt(player.pos.x, player.pos.z);
  check(r.distance >= r.width / 2 + 1 && Math.abs(player.pos.y - groundY(player.pos.x, player.pos.z)) < 0.1, `i ån: flyttas tillbaka till stranden (${at()})`);
}
out.textContent = log.join('\n');
out.dataset.log = log.join('\n');
out.dataset.done = pass ? 'pass' : 'fail';
</script>
</body>
</html>
