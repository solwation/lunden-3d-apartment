<pre id="out">running…</pre>
<script type="module">
// #1236: headless walk through the real world beyond the home block: the river (water is an obstacle), the bridges (rails,
// deck ends), the mapped buildings and the outer edge. Same Player/collision as the game; exposes `window.far` for probing.
//   python3 tools/devserve.py 8776 .   then   node tools/farwalktest.cjs http://localhost:8776
import * as THREE from 'three';
import { buildWorld } from '../src/world.js';
import { Player } from '../src/player.js';
import { Garage } from '../src/garage.js';
import { Core } from '../src/core.js';
import { WALK, SITE, PLAYER } from '../src/config.js';
import { farWalls, inWater, slideAt, slopeAt } from '../src/farwalk.js';
import { groundY, groundBelowDeckY, renderedTerrainY, treeFeet } from '../src/surroundings.js';
import { riverAt, waterYAt, deckAt, deckUnderAt, bridgeRecords, pierBoxes } from '../src/riverbridge.js';
import { parkRampEnds } from '../src/riverpark.js';

const out = document.getElementById('out');
// #1312: the page must always end with a final line the runner (tools/runnerverdict.cjs) recognises: "ALL PASS N checks" or
// "FAIL N checks". An exception anywhere (or the time budget below) writes the FAIL line, so a hang/crash is a fast FAIL, never a silent wait.
const T0 = performance.now(), BUDGET_MS = 240000; // every loop below steps player.update; the whole page is one synchronous run (~1 min on SwiftShader)
const log = [];
let pass = true;
const finish = (why) => {
  if (why) { pass = false; log.push(`FAIL ${why}`); }
  const n = log.filter((l) => /^(PASS|FAIL) /.test(l)).length, bad = log.filter((l) => l.startsWith('FAIL ')).length;
  log.push(`time ${((performance.now() - T0) / 1000).toFixed(1)} s`, pass ? `ALL PASS ${n} checks` : `FAIL ${bad} checks`);
  out.textContent = log.join('\n'); out.dataset.log = log.join('\n'); out.dataset.done = pass ? 'pass' : 'fail';
};
window.addEventListener('error', (e) => { if (!out.dataset.done) finish(`exception: ${e.message}`); });
window.addEventListener('unhandledrejection', (e) => { if (!out.dataset.done) finish(`exception: ${e.reason?.message ?? e.reason}`); });
const plan = await fetch('../data/plan.json').then((r) => r.json());
const world = buildWorld(plan);
world.garage = new Garage();
world.core = new Core();
const camera = new THREE.PerspectiveCamera();
camera.rotation.order = 'YXZ';
const player = new Player(world, camera);
window.far = { world, player, groundY, renderedTerrainY, riverAt, WALK, SITE };
const dt = 1 / 60;
const splashes = []; // #1281: every splash the player reports
player.onWaterRescue = (what, at) => { if (what === 'water') splashes.push({ at, to: { x: player.pos.x, z: player.pos.z, y: player.pos.y } }); };
const stepUpdate = player.update.bind(player);
player.update = (d) => { if (performance.now() - T0 > BUDGET_MS) throw new Error(`time budget ${BUDGET_MS / 1000} s exceeded`); return stepUpdate(d); };
const walk = (points, { run = true, step = null } = {}) => { // walks the waypoints; returns the first one it got stuck on, or -1
  for (let i = 0; i < points.length; i++) {
    const [x, z] = points[i];
    const limit = 8 + Math.hypot(player.pos.x - x, player.pos.z - z) / 1.6;
    let t = 0;
    while (Math.hypot(player.pos.x - x, player.pos.z - z) > 0.2) {
      camera.rotation.y = Math.atan2(-(x - player.pos.x), -(z - player.pos.z));
      player.keys = new Set(run ? ['KeyW', 'ShiftLeft'] : ['KeyW']);
      player.update(dt);
      if (step?.() === true) { player.keys = new Set(); return -1; }
      t += dt;
      if (t > limit) { player.keys = new Set(); return i; }
    }
  }
  player.keys = new Set();
  for (let i = 0; i < 30; i++) player.update(dt);
  return -1;
};
const check = (ok, text) => { pass &&= ok; log.push(`${ok ? 'PASS' : 'FAIL'} ${text} [${((performance.now() - T0) / 1000).toFixed(0)} s]`); }; // #1358: elapsed time per check, to see where the budget goes
const at = () => `(${player.pos.x.toFixed(1)}, ${player.pos.z.toFixed(1)}) y=${player.pos.y.toFixed(2)}`;
const routes = window.routes = [];
export const route = (name, start, points, expect) => routes.push({ name, start, points, expect });

const R = [
  // [name, start, waypoints, expectation(player) -> bool]
  ['parkplanet → gångstråket ner mot ån (slänten går att gå på)', [-35, 61], [[-30, 66], [-28, 70], [-30, 80], [-39, 95], [-40, 110], [-41, 118]],
    () => player.pos.z > 117 && player.pos.y <= -2.9],
  ['ån: rakt ut i vattnet ger plask och återstart torrt på stranden (inte en osynlig vägg)', [-41, 135], [[-41, 150]],
    () => splashes.length >= 1 && !inWater(player.pos.x, player.pos.z, player.pos.y) && player.pos.y > waterYAt(player.pos.x, player.pos.z) + 0.3],
  ['vägbron: över ån längs Sankt Lars väg till södra stranden', [23.5, 90], [[23.7, 100], [23.5, 125], [23.3, 143], [23.3, 155]],
    () => player.pos.z > 150],
  ['gång- och cykelbron: över ån', [18, 92], [[18.1, 101], [17.9, 125], [17.8, 146], [17.8, 155]], () => player.pos.z > 150],
  // #1382: travel both ways across the retained deck datum and the sampled southern bank.
  ['vägbron söderut till vägbankens krön', [23.5, 140], [[23.3,145.5],[23.6,152],[24.3,168],[25.6,184]], () => player.pos.z>183&&player.pos.y>-.1],
  ['vägbanken norrut över vägbrons anslutning', [25.6,184], [[24.3,168],[23.6,152],[23.3,145.5],[23.5,140]], () => player.pos.z<141&&Math.abs(player.pos.y+3)<.1],
  ['GC-bron söderut över anslutningen till slänten', [17.8,140], [[17.8,146],[18.6,152],[19,157]], () => player.pos.z>156&&player.pos.y>-1],
  ['GC-anslutningen norrut tillbaka över bron', [19,157], [[18.6,152],[17.8,146],[17.8,140]], () => player.pos.z<141&&Math.abs(player.pos.y+3)<.1],
  // #1271: the river footpath (OSM 44447963) runs UNDER both decks, in the cut; walk it east -> west and back
  ['vägbrons räcke stoppar: ut över sidan', [23.5, 125], [[30, 125]], () => player.pos.x < 27.5 + 0.3 && player.pos.y > -3.05],
  ['HepCat Store: byggnaden stoppar', [24, 0], [[34, 0]], () => player.pos.x < 28],
  ['Villan i parken: väggen stoppar', [-70, 75], [[-55, 75]], () => player.pos.x < -63],
  // #1542: round the school wall's east end (it stands x -26…30 along the far pavement, solid from the ground)
  ['skolområdet: längs Sankt Lars väg norrut till Klockhuset', [20, -10], [[31, -28], [31, -38], [21, -39], [20, -80], [24, -108], [45, -109]], () => player.pos.z < -108 && player.pos.x > 40],
  ['skolmuren: muren stoppar från gatan', [0, -28], [[0, -38]], () => player.pos.z > -32.0 && player.pos.z < -31],
  ['skolmuren: muren stoppar vid östra änden', [28, -28], [[28, -38]], () => player.pos.z > -32.0 && player.pos.z < -31],
  ['Klockhuset: fasaden med klocktornet stoppar', [45, -109], [[45, -125]], () => player.pos.z > -113.5],
  ['skolområdet: öster om Klockhuset mellan byggnaderna', [45, -109], [[70, -108], [100, -108], [130, -105], [130, -60]], () => player.pos.z > -62 && player.pos.x > 125],
  ['skolbyggnaden öster om Klockhuset stoppar', [100, -108], [[100, -125]], () => player.pos.z > -112.6 && player.pos.z < -111.5],
  ['skolområdet: söderut mellan Höjebroskolan och Kunskapsskolan tillbaka till kvarteret', [130, -60], [[130, -30], [75, -25], [40, -20], [25, -5]], () => player.pos.x < 30],
  ['Realgymnasiet: byggnadens östra vägg stoppar', [66, -30], [[66, -60], [55, -60]], () => player.pos.x > 61 && player.pos.x < 62],
  ['ytterkanten (WALK) stoppar västerut', [-240, 30], [[-290, 30]], () => player.pos.x >= WALK.x0 && player.pos.x < WALK.x0 + 0.6],
  ['ytterkanten (WALK) stoppar österut', [300, 20], [[340, 20]], () => player.pos.x <= WALK.x1 && player.pos.x > WALK.x1 - 0.6],
  ['ytterkanten (WALK) stoppar norrut', [60, -180], [[60, -230]], () => player.pos.z >= WALK.z0],
  ['ytterkanten (WALK) stoppar söderut', [60, 230], [[60, 280]], () => player.pos.z <= WALK.z1],
];

{ // #1271: the river footpath (OSM 44447963) runs UNDER both decks, in the cut: walk it both ways; under the decks the head clears the underside
  const B = SITE.bridges, pts = [[29.2, 110.9], [23.6, 111.1], [18, 111.5], [6.6, 111.8]];
  for (const [name, start, points, endX] of [['öst -> väst', [36.2, 106.4], pts, 8], ['väst -> öst', [6.6, 111.8], [...pts].reverse().slice(1).concat([[36.2, 106.4]]), 35]]) {
    player.spawn(start[0], start[1], 0); splashes.length = 0;
    let low = 0, under = 0, head = Infinity, aboveDeck = 0;
    const stuck = walk(points, { run: false, step: () => {
      if (deckAt(player.pos.x, player.pos.z) !== null) { under++; head = Math.min(head, deckUnderAt(player.pos.x, player.pos.z) - (player.pos.y + PLAYER.headroom)); if (player.pos.y > B.deckY - 1) aboveDeck++; }
      low = Math.min(low, player.pos.y);
    } });
    const ok = stuck === -1 && (endX === 8 ? player.pos.x < endX : player.pos.x > endX) && under > 60 && head > 0.1 && !aboveDeck && splashes.length === 0; // (the cut's floor is 0.6 m over the water: no splash)
    check(ok, `gångvägen vid ån under båda broarna, ${name}: ${under} steg under däcken, minsta fria höjd över huvudet ${head.toFixed(2)} m, lägsta y ${low.toFixed(2)}${ok ? '' : ` — stannade vid ${at()} (hinder vid punkt ${stuck})`}`);
  }
  // a pier of the road bridge stops the body walking along the cut (the deck's rails do not: walked above), and the deck's rails do not stop the walker under it
  const p = pierBoxes()[0]; player.spawn(p.x, p.z - 3, 0); player.pos.y = groundBelowDeckY(p.x, p.z - 3); walk([[p.x, p.z + 3]], { run: false });
  check(Math.abs(player.pos.z - p.z) > p.half - 0.05 && player.pos.z < p.z, `en brostolpe stoppar kroppen under bron (${at()}, stolpe ${p.x.toFixed(1)},${p.z.toFixed(1)})`);
  const gc = bridgeRecords[1]; const cz = gc.z - 12; player.spawn(gc.x - 6, cz, 0); player.pos.y = groundBelowDeckY(gc.x - 6, cz); walk([[gc.x + 6, cz]], { run: false });
  check(player.pos.x > gc.x + 5.5 && player.pos.y < B.deckY - 1.9, `tvärs under GC-bron: räcket på däcket stoppar inte (${at()})`);
  // #1284: the jetpack lifting from the cut under a deck stops at the underside (like a jump), but flies freely beside the bridge
  const jetUp = (x, z, y0) => { player.spawn(x, z, 0); player.pos.y = y0; player.jet = { worn: true, lift: () => 20 }; player.keys = new Set(); let hi = player.pos.y; for (let i = 0; i < 240; i++) { player.update(dt); hi = Math.max(hi, player.pos.y); } player.jet = null; return hi; };
  for (const [name, rec] of [['vägbron', bridgeRecords[0]], ['GC-bron', bridgeRecords[1]]]) {
    // #1531: 4 m off the bridge middle, on the bank of the narrowed channel (6 m off now lies on the shore flat, only 2.05 m under the road slab)
    const hi = jetUp(rec.x - 1, rec.z - 4, groundBelowDeckY(rec.x - 1, rec.z - 4));
    check(hi < B.deckY - rec.slab - PLAYER.headroom + 0.01 && hi > B.deckY - rec.slab - PLAYER.headroom - 0.2 && hi > groundBelowDeckY(rec.x - 1, rec.z - 4) + 0.3 && groundBelowDeckY(rec.x - 1, rec.z - 4) > waterYAt(rec.x - 1, rec.z - 4), `jetpacken under ${name} stoppas av däckets undersida (högst y=${hi.toFixed(2)}, undersida ${(B.deckY - rec.slab).toFixed(2)}, tjocklek ${rec.slab})`);
  }
  { const r = bridgeRecords[0], x = r.x + r.width / 2 + 3, hi = jetUp(x, r.z - 6, groundY(x, r.z - 6)); check(hi > B.deckY + 2, `jetpacken vid sidan om vägbron flyger fritt uppåt (högst y=${hi.toFixed(2)})`); }
}
for (const [name, start, points, ok] of R) {
  player.spawn(start[0], start[1], 0); splashes.length = 0;
  const stuckAt = walk(points, { step: () => splashes.length > 0 });
  const good = ok();
  check(good, `${name}${good ? '' : ` — stannade vid ${at()} (hinder vid punkt ${stuckAt})`}`);
  log.push(`   ended ${at()}`);
}
{ // a tree trunk in the park woods stops the body (a diamond, WALK.trunk)
  const alone = treeFeet.find((t) => t.kind === 'big' && t.patch && t.x > -100 && t.x < 100 && t.z > 70 && t.z < 130 && !treeFeet.some((u) => u !== t && Math.hypot(u.x - t.x, u.z - t.z) < 6));
  player.spawn(alone.x - 3, alone.z, 0); walk([[alone.x + 3, alone.z]]);
  check(player.pos.x < alone.x - 0.2, `trädstammen i parken stoppar (${at()}, stam ${alone.x.toFixed(1)},${alone.z.toFixed(1)})`);
}
{ // landed in a closed courtyard (Realgymnasiet's hole): put out on the street, and told so
  const hole = SITE.east.buildings.find((b) => b.holes?.length).holes[0], cx = hole.reduce((a, p) => a + p[0], 0) / hole.length, cz = hole.reduce((a, p) => a + p[1], 0) / hole.length;
  let told = ''; player.onWaterRescue = (w) => { told = w; };
  player.spawn(cx, cz, 0); player.update(dt);
  const b = SITE.east.buildings.find((q) => q.holes?.length), ins = (x, z, p) => { let y = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) if ((p[i][1] > z) !== (p[j][1] > z) && x < (p[j][0] - p[i][0]) * (z - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) y = !y; return y; };
  check(told === 'building' && !ins(player.pos.x, player.pos.z, b.polygon), `innergården utan väg ut: flyttas ut på gatan (${at()})`);
  player.onWaterRescue = (what, at) => { if (what === 'water') splashes.push({ at }); };
}
{ // the outer wall tells the visitor
  let told = 0; player.onEdge = () => told++; player.edgeAt = undefined;
  player.spawn(WALK.x1 - 3, 20, 0); walk([[WALK.x1 + 20, 20]]);
  check(told === 1, `ytterkanten säger ifrån en gång (${told})`);
}
{ // #1281: ended up in the water (a drop at the river's middle): a splash, back on the nearest dry bank, still, unhurt for a while
  const r0 = riverAt(-41, 143), side = [r0.x + r0.nx * 0.2, r0.z + r0.nz * 0.2];
  splashes.length = 0; player.spawn(...side, 0); player.pos.y = groundBelowDeckY(player.pos.x, player.pos.z); player.vy = -3; player.update(dt);
  check(splashes.length === 1 && !inWater(player.pos.x, player.pos.z, player.pos.y) && player.pos.y > waterYAt(player.pos.x, player.pos.z) + 0.3 && player.vy === 0 && player.safeUntil > performance.now() && Math.hypot(player.pos.x - side[0], player.pos.z - side[1]) < 15,
    `i ån: plask, flyttas till närmaste torra strand, stilla, skyddad mot fallskada (${at()}, ${splashes.length} plask)`);
  // the respawn point is clear of every wall and not in the paddock, over a number of river positions along the whole river
  let bad = 0, n = 0;
  for (let z = 62; z < 240; z += 3) for (let x = -250; x < 310; x += 11) {
    const r = riverAt(x, z); if (r.distance > 0.5 || z !== Math.round(z)) continue;
    n++; splashes.length = 0; player.spawn(x, z, 0); player.pos.y = groundBelowDeckY(player.pos.x, player.pos.z); player.update(dt);
    const hit = farWalls(player.pos.x, player.pos.z, player.pos.y).some((sg) => { const dx = sg[2] - sg[0], dz = sg[3] - sg[1], t = Math.max(0, Math.min(1, ((player.pos.x - sg[0]) * dx + (player.pos.z - sg[1]) * dz) / (dx * dx + dz * dz || 1e-9))); return Math.hypot(player.pos.x - sg[0] - dx * t, player.pos.z - sg[1] - dz * t) < PLAYER.radius - 0.01; });
    if (splashes.length !== 1 || hit || inWater(player.pos.x, player.pos.z, player.pos.y) || slideAt(player.pos.x, player.pos.z, player.pos.y, true)) bad++;
  }
  check(n > 10 && bad === 0, `plaskplatsens återstart är torr, gångbar och fri från väggar på ${n} ställen längs ån (${bad} dåliga)`);
}
{ // #1281: the jetpack over the water does not splash; coming down into it does
  const r0 = riverAt(-41, 143); splashes.length = 0; player.spawn(r0.x, r0.z, 0); player.pos.y = waterYAt(r0.x, r0.z) + 2;
  player.jet = { worn: true, lift: () => 9.81 }; player.keys = new Set();
  let low = Infinity; for (let i = 0; i < 180; i++) { player.update(dt); low = Math.min(low, player.pos.y); }
  check(splashes.length === 0 && low > waterYAt(r0.x, r0.z), `jetpacken svävar över ån utan plask (lägsta y ${low.toFixed(2)}, ${splashes.length} plask)`);
  player.jet = { worn: true, lift: () => -20 }; for (let i = 0; i < 300 && !splashes.length; i++) player.update(dt);
  player.jet = null;
  check(splashes.length === 1 && !inWater(player.pos.x, player.pos.z, player.pos.y), `jetpacken ner i ån: plask och tillbaka på stranden (${at()})`);
}
{ // #1281: ground over WALK.maxSlope cannot be climbed: walking up it you are thrown back down (a slide), without flicker at the threshold.
  // The park's real banks are under the limit except the narrow edges at the water, so the slope test lowers the limit for the park path.
  const keep = WALK.maxSlope; WALK.maxSlope = 0.3;
  const top = [-41, 118]; // the shore path (flat, y -5.5) at z 131-140; the slope up to the park (gradient 0.3-0.45 at z 124-129) is over the lowered limit
  let flips = 0, was = false, slid = 0, maxUp = -Infinity;
  player.spawn(-41, 132, 0); splashes.length = 0; const y0 = player.pos.y;
  player.keys = new Set(['KeyW', 'ShiftLeft']);
  for (let i = 0; i < 400; i++) {
    camera.rotation.y = Math.atan2(-(top[0] - player.pos.x), -(top[1] - player.pos.z));
    player.update(dt);
    if (player.sliding !== was) { flips++; was = player.sliding; } if (player.sliding) slid++;
    maxUp = Math.max(maxUp, player.pos.y - y0);
  }
  player.keys = new Set();
  check(slid > 30 && maxUp < 0.9 && player.pos.y < y0 + 0.9 && !splashes.length, `för brant slänt (gräns sänkt till 0.3): går inte att klättra upp, du glider tillbaka (${slid} bilder, högst ${maxUp.toFixed(2)} m upp, ${at()})`);
  check(flips <= 40, `glidningen flimrar inte vid gränsen: ${flips} växlingar under 400 bilder med W nedtryckt uppför`);
  // standing on it: slides down with a smooth speed to the calm shore path and stops there
  player.spawn(-41, 127, 0); let vmax = 0, dv = 0, pv = 0;
  for (let i = 0; i < 600; i++) { player.update(dt); vmax = Math.max(vmax, player.slideV); dv = Math.max(dv, Math.abs(player.slideV - pv)); pv = player.slideV; }
  check(!player.sliding && player.slideV === 0 && !splashes.length && player.pos.z > 129 && vmax > 1 && dv <= WALK.slideAccel * dt * 2.02, `står man på för brant mark glider man ner med jämn acceleration (högsta fart ${vmax.toFixed(1)} m/s, största fartsprång ${dv.toFixed(3)}) och stannar på lugn mark (${at()})`);
  // hysteresis: with the limit just over the ground's gradient there it starts no slide, but one already going (its stop level is under the gradient) carries on
  { const y = groundY(-41, 127), s0 = slopeAt(-41, 127, y).s; WALK.maxSlope = s0 * 1.05;
    const fresh = slideAt(-41, 127, y, false), going = slideAt(-41, 127, y, true);
    check(!fresh && !!going, `hysteresis: lutning ${s0.toFixed(2)} under startgränsen ${WALK.maxSlope.toFixed(2)} startar ingen glidning, men en pågående fortsätter tills den understiger ${(WALK.maxSlope * WALK.slideOut).toFixed(2)}`); }
  WALK.maxSlope = keep;
  // the steepest real bank edge (any cell over the real limit within 6 m of the water, dry, uphill neighbour calmer): walking down it slides you into the river.
  // (#a4e71ef lowered the river valley: if no real cell is over the limit any more, the steepest bank cell is used with the limit lowered under it)
  let best = null; WALK.maxSlope = 0; // (so slideAt answers anywhere that is not a deck)
  for (let x = WALK.x0 + 2; x < WALK.x1; x += 2) for (let z = 62; z < WALK.z1; z += 2) {
    const r = riverAt(x, z); if (r.distance > r.width / 2 + 7 || r.distance < r.width / 2 || deckAt(x, z) !== null) continue;
    const q = slideAt(x, z, groundY(x, z), false); if (!q) continue; const s1 = q.s; if (!best || s1 > best.s) best = { x, z, s: s1 };
  }
  WALK.maxSlope = keep;
  const real = best.s > keep; if (!real) WALK.maxSlope = best.s * 0.8;
  const q0 = slideAt(best.x, best.z, groundY(best.x, best.z)); splashes.length = 0;
  player.spawn(best.x - q0.dx * 2, best.z - q0.dz * 2, 0); // 2 m up the fall line
  let slid2 = 0; player.keys = new Set(['KeyW']);
  for (let i = 0; i < 400 && !splashes.length; i++) { camera.rotation.y = Math.atan2(-(q0.dx), -(q0.dz)); player.update(dt); if (player.sliding) slid2++; }
  player.keys = new Set();
  check(slid2 > 5 && splashes.length === 1, `åns brantaste kant vid (${best.x}, ${best.z}) (gradient ${best.s.toFixed(2)}, ${real ? 'över den riktiga gränsen' : 'gränsen sänkt'}): man glider ner och plaskar i (${slid2} glidbilder, ${splashes.length} plask, ${at()})`);
  WALK.maxSlope = keep;
  // the jetpack flies over steep ground without sliding
