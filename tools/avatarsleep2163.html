 const scene=new T.Scene();scene.background=new T.Color(0xdce3e6);scene.add(new T.HemisphereLight(0xffffff,0x828b71,1.5));const light=new T.DirectionalLight(0xffefdb,2.1);light.position.set(-2,5,-3);scene.add(light);
 const plane=new T.Mesh(new T.PlaneGeometry(30,30),new T.MeshStandardMaterial({color:0xa3ae99,roughness:1}));plane.rotation.x=-Math.PI/2;plane.position.y=FLOOR;scene.add(plane);

 return {scene,owners,g};

const cam=new T.PerspectiveCamera(30,W/H,.02,50);
window.ready=true;

window.run=(version,script,times,view='side',pre=0)=>{

 const set=t=>{let s=script[0];for(const e of script)if(e.t<=t)s=e;g.pose=s.pose;g.root.position.set(s.x,s.pose===2?0:FLOOR,0);g.root.rotation.y=0;};
