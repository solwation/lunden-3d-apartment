<!doctype html>
<html><head><meta charset="utf-8"><title>Avatar weather</title><link rel="icon" href="data:,">
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
</script>
<style>html,body{margin:0;background:#bfc6cc}canvas{display:block}</style></head>
<body><script type="module">
// #2018 component page, driven by tools/avatarweathertest.cjs: three avatars (long hair, bun, curly) through the real wet / snow state machine
// (Avatar.updateWeather with a fake clock): dry, soaked after rain outdoors, snowy after snowfall, then indoors a minute and several minutes later.
import * as THREE from 'three';
import { Avatar } from '../src/avatar.js';
import { wetEnv } from '../src/avatarweather.js';
import { decodeAvatarLook, avatarEyeHeight } from '../src/config.js';
const code = '210000100c5e8o2w0l8j0n0b0r8t8y8';
const W = 640, H = 480, renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xbfc6cc);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f72, 1.6));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2); sun.position.set(2, 4, -3); scene.add(sun);
const looks = [{ style: 1, top: 0x7a2f2f }, { style: 2, top: 0x2f4f7a }, { style: 4, top: 0x3a6a44 }], avatars = [];
looks.forEach((o, i) => {
  const lk = { ...decodeAvatarLook(code, 'wet'), tall: 1, build: 1, ...o }, a = new Avatar(lk);
  a.baseY = 1.62 - avatarEyeHeight(lk); a.object.position.set((i - 1) * 0.6, a.baseY, 0); a.object.rotation.y = Math.PI; scene.add(a.object); avatars.push(a);
});
const cam = new THREE.PerspectiveCamera(24, W / H, 0.05, 50);
cam.position.set(0.7, 2.0, -3.4); cam.lookAt(0, 1.35, 0);
let now = 1e6;
const tick = (secs, env, outdoors) => { Object.assign(wetEnv, env); for (let t = 0; t < secs; t += 5) { now += 5000; for (const a of avatars) a.updateWeather(outdoors, now); } };
const draw = () => { for (const a of avatars) a.update(1 / 60); scene.updateMatrixWorld(true); renderer.info.reset(); renderer.render(scene, cam); return { calls: renderer.info.render.calls, tris: renderer.info.render.triangles, wet: avatars.map((a) => +a.wetState.wet.toFixed(3)), snow: avatars.map((a) => +a.wetState.snow.toFixed(3)) }; };
const steps = { dry: () => { tick(5, { rain: 0, kind: null, temp: 12 }, true); }, wet: () => { tick(120, { rain: 1, kind: 'rain', temp: 8 }, true); }, snow: () => { for (const a of avatars) a.wetState = null; tick(200, { rain: 0.8, kind: 'snow', temp: -2 }, true); },
  indoors60: () => { tick(60, { rain: 0, kind: null, temp: 21 }, false); }, indoorsLater: () => { tick(400, { rain: 0, kind: null, temp: 21 }, false); } };
window.__step = (name) => { steps[name](); return draw(); };
window.__cost = (n = 20, frames = 600) => { // n avatars' updateWeather + update (CPU ms per frame)
  const crowd = []; for (let i = 0; i < n; i++) { const a = new Avatar({ ...decodeAvatarLook(code, 'c' + i), tall: 1, build: 1, style: 1 }); scene.add(a.object); crowd.push(a); }
  const run = (on) => { const t0 = performance.now(); for (let f = 0; f < frames; f++) for (const a of crowd) { if (on) a.updateWeather(true, 1e7 + f * 16); a.update(1 / 60); } return (performance.now() - t0) / frames; };
  run(true); run(false); const on = run(true), off = run(false);
  return { n, frames, msOn: on, msOff: off, perAvatarUs: (on - off) / n * 1000 };
};
window.__ready = true;
</script></body></html>
