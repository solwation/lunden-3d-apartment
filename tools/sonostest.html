<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Sonos test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Music in the SYMFONISK speakers (#187): E on the black one (kitchen, #298) starts it in all three (a panner each, the
// mix up), the panel opens; next song → another name; volume up/down changes the gain; E closes the panel and the
// music plays on; pause stops it; F stops it and hides the speakers. Checks the Web Audio state, and renders each
// channel offline (OfflineAudioContext) to see that it makes a sound and does not clip.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/sonostest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html';
document.body.append(f);
f.onload = async () => {
  if (document.readyState !== 'complete') await new Promise((r) => window.addEventListener('load', r, { once: true })); // media loads after the outer test document
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, step, world, scene, sonos, toggleFurniture } = w.__app;
  w.__app.renderer.setAnimationLoop(null); // drive steps below; give the media decoder time without software rendering
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action'), panel = d.getElementById('sonos-panel');
  const V = camera.position.constructor;
  const aim = (p, from) => {
    player.spawn(from[0], from[1], 0);
    for (let i = 0; i < 3; i++) step(1 / 60);
    scene.updateMatrixWorld(true);
    const dx = p.x - camera.position.x, dz = p.z - camera.position.z;
    camera.rotation.set(Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz)), Math.atan2(-dx, -dz), 0, 'YXZ');
    step(1 / 60);
    return btn.hidden ? '(hidden)' : btn.textContent;
  };
  const speakers = world.furnitureTargets.filter((t) => t.kind === 'speaker');
  let pass = check(speakers.length === 3, `${speakers.length} speakers`);
  const kitchen = speakers.find((t) => t.object.userData.symfonisk === 'speaker black'); // (#298)
  const p = kitchen.object.getWorldPosition(new V()).add(new V(0, 0.15, 0));
  let label = aim(p, [p.x, p.z + 0.9]); // from the room: it stands on the kitchen window board (#289)
  pass &= check(/spela musik på högtalaren/i.test(label), `the black speaker (kitchen): "${label}"`);
  pass &= check(!w.performance.getEntriesByType('resource').some((e) => /\/music\/.*\.(ogg|mp3)/.test(e.name)), 'no music downloaded before play');
  btn.click();
  for (let i = 0; i < 30; i++) step(1 / 30);
  await wait(300);
  const bus = sonos.bus;
  pass &= check(sonos.playing && !panel.hidden && !!bus && bus.outs.length === 3 && bus.outs.every((o) => o.pan.positionX.value !== 0), `playing in 3 panners, the panel open (${bus?.outs.map((o) => o.pos.toArray().map((v) => v.toFixed(1)).join(',')).join(' | ')})`);
  const ctx = bus.mix.context; // headless Chrome may keep the context suspended (no real gesture): its clock stands still
  pass &= check(sonos.gain > 0.05 && (!!sonos.file || sonos.barNo > 0), `the mix is up (${sonos.gain.toFixed(3)}), ${sonos.barNo} bars scheduled (context ${ctx.state})`);
  const name0 = panel.querySelector('.name').textContent;
  panel.querySelector('[data-act=next]').click();
  const name1 = panel.querySelector('.name').textContent;
  pass &= check(name1 !== name0, `next: "${name0}" → "${name1}"`);
  // Every configured channel streams a real recording, with an advancing media clock.
  for (let k = 0; k < 6; k++) {
    sonos.channel = k; sonos.play();
    for (let i = 0; i < 200 && sonos.file && !(sonos.file.el?.currentTime > 0); i++) await wait(100);
    const el = sonos.file?.el;
    pass &= check(!!el && el.currentTime > 0 && !el.error && sonos.barNo === 0, `channel ${k}: real music (${el?.currentTime.toFixed(2)} s)`);
    const firstName = sonos.name;
    el?.dispatchEvent(new w.Event('ended')); await wait(20);
    pass &= check(sonos.trackNo === 1 && sonos.name !== firstName && panel.querySelector('.name').textContent === sonos.name, `channel ${k}: next recording and title after ended`);
    sonos.file?.el?.dispatchEvent(new w.Event('ended')); await wait(20);
    pass &= check(sonos.trackNo === 0 && sonos.name === firstName, `channel ${k}: rotation returns to first recording`);
  }
  const g0 = sonos.gain;
  panel.querySelector('[data-act=up]').click();
  const g1 = sonos.gain;
  panel.querySelector('[data-act=down]').click(); panel.querySelector('[data-act=down]').click();
  const g2 = sonos.gain;
  pass &= check(g1 > g0 && g2 < g0, `volume up ${g0.toFixed(3)} → ${g1.toFixed(3)}, down → ${g2.toFixed(3)}`);
  // E (the keyboard) / × closes the panel, the music plays on
  d.getElementById('sonos-close').click();
  pass &= check(panel.hidden && sonos.playing, 'panel closed, still playing');
  label = aim(p, [p.x, p.z + 0.9]);
  pass &= check(/styra musiken/i.test(label), `"${label}"`);
  btn.click();
  pass &= check(!panel.hidden && sonos.playing, 'E again opens the panel');
  panel.querySelector('[data-act=play]').click();
  for (let i = 0; i < 10; i++) step(0.1);
  await wait(400);
  pass &= check(!sonos.playing && sonos.gain === 0 && !sonos.ch, 'paused: the mix down, nothing composing');
  panel.querySelector('[data-act=play]').click();
  // upstairs the ones downstairs are softer; the one in Sovrum 1 is up there
  player.spawn(2.9, 6.3, 0); player.pos.y = 3.25; player.eyeY = 3.25 + 1.62; for (let i = 0; i < 20; i++) step(0.1);
  const up = (o) => o.level === 1; // the white one in Sovrum 1 (#201, #298)
  pass &= check(player.level === 1 && bus.outs.some(up) && bus.outs.every((o) => (up(o) ? o.k >= 0.45 : o.k <= 0.2)), `upstairs: the speakers below are floor-muffled, Sovrum 1 is only wall-muffled from the hall (${bus.outs.map((o) => `${o.level}:${o.k.toFixed(2)}`)})`);
  // F: music off, speakers hidden
  toggleFurniture();
  pass &= check(!sonos.playing && panel.hidden && !world.furnitureOn, 'F stops the music');
  toggleFurniture();
  // real music files (#416): picked by type, fetched only when the channel plays, a missing file falls back to the
  // generated music, a playable one streams into the channel's sub-mix (no bars composed) with its title in the panel
  const M = await w.eval(`import('${new URL('../src/sonos.js', location.href).href}')`);
  const { SONOS } = await w.eval(`import('${new URL('../src/config.js', location.href).href}')`);
  const pick = M.trackSrc({ files: ['music/a.ogg', 'music/a.mp3'] }, (t) => (t === 'audio/mpeg' ? 'maybe' : ''));
  pass &= check(pick === 'music/a.mp3' && M.trackSrc({ files: ['music/a.ogg'] }, () => '') === null, `the file this browser plays: ${pick}`);
  const fetched = () => w.performance.getEntriesByType('resource').filter((e) => /\/music\//.test(e.name)).map((e) => e.name.replace(/.*\//, ''));
  const beforeMissing = new Set(fetched());
  const ch0 = SONOS.channels[0], originalTracks = ch0.tracks;
  ch0.tracks = [{ title: 'Saknas', artist: 'Test', files: ['music/finns-inte-416.ogg'] }];
  sonos.channel = 0; sonos.play();
  for (let i = 0; i < 40 && sonos.file; i++) { step(0.05); await wait(100); }
  step(0.1);
  // without a real gesture the browser refuses play() (no error, no failed file): the generated music then (run with
  // --autoplay-policy=no-user-gesture-required to test the files themselves)
  const autoplay = M.failedFiles.has('music/finns-inte-416.ogg');
  pass &= check(!sonos.file && sonos.playing && sonos.barNo > 0 && panel.querySelector('.name').textContent === ch0.name,
    `a missing file${autoplay ? '' : ' (play refused: no gesture)'} falls back to the generated music (${sonos.barNo} bars, "${panel.querySelector('.name').textContent}")`);
  pass &= check(fetched().filter((f) => !beforeMissing.has(f)).length <= 1, `only the channel's own file was asked for (${fetched().join(', ') || 'none'})`);
  // a 3 s tone as a WAV blob stands in for a real track
  const sr = 22050, n = sr * 3, wav = new DataView(new ArrayBuffer(44 + n * 2));
  const str = (o, s) => [...s].forEach((c, i) => wav.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); wav.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt '); wav.setUint32(16, 16, true); wav.setUint16(20, 1, true);
  wav.setUint16(22, 1, true); wav.setUint32(24, sr, true); wav.setUint32(28, sr * 2, true); wav.setUint16(32, 2, true); wav.setUint16(34, 16, true);
  str(36, 'data'); wav.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) wav.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 440 * i / sr) * 8000, true);
  const url = w.URL.createObjectURL(new w.Blob([wav.buffer], { type: 'audio/wav' }));
  ch0.tracks = [{ title: 'Testton', artist: 'Testaren', files: [url] }];
  sonos.next(1); sonos.next(-1); // restart channel 0 with the file
  const el = sonos.file?.el;
  if (autoplay) {
    // (headless with the game's WebGL running, the media pipeline may not decode within virtual time: the element is
    // checked to be attached, playing and unerrored)
    for (let i = 0; i < 20 && el && el.readyState < 2; i++) { step(0.05); await wait(100); }
    const bars = sonos.barNo; for (let i = 0; i < 10; i++) step(0.1);
    const state = el ? `readyState ${el.readyState}, ${el.paused ? 'paused' : 'playing'}, error ${el.error?.code ?? 'none'}` : 'no element';
    pass &= check(!!el && sonos.file?.el === el && !el.paused && !el.error && sonos.barNo === bars && panel.querySelector('.name').textContent === 'Testton – Testaren',
      `a playable file streams in, nothing composed, its title shown (${state}, "${panel.querySelector('.name').textContent}")`);
    sonos.pause();
    pass &= check(!sonos.file && !el.getAttribute('src'), 'paused: the file stopped and let go');
  } else {
    for (let i = 0; i < 10; i++) { step(0.05); await wait(50); }
    pass &= check(!sonos.file && sonos.barNo > 0 && panel.querySelector('.name').textContent === ch0.name, 'play refused (no gesture): the generated music, never silence');
    lines.push('SKIP the file itself: run with --autoplay-policy=no-user-gesture-required');
    sonos.pause();
  }
  ch0.tracks = originalTracks; sonos.channel = 0;
  // each channel rendered offline for 6 s: audible, not clipping
  const { CHANNELS } = await w.eval(`import('${new URL('../src/sonos.js', location.href).href}')`);
  for (const [id, c] of Object.entries(CHANNELS)) {
    const sr = 22050, ctx = new w.OfflineAudioContext(1, sr * 6, sr);
    const noiseBuf = ctx.createBuffer(1, sr * 2, sr), nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const A = { ctx, noiseBuf }, dest = ctx.destination;
    c.continuous?.(A, dest);
    for (let t = 0.05, i = 0; t < 6; t += c.bar * c.beat) c.play(A, dest, t, i++);
    const buf = await Promise.race([ctx.startRendering(), wait(8000).then(() => null)]); // --virtual-time-budget never finishes it
    if (!buf) { lines.push(`SKIP ${id}: no offline rendering here (headless with virtual time; run it in a normal browser)`); continue; }
    const data = buf.getChannelData(0);
    let peak = 0, sum = 0;
    for (const v of data) { peak = Math.max(peak, Math.abs(v)); sum += v * v; }
    const rms = Math.sqrt(sum / data.length);
    pass &= check(rms > 0.01 && peak < 1.2, `${id}: rms ${rms.toFixed(3)}, peak ${peak.toFixed(2)}`);
  }
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
