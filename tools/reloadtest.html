<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Reload test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// "Ladda om" keeps the place (#74): (1) a stored record puts the visitor back there (position, level,
// view, clock), the start screen says so, and the record is gone after reading; (2) without a record
// (F5) the visit starts at START; (3) "Börja från start" goes back to START; (4) a record inside a wall
// is ignored; (5) a record made mid-visit (#181): no start screen, "Ny version laddad" fades out after ~3 s; touch
// plays at once, mouse & keyboard: the next click takes the mouse; the mute choice is kept; (6) F5 (#203) carries
// on from the tab's running record without a note; (7) a record from an older build shows "Ny version laddad";
// (9) a page-made reload keeps the world (#277): the car still arriving, a cup of coffee in the hand, the fridge open,
// the lamps as switched, sitting in the sofa, the game's clock; (10) a new tab after that starts fresh at the real time.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/reloadtest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const lines = [];
const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); out.textContent = `running…\n${lines.join('\n')}`; return ok; };
const load = (q = '') => new Promise((resolve) => {
  const f = document.createElement('iframe');
  f.width = 900; f.height = 600; f.src = `../index.html${q}`;
  document.body.append(f);
  f.onload = async () => { while (!f.contentWindow.__app) await wait(100); resolve(f); };
});
const KEY = 'lunden.resume', SESSION = 'lunden.session';
(async () => {
  let pass = true;
  // (1) upstairs hall, looking west, 20:30 in March
  const rec = { x: 2.9, z: 6.3, feetY: 3.25, yaw: Math.PI / 2, pitch: -0.2, hour: 20.5, month: 3, ts: Date.now() };
  sessionStorage.setItem(KEY, JSON.stringify(rec));
  let f = await load();
  let { player, camera, day } = f.contentWindow.__app;
  pass &= check(Math.hypot(player.pos.x - rec.x, player.pos.z - rec.z) < 0.05 && Math.abs(player.pos.y - 3.25) < 0.01,
    `resumed at (${player.pos.x.toFixed(2)}, ${player.pos.y.toFixed(2)}, ${player.pos.z.toFixed(2)})`);
  pass &= check(Math.abs(camera.rotation.y - rec.yaw) < 0.01 && Math.abs(camera.rotation.x - rec.pitch) < 0.01, 'same view direction');
  const now = new Date(), realH = now.getHours() + now.getMinutes() / 60;
  pass &= check(Math.abs(day.hour - realH) < 0.1 && day.month === now.getMonth() + 1 && day.date === now.getDate(), `the real clock and date, not the record's (${day.clock}, ${day.date}/${day.month}) (#143)`);
  pass &= check(!f.contentDocument.getElementById('resume').hidden, 'start screen: "Du fortsätter där du var"');
  pass &= check(!sessionStorage.getItem(KEY) && !localStorage.getItem(KEY), 'the record is deleted when read');
  // (3) "Börja från start": after spooling and picking another date, back to now (#143)
  day.hour = 3; day.month = 1; day.date = 2; day.paused = true;
  f.contentDocument.getElementById('restart').click();
  pass &= check(Math.abs(day.hour - realH) < 0.1 && day.month === now.getMonth() + 1 && day.date === now.getDate() && !day.paused, `restart → the real time and date (${day.clock}, ${day.date}/${day.month})`);
  pass &= check(player.pos.z < -5 && f.contentDocument.getElementById('resume').hidden, `"Börja från start" → start (z ${player.pos.z.toFixed(2)})`);
  f.remove();
  // (2) a new visit: no record → START
  sessionStorage.removeItem(SESSION);
  f = await load();
  ({ player } = f.contentWindow.__app);
  pass &= check(player.pos.z < -5 && f.contentDocument.getElementById('resume').hidden, `F5 starts at the start (z ${player.pos.z.toFixed(2)})`);
  f.remove();
  // (4) a record inside a wall is ignored
  localStorage.setItem(KEY, JSON.stringify({ ...rec, x: 2.65, z: 3.0, feetY: 3.25, ts: Date.now() }));
  f = await load();
  ({ player } = f.contentWindow.__app);
  pass &= check(player.pos.z < -5, `a spot inside a wall → the start (z ${player.pos.z.toFixed(2)})`);
  f.remove();
  // (5) mid-visit records: touch → straight in; mouse → the click cover; muted stays muted
  sessionStorage.removeItem(SESSION);
  sessionStorage.setItem(KEY, JSON.stringify({ ...rec, mode: 'touch', muted: true, ts: Date.now() }));
  f = await load();
  let d = f.contentDocument, app = f.contentWindow.__app;
  const note = d.getElementById('reloaded');
  pass &= check(d.getElementById('overlay').hidden && app.touch.enabled && d.getElementById('arm').hidden, 'touch: no start screen, the joystick is on');
  pass &= check(Math.hypot(app.player.pos.x - rec.x, app.player.pos.z - rec.z) < 0.05, 'touch: at the stored place');
  pass &= check(!note.hidden && !note.classList.contains('gone'), `"${note.textContent}" shown`);
  pass &= check(d.getElementById('mute').textContent === '🔇', 'still muted');
  await wait(4200);
  pass &= check(note.hidden, 'the note is gone after ~3 s');
  f.remove();
  sessionStorage.setItem(KEY, JSON.stringify({ ...rec, mode: 'mouse', ts: Date.now() }));
  f = await load();
  d = f.contentDocument; app = f.contentWindow.__app;
  const arm = d.getElementById('arm');
  pass &= check(d.getElementById('overlay').hidden && !arm.hidden && /styra med musen/.test(arm.textContent) && !app.touch.enabled, `mouse: no start screen, the next click takes the mouse ("${arm.textContent}")`);
  pass &= check(!d.getElementById('reloaded').hidden && d.getElementById('mute').textContent === '🔊', 'mouse: the note, sound on');
  f.remove();
  // (6) F5 mid-visit (#203): the tab's running record puts the visitor back, no start screen, no note (same version)
  sessionStorage.removeItem(SESSION);
  f = await load();
  d = f.contentDocument; app = f.contentWindow.__app;
  d.getElementById('start-touch').click();
  app.player.spawn(2.9, 6.3, 1.0); app.player.pos.y = 3.25; app.player.eyeY = 3.25 + 1.62; app.camera.position.y = app.player.eyeY;
  await wait(2600); // it is written every 2 s
  pass &= check(!!sessionStorage.getItem(SESSION), 'the place is kept in sessionStorage while visiting');
  await new Promise((resolve) => { f.onload = async () => { while (!f.contentWindow.__app) await wait(100); resolve(); }; f.contentWindow.location.reload(); });
  d = f.contentDocument; app = f.contentWindow.__app;
  pass &= check(Math.hypot(app.player.pos.x - 2.9, app.player.pos.z - 6.3) < 0.05 && Math.abs(app.player.pos.y - 3.25) < 0.01 && Math.abs(app.camera.rotation.y - 1.0) < 0.01, `F5: back at the same place and view (${app.player.pos.x.toFixed(2)}, ${app.player.pos.z.toFixed(2)})`);
  pass &= check(d.getElementById('overlay').hidden && app.touch.enabled && d.getElementById('reloaded').hidden, 'F5: no start screen, no note on the same version');
  f.remove();
  // (7) F5 onto a newer version: "Ny version laddad"
  sessionStorage.setItem(SESSION, JSON.stringify({ ...rec, mode: 'touch', build: 'old1234', ts: Date.now() }));
  f = await load();
  d = f.contentDocument;
  pass &= check(!d.getElementById('reloaded').hidden && /Ny version laddad/.test(d.getElementById('reloaded').textContent), `F5 onto a new version: "${d.getElementById('reloaded').textContent}"`);
  f.remove();
  // (8) #222: with a record the start screen never shows, not even while the page loads; without, or with a bad
  // record, it does
  const early = async () => { // the start screen's visibility from the first moment the iframe has a body
    const f2 = document.createElement('iframe'); f2.width = 900; f2.height = 600; f2.src = '../index.html'; document.body.append(f2);
    let first = null;
    for (let i = 0; i < 4000 && first === null; i++) { const d2 = f2.contentDocument, o = d2?.getElementById('overlay'); if (o && d2.location.href !== 'about:blank') first = getComputedStyle(o).display !== 'none' && !d2.documentElement.classList.contains('resuming'); else await wait(2); }
    while (!f2.contentWindow.__app) await wait(50);
    const after = !f2.contentDocument.getElementById('overlay').hidden && !f2.contentDocument.documentElement.classList.contains('resuming');
    f2.remove();
    return { first, after };
  };
  sessionStorage.removeItem(SESSION); localStorage.removeItem(KEY);
  sessionStorage.setItem(KEY, JSON.stringify({ ...rec, mode: 'touch', ts: Date.now() }));
  let e = await early();
  pass &= check(e.first === false && e.after === false, `a reload record: no start screen from the first frame (first ${e.first}, after ${e.after})`);
  sessionStorage.setItem(KEY, JSON.stringify({ ...rec, x: 2.65, z: 3.0, mode: 'touch', ts: Date.now() })); // inside a wall
  e = await early();
  pass &= check(e.after === true, `a bad record: the start screen after all (${e.after})`);
  sessionStorage.removeItem(SESSION);
  e = await early();
  pass &= check(e.first === true && e.after === true, `no record: the start screen from the start (first ${e.first})`);
  sessionStorage.removeItem(SESSION);
  // (9) #277: a reload made by the page keeps the world — the car on its way, a cup of coffee in the hand, the fridge
  // open, a ceiling lamp on, a small lamp put out by hand, sitting in the sofa, the game's clock (spooled and paused)
  sessionStorage.removeItem(SESSION); localStorage.removeItem(KEY);
  f = await load('?time=21.5&month=1&day=10');
  d = f.contentDocument; app = f.contentWindow.__app;
  d.getElementById('start-touch').click();
  {
    const { step, player, camera, world, rest, cups, fridge, lights, day, car } = app;
    const sofa = world.furnitureTargets.find((t) => t.kind === 'rest' && t.name === 'soffan'), sp = sofa.spots[1];
    let stood = null;
    for (const r of [0.9, 1.2, 1.5, 0.7]) for (let k = 0; k < 12 && !stood; k++) {
      const a = sp.yaw + k * (Math.PI / 6), x = sp.pos.x - Math.sin(a) * r, z = sp.pos.z - Math.cos(a) * r;
      player.spawn(x, z, 0);
      for (let i = 0; i < 3; i++) step(1 / 60);
      if (Math.hypot(player.pos.x - x, player.pos.z - z) < 0.01) stood = { x, z };
    }
    rest.begin(sofa, sp, { x: player.pos.x, z: player.pos.z, y: player.pos.y, yaw: camera.rotation.y });
    for (let i = 0; i < 60; i++) step(1 / 60);
    const bottle = app.things.find((t) => t.drink && !t.homeParent);
    bottle.take(); bottle.placeAt(new player.pos.constructor(stood.x + 0.25, 0, stood.z)); // on the floor beside you
    const bottleAt = bottle.model.position.clone(), bottleI = app.things.indexOf(bottle);
    const tv = world.furnitureTargets.find((t) => t.kind === 'tv' && t.name === 'tv:n'); if (!tv.isOpen) tv.toggle();
    app.cat.object.position.set(stood.x - 0.4, 0, stood.z); app.cat.object.visible = true; app.cat.catName = 'Testkatt';
    const cup = cups.cups.find((c) => c.state === 'cabinet');
    cup.take(); cup.setFill(0.8);
    // the life sim (#371): an opened butter pack with 185 g left, a cut cucumber on the cutting board with two slices, a plate
    // with half a bread slice (the cup goes into the hand again after the plate — both kinds of hand restore are checked)
    const { life } = app, LI = life.items;
    const lp = (x, z) => ({ at: 'world', pos: [x, 0.755, z], yaw: 0 });
    const butter = life.create('butter', lp(3.3, 0.9), { amount: 185, pkg: 'open' });
    const board = life.create('board', lp(3.6, 1.8)), cuc = life.create('cucumber', { at: 'on', parent: board.id, slot: 0 }, { amount: 280 });
    const sl = [1, 2].map((k) => life.create('cucumberSlice', { at: 'on', parent: board.id, slot: k }));
    const plate = life.create('plate', lp(3.5, 1.2), { clean: 'used' }), half = life.create('breadSlice', { at: 'on', parent: plate.id, slot: 0 }, { amount: 0.5 });
    const lifeIds = { butter: butter.id, board: board.id, cuc: cuc.id, plate: plate.id, half: half.id, sl: sl.map((x) => x.id) };
    fridge.toggle();
    const sw = lights.switches.find((s) => !s.isOpen); sw.toggle();
    const lamp = lights.floorLamps.find((l) => l.auto && l.isOpen); lamp.toggle();
    day.hour = 21.75; day.paused = true;
    player.spawn(stood.x, stood.z, 0); // (the standing spot does not move while seated)
    car.call();
    for (let i = 0; i < 60 * 2; i++) step(1 / 60);
    const d0 = car.d, swRoom = sw.room, lampName = lamp.name, cupI = cups.cups.indexOf(cup);
    pass &= check(rest.active && car.state === 'arriving' && !!stood, `before: sitting ${rest.active}, the car arriving (${d0.toFixed(1)} m along)`);
    const world0 = app.keepWorld();
    const size = JSON.stringify(world0).length;
    pass &= check(world0 && world0.v === 1 && size < 6000, `the world record: v ${world0?.v}, ${size} bytes`);
    sessionStorage.setItem(KEY, JSON.stringify({ x: player.pos.x, z: player.pos.z, feetY: player.pos.y, yaw: camera.rotation.y, pitch: camera.rotation.x, mode: 'touch', build: null, world: world0, ts: Date.now() }));
    f.remove();
    f = await load();
    d = f.contentDocument; app = f.contentWindow.__app;
    const a2 = app;
    pass &= check(a2.car.state === 'arriving' && Math.abs(a2.car.d - d0) < 0.1 && a2.car.object.visible, `after: the car still arriving (${a2.car.state}, ${a2.car.d.toFixed(1)} m)`);
    pass &= check(a2.world.garage.door.target === 1 && a2.world.garage.door.t > 0, `after: the garage door still opening for it (#358, t ${a2.world.garage.door.t.toFixed(2)})`);
    pass &= check(a2.heldItem() === a2.cups.cups[cupI] && Math.abs(a2.cups.cups[cupI].fill - 0.8) < 0.01, `after: the cup of coffee in the hand (${a2.heldItem()?.name}, ${a2.heldItem()?.fill?.toFixed(2)})`);
    pass &= check(a2.fridge.isOpen && a2.fridge.t > 0.9, 'after: the fridge open');
    const sw2 = a2.lights.rooms.get(`${swRoom.level}:${swRoom.name}`), lamp2 = a2.lights.floorLamps.find((l) => l.name === lampName);
    pass &= check(sw2?.on && lamp2 && !lamp2.isOpen, `after: the room lamp on (${swRoom.name}), the small lamp off by hand (${lampName})`);
    pass &= check(a2.rest.active && a2.rest.target?.name === 'soffan' && a2.camera.position.distanceTo(a2.rest.spot.pos) < 0.01, 'after: sitting in the sofa');
    pass &= check(Math.abs(a2.day.hour - 21.75) < 0.01 && a2.day.paused && a2.day.month === 1 && a2.day.date === 10, `after: the game's clock (${a2.day.clock}, ${a2.day.date}/${a2.day.month}, paused ${a2.day.paused})`);
    const b2 = a2.things[bottleI], tv2 = a2.world.furnitureTargets.find((t) => t.kind === 'tv' && t.name === 'tv:n');
    pass &= check(b2.placed && b2.model.position.distanceTo(bottleAt) < 0.01, `after: the ${b2.name} where it was put down`);
    pass &= check(tv2.isOpen, 'after: the TV on');
    {
      const L2 = a2.life.items, g = (id) => L2.get(id);
      const b = g(lifeIds.butter), bd = g(lifeIds.board), cu = g(lifeIds.cuc), pl = g(lifeIds.plate), hf = g(lifeIds.half);
      pass &= check(b && b.amount === 185 && b.pkg === 'open' && Math.abs(b.place.pos[0] - 3.3) < 1e-6, `after: the opened butter, ${b?.amount} g left`);
      pass &= check(cu && cu.amount === 280 && cu.place.parent === bd.id && lifeIds.sl.every((id) => g(id)?.place.parent === bd.id), 'after: the cut cucumber and two slices on the board');
      pass &= check(pl && pl.clean === 'used' && hf.amount === 0.5 && hf.place.parent === pl.id && a2.life.view(hf).model.parent?.parent === a2.life.view(pl).model, 'after: the used plate with half a slice on it (its model on the plate\'s)');
      pass &= check(L2.audit().length === 0 && a2.life.views.size === L2.all().length, `after: ${L2.all().length} things, one view each`);
    }
    pass &= check(a2.cat.visible && a2.cat.catName === 'Testkatt' && Math.abs(a2.cat.object.position.x - (stood.x - 0.4)) < 0.01, `after: the cat still there (${a2.cat.catName})`);
    for (let i = 0; i < 60 * 120 && a2.car.state === 'arriving'; i++) a2.step(1 / 60);
    pass &= check(a2.car.state === 'parked' && !lamp2.isOpen && a2.rest.active, `the car parks (${a2.car.state}); the lamp stays off, still sitting`);
    // the plate with half a slice in the hand across another page-made reload (#371)
    a2.standUp(); a2.cups.cups[cupI].placeAt(new a2.camera.position.constructor(3.6, 0.754, 0.9)); a2.step(1 / 60);
    a2.life.view(lifeIds.plate).take(); a2.step(1 / 60);
    const w2 = a2.keepWorld();
    sessionStorage.setItem(KEY, JSON.stringify({ x: a2.player.pos.x, z: a2.player.pos.z, feetY: a2.player.pos.y, yaw: 0, pitch: 0, mode: 'touch', build: null, world: w2, ts: Date.now() }));
    f.remove();
    f = await load();
    const a3 = f.contentWindow.__app, pl3 = a3.life.items.get(lifeIds.plate);
    pass &= check(pl3?.place.at === 'hand' && a3.heldItem() === a3.life.view(pl3) && a3.life.items.children(pl3)[0]?.id === lifeIds.half, 'after another reload: the plate with half a slice in the hand');
    // a broken life part: the rest of the world still comes back, nothing thrown
    const w3 = a3.keepWorld(); w3.life = { v: 1, items: [{ id: 'x#1', type: 'nonsense' }, 7] };
    sessionStorage.setItem(KEY, JSON.stringify({ x: a3.player.pos.x, z: a3.player.pos.z, feetY: a3.player.pos.y, yaw: 0, pitch: 0, mode: 'touch', build: null, world: w3, ts: Date.now() }));
    f.remove();
    f = await load();
    const a4 = f.contentWindow.__app;
    pass &= check(!a4.life.items.get('x#1') && a4.life.items.audit().length === 0 && a4.day.paused && Math.abs(a4.day.hour - 21.75) < 0.05, `a broken life record: nothing made up, nothing thrown, the clock still kept (${a4.day.clock}; ${a4.life.items.all().length} things from the stock)`);
    f.remove();
  }
  // (10) a new tab after that: fresh, at START, the real time
  sessionStorage.removeItem(SESSION); localStorage.removeItem(KEY);
  f = await load();
  app = f.contentWindow.__app;
  {
    const n = new Date(), h = n.getHours() + n.getMinutes() / 60;
    pass &= check(app.player.pos.z < -5 && Math.abs(app.day.hour - h) < 0.1 && app.car.state === 'garage' && !app.heldItem() && !app.fridge.isOpen && !app.rest.active,
      `a new tab: at the start, the real time (${app.day.clock}), the car in the garage (#358), empty hands, the fridge shut`);
    // the life sim's stock is kept between visits (lunden.life, #371): the last page wrote it; empty-handed now
    const LS = JSON.parse(localStorage.getItem('lunden.life') ?? 'null');
    pass &= check(LS?.v >= 1 && Array.isArray(LS.items), `lunden.life is written (v ${LS?.v}, ${LS?.items?.length} things)`);
  }
  f.remove();
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
})().catch((e) => { out.textContent = `ERROR ${e.stack}\n${lines.join("\n")}`; });
</script>
</body>
</html>
