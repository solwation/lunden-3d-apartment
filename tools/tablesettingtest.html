<!doctype html><html lang="sv"><meta charset="utf-8"><title>Table setting test</title><pre id="out">running…</pre><script type="module">
const lines=[];let pass=true;const check=(ok,text)=>{lines.push((ok?'PASS':'FAIL')+' '+text);pass&&=!!ok},wait=ms=>new Promise(r=>setTimeout(r,ms));

 for(let k=0;k<3;k++){

 }
