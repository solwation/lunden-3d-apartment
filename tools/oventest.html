<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Oven and microwave test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Kitchen oven + microwave (#58): aim at each door, open it with the action button (the oven door
// drops, the microwave door swings out, the lamp inside lights), close it again. The Moccamaster
// (#59): switch it on (red light), it brews for MOCCAMASTER.brewSeconds, fills the jug, clicks off. #334: only with
// water in the tank and coffee in the filter (it says which is missing); brewing drains the tank, leaves wet grounds.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/oventest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
f.src = '../index.html';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, world, step } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  let pass = true;
  for (const name of ['ugnen', 'mikron']) {
    const a = world.lids.find((l) => l.name === name);
    pass &= check(!!a, `${name} exists`);
    if (!a) continue;
    const aim = () => {
      a.object.updateMatrixWorld(true);
      const p = a.object.children[0].getWorldPosition(new a.object.position.constructor());
      player.spawn(p.x - 1.0, p.z, -Math.PI / 2);
      for (let i = 0; i < 3; i++) step(1 / 60); // settle first (a dining chair may push you aside)
      camera.rotation.y = Math.atan2(-(p.x - camera.position.x), -(p.z - camera.position.z));
      camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(p.x - camera.position.x, p.z - camera.position.z));
      step(1 / 60);
    };
    aim();
    // touch shows the short "Öppna" on an appliance front (#502); both forms pass, anchored (#614)
    pass &= check(!btn.hidden && new RegExp(`^öppna( ${name})?$`, 'i').test(btn.textContent), `${name}: button "${btn.textContent}"`);
    btn.click();
    for (let i = 0; i < 90; i++) step(1 / 60);
    const angle = a.hinge === 'bottom' ? a.door.rotation.z : -a.door.rotation.y;
    pass &= check(a.isOpen && angle > 1.3 && a.lamp.emissiveIntensity > 0, `${name} open (angle ${(angle * 180 / Math.PI).toFixed(0)}°, lamp ${a.lamp.emissiveIntensity})`);
    a.toggle();
    for (let i = 0; i < 90; i++) step(1 / 60);
    pass &= check(!a.isOpen && Math.abs(a.hinge === 'bottom' ? a.door.rotation.z : a.door.rotation.y) < 1e-3 && a.lamp.emissiveIntensity === 0, `${name} closes, lamp off`);
  }
  // statistics (#82): the oven and the microwave count as "Ugn/mikro", not as toilet lids
  {
    const { stats, use } = w.__app;
    const a0 = stats.appliances, l0 = stats.lids;
    for (const name of ['ugnen', 'mikron']) { const a = world.lids.find((l) => l.name === name); use(a); for (let i = 0; i < 60; i++) step(1 / 60); use(a); }
    pass &= check(stats.appliances === a0 + 2 && stats.lids === l0, `stats: Ugn/mikro +${stats.appliances - a0}, toilet lids +${stats.lids - l0}`);
    const lid = world.lids.find((l) => l.kind === 'lid');
    use(lid); for (let i = 0; i < 60; i++) step(1 / 60);
    pass &= check(stats.lids === l0 + 1, `a toilet lid still counts as a lid (+${stats.lids - l0})`);
  }
  const mc = world.lids.find((l) => l.kind === 'coffee');
  pass &= check(!!mc, 'Moccamaster exists');
  if (mc) {
    mc.object.updateMatrixWorld(true);
    const p = mc.object.children[2].getWorldPosition(new mc.object.position.constructor()); // the tank
    player.spawn(p.x - 1.0, p.z, -Math.PI / 2);
    camera.rotation.y = Math.atan2(-(p.x - player.pos.x), -(p.z - player.pos.z));
    camera.rotation.x = Math.atan2(p.y - player.eyeY, Math.hypot(p.x - player.pos.x, p.z - player.pos.z));
    for (let i = 0; i < 3; i++) step(1 / 60);
    // #334: no water, no coffee → it says so and does not start; then one of them only; then both (`prime`)
    pass &= check(/Fyll på vatten och kaffe/.test(btn.textContent), `empty: "${btn.textContent}"`);
    btn.click(); step(1 / 60);
    pass &= check(!mc.isOpen && mc.led.emissiveIntensity === 0, 'empty: it does not start');
    mc.water = 1; step(1 / 60);
    pass &= check(/Häll i kaffe först/.test(btn.textContent), `water only: "${btn.textContent}"`);
    btn.click(); step(1 / 60);
    mc.water = 0; mc.grounds = 2; step(1 / 60);
    const coffeeOnly = btn.textContent;
    btn.click(); step(1 / 60);
    pass &= check(/Fyll på vatten först/.test(coffeeOnly) && !mc.isOpen, `coffee only: "${coffeeOnly}", not started`);
    mc.prime(); step(1 / 60);
    pass &= check(/sätta på kaffebryggaren/i.test(btn.textContent), `button "${btn.textContent}"`);
    btn.click();
    for (let i = 0; i < 10 * 60; i++) step(1 / 60);
    pass &= check(mc.isOpen && mc.led.emissiveIntensity > 0 && mc.fill > 0.2 && mc.fill < 0.9, `brewing: red light, jug filling (${mc.fill.toFixed(2)})`);
    for (let i = 0; i < 10 * 60; i++) step(1 / 60);
    pass &= check(!mc.isOpen && mc.led.emissiveIntensity === 0 && mc.fill === 1 && mc.done === 1, `done: light off, jug full (${mc.fill.toFixed(2)})`);
    step(1 / 60);
    pass &= check(mc.water === 0 && mc.spent && /Fyll på vatten och kaffe/.test(btn.textContent), `used up: the tank empty, wet grounds, "${btn.textContent}"`);
  }
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
