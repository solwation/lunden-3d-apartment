<html><head><meta charset="utf-8"><title>Ghost held items</title><link rel="icon" href="data:,">
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<style>html,body{margin:0;background:#bfc6cc}canvas{display:block}</style></head>
<body><script type="module">
// #1297 component page: other players (Ghost) with a held-item proxy per category, none, and a weapon that wins over a category.
// Driven by tools/ghostitemtest.cjs.
import * as THREE from 'three';
import { Ghost } from '../src/ghosts.js';
import { HELD_CATEGORIES } from '../src/heldcategory.js';
import { ghostItemTriangles } from '../src/ghostprops.js';
const CASES = [...HELD_CATEGORIES.map((key) => ({ key, hi: key, h: '' })),
  { key: 'none', hi: '', h: '' }, { key: 'weapon', hi: 'cup', h: 'saber' },
  { key: 'unknown', hi: '__unknown-category__', h: '' }];
const W = 2400, Hh = 460, renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, Hh); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xbfc6cc);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f72, 1.6));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2); sun.position.set(2, 4, 3); scene.add(sun);
const ghosts = CASES.map(({ hi, h }, i) => {
  const g = new Ghost(scene, i + 1, 'Spelare ' + (i + 1));
  if (g.tag) g.tag.visible = false;
  g.root.position.set((i - (CASES.length - 1) / 2) * 0.8, 0, 0);
  scene.add(g.root); g.root.visible = true;
  g.push({ p: [g.root.position.x, 0, 0], r: Math.PI, h, hi }, 1000); // the wire path: hi / h as the room sends them
  return g;
});
const cam = new THREE.PerspectiveCamera(22, W / Hh, 0.05, 50);
// Fit the complete case row, including added negative cases, rather than silently culling an edge proxy.
const overviewDistance = Math.max(7.6, CASES.length * 0.4 / (Math.tan(THREE.MathUtils.degToRad(12)) * W / Hh) + 1);
const effectiveVisible = (node) => { for (; node; node = node.parent) if (!node.visible) return false; return true; };
const finite = (a) => a.every(Number.isFinite);
const pixels = () => {
  const gl = renderer.getContext(), data = new Uint8Array(W * Hh * 4);
  gl.readPixels(0, 0, W, Hh, gl.RGBA, gl.UNSIGNED_BYTE, data); return data;
};
window.__shot = (i = null, far = false) => {
  let t = 1000;
  for (const g of ghosts) { g.root.rotation.y = Math.PI; g.have = false; for (let k = 0; k < 30; k++) g.animate(t += 33, far ? 1000 : 1, 0, 0); }
  const x = i === null ? 0 : ghosts[i].root.position.x;
  cam.fov = i === null ? 24 : 7; cam.updateProjectionMatrix();
  cam.position.set(x + (i === null ? 0 : -0.5), 1.2, i === null ? overviewDistance : 4.6); cam.lookAt(x - (i === null ? 0 : 0.15), i === null ? 0.95 : 1.05, 0);
  renderer.info.reset(); renderer.render(scene, cam);
  const calls = renderer.info.render.calls, tris = renderer.info.render.triangles;
  let transformsFinite = [cam.matrixWorld, cam.matrixWorldInverse, cam.projectionMatrix, cam.projectionMatrixInverse].every((m) => finite(m.elements));
  scene.traverse((node) => { transformsFinite &&= finite(node.matrix.elements) && finite(node.matrixWorld.elements); });
  const projections = ghosts.map((g) => {
    if (!g.itemProp) return null;
    const mesh = g.itemProp, p = mesh.geometry.attributes.position, v = new THREE.Vector3(), min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
    let geometryFinite = true;
    for (const a of Object.values(mesh.geometry.attributes)) geometryFinite &&= finite(a.array);
    for (let n = 0; n < p.count; n++) {
      v.fromBufferAttribute(p, n).applyMatrix4(mesh.matrixWorld).project(cam);
      for (let axis = 0; axis < 3; axis++) { const value = v.getComponent(axis); min[axis] = Math.min(min[axis], value); max[axis] = Math.max(max[axis], value); }
    }
    return { geometryFinite, finite: finite(min) && finite(max), min, max, effectiveVisible: effectiveVisible(mesh) };
  });
  // Compare the exact same pose/camera with only the intended proxy hidden: avatar/background pixels cannot pass this check.
  const contribution = (target) => {
    const visible = target?.visible, withItem = pixels();
    if (target) target.visible = false;
    renderer.info.reset(); renderer.render(scene, cam); const withoutItem = pixels();
    const drawCalls = calls - renderer.info.render.calls; let changedPixels = 0;
    for (let n = 0; n < withItem.length; n += 4) if (withItem[n] !== withoutItem[n] || withItem[n + 1] !== withoutItem[n + 1] || withItem[n + 2] !== withoutItem[n + 2]) changedPixels++;
    if (target) target.visible = visible;
    renderer.render(scene, cam);
    return { drawCalls, changedPixels };
  };
  const proxy = i === null ? null : contribution(ghosts[i].itemProp), weapon = i !== null && ghosts[i].prop ? contribution(ghosts[i].prop) : null;
  return { calls, tris, transformsFinite, projections, proxyPixels: proxy?.changedPixels ?? null, proxyCalls: proxy?.drawCalls ?? null, weapon, cases: CASES,
    items: ghosts.map((g) => g.itemProp && effectiveVisible(g.itemProp) ? g.itemProp.name : null), his: ghosts.map((g) => g.hi),
    weapons: ghosts.map((g) => g.prop && effectiveVisible(g.prop) ? g.prop.name : null),
    itemTris: Object.fromEntries(HELD_CATEGORIES.map((k) => [k, ghostItemTriangles(k)])) };
};
window.__ready = true;
</script></body></html>
