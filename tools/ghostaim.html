<!doctype html>
<html><head><meta charset="utf-8"><title>Ghost aim poses</title><link rel="icon" href="data:,">
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
</script>
<style>html,body{margin:0;background:#bfc6cc}canvas{display:block}</style></head>
<body><script type="module">
// #2149 component page: remote avatars (Ghost) aiming a rifle, a bow and a Nerf blaster up (balcony), level and down (stair), seen from the side;
// plus a saber. Driven by tools/ghostaimtest.cjs.
import * as THREE from 'three';
import { Ghost } from '../src/ghosts.js';
const CASES = [['rifle', 0.7], ['rifle', 0], ['rifle', -0.7], ['bow', 0.7], ['bow', 0], ['bow', -0.7], ['nerf', 0.7], ['saber', 0.7]];
const W = 1500, H = 560, renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xbfc6cc);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f72, 1.6));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2); sun.position.set(2, 4, 3); scene.add(sun);
const ghosts = CASES.map(([h, pitch], i) => {
  const g = new Ghost(scene, i + 1, 'Spelare ' + (i + 1));
  if (g.tag) g.tag.visible = false;
  scene.add(g.root); g.root.visible = true; g.setHeld(h); g.look = [0, pitch];
  return g;
});
const cam = new THREE.PerspectiveCamera(22, W / H, 0.05, 50);
window.__shot = () => { // from the right (+x): the figures face +z. A figure's `look` is set directly (animate() is driven without the interpolation)
  const n = CASES.length;
  cam.position.set(8.2, 1.15, 0); cam.lookAt(0, 1.05, 0);
  let t = 1000;
  ghosts.forEach((g, i) => { g.root.position.set(0, 0, (i - (n - 1) / 2) * 1.0); g.root.rotation.y = Math.PI; g.have = false; g.look = [0, CASES[i][1]]; });
  for (let k = 0; k < 60; k++) { t += 33; for (const g of ghosts) g.animate(t, 1, 0, 0); }
  renderer.render(scene, cam);
  return ghosts.map((g) => g.prop?.name ?? null);
};
window.__ready = true;
</script></body></html>
