<!doctype html><html lang="sv"><meta charset="utf-8"><title>Lokal föremålsklient B</title>
<style>body{margin:0;background:#20352f;color:white;font:13px system-ui}header{padding:8px}button{padding:10px;margin:3px}canvas{display:block}#status{padding:8px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<header>Klient B · riktig lokal PlayerRoom · produktionsmodeller/adaptrar</header><canvas></canvas><button id="fish">Ta fisken</button><button id="nut">Ta nöten</button><button id="put">Lägg på bordet</button><div id="status"></div>
<script type="module">
import * as T from 'three';import{SharedFish}from'../src/sharedfishclient.js';import{CaughtFish,Fishing}from'../src/fishing.js';import{Nut}from'../src/squirrels.js';import{NutField}from'../src/squirrelbrain.js';import{SquirrelSync}from'../src/squirrelsync.js';import{heldItem}from'../src/holdable.js';
const scene=new T.Scene(),camera=new T.PerspectiveCamera(50,420/240,.01,100);camera.position.set(-16.25,1.62,20.2);camera.lookAt(-16.25,.76,21.7);scene.add(new T.HemisphereLight(0xffffff,0x675c45,3));const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setSize(420,240,false);const table=new T.Mesh(new T.BoxGeometry(.9,.04,6.86),new T.MeshStandardMaterial({color:0x9a744c}));table.position.set(-16.25,.74,24.5);scene.add(table);scene.background=new T.Color('#bad4db');
const got=[],queue=[],saved=[],position=[-16.25,0,20.2],net={on:true,connected:false,me:'',sharedFish:m=>{if(!net.connected)return false;queue.push(m);return true;}};
const fishing={scene,camera,fish:[],fins:[],dropReceipts:[],cookers:{grills:[],pan:null},rod:{placed:false},dropSpot:()=>new T.Vector3(...position),saveState:Fishing.prototype.saveState,onItem:f=>manager.attach(f),onMessage:console.log,onEaten(){throw Error('unexpected fixture reward')},onCatFed(){throw Error('unexpected fixture reward')}};
const manager=new SharedFish({fishing,ghosts:net,persist:()=>saved.push(structuredClone(fishing.saveState())),say:console.log});
const field=new NutField([],()=>0,()=>true,()=>.5);field.setActive(true);const host={nuts:field,net:{on:true,ready:()=>net.connected,me:()=>net.me,notice:console.log}},sync=new SquirrelSync({field,brains:[],me:()=>net.me,send:m=>{queue.push(m);return net.connected},hooks:{notice:console.log}});host.sync=sync;const nutItems=field.slots.map(s=>new Nut(scene,camera,s,new T.MeshStandardMaterial({vertexColors:true}),host));host.nutItems=nutItems;
const socket=new WebSocket('ws://localhost:8937/players?n=Lokalt%20B');socket.onmessage=e=>{if(e.data==='q')return;const m=JSON.parse(e.data);got.push(m);if(m.t==='w'){net.me=m.i;net.connected=true;manager.receive(m.sharedFish,true);sync.receive(m.nutDrops);}else if(m.t==='df')manager.receive(m);else if(m.t==='sq')sync.receive(m);};socket.onclose=()=>net.connected=false;
setInterval(()=>{if(net.connected)socket.send(JSON.stringify(queue.shift()??{p:position,r:Math.PI,score:0}));},200);
document.querySelector('#fish').onclick=()=>fishing.fish.find(f=>f.placed&&!f.broken)?.take();document.querySelector('#nut').onclick=()=>nutItems.find(n=>n.slot.sharedDrop&&!n.broken&&!n.held)?.take();document.querySelector('#put').onclick=()=>{const h=heldItem();h?.placeAt(new T.Vector3(h.isSquirrelNut?-16.174:-16.478,.76,h.isSquirrelNut?21.5:21.4),.7);};
function frame(){manager.update();sync.poll();for(const n of nutItems)n.sync();renderer.render(scene,camera);document.querySelector('#status').textContent=`Fisk ${fishing.fish.filter(f=>!f.broken).length} · nötter ${nutItems.filter(n=>!n.broken).length} · hand ${heldItem()?.name??'tom'} · ${net.connected?'ansluten':'frånkopplad'}`;requestAnimationFrame(frame);}frame();window.peer={scene,camera,renderer,net,socket,got,queue,saved,fishing,manager,field,sync,nutItems,position,heldItem};
</script></html>
