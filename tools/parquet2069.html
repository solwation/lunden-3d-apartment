import * as T from 'three';

 const room=new T.Group();buildLevel(structuredClone(plan.floors[0]),0,room,{standard:std,mats});scene.add(room);room.visible=false;rooms.push(room);

 if(view==='room'){cam.position.set(3.9,1.6,11.9);cam.lookAt(2.1,.55,8.5);}
 else{cam.position.set(1.12,.58,2.48);cam.lookAt(1.4,0,1.02);}
 renderer.render(scene,cam);
 document.querySelector('#label').textContent=`${type?'Standard trestav':'Ek Chalk enstav'} — ${view==='room'?'produktionsbyggd våning, samma kamera/ljus':'produktionsgolv, närvy'} — ${new URLSearchParams(location.search).get('phase')}`;
 let triangles=0,meshes=0;group.traverse(o=>{if(o.isMesh){meshes++;triangles+=(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3;}});

window.__textures=()=>[M.floor,SM.floor].map(m=>{

 return{roughness:m.roughness,maps:maps.map(t=>({width:t.image.width,height:t.image.height,repeat:t.repeat.toArray(),colorSpace:t.colorSpace,baseBytes:t.image.width*t.image.height*4,mippedBytes:mipBytes(t.image.width,t.image.height)})),sameRoughUV:!m.roughnessMap||m.map.repeat.equals(m.roughnessMap.repeat)};
