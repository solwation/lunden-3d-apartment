<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Basketball test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Tilly's basketball (basket.js): the daybed's drawers open (shoes, hair things); the hoop is down; take the ball
// from its holder → the hoop rises; dribble (down to the floor and back into the hand); throw it at the wall (it
// bounces back off it, never through it, and is caught or comes to rest); outside, shots at the rim score a basket
// and from far a three; it never falls through the asphalt; F sends it home and the hoop sinks.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/baskettest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600; f.src = '../index.html?time=12';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, step, heldItem, world, ball, hoop, stats, toggleFurniture } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  d.getElementById('start-touch').click();
  await wait(50);
  world.object.updateMatrixWorld(true);
  const btn = d.getElementById('action');
  const V = camera.position.constructor;
  const look = (p) => { const dx = p.x - camera.position.x, dz = p.z - camera.position.z; camera.rotation.y = Math.atan2(-dx, -dz); camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz)); };
  const stand = (x, z, level) => { player.spawn(x, z, 0); if (level) { player.pos.y = 3.25; player.eyeY = 3.25 + 1.62; } for (let i = 0; i < 3; i++) step(1 / 60); };
  const aim = (obj, level, stands, re) => { // stand somewhere listed, look at obj, until the button matches
    obj.updateMatrixWorld(true);
    const p = obj.getWorldPosition(new V());
    for (const [x, z] of stands) { stand(x, z, level); look(p); step(1 / 60); if (!btn.hidden && re.test(btn.textContent)) return true; }
    return false;
  };
  const run = (secs, until = () => false) => { for (let t = 0; t < secs; t += 1 / 60) { step(1 / 60); if (until()) return true; } return false; };
  let pass = true;

  // the daybed's three drawers: they open, and what is in them shows
  const drawers = world.furnitureTargets.filter((t) => t.name === 'lådan' && t.object && (() => { const p = t.object.getWorldPosition(new V()); return p.x < 1.4 && p.z > 9.8 && p.z < 12.3 && p.y > 3.2 && p.y < 3.6; })());
  pass &= check(drawers.length === 3, `the daybed has 3 drawers (${drawers.length})`);
  for (const dr of drawers) { dr.toggle(); for (let i = 0; i < 30; i++) dr.update(0.1); }
  pass &= check(drawers.every((dr) => dr.isOpen && dr.contents?.visible), 'open, with shoes / hair things showing');
  for (const dr of drawers) { dr.toggle(); for (let i = 0; i < 30; i++) dr.update(0.1); }
  pass &= check(drawers.every((dr) => !dr.isOpen && !dr.contents.visible), 'shut again, the contents hidden');

  // the hoop is down until the ball is taken
  run(0.2);
  pass &= check(!hoop.object.visible && hoop.k === 0, 'the hoop is under the asphalt while the ball is in its holder');
  const bz = ball.model.getWorldPosition(new V()).z; // the holder is centred on the daybed (#312: by the window)
  pass &= check(aim(ball.model, 1, [[1.6, bz], [1.8, bz - 0.4], [1.5, bz + 0.4]], /ta basketbollen/i), `the ball over the daybed: "${btn.textContent}"`);
  btn.click(); step(1 / 60);
  pass &= check(heldItem() === ball, 'the ball in the hand');
  run(1.5);
  pass &= check(hoop.up && hoop.object.visible, 'the hoop has come up out front');

  // dribble: down to the floor, back into the hand
  stand(1.8, 9.8, 1); camera.rotation.set(-0.3, 1.5, 0, 'YXZ');
  let minY = 99;
  ball.useAlt();
  pass &= check(heldItem() !== ball && ball.flying, 'dribbled: out of the hand');
  const back = run(2.5, () => { if (heldItem() !== ball) minY = Math.min(minY, ball.model.position.y); return heldItem() === ball; });
  pass &= check(back && minY < 3.25 + 0.2, `bounced on the floor (lowest ${(minY - 3.25).toFixed(2)} m) and back in the hand`);

  // a throw at the west wall: it bounces back, never through it
  stand(1.9, 10.0, 1); camera.rotation.set(0, Math.PI / 2, 0, 'YXZ'); step(1 / 60);
  let minX = 99;
  let frames = 0;
  ball.use();
  pass &= check(ball.flying, 'thrown at the wall');
  run(12, () => { frames++; if (heldItem() !== ball) minX = Math.min(minX, ball.model.position.x); return heldItem() === ball || !ball.flying; });
  pass &= check(minX > 0.202 + 0.1, `it stayed in the room (nearest the wall x ${minX.toFixed(3)})`);
  pass &= check(heldItem() === ball || (!ball.flying && ball.placed), `caught again or lying still (${heldItem() === ball ? 'caught' : 'lying at ' + ball.model.position.toArray().map((v) => v.toFixed(2)).join(', ')})`);
  if (heldItem() !== ball) { ball.take(); }

  // outside: shots at the rim
  w.Math.random = () => 0.5; // no jitter
  const shoot = (x, z) => {
    stand(x, z, 0); look(hoop.rimC); step(1 / 60);
    const before = stats.baskets;
    if (heldItem() !== ball) ball.take();
    ball.cool = 0; ball.use();
    lines.push(`INFO aim ${ball.lastAim.toArray().map((v) => v.toFixed(2))} rim ${hoop.rimC.toArray().map((v) => v.toFixed(2))} from ${ball.model.position.toArray().map((v) => v.toFixed(2))} v ${ball.v.toArray().map((v) => v.toFixed(2))} camV ${ball.camV.toArray().map((v) => v.toFixed(2))}`);
    let lowest = 99, prev = ball.model.position.clone(), cross = null;
    let pv = ball.v.clone(), kinks = 0;
    const watch = () => { if (heldItem() === ball) return; const p = ball.model.position; lowest = Math.min(lowest, p.y);
      if (kinks < 3 && ball.v.clone().sub(pv).length() > 0.5) { kinks++; lines.push(`INFO kink at ${p.toArray().map((v) => v.toFixed(2))}: v ${pv.toArray().map((v) => v.toFixed(2))} → ${ball.v.toArray().map((v) => v.toFixed(2))}`); } pv = ball.v.clone();
      if (!cross && prev.y >= hoop.rimC.y && p.y < hoop.rimC.y) cross = `${Math.hypot(p.x - hoop.rimC.x, p.z - hoop.rimC.z).toFixed(2)} m off the rim's centre`; prev = p.clone(); };
    run(4, () => { watch(); return stats.baskets > before; });
    run(3, () => { watch(); return !ball.flying; });
    lines.push(`INFO shot from (${x.toFixed(1)}, ${z.toFixed(1)}): down through the rim height ${cross ?? 'never'}`);
    return { scored: stats.baskets > before, lowest };
  };
  const b0 = stats.baskets, t0s = stats.threes;
  const near = shoot(hoop.rimC.x, hoop.rimC.z + 4);
  pass &= check(near.scored && stats.threes === t0s, `a shot from 4 m: in (baskets ${b0} → ${stats.baskets}), not a three`);
  pass &= check(near.lowest > hoop.ground + ball.model.children[0].geometry.parameters.radius - 0.02, `it never sank into the asphalt (lowest ${near.lowest.toFixed(3)})`);
  const far = shoot(hoop.rimC.x + 2, hoop.rimC.z + 7.2);
  pass &= check(far.scored && stats.threes === t0s + 1, `a shot from 7.5 m: in, a three (threes ${stats.threes})`);
  // a shot well to the side of the hoop misses
  stand(hoop.rimC.x + 5, hoop.rimC.z + 4, 0); look(new V(hoop.rimC.x + 5, 3, hoop.rimC.z - 3)); step(1 / 60);
  if (heldItem() !== ball) ball.take();
  const b1 = stats.baskets; ball.cool = 0; ball.use(); run(4);
  pass &= check(stats.baskets === b1, 'a shot past the hoop does not count');

  // E on it where it lies takes it; F: home, the hoop sinks
  run(12, () => !ball.flying);
  pass &= check(!ball.flying && ball.placed, 'it has come to rest on the ground');
  toggleFurniture(false); run(1.5);
  pass &= check(!ball.placed && !ball.held && !hoop.object.visible, 'F: the ball home, the hoop gone');
  toggleFurniture(true); run(0.2);
  pass &= check(!hoop.object.visible, 'F back: the hoop stays down (the ball is home)');
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
