<script type="module">
import * as T from 'three';
import {buildExterior} from '../src/exterior.js';
import {SOLAR_SURFACE as C} from '../src/config.js';

const plan=await (await fetch('../data/plan.json')).json(),lo=plan.floors[0],W=lo.size.x,D=lo.size.z,north=[],south=[];

 for(const pr of floor.windows){
  const facade=pr.z0<D/2?'north':'south',cx=(pr.x0+pr.x1)/2;

 }
 for(const door of floor.doors){

  (door.tip[1]<0?north:south).push({x0:Math.min(door.hinge[0],door.wall[0]),x1:Math.max(door.hinge[0],door.wall[0]),y0:LEVELS[li].floor,y1:LEVELS[li].floor+DOOR_HEIGHT});
 }
}
const m=(color,roughness=.95)=>new T.MeshStandardMaterial({color,roughness});
const exterior=buildExterior({W,D,roofTop:UNIT_TOP,north,south,site:lo.site,frame:m(COLORS.frame),wall:m(COLORS.wall),mats:{patio:m(COLORS.patio),hedge:m(COLORS.hedge),fence:m(COLORS.fence)}});

const scene=new T.Scene();scene.background=new T.Color(0xd7dee3);scene.add(exterior);
const ground=new T.Mesh(new T.PlaneGeometry(180,140),m(0xc6c5be));ground.rotation.x=-Math.PI/2;ground.position.y=-.035;scene.add(ground);
const hemi=new T.HemisphereLight(0xe5edf5,0x80705b,1.7);scene.add(hemi);
const sun=new T.DirectionalLight(0xfff2df,3);sun.position.set(-36,40,20);scene.add(sun);
const camera=new T.PerspectiveCamera(45,1.5,.05,300);

if(panels.length!==1)throw new Error('Expected one real solar batch');
const panel=panels[0];
const hash=async a=>Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',a)),x=>x.toString(16).padStart(2,'0')).join('');
window.__proof=async()=>{
 const geometry=[];let bytes=0,triangles=0;
 for(const o of exterior.getObjectsByProperty('isMesh',true)){
  const g=o.geometry,attributes={};let b=0;
  for(const[k,a]of Object.entries(g.attributes)){attributes[k]={count:a.count,bytes:a.array.byteLength,sha:await hash(a.array)};b+=a.array.byteLength;}
  b+=g.index?.array.byteLength??0;bytes+=b;triangles+=(g.index?.count??g.attributes.position.count)/3;
  geometry.push({name:o.name,panel:o===panel,attributes,index:g.index?await hash(g.index.array):null,bytes:b,triangles:(g.index?.count??g.attributes.position.count)/3,shadows:[o.castShadow,o.receiveShadow]});
 }
 const m=panel.material,tex=t=>t?{size:[t.image.width,t.image.height],bytes:t.image.data.byteLength,version:t.version,colorSpace:t.colorSpace,repeat:[...t.repeat]}:null;
 return{geometry,budget:{meshes:geometry.length,bytes,triangles},walk:exterior.userData.walk,segments:exterior.userData.segments,material:{colour:m.color.getHex(),roughness:m.roughness,metalness:m.metalness,colourMap:tex(m.map),roughnessMap:tex(m.roughnessMap)},panel:geometry.find(g=>g.panel)};
};

 const views={near:[[-32.6,14.6,7.4],[-32.5,12.96,5.9]],roof:[[-17,45,58],[-15,12.9,7]]};
 const[eye,target]=views[view];camera.position.fromArray(eye);camera.lookAt(...target);camera.updateMatrixWorld(true);renderer.info.reset();renderer.render(scene,camera);
 return{view,camera:eye,target,calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,textures:renderer.info.memory.textures,programs:renderer.info.programs.length,image:renderer.domElement.toDataURL('image/jpeg',.96)};
