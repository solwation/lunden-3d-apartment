<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Spider-Man suit test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// #597: the Spider-Man suit folded in the second drawer of Walter & Kian's MALM: not a target through the shut drawer;
// open it, E puts it on (red hands, 🕸 on touch); indoors walking into a wall climbs nothing; E with nothing else lays it
// on the floor, E on it again; outdoors walking into Hus C's façade holds you on it, W climbs, A / D sideways, S down to
// the ground, Space lets go, W to the top pulls you over onto the roof unhurt; walls with no building behind (the area's
// edge) cannot be climbed; a click shoots a web that sticks to the façade, at most SPIDER.web.max at once, gone after
// `life`; keep.js round trip; F home to the drawer; the `spiderman` cheat; touch: the stick climbs, 🕸 shoots.
// #600: no fall hurts in the suit, Space jumps high (once per press), a web on the façade pulls you there onto the wall,
// Space mid-swing lets go and the speed carries on, a web on the street pulls you there; the jump button by 🕸 jumps;
// without the suit 8 m hurts.
// #636: the arms: climbing shows both hands (they follow the direction and the tempo, grip when still), a shot web shows the
// right hand in the web pose (the left one stays down), swinging both reach for the anchor; the suit's jump also works
// indoors but the ceiling stops it (no one goes through the building); without the suit Space / the jump button (always on
// touch) is a low jump (~1 m, well under the suit's) that clears the clipped entrance hedge (0.58 m) which holds a walker;
// the jump leaves stairs, the stairwell and a reload record (`restY`) in order.
//   node runtest.cjs http://localhost:8137/tools/spidersuittest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
f.src = '../index.html?shot&time=12&month=6&freeze';
document.body.append(f);
f.onload = () => run().catch((e) => { out.textContent = `FAIL ${e}\n${e.stack}\nSOME FAILED`; });
async function run() {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const A = w.__app, { player, fall, world, step, camera, renderer, suit, toggleFurniture, touch, keepWorld, cheats, scene } = A;
  const mod = (p) => w.eval(`import('${new URL(p, location.href).href}')`);
  const { PLAYER, SPIDER, SITE, LEVELS, HAND, OUTDOOR } = await mod('../src/config.js');
  const lines = [];
  let pass = true;
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= !!ok; return ok; };
  const f2 = (v) => v.toFixed(2);
  d.getElementById('install').hidden = true;
  Object.defineProperty(d, 'pointerLockElement', { get: () => renderer.domElement, configurable: true });
  d.dispatchEvent(new w.Event('pointerlockchange'));
  const landings = [];
  const land0 = player.onLand;
  player.onLand = (drop, gap) => { const r = land0(drop, gap); landings.push({ drop, gap, r }); return r; };
  const dt = 1 / 60;
  const key = (code, down = true) => d.dispatchEvent(new w.KeyboardEvent(down ? 'keydown' : 'keyup', { code, bubbles: true }));
  const prompt = () => d.getElementById('prompt').hidden ? '' : d.getElementById('prompt').textContent;
  const place = (x, z, feet, yawDeg = 180, pitchDeg = 0) => {
    player.spawn(x, z, yawDeg * Math.PI / 180);
    if (feet !== undefined) { player.pos.y = feet; player.eyeY = feet + PLAYER.eye; }
    camera.rotation.x = pitchDeg * Math.PI / 180;
    landings.length = 0;
    for (let i = 0; i < 10; i++) step(dt);
    for (let i = 0; i < 300 && player.glide; i++) step(dt); // (out of a parked car / a bench first, #314)
  };
  const run = (secs, keys = []) => { player.keys = new Set(keys); for (let t = 0; t < secs; t += dt) { step(dt); if (fall.active) break; } player.keys = new Set(); };

  // (1) in the drawer, the drawer shut: not a target
  const box = scene.getObjectByName('spidersuit-drawer'), m = suit.model;
  check(box && suit.state === 'drawer' && m.parent === box && !suit.reachable && suit.drawer && !suit.drawer.isOpen, 'folded in the MALM drawer (Sovrum 2), the drawer shut: not reachable');
  const at = m.getWorldPosition(camera.position.clone());
  check(at.y > LEVELS[1].floor + 0.5 && at.y < LEVELS[1].floor + 1.1 && Math.abs(at.x - 5.05) < 0.4 && Math.abs(at.z - 9.79) < 0.4, `in Walter & Kian's MALM (${f2(at.x)}, ${f2(at.y)}, ${f2(at.z)})`);
  place(5.05, 8.95, LEVELS[1].floor, 180, -40); // (the MALM's drawers open north, away from the bunk)
  camera.lookAt(at); for (let i = 0; i < 3; i++) step(dt);
  check(!/Spindelmannendräkten/.test(prompt()), `drawer shut: "${prompt()}"`);
  // (2) open it, E on the suit: on
  suit.drawer.toggle(); for (let i = 0; i < 40; i++) step(dt);
  camera.lookAt(suit.target.pickable.getWorldPosition(camera.position.clone())); for (let i = 0; i < 3; i++) step(dt);
  check(/ta på dig Spindelmannendräkten/i.test(prompt()), `drawer open: "${prompt()}"`);
  key('KeyE'); key('KeyE', false); step(dt);
  check(suit.worn && player.suit === suit && !m.visible && !A.heldItem(), 'E: the suit on (hands free)');
  // (3) indoors: walking into the wall climbs nothing
  place(5.05, 8.95, LEVELS[1].floor, 0, 0);
  const y0 = player.pos.y;
  run(1.5, ['KeyW']);
  run(1, ['KeyW']);
  check(!player.climb && Math.abs(player.pos.y - y0) < 0.01, `indoors into the room's north wall: no climbing (y ${f2(player.pos.y)})`);
  // (4) E with nothing else: laid on the floor, E on it again
  place(5.05, 8.95, LEVELS[1].floor, 0, 75); // (up at the ceiling: nothing else in focus)
  check(/ta av dig dräkten/.test(prompt()), `standing with it on: "${prompt()}"`);
  key('KeyE'); key('KeyE', false); step(dt);
  check(suit.state === 'ground' && !player.suit && m.visible && m.parent === scene && Math.abs(m.position.y - LEVELS[1].floor) < 0.05, `laid down on the floor at (${f2(m.position.x)}, ${f2(m.position.y)}, ${f2(m.position.z)})`);
  camera.lookAt(suit.target.pickable.getWorldPosition(camera.position.clone())); for (let i = 0; i < 3; i++) step(dt);
  check(/ta på dig Spindelmannendräkten/i.test(prompt()), `looking down at it: "${prompt()}"`);
  key('KeyE'); key('KeyE', false); step(dt);
  check(suit.worn, 'E: on again');
  // keep.js: laid down → saved → back
  suit.takeOff();
  const saved = JSON.parse(JSON.stringify(keepWorld().spidersuit ?? null)), spot = m.position.clone();
  suit.goHome(); suit.loadState(saved);
  check(saved?.s === 'ground' && suit.state === 'ground' && m.position.distanceTo(spot) < 0.01, `keep.js round trip: ${JSON.stringify(saved)}`);
  suit.putOn();
  check(JSON.stringify(keepWorld().spidersuit) === '{"s":"worn"}', 'keep.js: worn is saved');

  // (5) outdoors: into Hus C's south façade → on the wall; climb; sideways; down; let go
  const C = SITE.blocks.find((b) => b.name === 'Hus C'), cx = (C.x0 + C.x1) / 2, roofC = world.roofs.topAt(cx, C.z1 - 1);
  place(cx, C.z1 + 1.5, undefined, 0, 0);
  const gy = player.pos.y;
  for (let t = 0; t < 3 && !player.climb; t += dt) { player.keys = new Set(['KeyW']); step(dt); }
  check(player.climb && Math.abs(player.climb.nz - 1) < 0.1, `walked into Hus C's south façade: on the wall (normal ${player.climb && f2(player.climb.nx)}, ${player.climb && f2(player.climb.nz)})`);
  run(1, ['KeyW']);
  check(player.climb && player.pos.y > gy + SPIDER.climb * 0.8 && player.pos.z > C.z1 && !player.fall, `W 1 s: up ${f2(player.pos.y - gy)} m, still outside the façade (z ${f2(player.pos.z)})`);
  const hand = A.hand, minf = (h) => Array.from(h.morphTargetInfluences);
  check(hand.hand.visible && hand.left.hand.visible && hand.cPhase > 6 && hand.cDir.y > 0.9, `climbing up: both hands on the wall (phase ${f2(hand.cPhase)} rad, direction ${f2(hand.cDir.x)}, ${f2(hand.cDir.y)})`);
  const ph0 = hand.cPhase; run(0.5, []);
  check(player.climb && Math.abs(hand.cPhase - ph0) < 0.5 && hand.hand.visible && minf(hand.hand)[0] > 0.8 && minf(hand.left.hand)[0] > 0.8, `still on the wall: the hands rest, gripping (grip ${f2(minf(hand.hand)[0])}, ${f2(minf(hand.left.hand)[0])})`);
  const x1 = player.pos.x;
  run(1, ['KeyD']);
  check(hand.cDir.x > 0.9 && Math.abs(hand.cPhase - ph0) > 3, `D: the hands move sideways (direction ${f2(hand.cDir.x)}, ${f2(hand.cDir.y)})`);
  check(player.climb && player.pos.x > x1 + SPIDER.side * 0.8, `D 1 s: sideways ${f2(player.pos.x - x1)} m`);
  run(0.3, ['KeyS']);
  check(hand.cDir.y < -0.9, `S: the hands move down (direction ${f2(hand.cDir.y)})`);
  run(2, ['KeyS']);
  check(!player.climb && Math.abs(player.pos.y - gy) < 0.05, `S: down to the ground and standing (y ${f2(player.pos.y)})`);
  run(0.6, []);
  check(!hand.hand.visible && !hand.left.hand.visible, 'standing again: the arms are down');
  for (let t = 0; t < 2 && !player.climb; t += dt) { player.keys = new Set(['KeyW']); step(dt); }
  run(0.6, ['KeyW']);
  const hy = player.pos.y;
  run(0.05, ['Space']);
  check(!player.climb, `Space: let go at ${f2(hy - gy)} m`);
  run(2);
  check(Math.abs(player.pos.y - gy) < 0.05 && !landings.some((l) => l.r === 'hurt'), 'fell back down, unhurt');
  // (6) to the top: over the edge onto the roof
  for (let t = 0; t < 2 && !player.climb; t += dt) { player.keys = new Set(['KeyW']); step(dt); }
  let t = 0;
  for (; t < 30 && player.climb; t += dt) { player.keys = new Set(['KeyW']); step(dt); }
  player.keys = new Set();
  for (let i = 0; i < 10; i++) step(dt);
  const on = world.roofs.standingOn(player.pos.x, player.pos.z, player.pos.y);
  check(on?.id === 'roof-Hus C' && !landings.some((l) => l.r === 'hurt') && player.aloft, `climbed ${f2(roofC - gy)} m in ${f2(t)} s: on ${on?.name ?? 'nothing'} at ${f2(player.pos.y)} m`);
  // (7) the area's edge (no building behind): no climbing
  place(OUTDOOR.x0 + 1, 0, undefined, 90, 0);
  run(2, ['KeyW']);
  check(!player.climb, `the area's west edge: not climbable (x ${f2(player.pos.x)})`);

  // (#636) a web shot into the sky (nothing to stick to): the right hand takes the web-shooter pose, the left stays down
  place(cx, C.z1 + 30, undefined, 90, 55);
  A.click(0);
  for (let i = 0; i < 20; i++) step(dt);
  const mi = minf(hand.hand);
  check(!player.swing && hand.hand.visible && !hand.left.hand.visible && mi[2] > 0.8 && mi[0] < 0.2 && suit.shot, `a web shot at the sky: the right hand in the web pose (web ${f2(mi[2])}, grip ${f2(mi[0])}), the left down`);
  run(HAND.suit.webHold + 0.5);
  check(!hand.hand.visible, 'the pose goes down again after webHold');
  // (8) webs: a click shoots, a splat on Hus C's façade
  place(cx, C.z1 + 6, undefined, 0, 10);
  const r = A.click(0);
  for (let i = 0; i < 30; i++) step(dt);
  const web = suit.webs[0]?.mesh;
  check(r === 'web' && suit.webs.length === 1 && web && Math.abs(web.position.z - C.z1) < 0.3, `click: a web on the façade at (${web && f2(web.position.x)}, ${web && f2(web.position.y)}, ${web && f2(web.position.z)})`);
  for (let i = 0; i < 6; i++) { camera.rotation.y = (i - 3) * 0.12; A.click(0); for (let k = 0; k < 20; k++) step(dt); }
  check(suit.webs.length === SPIDER.web.max, `six more: ${suit.webs.length} at once (max ${SPIDER.web.max})`);
  for (let i = 0; i < (SPIDER.web.life + 1) * 10; i++) step(0.1);
  check(suit.webs.length === 0 && !suit.strand.visible, `after ${SPIDER.web.life} s: gone`);

  // (#600) no fall hurts with the suit on: 8 m down onto the street, a soft landing where you fell
  place(cx, C.z1 + 8, undefined, 0, 0);
  const sy = player.pos.y;
  player.pos.y = sy + 8; player.eyeY = player.pos.y + PLAYER.eye; landings.length = 0;
  run(3);
  check(!fall.active && landings.some((l) => l.r === 'soft') && !landings.some((l) => l.r === 'hurt') && Math.abs(player.pos.z - (C.z1 + 8)) < 0.1 && Math.abs(player.pos.y - sy) < 0.05,
    `8 m drop in the suit: ${landings.map((l) => `${f2(l.drop)} m ${l.r}`).join(', ')}, still at z ${f2(player.pos.z)}`);
  // (#600) the high jump: Space off the ground outdoors
  place(cx, C.z1 + 8, undefined, 0, 0); landings.length = 0;
  let top = player.pos.y;
  player.keys = new Set(['Space']); step(dt); player.keys = new Set();
  for (let i = 0; i < 180; i++) { step(dt); top = Math.max(top, player.pos.y); }
  check(top - sy > 2 && Math.abs(player.pos.y - sy) < 0.05 && !landings.some((l) => l.r === 'hurt'), `Space: a jump ${f2(top - sy)} m high (SPIDER.jump ${SPIDER.jump} m/s), down unhurt`);
  // held Space jumps once (a press, not a hold)
  run(0.3, ['Space']); run(1.5, ['Space']);
  const t2 = player.pos.y;
  run(0.5, ['Space']);
  check(Math.abs(t2 - sy) < 0.05 && Math.abs(player.pos.y - sy) < 0.05, 'Space held: one jump, then standing');
  // (#600) a web that sticks on Hus C's façade pulls you there and you hold on
  place(cx, C.z1 + 6, undefined, 0, 25); landings.length = 0;
  const cr = A.click(0), anchor = suit.shot?.to;
  let swung = false, ts = 0;
  for (; ts < 5 && !player.climb; ts += dt) { step(dt); swung ||= !!player.swing; }
  check(swung && player.climb && Math.abs(player.climb.nz - 1) < 0.1 && player.pos.z - C.z1 < 0.6 && anchor && Math.abs(player.pos.y + PLAYER.eye - anchor.y) < 0.3 && !landings.length,
    `🕸 at the façade from 6 m: pulled there in ${f2(ts)} s, on the wall, the eyes ${f2(player.pos.y + PLAYER.eye - sy)} m up (z ${f2(player.pos.z - C.z1)} m off it; click '${cr}', the web at ${anchor && [anchor.x, anchor.y, anchor.z].map(f2)}, from ${[player.pos.x, player.pos.z].map(f2)})`);
  check(suit.strand.visible, 'the strand held while swinging');
  player.letGo(); run(3);
  place(cx, C.z1 + 8, undefined, 0, 25); landings.length = 0; A.click(0);
  for (let i = 0; i < 20 && !player.swing; i++) step(dt);
  for (let i = 0; i < 12; i++) step(dt);
  check(player.swing && hand.hand.visible && hand.left.hand.visible && minf(hand.hand)[2] > 0.8, `swinging: both arms up at the anchor (right: web ${f2(minf(hand.hand)[2])})`);
  player.letGo(); run(3);
  place(cx, C.z1 + 6, undefined, 0, 25); landings.length = 0; A.click(0);
  for (let ts2 = 0; ts2 < 5 && !player.climb; ts2 += dt) step(dt);
  run(0.05, ['Space']); run(4);
  check(!player.climb && Math.abs(player.pos.y - sy) < 0.05 && !landings.some((l) => l.r === 'hurt'), 'Space: off the wall, down unhurt');
  // a web on the pergola in the courtyard (held back under it): let go when getting no closer
  place(cx, C.z1 + 10, undefined, 0, 25); landings.length = 0;
  A.click(0);
  for (let i = 0; i < 120 && !player.swing; i++) step(dt);
  let tp = 0; for (; tp < SPIDER.swing.max + 1 && player.swing; tp += dt) step(dt);
  run(2);
  check(!player.swing && !player.climb && !fall.active && Math.abs(player.pos.y - player.groundAt(player.pos.x, player.pos.z, player.pos.y)) < 0.05, `a web held back by the pergola: let go after ${f2(tp)} s, standing`);
  // Space mid-swing lets go: the speed carries on, then down
  place(cx, C.z1 + 14, undefined, 0, 22); landings.length = 0;
  A.click(0);
  for (let i = 0; i < 120 && !player.swing; i++) step(dt);
  for (let i = 0; i < 25 && player.swing; i++) step(dt);
  const zr = player.pos.z, vr = player.swing?.v.clone();
  run(0.05, ['Space']);
  check(vr && !player.swing && player.fling && player.fling.z < -1, `Space mid-swing: let go at ${f2(zr - C.z1)} m (${vr && f2(vr.length())} m/s)`);
  run(3);
  check(!player.swing && !player.fling && player.pos.z < zr - 0.5 && !landings.some((l) => l.r === 'hurt') && !fall.active, `flew on ${f2(zr - player.pos.z)} m and landed unhurt`);
  // a web onto the street (no façade): pulled there, let go at it
  place(cx, C.z1 + 12, undefined, 180, -35);
  const z0s = player.pos.z;
  A.click(0);
  for (let i = 0; i < 240 && (player.swing || i < 60); i++) step(dt);
  run(2);
  check(!player.swing && !player.climb && player.pos.z > z0s + 1 && Math.abs(player.pos.y - player.groundAt(player.pos.x, player.pos.z, player.pos.y)) < 0.05, `a web on the ground ahead: pulled ${f2(player.pos.z - z0s)} m, standing`);

  // (9) F: home to the drawer (the drawer shut)
  toggleFurniture(false); toggleFurniture(true);
  check(suit.state === 'drawer' && m.parent === box && !player.suit, 'F: back in its drawer');
  // (10) the cheat
  const said = cheats.spiderman();
  check(suit.worn && /på/.test(said) && /redan/.test(cheats.spiderman()), `spiderman: "${said}"`);

  // (11) touch: 🕸 shown, the stick climbs, 🕸 shoots, the action button lays it down
  place(cx, C.z1 + 1.5, undefined, 0, 0);
  touch.enabled = true; d.body.classList.add('touch');
  for (let i = 0; i < 3; i++) step(dt);
  const web2 = d.getElementById('web-btn');
  check(!web2.hidden && w.getComputedStyle(web2).display !== 'none', 'touch: 🕸 shown');
  touch.analog.y = 1;
  for (let t2 = 0; t2 < 3 && !player.climb; t2 += dt) step(dt);
  for (let i = 0; i < 60; i++) step(dt);
  check(player.climb && player.pos.y > gy + 1.5, `the stick forward: on the wall, up ${f2(player.pos.y - gy)} m`);
  touch.analog.y = -1;
  for (let i = 0; i < 150 && player.climb; i++) step(dt);
  touch.analog.y = 0; for (let i = 0; i < 5; i++) step(dt);
  check(!player.climb && Math.abs(player.pos.y - gy) < 0.05, 'the stick back: down and standing');
  web2.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true, pointerType: 'touch' }));
  for (let i = 0; i < 20; i++) step(dt);
  check(suit.webs.length >= 1, `🕸: a web (${suit.webs.length})`);
  player.letGo(); run(1); // (the strand pulled you onto the façade, #600)
  camera.rotation.x = 0.4; for (let i = 0; i < 3; i++) step(dt);
  const act = d.getElementById('action');
  check(/Ta av dig dräkten/i.test(act.textContent) && !act.hidden, `the action button says "${act.textContent}"`);
  // the jump button (#600): by 🕸, jumps
  const jb = d.getElementById('jump-btn');
  const jr = jb.getBoundingClientRect(), wr = web2.getBoundingClientRect();
  check(!jb.hidden && w.getComputedStyle(jb).display !== 'none' && Math.abs(jr.top - wr.top) < 2 && jr.right <= wr.left && wr.left - jr.right < 20, `touch: the jump button left of 🕸 (${f2(wr.left - jr.right)} px apart)`);
  place(cx, C.z1 + 8, undefined, 0, 0); top = player.pos.y;
  jb.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true, pointerType: 'touch' }));
  for (let i = 0; i < 180; i++) { step(dt); top = Math.max(top, player.pos.y); }
  check(top - sy > 2, `the jump button: ${f2(top - sy)} m up`);
  camera.rotation.x = 0.4; for (let i = 0; i < 3; i++) step(dt);
  act.click(); step(dt);
  check(suit.state === 'ground' && web2.hidden && !jb.hidden && w.getComputedStyle(jb).display !== 'none' && w.getComputedStyle(web2).display === 'none', 'the action button laid it down; 🕸 hidden, the jump button stays (#636)');
  // (#636) without the suit: the jump button / Space = the low jump (~PLAYER.jump), no web, no climbing, the drop hurts again
  place(cx, C.z1 + 8, undefined, 0, 0); landings.length = 0;
  jb.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true, pointerType: 'touch' })); top = player.pos.y;
  for (let i = 0; i < 90; i++) { step(dt); top = Math.max(top, player.pos.y); }
  const lowH = PLAYER.jump ** 2 / 19.6, highH = SPIDER.jump ** 2 / 19.6;
  check(top - sy > lowH * 0.9 && top - sy < lowH * 1.1 && top - sy < highH / 2 && Math.abs(player.pos.y - sy) < 0.01 && !landings.some((l) => l.r), `no suit: the jump button jumps ${f2(top - sy)} m (the suit's ${f2(highH)} m), a plain landing (${JSON.stringify(landings.map((l) => l.r))})`);
  place(cx, C.z1 + 8, undefined, 0, 0); landings.length = 0; top = player.pos.y;
  run(0.05, ['Space']); for (let i = 0; i < 90; i++) { step(dt); top = Math.max(top, player.pos.y); }
  check(top - sy > lowH * 0.9 && top - sy < lowH * 1.1, `no suit: Space jumps ${f2(top - sy)} m`);
  run(0.3, ['Space']); run(1.5, ['Space']); const t3 = player.pos.y; run(0.5, ['Space']);
  check(Math.abs(t3 - sy) < 0.01 && Math.abs(player.pos.y - sy) < 0.01, 'no suit: Space held, one jump');
  check(A.click(0) !== 'web' && suit.webs.length === 0, 'no suit: a click shoots no web');
  place(cx, C.z1 + 1.5, undefined, 0, 0); run(2, ['KeyW']);
  check(!player.climb && player.pos.z > C.z1, `no suit: walking into the façade does not climb (y ${f2(player.pos.y)})`);
  place(cx, C.z1 + 8, undefined, 0, 0); landings.length = 0;
  player.pos.y = sy + 8; player.eyeY = player.pos.y + PLAYER.eye;
  run(3);
  check(landings.some((l) => l.r === 'hurt'), 'no suit: 8 m hurts');
  for (let i = 0; i < 600 && fall.t >= 0; i++) step(dt);
  touch.enabled = false; d.body.classList.remove('touch');

  // (#636) the jump over the clipped hedge and indoors, with and without the suit
  const jumpTop = (secs = 1.5) => { const y0 = player.pos.y; let hi = y0; player.keys = new Set(['Space']); step(dt); player.keys = new Set(); for (let t = 0; t < secs; t += dt) { step(dt); hi = Math.max(hi, player.pos.y); } return hi - y0; };
  const hedge = scene.getObjectByName('front-boxwood'), hrun = hedge.userData.runs.find((r) => r[1] - r[0] > 6), hx = (hrun[0] + hrun[1]) / 2;
  const hz = hedge.userData.segments.flatMap((q) => [q[1], q[3]]), hz0 = Math.min(...hz), hz1 = Math.max(...hz), hTop = hedge.userData.segments[0][4];
  check(Math.abs(hTop - 0.58) < 0.01, `the hedge's collision carries its top: ${f2(hTop)} m (SITE.life.strip.hedge ${SITE.life.strip.hedge.height} m + its bed)`);
  check(lowH > hTop + 0.3 && lowH < highH / 2, `config: a jump of ${f2(lowH)} m clears the hedge, the suit's ${f2(highH)} m`);
  suit.goHome();
  place(hx, hz0 - 1.0, undefined, 180, 0); run(3, ['KeyW']);
  check(player.pos.z < hz0 && player.pos.z > hz0 - 0.3, `walking into the hedge: held at z ${f2(player.pos.z)} (the hedge starts at ${f2(hz0)})`);
  for (const [label, worn] of [['no suit', false], ['the suit', true]]) {
    if (worn) suit.putOn(); else suit.goHome();
    place(hx, hz0 - 1.0, undefined, 180, 0); landings.length = 0;
    player.keys = new Set(['KeyW']); for (let i = 0; i < 90 && player.pos.z < hz0 - 0.24; i++) step(dt); // walking at the hedge ...
    player.keys = new Set(['KeyW', 'Space']); step(dt); player.keys = new Set(['KeyW']);                 // ... Space from touching it
    let hiH = 0; for (let t = 0; t < 2.5; t += dt) { step(dt); hiH = Math.max(hiH, player.pos.y); }
    check(player.pos.z > hz1 + 0.15 && !fall.active && !landings.some((l) => l.r === 'hurt'), `${label}: walking + Space from the hedge's edge: over it (z ${f2(player.pos.z)}, past ${f2(hz1)}), feet up to ${f2(hiH)} m`);
    player.keys = new Set();
  }
  suit.goHome();
  // indoors the ceiling stops the jump (the suit's high one too): the head stays under the ceiling; Entréplan and Övreplan
  for (const [label, x, z, floor] of [['Entréplan', 4.6, 9.5, LEVELS[0].floor], ['Övreplan (Sovrum 2)', 5.05, 8.95, LEVELS[1].floor]]) {
    for (const worn of [true, false]) {
      if (worn) suit.putOn(); else suit.goHome();
      place(x, z, floor, 0, 0); landings.length = 0;
      const cap = player.ceilingAt(player.pos.x, player.pos.z, player.pos.y) - PLAYER.headroom - player.pos.y, up = jumpTop();
      check(player.inFootprint() && up > 0.3 && up <= cap + 0.02 && up < (worn ? highH : 9) && Math.abs(player.pos.y - floor) < 0.02 && !landings.some((l) => l.r === 'hurt' || (!worn && l.r)) && !fall.active,
        `${label}, ${worn ? 'the suit' : 'no suit'}: jump ${f2(up)} m (the ceiling allows ${f2(cap)} m), landed on the floor (${JSON.stringify(landings.map((l) => l.r))})`);
    }
  }
  suit.goHome();
  // under a lowered ceiling (Tvätt / Badrum RH 2.5): lower still
  place(1.0, 4.0, LEVELS[0].floor, 0, 0);
  const capL = player.ceilingAt(player.pos.x, player.pos.z, player.pos.y) - LEVELS[0].floor, upL = jumpTop();
  check(capL < 2.55 && upL <= capL - PLAYER.headroom + 0.02, `under the soffit (ceiling ${f2(capL)} m): jump ${f2(upL)} m, the head stays under it`);
  // on the stair: a jump lands on the tread again
  place(4.2, 7.1, undefined, 0, 0); const sh = player.stairAt(4.2, 7.1);
  const upS = jumpTop(); check(sh !== null && sh > 0.5 && upS > 0.3 && Math.abs(player.pos.y - player.stairAt(player.pos.x, player.pos.z)) < 0.02 && !fall.active, `on flight A: jump ${f2(upS)} m, back on the tread (${f2(player.pos.y)} m)`);
  // a reload mid-jump keeps the ground, not the air (resume.js refuses a record in the air)
  place(5.05, 8.95, LEVELS[1].floor, 0, 0);
  player.keys = new Set(['Space']); step(dt); player.keys = new Set(); for (let i = 0; i < 8; i++) step(dt);
  check(player.pos.y > LEVELS[1].floor + 0.2 && Math.abs(player.restY() - LEVELS[1].floor) < 0.02, `mid-jump (${f2(player.pos.y - LEVELS[1].floor)} m up): the record keeps the floor (${f2(player.restY())})`);
  run(1);
  // the stairwell / the lift: no jump
  player.pos.set(-17.8, 0, 8.6); player.vy = 0; player.fall = null; for (let i = 0; i < 5; i++) step(dt);
  check(player.inCore && jumpTop(0.5) < 0.01, 'in the stairwell: Space does not jump');

  out.textContent = lines.join('\n') + `\n${pass ? 'ALL PASS' : 'SOME FAILED'}`;
}
</script>
