<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Light test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Light switch test: every switch and floor lamp can be aimed at and toggled with the action
// button (touch mode); the room (and its pool light) turns on.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/lighttest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
f.src = '../index.html?time=12&freeze';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, lights, step } = w.__app;
  const taps = lights.targets;
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  const lines = [];
  let pass = taps.length >= 14;
  lines.push(`${pass ? 'PASS' : 'FAIL'} ${taps.length} switches/lamps`);
  for (const t of taps) {
    (t.object ?? t.pickable).updateMatrixWorld(true);
    // stand 0.7 m from the pick target, on the side facing the room, and look at it
    // the SYMFONISK lamp (#186): aim at its glass (its origin is at its foot on the window board)
    const target = t.kind === 'lamp' && t.name === 'lampan' ? t.room.lamps[0].pos.clone() : t.pickable.getWorldPosition(t.pickable.position.clone());
    const level = target.y > 3 ? 1 : 0;
    const floorY = level ? 3.25 : 0;
    const ring = [...Array(16)].map((_, a) => [target.x + Math.sin((a / 16) * Math.PI * 2) * 0.7, target.z + Math.cos((a / 16) * Math.PI * 2) * 0.7]);
    // on a window board the target is outside the room map: the room in front of it
    const want = w.__app.world.roomMaps[level].at(target.x, target.z) ?? ring.map(([x, z]) => w.__app.world.roomMaps[level].exact(x, z)).find(Boolean);
    let best = null;
    for (let a = 0; a < 16; a++) {
      const ang = (a / 16) * Math.PI * 2, x = target.x + Math.sin(ang) * 0.7, z = target.z + Math.cos(ang) * 0.7;
      if (w.__app.world.roomMaps[level].exact(x, z) === want) { best = { x, z }; break; }
    }
    if (!best) { lines.push(`FAIL ${t.name}: no place to stand`); pass = false; continue; }
    player.spawn(best.x, best.z, Math.atan2(-(target.x - best.x), -(target.z - best.z)));
    player.pos.y = floorY; player.eyeY = floorY + 1.62;
    for (let i = 0; i < 3; i++) step(1 / 60);
    camera.rotation.y = Math.atan2(-(target.x - camera.position.x), -(target.z - camera.position.z));
    camera.rotation.x = Math.atan2(target.y - camera.position.y, Math.hypot(target.x - camera.position.x, target.z - camera.position.z));
    step(1 / 60);
    const label = btn.textContent;
    btn.click();
    step(1 / 60);
    const on = t.isOpen && lights.pool.some((l) => l.intensity > 0);
    btn.click();
    step(1 / 60);
    const off = !t.isOpen;
    const ok = /tända/i.test(label) && on && off;
    pass &&= ok;
    lines.push(`${ok ? 'PASS' : 'FAIL'} ${t.name} @ (${target.x.toFixed(2)}, ${target.y.toFixed(2)}, ${target.z.toFixed(2)}) button "${label}" (${t.room.name ?? ''}) on=${on} off=${off}`);
  }
  // #221: the kitchen's bench light and the hood's light are lamps of their own; their washes follow them
  for (const name of ['bänkbelysningen', 'lampan i köksfläkten']) {
    const l = lights.floorLamps.find((x) => x.name === name);
    if (!l) { pass = false; lines.push(`FAIL ${name}: missing`); continue; }
    l.set(true); const onOk = l.spec.shade.emissiveIntensity > 0.5 && l.spec.glows.every((g) => g.visible && g.opacity > 0.1);
    l.set(false); const offOk = l.spec.shade.emissiveIntensity < 0.1 && l.spec.glows.every((g) => !g.visible);
    pass &&= onOk && offOk;
    lines.push(`${onOk && offOk ? 'PASS' : 'FAIL'} ${name}: the LED and the wash on (${onOk}) and off (${offOk})`);
  }
  // the three SYMFONISK speakers (#186): the white one in the kitchen, the black one in Sovrum 1's window (#201), the lamp on
  // the window board behind the sofa
  const sym = {};
  w.__app.scene.traverse((o) => { if (o.userData.symfonisk) sym[o.userData.symfonisk] = o.getWorldPosition(o.position.clone()); });
  const roomOf = (p) => p && [[0, 0], [0, 0.4], [0, -0.4], [-0.4, 0]].map(([dx, dz]) => w.__app.world.roomMaps[0].at(p.x + dx, p.z + dz)).find(Boolean);
  const symOk = roomOf(sym['speaker white']) === 'Kök / matplats' && w.__app.world.roomMaps[1].at(sym['speaker black'].x, sym['speaker black'].z + 0.4) === 'Sovrum 1' && sym['lamp white']?.z > 12.2;
  pass &&= symOk;
  lines.push(`${symOk ? 'PASS' : 'FAIL'} SYMFONISK: ${Object.entries(sym).map(([k, p]) => `${k} (${p.x.toFixed(2)}, ${p.z.toFixed(2)}) ${roomOf(p)}`).join(', ')}`);
  // no ceiling lamp hangs in the stair opening (#88): Entréplan lamps outside STAIR.hole
  {
    const { STAIR } = await import('../src/config.js');
    const h = STAIR.hole;
    // inside the opening a lamp must hang under a tread (the Klk under the stair, well below the
    // Entréplan ceiling), never at ceiling height in mid-air
    const bad = [...w.__app.lights.rooms.values()].flatMap((R) => R.lamps.filter((l) => l.level === 0
      && l.pos.x > h.x0 && l.pos.x < h.x1 && l.pos.z > h.z0 && l.pos.z < h.z1
      && !(w.__app.stairHeight(l.pos.x, l.pos.z) !== null && w.__app.stairHeight(l.pos.x, l.pos.z) - 0.2 > l.pos.y)).map((l) => `${R.name} (${l.pos.x.toFixed(2)}, ${l.pos.y.toFixed(2)}, ${l.pos.z.toFixed(2)})`));
    lines.push(`${bad.length ? 'FAIL' : 'PASS'} no lamp in the stair opening${bad.length ? ': ' + bad.join(', ') : ''}`);
    pass = pass && !bad.length;
  }
  // every switch sits on a wall: a wall outline segment within 2 cm behind it, covering the plate (#76)
  {
    const sw = w.__app.lights.switches;
    let bad = [];
    for (const s of sw) {
      const p = s.object.position, lv = p.y > 3 ? 1 : 0;
      const n = [Math.sin(s.object.rotation.y), Math.cos(s.object.rotation.y)];
      const ok = w.__app.world.levels[lv].wallSegments.some(([x0, z0, x1, z1]) => {
        const dx = x1 - x0, dz = z1 - z0, len = Math.hypot(dx, dz);
        if (len < 0.1 || Math.abs((dx * n[0] + dz * n[1]) / len) > 0.05) return false;
        const behind = (p.x - x0) * n[0] + (p.z - z0) * n[1]; // plate centre in front of the face
        const t = ((p.x - x0) * dx + (p.z - z0) * dz) / len;
        return behind > -0.001 && behind < 0.02 && t > 0.04 && t < len - 0.04;
      });
      if (!ok) bad.push(`(${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)})`);
    }
    const okW = bad.length === 0;
    lines.push(`${okW ? 'PASS' : 'FAIL'} ${sw.length} switches on a wall${bad.length ? ': floating ' + bad.join(' ') : ''}`);
    pass = pass && okW;
  }
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
