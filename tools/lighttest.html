<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Light test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Light switch test: every switch and floor lamp can be aimed at and toggled with the action
// button (touch mode); the room (and its pool light) turns on. The small lamps follow the dusk, the ceiling lamps
// only the switches, and the pool lights fade instead of jumping when you change rooms (#234).
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/lighttest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
f.src = '../index.html?time=12&freeze';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, lights, step } = w.__app;
  const taps = lights.targets;
  d.getElementById('start-touch').click();
  await wait(50);
  const btn = d.getElementById('action');
  const lines = [];
  let pass = taps.length >= 14;
  lines.push(`${pass ? 'PASS' : 'FAIL'} ${taps.length} switches/lamps`);
  for (const t of taps) {
    if (t.name === 'läslampan') continue; // the bunks' reading lamps (#219): their own test below
    (t.object ?? t.pickable).updateMatrixWorld(true);
    // stand 0.7 m from the pick target, on the side facing the room, and look at it
    // the SYMFONISK lamp (#186): aim at its glass (its origin is at its foot on the window board)
    const target = t.kind === 'lamp' && t.name === 'lampan' ? t.room.lamps[0].pos.clone() : t.pickable.getWorldPosition(t.pickable.position.clone());
    const level = target.y > 3 ? 1 : 0;
    const floorY = level ? 3.25 : 0;
    const ring = [...Array(16)].map((_, a) => [target.x + Math.sin((a / 16) * Math.PI * 2) * 0.7, target.z + Math.cos((a / 16) * Math.PI * 2) * 0.7]);
    // on a window board the target is outside the room map: the room in front of it
    const want = w.__app.world.roomMaps[level].at(target.x, target.z) ?? ring.map(([x, z]) => w.__app.world.roomMaps[level].exact(x, z)).find(Boolean);
    // the first spot in that room from where the button offers the lamp (not, say, the bunk a lamp on a chest stands by)
    // (#421) a small lamp: stand on free floor. A spot inside a piece of furniture (the SYMFONISK lamp's ring runs through
    // the sofa) is glided out of by player.unstick (#314) while the light fades in, and the second press would aim at the
    // sofa: the free spots first, then the nearest free floor to each spot (where a visitor ends up, e.g. by the sofa)
    const passes = t.kind === 'lamp' ? ['free', 'nearest'] : ['any'];
    let best = null, label = '';
    for (let a = 0; a < passes.length * 16; a++) {
      const mode = passes[Math.floor(a / 16)], ang = ((a % 16) / 16) * Math.PI * 2;
      let x = target.x + Math.sin(ang) * 0.7, z = target.z + Math.cos(ang) * 0.7;
      if (w.__app.world.roomMaps[level].exact(x, z) !== want) continue;
      if (mode !== 'any' && !player.isFree(x, z, level)) {
        const n = mode === 'nearest' && player.nearestFree(x, z, level);
        if (!n || w.__app.world.roomMaps[level].exact(n.x, n.z) !== want) continue;
        ({ x, z } = n);
      }
      best ??= { x, z };
      if (w.__app.rest.active) w.__app.standUp(); // a spot tried for an earlier lamp may have sat us down (#331)
      player.spawn(x, z, Math.atan2(-(target.x - x), -(target.z - z)));
      player.pos.y = floorY; player.eyeY = floorY + 1.62;
      for (let i = 0; i < 3; i++) step(1 / 60);
      camera.rotation.y = Math.atan2(-(target.x - camera.position.x), -(target.z - camera.position.z));
      camera.rotation.x = Math.atan2(target.y - camera.position.y, Math.hypot(target.x - camera.position.x, target.z - camera.position.z));
      step(1 / 60);
      label = btn.textContent;
      if (/tända/i.test(label)) break;
    }
    if (!best) { lines.push(`FAIL ${t.name}: no place to stand`); pass = false; continue; }
    if (!/tända/i.test(label)) { lines.push(`FAIL ${t.name}: not offered from any spot ("${label}")`); pass = false; continue; }
    btn.click();
    for (let i = 0; i < 30; i++) step(1 / 60); // (the pool light fades in over LIGHTING.poolFade)
    // (a room behind a closed door from here — the Klk under the stair — gets no pool light through it, #234: then its fixture glows)
    const hidden = t.room.lamps.every((l) => !lights.scores.has(l));
    // #295: a room switch visibly lights its room: the fixture glows, a pool light sits on one of its lamps (standing in
    // the room), its washes are on (k = 1) and wash + pool add up to the lamp
    const glowing = (m) => (m.userData.lit ? m.emissiveIntensity > 0.2 : m.userData.glow ? m.visible && m.opacity > 0 : m.emissiveIntensity > 0.5);
    const wash = lights.wash, uK = wash.k, uPool = wash.pool;
    const mine = wash.entries.map((e, i) => [e, i]).filter(([e]) => e.owner === t.room || e.owner === t);
    const pooled = (lamp) => lights.slots.some((s, i) => s.lamp === lamp && s.f === 1 && lights.pool[i].intensity > 0);
    let washOn = true;
    if (t.kind === 'switch') washOn = mine.length === t.room.lamps.length && mine.every(([, i]) => uK[i] === 1) && mine.every(([e, i]) => Math.abs(uPool[i] - (pooled(e.lamp) ? 1 : 0)) < 1e-6);
    const lit = t.kind === 'switch' ? t.room.mats.length > 0 && t.room.mats.every(glowing) && (hidden || t.room.lamps.some(pooled)) : lights.pool.some((l) => l.intensity > 0) || (hidden && t.room.mats.some((m) => m.emissiveIntensity > 0.5));
    const on = t.isOpen && lit && washOn;
    btn.click();
    step(1 / 60);
    const off = !t.isOpen && (t.kind !== 'switch' || (t.room.mats.every((m) => !glowing(m)) && mine.every(([, i]) => uK[i] === 0) && t.room.lamps.every((l) => !lights.slots.some((s) => s.lamp === l))));
    const ok = /tända/i.test(label) && on && off;
    pass &&= ok;
    lines.push(`${ok ? 'PASS' : 'FAIL'} ${t.name} @ (${target.x.toFixed(2)}, ${target.y.toFixed(2)}, ${target.z.toFixed(2)}) from (${camera.position.x.toFixed(2)}, ${camera.position.z.toFixed(2)}) button "${label}" (${t.room.name ?? ''}) on=${on}${t.kind === 'switch' ? ` (glow, ${hidden ? 'behind a door: no pool light' : 'pool light'}, ${mine.length} washes ${washOn})` : ''} off=${off}`);
  }
  // #409: the Hue Go's handle loop steps through its colour scenes: off → on in the next colour, the glow, the pool
  // light's colour and the shader wash's colour follow; round to the start again
  {
    const hue = lights.floorLamps.find((x) => x.name === 'Hue Go-lampan');
    const loop = w.__app.world.furnitureTargets.find((t) => t.kind === 'huecolor');
    if (!hue || !loop) { pass = false; lines.push('FAIL the Hue Go or its colour target missing'); }
    else {
      const wash = lights.wash, i = wash.entries.findIndex((e) => e.owner === hue), at = (wash.n + i) * 4;
      hue.set(false); step(1 / 60);
      const before = [...wash.data.slice(at, at + 3)];
      loop.toggle(); step(1 / 60);
      const after = [...wash.data.slice(at, at + 3)], c = hue.room.lamps[0].color;
      const ok1 = hue.isOpen && c !== 0xffc98a && hue.spec.shade.emissive.getHex() === c && i >= 0 && after.some((v, k) => Math.abs(v - before[k]) > 1e-3);
      for (let k = 0; k < 3; k++) loop.toggle();
      step(1 / 60);
      const ok2 = hue.room.lamps[0].color === 0xffc98a && Math.abs(wash.data[at] - before[0]) < 1e-4;
      hue.set(false);
      pass &&= ok1 && ok2;
      lines.push(`${ok1 && ok2 ? 'PASS' : 'FAIL'} the Hue Go's colour scenes: on in #${c.toString(16)}, glow + wash follow (${ok1}), round to warm white (${ok2})`);
    }
  }
  // #221: the kitchen's bench light and the hood's light are lamps of their own; their washes follow them (the DANI's too)
  for (const name of ['bänkbelysningen', 'lampan i köksfläkten', 'rottinglampan']) { // + the DANI's floor / ceiling washes (#411, #423)
    const l = lights.floorLamps.find((x) => x.name === name);
    if (!l) { pass = false; lines.push(`FAIL ${name}: missing`); continue; }
    l.set(true); const onOk = l.spec.shade.emissiveIntensity > 0.5 && l.spec.glows.every((g) => g.visible && g.opacity > 0.1);
    l.set(false); const offOk = l.spec.shade.emissiveIntensity < 0.1 && l.spec.glows.every((g) => !g.visible);
    pass &&= onOk && offOk;
    lines.push(`${onOk && offOk ? 'PASS' : 'FAIL'} ${name}: the LED and the wash on (${onOk}) and off (${offOk})`);
  }
  // the bunks' NYMÅNE reading lamps (#219): one per berth, white in Sovrum 3, black in Sovrum 2. Stand on the room side
  // of the bunk level with the lamp's berth (crouched for the lower one, under the top bunk), aim at the shade, on, off
  {
    const THREE = await w.eval("import('three')");
    const reading = taps.filter((t) => t.name === 'läslampan');
    let ok = reading.length === 4;
    lines.push(`${ok ? 'PASS' : 'FAIL'} ${reading.length} reading lamps at the bunks`);
    for (const t of reading) {
      const g = t.pickable; g.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(g), c = box.getCenter(new THREE.Vector3());
      const wallX = g.getWorldPosition(new THREE.Vector3()).x, out = wallX < 3 ? 1 : -1; // into the room
      const lower = t.spec.berth === 'underslafen';
      const colour = g.children.some((m) => m.material?.color?.getHex() === (t.spec.room === 'Sovrum 3' ? 0xf2f2ef : 0x1c1c1e));
      const room = w.__app.world.roomMaps[1].exact(wallX + out * 0.5, c.z);
      player.crouch = lower;
      player.spawn(wallX + out * 1.35, c.z, out > 0 ? Math.PI / 2 : -Math.PI / 2);
      player.pos.y = 3.25; player.eyeY = 3.25 + (lower ? 0.95 : 1.62);
      for (let i = 0; i < 40; i++) step(1 / 60);
      const o = g.getWorldPosition(new THREE.Vector3()), aim = o.clone().add(new THREE.Vector3(out * 0.12, -0.06, 0)); // the shade, out and below the arm
      camera.rotation.y = Math.atan2(-(aim.x - camera.position.x), -(aim.z - camera.position.z));
      camera.rotation.x = Math.atan2(aim.y - camera.position.y, Math.hypot(aim.x - camera.position.x, aim.z - camera.position.z));
      step(1 / 60);
      const label = btn.hidden ? '(hidden)' : btn.textContent;
      btn.click(); step(1 / 60);
      const lp = t.room.lamps[0].pos;
      const on = t.isOpen && t.spec.shade.emissiveIntensity > 0.5 && lights.pool.some((l) => l.intensity > 0 && l.position.distanceTo(lp) < 0.01);
      btn.click(); step(1 / 60);
      const off = !t.isOpen;
      const okL = /tända läslampan/i.test(label) && on && off && colour && room === t.spec.room;
      ok &&= okL;
      lines.push(`${okL ? 'PASS' : 'FAIL'} läslampan ${t.spec.room} ${t.spec.berth} @ (${aim.x.toFixed(2)}, ${(aim.y - 3.25).toFixed(2)}, ${aim.z.toFixed(2)}) from (${camera.position.x.toFixed(2)}, ${(camera.position.y - 3.25).toFixed(2)}, ${camera.position.z.toFixed(2)}) ${lower ? 'crouched' : 'standing'}: "${label}", on=${on} off=${off}, colour ${colour}, room ${room}`);
    }
    player.crouch = false;
    pass &&= ok;
  }
  // the three SYMFONISK speakers (#186): the black one in the kitchen, the white one in Sovrum 1's window (#201, #298), the lamp on
  // the window board behind the sofa
  const sym = {};
  w.__app.scene.traverse((o) => { if (o.userData.symfonisk) sym[o.userData.symfonisk] = o.getWorldPosition(o.position.clone()); });
  const roomOf = (p) => p && [[0, 0], [0, 0.4], [0, -0.4], [-0.4, 0]].map(([dx, dz]) => w.__app.world.roomMaps[p.y > 3 ? 1 : 0].at(p.x + dx, p.z + dz)).find(Boolean); // (the level from the height, #421)
  const symOk = roomOf(sym['speaker black']) === 'Kök / matplats' && w.__app.world.roomMaps[1].at(sym['speaker white'].x, sym['speaker white'].z + 0.4) === 'Sovrum 1' && sym['lamp white']?.z > 12.2;
  pass &&= symOk;
  lines.push(`${symOk ? 'PASS' : 'FAIL'} SYMFONISK: ${Object.entries(sym).map(([k, p]) => `${k} (${p.x.toFixed(2)}, ${p.z.toFixed(2)}) ${roomOf(p)}`).join(', ')}`);
  // no ceiling lamp hangs in the stair opening (#88): Entréplan lamps outside STAIR.hole
  {
    const { STAIR } = await import('../src/config.js');
    const h = STAIR.hole;
    // inside the opening a lamp must hang under a tread (the Klk under the stair, well below the
    // Entréplan ceiling), never at ceiling height in mid-air
    const bad = [...w.__app.lights.rooms.values()].flatMap((R) => R.lamps.filter((l) => l.level === 0
      && l.pos.x > h.x0 && l.pos.x < h.x1 && l.pos.z > h.z0 && l.pos.z < h.z1
      && !(w.__app.stairHeight(l.pos.x, l.pos.z) !== null && w.__app.stairHeight(l.pos.x, l.pos.z) - 0.2 > l.pos.y)).map((l) => `${R.name} (${l.pos.x.toFixed(2)}, ${l.pos.y.toFixed(2)}, ${l.pos.z.toFixed(2)})`));
    lines.push(`${bad.length ? 'FAIL' : 'PASS'} no lamp in the stair opening${bad.length ? ': ' + bad.join(', ') : ''}`);
    pass = pass && !bad.length;
  }
  // every switch sits on a wall: a wall outline segment within 2 cm behind it, covering the plate (#76)
  {
    const sw = w.__app.lights.switches;
    let bad = [];
    for (const s of sw) {
      const p = s.object.position, lv = p.y > 3 ? 1 : 0;
      const n = [Math.sin(s.object.rotation.y), Math.cos(s.object.rotation.y)];
      const ok = w.__app.world.levels[lv].wallSegments.some(([x0, z0, x1, z1]) => {
        const dx = x1 - x0, dz = z1 - z0, len = Math.hypot(dx, dz);
        if (len < 0.1 || Math.abs((dx * n[0] + dz * n[1]) / len) > 0.05) return false;
        const behind = (p.x - x0) * n[0] + (p.z - z0) * n[1]; // plate centre in front of the face
        const t = ((p.x - x0) * dx + (p.z - z0) * dz) / len;
        return behind > -0.001 && behind < 0.02 && t > 0.04 && t < len - 0.04;
      });
      if (!ok) bad.push(`(${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)})`);
    }
    const okW = bad.length === 0;
    lines.push(`${okW ? 'PASS' : 'FAIL'} ${sw.length} switches on a wall${bad.length ? ': floating ' + bad.join(' ') : ''}`);
    pass = pass && okW;
  }
  // #234: at night the small lamps are on by themselves and the ceiling lamps off; spooled to day they go out (a fade),
  // back to night they come on; a lamp switched on by hand in the day stays on until the dusk; walking out of a room
  // with its ceiling lamp on, its pool light never jumps
  pass = (await nightTest(lines)) && pass;
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};

async function nightTest(lines) {
  const g = document.createElement('iframe');
  g.width = 900; g.height = 600; g.src = '../index.html?time=22&freeze';
  document.body.append(g);
  await new Promise((r) => { g.onload = r; });
  const w = g.contentWindow;
  while (!w.__app) await wait(100);
  const { lights, day, step, player } = w.__app;
  w.document.getElementById('start-touch').click();
  await wait(50);
  let pass = true;
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= ok; return ok; };
  const small = lights.floorLamps.filter((f) => f.auto), hood = lights.floorLamps.find((f) => f.name === 'lampan i köksfläkten');
  const rooms = [...lights.rooms.values()];
  const allOn = (k) => small.every((f) => f.room.on && f.k === 1) === k && small.every((f) => !f.room.on && f.k === 0) === !k;
  step(1 / 60);
  check(small.length >= 10 && allOn(true) && !hood.room.on && rooms.every((R) => !R.on),
    `&time=22: ${small.length} small lamps on (${small.filter((f) => f.k === 1).length}), the hood light and all ${rooms.length} ceiling lamps off`);
  const living = rooms.find((R) => R.level === 0 && R.name === 'Vardagsrum');
  const spin = (secs) => { for (let i = 0; i < secs * 60; i++) step(1 / 60); };
  living.toggle();
  day.hour = 12; spin(0.5);
  const fading = small.every((f) => !f.room.on && f.k > 0.2 && f.k < 0.8);
  spin(1);
  check(fading && allOn(false) && living.on, `spooled to 12: the small lamps fade out (half-way ${fading}) and are off, the living-room ceiling lamp stays on`);
  const floor = lights.floorLamps.find((f) => f.name === 'golvlampan');
  floor.toggle(); spin(3);
  check(floor.room.on && floor.k === 1, 'the floor lamp switched on by hand in the day stays on');
  day.hour = 22; spin(1.5);
  check(allOn(true) && living.on, 'spooled to 22: the small lamps are on again, the ceiling lamp unchanged');
  floor.toggle(); spin(2);
  check(!floor.room.on, 'the floor lamp switched off by hand at night stays off');
  day.hour = 12; spin(1.5); day.hour = 22; spin(1.5);
  check(floor.room.on, '…until the next dusk switches it on again');
  // walk from the living room to the kitchen with the living-room ceiling lamp on
  const path = [[3.6, 10.5], [3.3, 8.6], [2.8, 7.4], [2.6, 6.2], [2.6, 5.0], [3.0, 3.6], [3.5, 2.2]];
  player.spawn(path[0][0], path[0][1], 0); spin(1);
  let prev = lights.pool.map((l) => l.intensity), jump = 0, at = '';
  for (let i = 1; i < path.length; i++) {
    const [x0, z0] = path[i - 1], [x1, z1] = path[i];
    const n = Math.ceil(Math.hypot(x1 - x0, z1 - z0) / 0.025); // 1.5 m/s at 60 fps
    for (let j = 1; j <= n; j++) {
      player.pos.x = x0 + (x1 - x0) * j / n; player.pos.z = z0 + (z1 - z0) * j / n;
      step(1 / 60);
      const now = lights.pool.map((l) => l.intensity);
      now.forEach((v, k) => { const d = Math.abs(v - prev[k]); if (d > jump) { jump = d; at = `(${player.pos.x.toFixed(2)}, ${player.pos.z.toFixed(2)})`; } });
      prev = now;
    }
  }
  const room = w.__app.world.roomAt(0, player.pos.x, player.pos.z);
  check(living.on && room === 'Kök / matplats' && jump < 0.15, `walked into ${room}: the living room still lit (${living.on}), the biggest pool step in one frame ${jump.toFixed(3)} at ${at}`);
  // #276: a lit small lamp lights its surroundings wherever the visitor is: its on/off, its k and its wash (in the lit
  // materials' shaders, a texel per lamp, #294) stay the same while the visitor goes through every room on both floors
  const wash = lights.wash, uK = wash.k;
  const auto = small.filter((f) => wash.lamps.includes(f));
  const mats = new Set();
  w.__app.scene.traverse((o) => { for (const m of [o.material].flat()) if (m?.isMeshStandardMaterial) mats.add(m); });
  const patched = [...mats].filter((m) => wash.patched.has(m)).length;
  check(wash.lamps.length >= 20 && auto.length >= 10 && patched === mats.size,
    `${wash.lamps.length} lamp anchors light the flat in the shaders (${auto.length} small lamps), ${patched} of ${mats.size} standard materials have it`);
  const pick = floor; pick.toggle(); // one switched off by hand: it stays off through the walk too
  spin(0.2);
  const snap = () => lights.floorLamps.map((f) => `${f.room.on}:${f.k.toFixed(3)}`).join() + '|' + uK.map((v) => v.toFixed(3)).join();
  const before = snap();
  const lit = wash.lamps.filter((f, i) => uK[i] === 1).length;
  let same = true, where = '', visited = 0, sumOk = true, sumAt = '';
  const uPool = wash.pool;
  const dirs = [[0, -1], [1, 0], [0, 1], [-1, 0]].map(([x, z]) => ({ x, y: 0, z }));
  w.__app.world.roomMaps.forEach((map, level) => {
    for (const r of map.regions()) {
      if (r.area < 0.6) continue;
      for (const dir of dirs) {
        const at = { x: r.x, y: level ? 3.25 + 1.6 : 1.6, z: r.z };
        for (let i = 0; i < 30; i++) { lights.updateAuto(day.daylight, 1 / 60); lights.update(level, at, 1 / 60, dir); }
        visited++;
        if (snap() !== before && same) { same = false; where = `${level}:${r.name}`; }
        // #294: wash and pool light cross-fade — what each lit lamp gives (its wash's share + its pool light's) is its k
        wash.entries.forEach((e, i) => {
          const pool = lights.slots.reduce((a, s, j) => a + (s.lamp === e.lamp ? lights.pool[j].intensity / e.lamp.intensity : 0), 0);
          const sum = uK[i] * (1 - uPool[i]) + pool;
          if (Math.abs(sum - uK[i]) > 1e-3) { sumOk = false; sumAt ||= `${e.owner.name} at ${level}:${r.name} (${sum.toFixed(3)} of ${uK[i]})`; }
        });
      }
    }
  });
  check(same && lit >= 9 && !pick.room.on && uK[wash.lamps.indexOf(pick)] === 0,
    `through ${visited} room/view stops on both floors: every small lamp's on, k and wash unchanged (${lit} washes full, the floor lamp switched off by hand stays off)${same ? '' : ' — changed in ' + where}`);
  day.hour = 12; spin(1.5);
  check(sumOk, `#294: at every stop each lit lamp's wash + pool light add up to the lamp${sumOk ? '' : ' — not ' + sumAt}`);
  // #294: walking away from the lit lamps in 1 m steps through the flat (the living room → the hall), no lamp's lit
  // parts go to the detail culler's hidden layer; from outside only the walls hide them, never their size
  {
    const { camera } = w.__app, culler = w.__app.detail();
    const lampMeshes = [];
    w.__app.scene.traverse((o) => { if (o.isMesh && [o.material].flat().some((m) => m?.userData.lamp)) lampMeshes.push(o); });
    const route = [[3.6, 10.5], [3.3, 7.4], [2.6, 5.0], [2.6, 2.5], [1.6, 1.2], [1.6, 0.8]];
    let hiddenAt = '', stops = 0;
    for (let i = 1; i < route.length; i++) {
      const [x0, z0] = route[i - 1], [x1, z1] = route[i], n = Math.max(1, Math.round(Math.hypot(x1 - x0, z1 - z0)));
      for (let j = 1; j <= n; j++) {
        camera.position.set(x0 + (x1 - x0) * j / n, 1.6, z0 + (z1 - z0) * j / n); camera.updateMatrixWorld();
        culler.update(camera); stops++;
        const gone = lampMeshes.filter((m) => !m.layers.test(camera.layers));
        if (gone.length && !hiddenAt) hiddenAt = `${gone.length} at (${camera.position.x.toFixed(1)}, ${camera.position.z.toFixed(1)})`;
      }
    }
    const sized = culler.items.filter((it) => it.lamp && it.cut !== Infinity).length;
    check(lampMeshes.length > 20 && !hiddenAt && !sized && culler.items.some((it) => it.lamp), `#294: ${lampMeshes.length} lit lamp parts stay drawn over ${stops} 1 m steps away, none culled for its size${hiddenAt ? ' — hidden: ' + hiddenAt : ''}`);
  }
  check(wash.lamps.every((o, i) => !(o.spec) || uK[i] === 0), 'at dawn every small lamp\'s wash is gone');
  day.hour = 22; spin(1.5);
  check(pick.room.on && uK.every((v, i) => v === (wash.lamps[i].auto ? 1 : v)) && uK[wash.lamps.indexOf(living)] === 1, '…and at the dusk they are all back, the hand-switched floor lamp too');
  g.remove();
  return pass;
}
