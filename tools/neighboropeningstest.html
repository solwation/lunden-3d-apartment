const lines=[];let pass=true;const check=(ok,text)=>{lines.push((ok?'PASS':'FAIL')+' '+text);pass&&=!!ok},wait=ms=>new Promise(r=>setTimeout(r,ms));

for(const row of rows.filter(o=>o.panes))for(const p of row.panes){paneCount++;bounds&&=p.x0>=row.x0&&p.x1<=row.x1&&p.y0>=row.y0&&p.y1<=row.y1;const sign=row.north?-1:1;ray.set(new T.Vector3((p.x0+p.x1)/2,(p.y0+p.y1)/2,p.z+sign*.12),new T.Vector3(0,0,-sign));ray.far=.2;const h=ray.intersectObject(E,true)[0];exposed&&=glasses.includes(h?.object);}

const glass=glasses[0].material;E.userData.update(0);const day=glass.envMapIntensity;E.userData.update(1);check(glass.envMapIntensity<day&&glasses[1].material.emissiveIntensity>.5,'night dims reflected daylight and keeps existing warm occupied panes');E.userData.update(0);

// #569: mapped ABC windows retain their original openings, night overlays and real opaque glazing.
let site;A.scene.traverse(o=>{if(o.userData.siteNeighborOpenings)site=o});
const siteGlass=A.scene.getObjectByName('siteNeighborGlass'),siteRows=site.userData.siteNeighborOpenings;

let aligned=0;for(const row of siteRows)for(const p of row.panes)if(litPanes.some(l=>Math.abs(l.x-p.x-row.n[0]*.018)<.001&&Math.abs(l.y-p.y)<.001&&Math.abs(l.z-p.z-row.n[1]*.018)<.001&&Math.abs(l.width-p.width)<.001&&Math.abs(l.height-p.height)<.001))aligned++;
