<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Terrain test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// The ground's levels and joins (#346): the courtyard is the model's reference level (y 0 = L1007's Entréplan floor,
// no real plushöjd), the documented local differences (S2: ~3 m to the park, the ramp ~0.9 m, the stairs ~1.4 m east
// and ~1 m NW) are kept as local conditions, the ramp's ends, the stairs' feet and the garage drive meet their ground
// without a step, no general slope crosses the courtyard's retaining walls or a house's plinth, and the walkable ground
// in OUTDOOR has no step a collision segment does not guard.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/terraintest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 400; f.height = 300; f.src = '../index.html?time=12&month=6';
document.body.append(f);
f.onload = () => run().catch((e) => { out.textContent = `FAIL ${e}\n${e.stack}\nSOME FAILED`; });
async function run() {
  const w = f.contentWindow;
  while (!w.__app) await wait(100);
  const { world } = w.__app;
  const { groundY, westY } = await w.eval(`import('${new URL('../src/surroundings.js', location)}')`);
  const { SITE, OUTDOOR, LEVELS, PLAYER } = await w.eval(`import('${new URL('../src/config.js', location)}')`);
  const T = SITE.terrain, R = T.ramp, E = T.east, Wst = T.west, G = T.garageDoor;
  const lines = [];
  let pass = true;
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= !!ok; return ok; };
  const near = (a, b, tol) => Math.abs(a - b) <= tol;
  const f3 = (v) => v.toFixed(3);

  // the reference level
  check(T.ref && T.ref.y === 0 && T.ref.y === LEVELS[0].floor && groundY(-20, 20) === T.ref.y,
    `the courtyard is the reference level y ${T.ref?.y} = Entréplan's floor ${LEVELS[0].floor} (ground ${groundY(-20, 20)})`);
  check(T.ref.plus === null, `no real plushöjd is claimed (ref.plus = ${T.ref.plus})`);
  // the documented local differences (S2), each where the plan puts it
  const D = T.documented;
  check(near(-T.park, D.park, 1e-9) && near(R.drop, D.ramp, 1e-9) && near(T.stairs[0].drop, D.eastStair, 1e-9),
    `S2's differences: park ${-T.park} (${D.park}), ramp ${R.drop} (${D.ramp}), east stair ${T.stairs[0].drop} (${D.eastStair})`);
  const nwFoot = westY(Wst.stair.z1);
  check(near(-nwFoot, D.nwStair, 0.1), `the NW stair falls ${f3(-nwFoot)} m (S2: ca ${D.nwStair} m)`);

  // the ramp: top on the landing, foot on the street by the gable, no step across either end
  const xs = [R.x0 + 0.1, (R.x0 + R.x1) / 2, R.x1 - 0.1];
  for (const x of xs) {
    const top = [groundY(x, R.z1 - 0.01), groundY(x, R.z1 + 0.01)], foot = [groundY(x, R.z0 + 0.01), groundY(x, R.z0 - 0.01)];
    check(near(top[0], top[1], 0.01) && near(top[1], 0, 1e-9), `ramp top at x ${x.toFixed(2)}: ${f3(top[0])} → landing ${f3(top[1])}`);
    check(near(foot[0], foot[1], 0.01) && near(foot[0], -R.drop, 0.01), `ramp foot at x ${x.toFixed(2)}: ${f3(foot[0])} → street ${f3(foot[1])}`);
  }
  // the stairs: top at the courtyard, foot on the ground (the walk / park level) it leads to
  for (const St of T.stairs) {
    const drop = St.drop ?? -T.park, steps = St.steps ?? Math.round(drop / 0.17);
    let z = St.z;
    for (let k = 0; k < steps; k++) z += (St.landing && k === Math.floor(steps / 2) - 1) ? St.landing : St.step;
    const cx = (St.x0 + St.x1) / 2, foot = groundY(cx, z + 0.05), top = groundY(cx, St.z - 0.05);
    check(near(top, 0, 1e-9) && near(foot, -drop, 0.03), `stair x ${St.x0}…${St.x1} from z ${St.z}: top ${f3(top)}, foot −${drop} on ground ${f3(foot)} at z ${z.toFixed(2)}`);
    if (St.walk) check(near(groundY(cx, St.walk.z0 + 0.01), -drop, 0.03), `its walk starts at the foot (${f3(groundY(cx, St.walk.z0 + 0.01))})`);
  }
  // the NW stair: its top on the forecourt (y 0), its foot on Karpvägen's verge
  check(near(groundY(Wst.stair.x1 + 0.05, Wst.stair.z1 - 0.3), 0, 1e-9), 'the NW stair leaves the level forecourt');
  // the garage drive: level in front of the door, the door's sill on it
  const sill = [];
  for (let z = G.z0 - 0.5; z <= G.z1 + 0.5 + 1e-6; z += 0.5) for (const x of [G.drive + 0.1, (G.drive + G.x) / 2, G.x - 0.06]) sill.push(groundY(x, z));
  const lo = Math.min(...sill), hi = Math.max(...sill);
  check(hi - lo < 0.02 && near(lo, T.park, 0.02), `the garage drive is level at the park / garage floor: ${f3(lo)} … ${f3(hi)}`);

  // no general slope through a retaining wall: just outside every box edge the ground is at or below the courtyard,
  // and it does not climb back up towards the edge within 2 m
  const onBox = (x, z) => T.box.some((b) => x >= b.x0 && x <= b.x1 && z >= b.z0 && z <= b.z1);
  let up = 0, upAt = '';
  for (const b of T.box) for (const [ax, az, bx, bz, ox, oz] of [[b.x0, b.z0, b.x1, b.z0, 0, -1], [b.x1, b.z0, b.x1, b.z1, 1, 0], [b.x0, b.z1, b.x1, b.z1, 0, 1], [b.x0, b.z0, b.x0, b.z1, -1, 0]]) {
    const n = Math.ceil(Math.hypot(bx - ax, bz - az) / 0.5);
    for (let k = 0; k < n; k++) { // the middle of each 0.5 m piece (not the corners, where another edge takes over)
      const x = ax + ((bx - ax) * (k + 0.5)) / n, z = az + ((bz - az) * (k + 0.5)) / n;
      if (onBox(x + ox * 0.05, z + oz * 0.05)) continue;
      const y0 = groundY(x + ox * 0.05, z + oz * 0.05);
      for (const d of [0.5, 1, 2]) {
        if (onBox(x + ox * d, z + oz * d)) break;
        const y = groundY(x + ox * d, z + oz * d);
        if (y > 1e-9 || y > y0 + 0.5) { up++; upAt ||= `(${x.toFixed(1)}, ${z.toFixed(1)})`; }
      }
    }
  }
  check(up === 0, `no ground rises above the courtyard or back towards a box edge: ${up} ${upAt}`);
  // houses: no plinth floats — a house above the ground stands on a plinth down to the lowest ground under its footprint
  // (surroundings.js `plinth`, sampled like `lowestGround`), which must reach the lowest ground just outside it; a base
  // below the ground (a suterräng storey against the courtyard) is allowed
  for (const b of SITE.blocks) {
    let out = Infinity, foot = Infinity;
    const n = 12;
    for (let i = 0; i <= n; i++) for (const [x, z] of [[b.x0 + ((b.x1 - b.x0) * i) / n, b.z0 - 0.1], [b.x0 + ((b.x1 - b.x0) * i) / n, b.z1 + 0.1],
      [b.x0 - 0.1, b.z0 + ((b.z1 - b.z0) * i) / n], [b.x1 + 0.1, b.z0 + ((b.z1 - b.z0) * i) / n]]) out = Math.min(out, groundY(x, z));
    for (let x = b.x0; x <= b.x1 + 1e-6; x += Math.max(0.5, (b.x1 - b.x0) / Math.ceil((b.x1 - b.x0) / 2)))
      for (let z = b.z0; z <= b.z1 + 1e-6; z += Math.max(0.5, (b.z1 - b.z0) / Math.ceil((b.z1 - b.z0) / 2))) foot = Math.min(foot, groundY(x, z));
    const bottom = Math.min(b.base, foot);
    check(bottom <= out + 0.05, `${b.name}: base ${b.base}, plinth to ${f3(bottom)}, lowest ground round it ${f3(out)}`);
  }

  // walkable continuity: in OUTDOOR (outside Hus L's row and the flat), two points 5 cm apart never differ by more than
  // 5 cm unless a collision segment lies between them
  const segs = world.levels[0].segments;
  const cross = (ax, az, bx, bz) => segs.some((s) => {
    const d = (s[2] - s[0]) * (bz - az) - (s[3] - s[1]) * (bx - ax);
    if (Math.abs(d) < 1e-12) return false;
    const t = ((ax - s[0]) * (bz - az) - (az - s[1]) * (bx - ax)) / d, u = ((ax - s[0]) * (s[3] - s[1]) - (az - s[1]) * (s[2] - s[0])) / d;
    return t >= -1e-6 && t <= 1 + 1e-6 && u >= -1e-6 && u <= 1 + 1e-6;
  });
  const { husLLayout } = await w.eval(`import('${new URL('../src/exterior.js', location)}')`);
  const { xw, xe } = husLLayout();
  const { recessFloors } = await w.eval(`import('${new URL('../src/surroundings.js', location)}')`);
  const inHouse = (x, z) => SITE.blocks.some((b) => !b.style && x > b.x0 && x < b.x1 && z > b.z0 && z < b.z1)
    && !recessFloors.some((r) => x >= r.x0 - 0.05 && x <= r.x1 + 0.05 && z >= r.z0 - 0.05 && z <= r.z1 + 0.05); // inside an Å-hus: not walked (#355)
  const inRow0 = (x, z) => x > xw - 0.05 && x < xe + 0.05 && z > -0.05 && z < T.north + 0.05; // Hus L's row (its façades are the segments)
  const inRow = (x, z) => inRow0(x, z) || inHouse(x, z);
  // #355: on the stairs a riser is a step the visitor walks (≤ PLAYER.stepUp), not a drop
  const stairEnd = (St) => { const drop = St.drop ?? -T.park, steps = St.steps ?? Math.round(drop / 0.17); let z = St.z; for (let k = 0; k < steps; k++) z += (St.landing && k === Math.floor(steps / 2) - 1) ? St.landing : St.step; return z; };
  const onStair = (x, z) => T.stairs.some((St) => x >= St.x0 - 0.06 && x <= St.x1 + 0.06 && z >= St.z - 0.06 && z <= stairEnd(St) + 0.06)
    || (x >= Wst.stair.x0 - 0.06 && x <= Wst.stair.x1 + 0.06 && z <= Wst.stair.z1 + 0.06);
  const riser = (x, z, x1, z1, dy) => dy <= 0.25 && dy < PLAYER.stepUp && (onStair(x, z) || onStair(x1, z1));
  const h = 0.05;
  let jumps = 0, jumpAt = '', pairs = 0;
  const cells = new Set(); // one example per metre cell
  for (let x = OUTDOOR.x0; x < OUTDOOR.x1; x += h) for (let z = OUTDOOR.z0; z < OUTDOOR.z1; z += h) {
    if (inRow(x, z)) continue;
    const y = groundY(x, z);
    for (const [x1, z1] of [[x + h, z], [x, z + h]]) {
      if (x1 > OUTDOOR.x1 || z1 > OUTDOOR.z1 || inRow(x1, z1)) continue;
      pairs++;
      const dy = Math.abs(groundY(x1, z1) - y);
      if (dy > 0.05 && !riser(x, z, x1, z1, dy) && !cross(x, z, x1, z1)) { jumps++; const c = `(${Math.round(x)}, ${Math.round(z)})`; if (!cells.has(c) && cells.size < 30) { cells.add(c); jumpAt += ` (${x.toFixed(2)}, ${z.toFixed(2)}) ${f3(y)} → ${f3(groundY(x1, z1))};`; } }
    }
  }
  check(jumps === 0, `walkable ground in OUTDOOR is continuous (${pairs} pairs 5 cm apart): ${jumps} unguarded steps ${jumpAt}`);
  check(PLAYER.stepUp > 0.05, 'the 5 cm tolerance is below the visitor\'s step-up');

  out.textContent = lines.join('\n') + `\n${pass ? 'ALL PASS' : 'SOME FAILED'}`;
}
</script>
</body>
</html>
