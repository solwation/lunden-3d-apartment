<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Walk test</title>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
<pre id="out">running…</pre>
<script type="module">
// Headless smoke test of movement/collision/stairs: walks a waypoint route with the real
// Player class and prints the result. Run (with a local server in the repo root):
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/walktest.html
import * as THREE from 'three';
import { buildWorld } from '../src/world.js';
import { Player } from '../src/player.js';
import { START } from '../src/config.js';

const out = document.getElementById('out');
const plan = await fetch('../data/plan.json').then((r) => r.json());
const world = buildWorld(plan);
const camera = new THREE.PerspectiveCamera();
camera.rotation.order = 'YXZ';
const player = new Player(world, camera);

const routes = {
  'start ute → ytterdörren → hall': {
    start: [START.x, START.z], open: [[0.80, 0.0]], points: [[1.3, -3.0], [1.3, -0.5], [1.3, 1.2]], expectLevel: 0,
  },
  'fasaden blockerar (in i grannens lägenhet)': {
    start: [-3.0, -2.0], open: [], points: [[-3.0, -2.0], [-3.0, 3.0]], expectStuck: true,
  },
  'entré → trappa → Sovrum 1': {
    // via x 2.4 past the dining chairs (between the hall wall and the chair backs)
    start: [1.26, -1.6], open: [[0.80, 0.0], [2.75, 5.01]], // entrance, Sovrum 1
    points: [[1.3, -0.5], [1.3, 2.4], [2.4, 2.4], [2.4, 4.6], [2.7, 7.13], [4.3, 7.13], [5.1, 7.0], [5.15, 6.2],
      [4.3, 6.2], [3.0, 6.2], [3.15, 5.5], [3.15, 3.0]],
    expectLevel: 1,
  },
  'Sovrum 1 → ner → uteplats': {
    start: null, open: [[2.75, 5.01], [0.95, 12.70]], // Sovrum 1, patio door
    points: [[3.15, 5.5], [3.0, 6.2], [4.3, 6.2], [5.15, 6.2], [5.1, 7.0], [4.3, 7.13], [2.7, 7.13],
      [2.7, 9.0], [1.4, 12.0], [1.4, 13.5]],
    expectLevel: 0,
  },
  'uteplats → genom häcköppningen → gräsmattan': {
    start: [1.4, 13.5], open: [], points: [[1.4, 15.2], [0.6, 16.4], [0.6, 18.4], [2.5, 20.0]], expectLevel: 0,
  },
  'grannens skärmvägg blockerar (gräsmattan → grannens uteplats)': {
    start: [-2.0, 20.0], open: [], points: [[-2.0, 20.0], [-2.0, 14.0], [-1.0, 14.0]], expectStuck: true,
  },
  'vägg blockerar (hall → badrum genom vägg)': {
    start: [1.3, 2.4], open: [], points: [[1.3, 2.4], [2.4, 6.0]], expectStuck: true,
  },
};

const lines = [];
let pass = true;
const dt = 1 / 60;
for (const [name, r] of Object.entries(routes)) {
  if (r.start) player.spawn(r.start[0], r.start[1], Math.PI);
  for (const d of world.doors) {
    const wanted = d.kind === 'swing' && r.open.some(([x, z]) => Math.hypot(d.hinge[0] - x, d.hinge[1] - z) < 0.05);
    if (wanted !== d.isOpen) d.toggle();
    for (let i = 0; i < 120; i++) d.update(dt);
  }
  let stuck = false;
  for (const [x, z] of r.points) {
    let t = 0;
    while (Math.hypot(player.pos.x - x, player.pos.z - z) > 0.12) {
      camera.rotation.y = Math.atan2(-(x - player.pos.x), -(z - player.pos.z));
      player.keys = new Set(['KeyW']);
      player.update(dt);
      t += dt;
      if (t > 15) { stuck = true; break; }
    }
    lines.push(`  → (${x}, ${z}) ${stuck ? 'STUCK at' : 'at'} (${player.pos.x.toFixed(2)}, ${player.pos.z.toFixed(2)}) y=${player.pos.y.toFixed(2)} level=${player.level} t=${t.toFixed(1)}s`);
    if (stuck) break;
  }
  player.keys = new Set();
  for (let i = 0; i < 60; i++) player.update(dt);
  const ok = r.expectStuck ? stuck : !stuck && player.level === r.expectLevel;
  pass &&= ok;
  lines.unshift(`${ok ? 'PASS' : 'FAIL'} ${name}`);
  out.textContent = lines.join('\n');
  lines.length = 0;
  out.dataset.log = (out.dataset.log ?? '') + `${ok ? 'PASS' : 'FAIL'} ${name}\n` + out.textContent.split('\n').slice(1).join('\n') + '\n';
}
// sprint (#43): Shift outdoors ≈ PLAYER.run, Shift inside only walking pace; no tunnelling
{
  const { PLAYER } = await import('../src/config.js');
  const run = (x, z, yaw, secs) => {
    player.spawn(x, z, yaw);
    player.keys = new Set(['KeyW', 'ShiftLeft']);
    const x0 = player.pos.x, z0 = player.pos.z;
    for (let i = 0; i < secs * 60; i++) player.update(dt);
    player.keys = new Set();
    return Math.hypot(player.pos.x - x0, player.pos.z - z0) / secs;
  };
  const outV = run(START.x, START.z, Math.PI / 2, 1); // west along the street
  const inV = run(1.3, 0.8, Math.PI, 0.5);             // hall, facing south
  const okOut = Math.abs(outV - PLAYER.run) < 0.15, okIn = Math.abs(inV - PLAYER.walk) < 0.15;
  pass &&= okOut && okIn;
  out.dataset.log += `${okOut ? 'PASS' : 'FAIL'} sprint utomhus (${outV.toFixed(2)} m/s, vill ${PLAYER.run})\n`;
  out.dataset.log += `${okIn ? 'PASS' : 'FAIL'} inomhus bara gång med Shift (${inV.toFixed(2)} m/s, vill ${PLAYER.walk})\n`;
  // sprint straight at a neighbour's screen wall from the lawn: must stop at it
  run(-2.0, 21.0, 0, 3);
  const okWall = player.pos.z > 17.5;
  pass &&= okWall;
  out.dataset.log += `${okWall ? 'PASS' : 'FAIL'} sprint tunnlar inte genom häcken (z ${player.pos.z.toFixed(2)})\n`;
}
// crouch (#70): Ctrl lowers the eye to PLAYER.crouchEye at half speed, and the stair still works
{
  const { PLAYER } = await import('../src/config.js');
  player.spawn(1.3, 0.8, Math.PI);
  player.crouch = true;
  for (let i = 0; i < 60; i++) player.update(dt);
  const eye = player.eyeY - player.pos.y;
  player.keys = new Set(['KeyW']);
  const z0 = player.pos.z;
  for (let i = 0; i < 30; i++) player.update(dt);
  const v = (player.pos.z - z0) / 0.5;
  player.keys = new Set();
  const okEye = Math.abs(eye - PLAYER.crouchEye) < 0.05, okV = Math.abs(v - PLAYER.walk * PLAYER.crouchSpeed) < 0.1;
  out.dataset.log += `${okEye ? 'PASS' : 'FAIL'} huk: ögonhöjd ${eye.toFixed(2)} m\n${okV ? 'PASS' : 'FAIL'} huk: fart ${v.toFixed(2)} m/s\n`;
  pass &&= okEye && okV;
  // walk up the stair on your haunches
  player.spawn(2.7, 7.13, -Math.PI / 2);
  for (const [x, z] of [[4.3, 7.13], [5.1, 7.0], [5.15, 6.2], [4.3, 6.2], [3.0, 6.2]]) {
    for (let t = 0; t < 12 && Math.hypot(player.pos.x - x, player.pos.z - z) > 0.12; t += dt) {
      camera.rotation.y = Math.atan2(-(x - player.pos.x), -(z - player.pos.z));
      player.keys = new Set(['KeyW']);
      player.update(dt);
    }
  }
  player.keys = new Set();
  const okStair = player.level === 1;
  out.dataset.log += `${okStair ? 'PASS' : 'FAIL'} huk: uppför trappan (level ${player.level})\n`;
  pass &&= okStair;
  player.crouch = false;
  for (let i = 0; i < 60; i++) player.update(dt);
  const up = Math.abs(player.eyeY - player.pos.y - PLAYER.eye) < 0.05;
  out.dataset.log += `${up ? 'PASS' : 'FAIL'} reser sig när Ctrl släpps\n`;
  pass &&= up;
}
out.textContent = (pass ? 'ALL PASS\n' : 'SOME FAILED\n') + out.dataset.log;
</script>
</body>
</html>
