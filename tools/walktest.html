<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Walk test</title>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
<pre id="out">running…</pre>
<script type="module">
// Headless smoke test of movement/collision/stairs: walks a waypoint route with the real
// Player class and prints the result. Run (with a local server in the repo root):
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/walktest.html
import * as THREE from 'three';
import { buildWorld } from '../src/world.js';
import { Player } from '../src/player.js';

const out = document.getElementById('out');
const plan = await fetch('../data/plan.json').then((r) => r.json());
const world = buildWorld(plan);
const camera = new THREE.PerspectiveCamera();
camera.rotation.order = 'YXZ';
const player = new Player(world, camera);

const routes = {
  'entré → trappa → Sovrum 1': {
    start: [1.26, -1.6], open: [[0.80, 0.0], [2.75, 5.01]], // entrance, Sovrum 1
    points: [[1.3, -0.5], [1.3, 2.4], [2.7, 2.4], [2.7, 7.13], [4.3, 7.13], [5.1, 7.0], [5.15, 6.2],
      [4.3, 6.2], [3.0, 6.2], [3.15, 5.5], [3.15, 3.0]],
    expectLevel: 1,
  },
  'Sovrum 1 → ner → uteplats': {
    start: null, open: [[2.75, 5.01], [0.95, 12.70]], // Sovrum 1, patio door
    points: [[3.15, 5.5], [3.0, 6.2], [4.3, 6.2], [5.15, 6.2], [5.1, 7.0], [4.3, 7.13], [2.7, 7.13],
      [2.7, 9.0], [1.4, 12.0], [1.4, 13.5]],
    expectLevel: 0,
  },
  'vägg blockerar (hall → badrum genom vägg)': {
    start: [1.3, 2.4], open: [], points: [[1.3, 2.4], [2.4, 6.0]], expectStuck: true,
  },
};

const lines = [];
let pass = true;
const dt = 1 / 60;
for (const [name, r] of Object.entries(routes)) {
  if (r.start) player.spawn(r.start[0], r.start[1], Math.PI);
  for (const d of world.doors) {
    const wanted = d.kind === 'swing' && r.open.some(([x, z]) => Math.hypot(d.hinge[0] - x, d.hinge[1] - z) < 0.05);
    if (wanted !== d.isOpen) d.toggle();
    for (let i = 0; i < 120; i++) d.update(dt);
  }
  let stuck = false;
  for (const [x, z] of r.points) {
    let t = 0;
    while (Math.hypot(player.pos.x - x, player.pos.z - z) > 0.12) {
      camera.rotation.y = Math.atan2(-(x - player.pos.x), -(z - player.pos.z));
      player.keys = new Set(['KeyW']);
      player.update(dt);
      t += dt;
      if (t > 15) { stuck = true; break; }
    }
    lines.push(`  → (${x}, ${z}) ${stuck ? 'STUCK at' : 'at'} (${player.pos.x.toFixed(2)}, ${player.pos.z.toFixed(2)}) y=${player.pos.y.toFixed(2)} level=${player.level} t=${t.toFixed(1)}s`);
    if (stuck) break;
  }
  player.keys = new Set();
  for (let i = 0; i < 60; i++) player.update(dt);
  const ok = r.expectStuck ? stuck : !stuck && player.level === r.expectLevel;
  pass &&= ok;
  lines.unshift(`${ok ? 'PASS' : 'FAIL'} ${name}`);
  out.textContent = lines.join('\n');
  lines.length = 0;
  out.dataset.log = (out.dataset.log ?? '') + `${ok ? 'PASS' : 'FAIL'} ${name}\n` + out.textContent.split('\n').slice(1).join('\n') + '\n';
}
out.textContent = (pass ? 'ALL PASS\n' : 'SOME FAILED\n') + out.dataset.log;
</script>
</body>
</html>
