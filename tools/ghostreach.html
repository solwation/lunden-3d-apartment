<!doctype html>
<html><head><meta charset="utf-8"><title>Ghost reach</title><link rel="icon" href="data:,">
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  } }
</script>
<style>html,body{margin:0;background:#bfc6cc}canvas{display:block}</style></head>
<body><script type="module">
// #2161 component page: two remote avatars (Ghost) seen from the side, both facing east (root yaw -90 deg: the body adds 180): A reaches for a door handle (a plain door leaf),
// B for a thing on the floor (a small box). `?off=1` starts no reach (the state before the issue). Driven by tools/ghostreachtest.cjs.
import * as THREE from 'three';
import { Ghost } from '../src/ghosts.js';
import { REACH } from '../src/config.js';
const q = new URLSearchParams(location.search), off = q.has('off');
const W = 1400, H = 700, renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xbfc6cc);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f72, 1.6));
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2); sun.position.set(2, 4, 4); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 4), new THREE.MeshStandardMaterial({ color: 0x9a8f80 })); floor.rotation.x = -Math.PI / 2; floor.position.set(1.4, 0, 0); scene.add(floor);
const leaf = new THREE.Mesh(new THREE.BoxGeometry(0.05, 2.0, 0.9), new THREE.MeshStandardMaterial({ color: 0xe8e2d6 })); leaf.position.set(0.55, 1.0, 0); scene.add(leaf);
const knob = new THREE.Mesh(new THREE.SphereGeometry(0.035), new THREE.MeshStandardMaterial({ color: 0x555a60 })); knob.position.set(0.5, 1.0, 0.0); scene.add(knob);
const box = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.1, 0.16), new THREE.MeshStandardMaterial({ color: 0xc0392b })); box.position.set(2.85, 0.05, 0); scene.add(box);
const CASES = [{ x: -0.1, target: [0.55, 1.0, 0.0] }, { x: 2.35, target: [2.85, 0.07, 0.0] }];
const ghosts = CASES.map((c, i) => {
  const g = new Ghost(scene, i + 1, 'Spelare ' + (i + 1)); if (g.tag) g.tag.visible = false;
  g.root.visible = true; g.push({ p: [c.x, 0, 0], r: -Math.PI / 2, hi: '', look: [0, 0] }, 1000); g.look = [0, 0];
  return g;
});
const cam = new THREE.PerspectiveCamera(24, W / H, 0.05, 50);
window.__shot = (at = 0.5) => { // at: the share of the held part of the reach shown (0.5 = mid-hold)
  cam.position.set(1.3, 1.1, 6.2); cam.lookAt(1.3, 0.95, 0);
  let t = 1000;
  ghosts.forEach((g, i) => {
    g.root.position.set(CASES[i].x, 0, 0); g.root.rotation.y = -Math.PI / 2; g.have = false;
    for (let k = 0; k < 30; k++) g.animate(t += 33, 1, 0, 0);
    const start = t; if (!off) g.startReach(CASES[i].target, start);
    const end = start + (REACH.up + REACH.hold * at) * 1000;
    while (t < end) g.animate(t += 33, 1, 0, 0);
  });
  renderer.render(scene, cam);
  return { reaching: ghosts.map((g) => !!g.reach) };
};
window.__ready = true;
</script></body></html>
