<!doctype html><html lang="sv"><meta charset="utf-8"><title>Watering test</title><pre id="out">running…</pre><script type="module">
const lines=[];let pass=true;const check=(ok,text)=>{lines.push((ok?'PASS':'FAIL')+' '+text);pass&&=!!ok},wait=ms=>new Promise(r=>setTimeout(r,ms));

 function aim(point,target,feet=0){for(let k=0;k<16;k++){const a=k/16*Math.PI*2;A.player.spawn(point.x+Math.sin(a)*.8,point.z+Math.cos(a)*.8,0);A.player.pos.y=feet;A.player.eyeY=feet+1.62;A.step(0);A.camera.lookAt(point);A.camera.updateMatrixWorld(true);A.step(0);if(A.focus().focused===target)return true;}return false;}

 const pick=p.target.pickable;check(pick.material.visible===false,'care target stays invisible when SillPot reveals its own child meshes');

 check(I.audit().length===0,'inventory invariants hold after filling, cancellation, moving, pouring and reload');
 A.resetHome.go=()=>{};A.resetHome.confirm();A=await load('shot&cloud=&time=12');
 check(A.life.items.ofType('wateringCan').length===1&&A.life.items.ofType('wateringCan')[0].amount===0&&A.watering.plants.every(p=>!p.watered),'actual home reset restores one empty can and dry plants');
 document.getElementById('out').textContent=lines.join('\n')+'\n'+(pass?'ALL PASS':'SOME FAILED');
}catch(e){document.getElementById('out').textContent=lines.join('\n')+'\nFAIL '+e.stack;}
</script></html>
