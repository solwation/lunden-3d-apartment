<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Life test (M3)</title></head>
<body>
<pre id="out">running…</pre>
<script type="module">
import { LIFE, LIFE_MESS, LEVELS } from '../src/config.js';
const out = document.getElementById('out');
const lines = [];
let pass = true;
const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= !!ok; return ok; };
const only = new URLSearchParams(location.search).get('only'); // ?only=383,385: just those sections
const want = (n) => !only || only.split(',').includes(String(n));
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
async function load(q) {
  const f = document.createElement('iframe');
  f.width = 900; f.height = 600; f.src = `../index.html?${q}`;
  document.body.append(f);
  await new Promise((r) => { f.onload = r; });
  while (!f.contentWindow.__app) await wait(100);
  f.contentDocument.getElementById('start-touch').click();
  await wait(50);
  return f;
}
/** The test's tools for one page. */
function kit(f) {
  const A = f.contentWindow.__app, d = f.contentDocument, btn = d.getElementById('action');
  const { player, camera, step, scene } = A;
  const settle = (o) => { for (let i = 0; i < 40; i++) o.update(0.1); scene.updateMatrixWorld(true); };
  const open = (o) => { if (o && !o.isOpen) { o.toggle(); settle(o); } };
  const close = (o) => { if (o && o.isOpen) { o.toggle(); settle(o); } };
  const secs = (s) => { for (let i = 0; i < Math.ceil(s * 60); i++) step(1 / 60); };
  const ring = (p) => [...Array(16)].map((_, i) => [p.x + Math.sin(i / 16 * 6.283) * (0.75 + (i % 2) * 0.3), p.z + Math.cos(i / 16 * 6.283) * (0.75 + (i % 2) * 0.3)]);
  /** Aim the eye at world point p from a few stands until the action button / the menu matches `re`. */
  const aim = (p, re, stands = []) => {
    for (const [x, z] of [...stands, ...ring(p)]) {
      player.spawn(x, z, 0); for (let i = 0; i < 3; i++) step(1 / 60);
      const dx = p.x - camera.position.x, dz = p.z - camera.position.z;
      camera.rotation.y = Math.atan2(-dx, -dz); camera.rotation.x = Math.atan2(p.y - camera.position.y, Math.hypot(dx, dz)); step(1 / 60);
      const text = btn.hidden ? [...d.querySelectorAll('#choices button')].map((b) => b.textContent).join(' | ') : btn.textContent;
      if (re.test(text)) return text;
    }
    return null;
  };
  const life = A.life, I = life.items;
  /** Row `id` of a target's actions (an instance, or a raw target such as a tap). */
  const row = (id, target) => life.options(target?.id ? { item: life.view(target) } : target ?? { instance: I.held() }).find((o) => o.id === id);
  /** Run row `id` and let it finish: true, or the reason. */
  const run = (id, target, s = 0) => { const r = row(id, target); const ok = !!r && !r.reason && r.run(); secs(s + 0.1); return ok ? true : r?.reason ?? `no ${id}`; };
  const lid = (k) => A.world.lids.find(k);
  return { A, d, btn, settle, open, close, secs, aim, life, I, row, run, lid, step, V: camera.position.constructor };
}

const box = (m) => { m.geometry.computeBoundingBox(); return m.geometry.boundingBox.clone().applyMatrix4(m.matrixWorld); };

// --- #388: crumbs and dust ----------------------------------------------------------------------------------------
if (want(388)) try {
  const f = await load('life&shot');
  const K = kit(f), { A, life, I, run, secs, step, V } = K, mess = life.mess, P = A.player;
  check(mess && mess.spots.length === 0, `&life starts without mess (${mess?.spots.length})`);
  // a slice of bread eaten in the kitchen, standing on the floor: crumbs at the feet
  P.spawn(4.3, 2.6, Math.PI / 2); A.camera.rotation.x = 0; step(1 / 60);
  life.create('breadSlice', { at: 'hand' }); step(1 / 60);
  for (let k = 0; k < 4; k++) run('eat', null, 0.6);
  const fl = mess.spots.filter((s) => s.kind === 'crumb' && s.surf === 'floor');
  check(!I.held() && fl.length >= 1 && fl.every((s) => s.y === LEVELS[0].floor && Math.hypot(s.x - P.pos.x, s.z - P.pos.z) < 0.6 && P.isFree(s.x, s.z, 0, LIFE_MESS.margin)),
    `eating a slice drops crumbs on the floor at the feet (${fl.map((s) => `${s.x},${s.z} ${s.amt}`).join(' | ')})`);
  check(Math.abs(mess.total() - 4 * LIFE_MESS.per.bite) < 1e-6 && fl.length === 1, `four bites, one spot that grew (${mess.total()})`);
  check(/^Kök/.test(fl[0]?.room ?? ''), `the spot knows its room (${fl[0]?.room})`);
  // a bite over the dining table: on the table
  const table = A.world.cupSurfaces.find((s) => Math.abs(s.userData.surface - 0.754) < 0.01), tb = box(table).getCenter(new V());
  const t = mess.fromEvent({ from: 'bite', pos: [tb.x, 1.3, tb.z], feet: [tb.x + 0.6, 0, tb.z] });
  check(t && t.surf === 'table' && Math.abs(t.y - 0.754) < 0.01, `a bite over the dining table: crumbs on the table (${t?.surf} ${t?.y})`);
  // a cut on the board on the worktop: beside the board, on the worktop
  const top = A.world.cupSurfaces.find((s) => s.userData.counter), wc = box(top).getCenter(new V());
  const c = mess.fromEvent({ from: 'cut', pos: [wc.x, top.userData.surface, wc.z] });
  check(c && c.surf === 'worktop' && Math.abs(c.y - top.userData.surface) < 0.01 && life.worktopAt([c.x, c.y, c.z]), `a cut: crumbs beside the board on the worktop (${c?.surf} ${c?.x?.toFixed(2)},${c?.z?.toFixed(2)})`);
  // a real cut: the cucumber on the board on the worktop, the knife in the hand
  const board = I.ofType('board')[0], cuc = I.ofType('cucumber')[0], knife = I.ofType('knife')[0];
  I.move(board, { at: 'world', pos: [wc.x, top.userData.surface + 0.001, wc.z], yaw: 0 }, { ignoreShut: true });
  I.move(cuc, { at: 'on', parent: board.id, slot: 0 }, { ignoreShut: true });
  I.move(knife, { at: 'hand' }, { ignoreShut: true }); step(1 / 60);
  const before = mess.total({ kind: 'crumb' });
  const cutOk = run('cut', cuc, 1);
  check(cutOk === true && mess.total({ kind: 'crumb' }) > before, `cutting the cucumber leaves crumbs (${cutOk}, ${before} → ${mess.total({ kind: 'crumb' })})`);
  I.move(knife, { at: 'world', pos: [wc.x, top.userData.surface + 0.001, wc.z + 0.3], yaw: 0 }); step(1 / 60);
  // saved by amount
  const sig = (m) => m.spots.map((s) => `${s.kind}:${s.surf}:${s.x},${s.z}:${s.amt.toFixed(3)}`).sort().join(' ');
  const was = sig(mess), rec = JSON.parse(JSON.stringify(life.serialize()));
  check(rec.x?.mess?.s?.length === mess.spots.length, `the record has every spot (${rec.x?.mess?.s?.length})`);
  mess.clear(); life.load(rec);
  check(sig(mess) === was && mess.meshes.crumb.count === mess.count('crumb'), 'loaded again: the same spots, the same amounts, drawn');
  // dust: near a wall, on a floor the visitor reaches, at most perRoom spots a room
  for (let i = 0; i < 120; i++) mess.dust();
  const dust = mess.spots.filter((s) => s.kind === 'dust'), perRoom = {};
  for (const s of dust) perRoom[`${s.level}:${s.room}`] = (perRoom[`${s.level}:${s.room}`] ?? 0) + 1;
  const near = (s) => A.world.levels[s.level].wallSegments.some(([ax, az, bx, bz]) => { const dx = bx - ax, dz = bz - az, l = dx * dx + dz * dz || 1, k = Math.max(0, Math.min(1, ((s.x - ax) * dx + (s.z - az) * dz) / l)); return Math.hypot(s.x - ax - dx * k, s.z - az - dz * k) < LIFE_MESS.dust.wall + 1e-6; });
  check(dust.length > 6 && dust.every((s) => s.y === LEVELS[s.level].floor && s.room && P.isFree(s.x, s.z, s.level, LIFE_MESS.margin) && near(s)),
    `dust on the floors near the walls, where you reach (${dust.length} spots on ${new Set(dust.map((s) => s.level)).size} floors)`);
  check(Object.values(perRoom).every((n) => n <= LIFE_MESS.dust.perRoom) && dust.every((s) => s.amt <= 1), `at most ${LIFE_MESS.dust.perRoom} dust spots a room, none over full (${JSON.stringify(perRoom)})`);
  // the cap: far more than it draws
  for (let i = 0; i < 300; i++) mess.add('crumb', 0.5 + Math.random() * 4.5, 0, 7.2 + Math.random() * 5.2, { amt: 0.3 });
  check(mess.count('crumb') <= LIFE_MESS.max.crumb && mess.meshes.crumb.count === mess.count('crumb') && mess.meshes.crumb.instanceMatrix.count === LIFE_MESS.max.crumb,
    `300 more crumbs: still at most ${LIFE_MESS.max.crumb} spots (${mess.count('crumb')}), one mesh`);
  check(mess.spots.every((s) => s.amt <= 1), 'no spot over full: the mess never grows without bound');
  // off: nothing by itself
  mess.clear(); life.rules.mess = false;
  life.create('breadSlice', { at: 'hand' }); step(1 / 60); run('eat', null, 0.6);
  mess.dustT = 1e9; mess.update(1);
  check(mess.spots.length === 0, 'the automatic mess off: no crumbs, no dust');
  life.rules.mess = true;
  f.remove();
  const g = await load('life&shot&mess=0');
  check(g.contentWindow.__app.life.rules.mess === false, '&mess=0 switches it off');
  g.remove();
} catch (e) { pass = false; lines.push(`FAIL #388 error ${e.stack}`); }

// --- #389: stick vacuum take out and dock -------------------------------------------------------------------------
if (want(389)) try {
  const f = await load('life&shot');
  const K = kit(f), { A, step, V, settle } = K;
  const vac = A.vacuum, kd = A.world.klkDoor;
  check(vac && vac.isAtDock && vac.led.visible, `vacuum starts docked with charging LED visible (${vac?.isAtDock})`);
  check(kd && !kd.isOpen, `storage door starts shut (${kd?.isOpen})`);

  // Closed door blocks taking from dock
  check(vac.takeTarget.blocked && vac.takeTarget.blockedText === 'Öppna förrådsdörren först',
    `taking is blocked with hint when door shut (${vac.takeTarget.blockedText})`);
  vac.take();
  check(vac.isAtDock && !vac.held, 'taking with shut door refused');

  // Open storage door
  kd.toggle(); settle(kd);
  check(kd.isOpen && !vac.takeTarget.blocked, `storage door open, taking unblocked (${vac.takeTarget.blocked})`);

  // Take vacuum into hand (vacuum mode)
  vac.take();
  check(vac.held && !vac.isAtDock && !vac.led.visible, 'vacuum in hand, charging LED off');
  check(vac.model.parent === A.camera && vac.model.position.y < -1.4, `held in vacuum mode with head on floor (${vac.model.position.y.toFixed(2)})`);

  // Place on floor
  const floorSpot = new V(3.8, LEVELS[0].floor, 5.0);
  vac.placeAt(floorSpot, 0);
  check(!vac.held && vac.placed && !vac.isAtDock && !vac.led.visible, 'vacuum placed on floor');
  check(!vac.takeTarget.blocked, 'taking placed vacuum on floor is not blocked by storage door');

  // Take again from floor
  vac.take();
  check(vac.held && !vac.placed, 'taken again from floor');

  // Shut storage door while holding
  kd.toggle(); settle(kd);
  check(!kd.isOpen && vac.backTarget.blocked && vac.backTarget.blockedText === 'Öppna förrådsdörren först',
    `docking blocked with hint when door shut (${vac.backTarget.blockedText})`);
  vac.putBack();
  check(vac.held && !vac.isAtDock, 'docking attempt refused while door is shut');

  // Open door again and dock
  kd.toggle(); settle(kd);
  check(kd.isOpen && !vac.backTarget.blocked, 'docking unblocked with door open');
  vac.putBack();
  check(!vac.held && !vac.placed && vac.isAtDock && vac.led.visible, 'vacuum docked, charging LED on');

  // Shut storage door
  kd.toggle(); settle(kd);
  check(!kd.isOpen && kd.t < 0.05, 'storage door shut after returning vacuum');

  // Headroom check at dock under stair
  const u = A.stairUnderside(vac.home.pos.x, 6.55);
  check(u !== null && u > 2.0 && vac.home.pos.y + 1.25 < u, `vacuum at dock clears stair underside (u ${u?.toFixed(3)} m > top)`);

  f.remove();
} catch (e) { pass = false; lines.push(`FAIL #389 error ${e.stack}`); }

// --- #390: vacuuming removes nearby crumbs and dust ---------------------------------------------------------------
if (want(390)) try {
  const f = await load('life&shot');
  const K = kit(f), { A, step, V, settle } = K;
  const vac = A.vacuum, mess = A.life.mess, P = A.player, kd = A.world.klkDoor;

  // Open storage door and take vacuum
  kd.toggle(); settle(kd);
  vac.take();
  check(vac.held && !vac.running && vac.useLabel === 'Starta', 'vacuum held, motor initially off (Starta)');

  // Test toggling with use() (simulating E / touch button)
  vac.use();
  check(vac.running && vac.useLabel === 'Stäng av', 'vac.use() toggles motor on (Stäng av)');

  // Sonos ducking check
  check(typeof vac.nearSonos(A.sonos) === 'boolean', 'nearSonos helper works');

  // Seed crumbs and dust on the kitchen floor
  mess.clear();
  const c1 = mess.add('crumb', 4.3, LEVELS[0].floor, 2.6, { surf: 'floor', level: 0, amt: 0.5, room: 'Kök / matplats' });
  const d1 = mess.add('dust', 4.35, LEVELS[0].floor, 2.65, { level: 0, amt: 0.5, room: 'Kök / matplats' });
  const farCrumb = mess.add('crumb', 1.5, LEVELS[0].floor, 8.5, { surf: 'floor', level: 0, amt: 0.5, room: 'Vardagsrum' });
  check(mess.count() === 3, 'mess seeded on floor');

  // Move player near the kitchen crumbs
  // head is ~1.15m in front of camera
  // player at (4.3, 3.75) facing north (yaw=0, dz = -1.15 so head is around z=2.6)
  P.spawn(4.12, 3.75, 0);
  A.camera.rotation.x = 0; A.camera.rotation.y = 0;
  for (let i = 0; i < 40; i++) step(1 / 60);

  check(mess.total({ room: 'Kök / matplats' }) === 0, 'crumbs and dust in front of vacuum head removed');
  check(mess.spots.includes(farCrumb), 'far crumb in other room not cleared (no whole-room clearing)');

  // Not through walls:
  // Add a crumb on the other side of a kitchen wall
  const crumbBehindWall = mess.add('crumb', 3.3, LEVELS[0].floor, 2.6, { surf: 'floor', level: 0, amt: 0.5 });
  P.spawn(3.6, 2.6, Math.PI / 2);
  for (let i = 0; i < 20; i++) step(1 / 60);
  check(mess.spots.includes(crumbBehindWall), 'mess through wall is not taken');

  // Not on other floor:
  const crumbFloor1 = mess.add('crumb', 4.3, LEVELS[1].floor, 2.6, { surf: 'floor', level: 1, amt: 0.5 });
  P.spawn(4.12, 3.75, 0); // on level 0
  for (let i = 0; i < 20; i++) step(1 / 60);
  check(mess.spots.includes(crumbFloor1), 'mess on upper floor is not taken from lower floor');

  // Clear remaining crumbs in living room to test clean room
  vac.dustAmount = 0; // empty vacuum so container limit doesn't prevent vacuuming
  P.spawn(1.32, 9.65, 0);
  for (let i = 0; i < 40; i++) step(1 / 60);
  check(mess.total({ room: 'Vardagsrum' }) === 0, 'living room mess cleared');

  // Stats vacuumed tracked
  check(A.stats.vacuumed > 0, `vacuumed area tracked in stats (${A.stats.vacuumed?.toFixed(2)} m²)`);

  // Cat scare test
  if (A.cat) {
    A.cat.setCat(A.BREEDS[0], A.VARIANTS[0]);
    A.cat.object.position.set(P.pos.x + 0.8, LEVELS[0].floor, P.pos.z - 0.8);
    A.cat.object.visible = true;
    check(!A.cat.leaving, 'cat visible before vacuum scare');
    step(1 / 60);
    check(A.cat.leaving && !A.cat.leaving.hurt, 'cat runs away meowing without counting as hurt');
  }

  // Turn off
  vac.use();
  check(!vac.running && vac.useLabel === 'Starta', 'vac.use() turns off');

  f.remove();
} catch (e) { pass = false; lines.push(`FAIL #390 error ${e.stack}`); }

// --- #391: empty vacuum cleaner and wipe worktop with dishcloth --------------------------------------
if (want(391)) try {
  const f = await load('life&shot');
  const K = kit(f), { A, step, V, settle } = K;
  const vac = A.vacuum, mess = A.life.mess, cloth = A.cloth;
  check(vac && cloth, 'vacuum and cloth available');

  // 1. Vacuum dust accumulation and full notification
  vac.dustAmount = vac.dustCapacity * 0.95;
  check(!vac.isFull(), 'vacuum not full yet');
  vac.dustAmount = vac.dustCapacity;
  check(vac.isFull(), 'vacuum is full at capacity');

  // Test emptyIntoBin
  const I = A.life.items;
  const bins = [...A.life.views.values()].filter((v) => I.has(v.item, 'bin'));
  const restBin = bins.find((b) => I.def(b.item).sort === 'rest') || bins[0];
  check(restBin, 'rest wastebin found');
  const prevBinAmount = restBin.item.amount;
  vac.emptyIntoBin(restBin.item);
  I.add(restBin.item, 1);
  check(vac.dustAmount === 0, 'emptyIntoBin empties vacuum to 0');
  check(restBin.item.amount > prevBinAmount, 'bin amount increased after emptying vacuum');

  // 2. Cloth wipes and dirty limit
  cloth.take();
  check(cloth.held, 'cloth is held');
  check(cloth.useLabel === 'Torka', 'cloth useLabel is Torka');
  cloth.mess = mess;

  // Add worktop crumbs
  mess.clear();
  const c1 = mess.add('crumb', 4.3, 0.9, 2.6, { surf: 'counter', amt: 0.5, room: 'Kök / matplats' });
  check(mess.count() === 1, 'mess added on counter');

  // Wipe worktop
  cloth.wipe({ x: 4.3, y: 0.9, z: 2.6 });
  check(cloth.wipes === 1, 'cloth wipe count incremented');
  check(mess.count() === 0, 'crumbs wiped away by cloth');

  // Wipe up to limit
  for (let i = cloth.wipes; i < cloth.maxWipes; i++) {
    cloth.wipe({ x: 4.3, y: 0.9, z: 2.6 });
  }
  check(cloth.dirty, 'cloth becomes dirty after maxWipes');
  check(cloth.wipe({ x: 4.3, y: 0.9, z: 2.6 }) === false, 'dirty cloth refuses to wipe');

  // Rinse at running tap
  const kitchenTap = A.taps.find((t) => t.name?.toLowerCase().includes('kök') || t.object?.position.x > 3.5) || A.taps[0];
  check(kitchenTap, 'kitchen tap found');
  kitchenTap.toggle(); // turn tap on
  settle(kitchenTap);
  check(kitchenTap.isOpen, 'kitchen tap is running');

  cloth.rinse();
  check(!cloth.dirty && cloth.wipes === 0, 'cloth is clean after rinse');

  cloth.putBack();
  f.remove();
} catch (e) { pass = false; lines.push(`FAIL #391 error ${e.stack}`); }

// --- #485: larger bin, real suction conserves excess dirt and resumes after emptying -----------------
if (want(485)) try {
  const f = await load('life&shot');
  const { A, step, settle } = kit(f);
  const vac = A.vacuum, mess = A.life.mess;
  check(vac.dustCapacity === 3, 'bin holds three times the former 1.0 mess units');
  A.world.klkDoor.toggle(); settle(A.world.klkDoor); vac.take(); vac.use();
  A.player.spawn(4.12, 3.75, 0); A.camera.rotation.set(0, 0, 0, 'YXZ');
  const clean = () => { for (let i = 0; i < 40; i++) step(1 / 60); };
  const add = (amt) => mess.add('crumb', 4.3, LEVELS[0].floor, 2.6, { surf: 'floor', level: 0, amt });
  const bar = f.contentDocument.querySelector('#vacuum-hud i');
  mess.clear(); add(1); clean();
  check(Math.abs(vac.dustAmount - 1) < 1e-6 && !vac.isFull(), 'old full-bin load fits with room to spare');
  check(bar.style.width === '33%', 'old full-bin load shows 33 percent');
  add(1); clean(); add(0.75);
  mess.add('dust', 4.3, LEVELS[0].floor, 2.6, { surf: 'floor', level: 0, amt: 0.75 }); clean();
  check(vac.isFull() && vac.dustAmount === 3 && bar.style.width === '100%', 'full bin stops at 3 and 100 percent');
  check(Math.abs(mess.total() - 0.5) < 1e-6, 'excess dirt remains on floor');
  clean(); check(Math.abs(mess.total() - 0.5) < 1e-6, 'running full vacuum cannot destroy excess dirt');
  vac.emptyIntoBin();
  check(bar.style.width === '0%' && !vac.isFull(), 'emptying resets indicator and full state');
  clean(); check(mess.total() === 0 && Math.abs(vac.dustAmount - 0.5) < 1e-6, 'vacuum resumes and collects remaining dirt');
  vac.putBack(); f.remove();
} catch (e) { pass = false; lines.push(`FAIL #485 error ${e.stack}`); }

lines.push(pass ? 'ALL PASS' : 'SOME FAILED');
out.textContent = lines.join('\n');
</script>
</body>
</html>
