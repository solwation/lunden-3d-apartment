import { loadRiggedAvatarModel } from '../src/avatar.js';
import { avatarLook } from '../src/config.js';

const ownStyle = document.createElement('style');
ownStyle.textContent = 'body{margin:0;background:#edf0f3}#fixture-label{position:fixed;left:14px;top:10px;z-index:2;color:#173044;background:#ffffffe0;padding:10px;font:15px system-ui}canvas{display:block}';
document.head.append(ownStyle);

await loadRiggedAvatarModel();
const renderer = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
