<script type="module">

function ambient(which=0,phase=0){const c=selected[which];clock=slots[which].clock;cats.cats.forEach(q=>{q.group.visible=false;q.bfMesh.visible=false});c.st='route';c.alpha=1;const sp=c.schedulePose(true);c.x=sp.x;c.z=sp.z;c.h=sp.h;c.t=phase;camera.position.set(c.x+3,1.4,c.z+3);cats.step(c,0,camera.position,false);if(!c.bfMesh.visible)throw Error('Production chase did not produce a butterfly');return c;}

</script>
