<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Changelog note test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// Changelog test: pretends the last visit saw entry 1 (so the rest are "Nytt"), walks up to
// the note on the freezer in touch mode, reads it with the action button and puts it back.
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/notetest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
window.addEventListener('unhandledrejection', (e) => { out.textContent = `SOME FAILED\nFAIL error: ${e.reason?.stack || e.reason}`; });
localStorage.setItem('lunden.changelogSeen', '1');
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
f.src = '../index.html';
document.body.append(f);
f.onload = async () => {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, camera, note, step } = w.__app;
  const lines = [];
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); return ok; };
  const total = d.querySelectorAll('#note-list li').length;
  const fresh = d.querySelectorAll('#note-list .new').length;
  const data = await fetch('../data/changelog.json').then((r) => r.json());
  const stamped = data.every((e) => Number.isFinite(e.t));
  let pass = true;
  if (stamped) {
    // a stamped build (#341): newest published first; seen=1 migrates to the t of entry 1
    const t1 = data.find((e) => e.id === 1)?.t || Math.max(...data.filter((e) => e.id <= 1).map((e) => e.t));
    const want = data.slice(0,100).filter((e) => e.t > t1).length;
    pass &= check(data.every((e, i) => i === 0 || data[i - 1].t >= e.t), 'stamped changelog.json is newest t first');
    pass &= check(total === Math.min(100,data.length) && fresh === want, `"Nytt" on ${fresh} of ${total} entries since seen=1 (want ${want})`);
    pass &= check(Number(localStorage.getItem('lunden.changelogSeenT')) === Math.max(...data.map((e) => e.t)), 'last seen t stored');
  } else {
    pass &= check(total === Math.min(100,data.length) && fresh === data.slice(0,100).filter(e=>e.id>1).length, `"Nytt" on ${fresh} of ${total} entries since seen=1`);
  }
  pass &= check(localStorage.getItem('lunden.changelogSeen') !== '1', 'last seen id updated');
  // markNew (#341) on made-up entries: id 4 was pushed last with a too low id
  const { markNew, loadChangelog } = await w.eval(`import('${new URL('../src/changelog.js', location.href)}')`); // the iframe has the import map
  const mem = (o = {}) => ({ o, getItem: (k) => (k in o ? o[k] : null), setItem: (k, v) => { o[k] = v; } });
  const E = [{ id: 7, t: 300 }, { id: 6, t: 200 }, { id: 4, t: 400 }, { id: 3, t: 100 }];
  const fmt = (r) => r.map((e) => `${e.id}${e.isNew ? '*' : ''}`).join(' ');
  let s = mem({ 'lunden.changelogSeenT': '250' });
  let r = markNew(E, s);
  pass &= check(fmt(r) === '4* 7* 6 3' && s.o['lunden.changelogSeenT'] === '400' && s.o['lunden.changelogSeen'] === '7',
    `seenT 250: ordered by t, only the later ones new (${fmt(r)})`);
  s = mem({ 'lunden.changelogSeen': '7' });
  r = markNew(E, s);
  pass &= check(fmt(r) === '4* 7 6 3' && s.o['lunden.changelogSeenT'] === '400', `old id key 7 migrates: only the late id 4 new (${fmt(r)})`);
  r = markNew(E, s);
  pass &= check(fmt(r) === '4 7 6 3', `seen again: nothing new (${fmt(r)})`);
  r = markNew(E, mem());
  pass &= check(fmt(r) === '4 7 6 3', `first visit: nothing new (${fmt(r)})`);
  const D = E.map(({ id }) => ({ id }));
  s = mem({ 'lunden.changelogSeen': '5' });
  r = markNew(D, s);
  pass &= check(fmt(r) === '7* 6* 4 3' && !('lunden.changelogSeenT' in s.o), `without t: file order, by id as before (${fmt(r)})`);
  // Exercise the real loader: truncate after publication sorting, retaining all source entries.
  const fetchBefore=w.fetch,keys=['lunden.changelogSeen','lunden.changelogSeenT'],seenBefore=keys.map(k=>w.localStorage.getItem(k));
  try {
    const history=Array.from({length:251},(_,i)=>({id:i+1,t:i+100,date:'2026-10-08',text:`change ${i+1}`}));
    history[0].t=1000; // lowest id was actually published last
    w.localStorage.setItem(keys[1],'300');
    w.fetch=async()=>({json:async()=>history});
    const latest=await loadChangelog();
    pass &= check(latest.length===100&&latest[0].id===1&&latest[1].id===251&&latest[99].id===153&&latest.filter(e=>e.isNew).length===51,
      'latest 100 selected after sorting by publication time, with correct New markers');
    pass &= check(history.length===251&&w.localStorage.getItem(keys[0])==='251'&&w.localStorage.getItem(keys[1])==='1000','full history and last-seen metadata retained');
    for(const n of [0,50,100]) {
      w.fetch=async()=>({json:async()=>history.slice(0,n)});
      pass &= check((await loadChangelog()).length===n,`history with ${n} changes displays all entries`);
    }
  } finally {w.fetch=fetchBefore;keys.forEach((k,i)=>seenBefore[i]===null?w.localStorage.removeItem(k):w.localStorage.setItem(k,seenBefore[i]));}
  d.getElementById('start-touch').click();
  await wait(50);
  // stand 1 m north of the note, facing south (yaw 180), eye level with it
  w.__app.scene.updateMatrixWorld(true); // normally done by the first render
  const V = note.object.position.constructor; // the iframe's THREE.Vector3
  const p = note.object.getWorldPosition(new V());
  player.spawn(p.x, p.z - 1.0, Math.PI);
  camera.rotation.x = Math.atan2(p.y - player.eyeY, 1.0);
  for (let i = 0; i < 5; i++) step(1 / 60);
  const btn = d.getElementById('action');
  pass &= check(!btn.hidden && /läsa lappen/i.test(btn.textContent), `action button "${btn.textContent}"`);
  btn.click();
  pass &= check(!d.getElementById('note').hidden, 'note opens');
  const before = { x: player.pos.x, z: player.pos.z };
  w.__app.touch.analog.y = 1;
  for (let i = 0; i < 30; i++) step(1 / 60);
  w.__app.touch.analog.y = 0;
  pass &= check(Math.hypot(player.pos.x - before.x, player.pos.z - before.z) < 0.01, 'no walking while reading');
  btn.click();
  pass &= check(d.getElementById('note').hidden, 'note closes');
  // the freezer opens (#161): the note is on its door and swings with it (open, it faces the corner unit)
  const { world, use } = w.__app;
  const fz = world.lids.find((l) => l.kind === 'fridge' && l.freezer);
  pass &= check(!!fz && note.object.parent === fz.door, 'note is on the freezer door');
  if (fz) {
    use(fz);
    for (let i = 0; i < 120; i++) step(1 / 60);
    w.__app.scene.updateMatrixWorld(true);
    const q = note.object.getWorldPosition(new V());
    pass &= check(fz.isOpen && q.distanceTo(p) > 0.2, `freezer open, the note moved ${q.distanceTo(p).toFixed(2)} m`);
    use(fz);
    for (let i = 0; i < 120; i++) step(1 / 60);
    w.__app.scene.updateMatrixWorld(true);
    pass &= check(!fz.isOpen && note.object.getWorldPosition(new V()).distanceTo(p) < 0.005, 'freezer closed, the note back in place');
  }
  // keyboard scrolling (#275): fake pointer lock so the real key handler runs
  const canvas = d.querySelector('canvas');
  Object.defineProperty(d, 'pointerLockElement', { get: () => canvas, configurable: true });
  d.dispatchEvent(new w.Event('pointerlockchange'));
  const key = (type, code, o = {}) => d.dispatchEvent(new w.KeyboardEvent(type, { code, bubbles: true, cancelable: true, ...o }));
  const press = (code, o) => { key('keydown', code, o); key('keyup', code, o); };
  const paper = d.querySelector('#note .paper');
  key('keydown', 'KeyW'); // held while walking up to the note
  w.__app.showNote(true);
  const at = { x: player.pos.x, z: player.pos.z };
  pass &= check(paper.scrollHeight > paper.clientHeight + 200, `a long list (${paper.scrollHeight} > ${paper.clientHeight} px)`);
  const moves = [['ArrowDown', 1], ['KeyS', 1], ['PageDown', 1], ['Space', 1], ['End', 1], ['ArrowUp', -1], ['KeyW', -1], ['PageUp', -1], ['Space', -1, { shiftKey: true }], ['Home', -1]];
  paper.scrollTop = 0;
  for (const [code, dir, o] of moves) {
    if (code === 'End') paper.scrollTop = 0;
    if (dir < 0) paper.scrollTop = code === 'Home' ? paper.scrollHeight : 2000;
    const s0 = paper.scrollTop;
    press(code, o);
    for (let i = 0; i < 3; i++) step(1 / 60);
    const ok = Math.sign(paper.scrollTop - s0) === dir
      && (code !== 'End' || paper.scrollTop >= paper.scrollHeight - paper.clientHeight - 1) && (code !== 'Home' || paper.scrollTop === 0);
    pass &= check(ok, `${o?.shiftKey ? 'Shift+' : ''}${code}: scrollTop ${s0} → ${paper.scrollTop}`);
  }
  pass &= check(Math.hypot(player.pos.x - at.x, player.pos.z - at.z) < 0.01, 'the player does not move while scrolling');
  // the W held from before: its auto-repeat does nothing until it is released
  paper.scrollTop = 300;
  key('keydown', 'KeyW', { repeat: true });
  for (let i = 0; i < 10; i++) step(1 / 60);
  pass &= check(paper.scrollTop === 300 && Math.hypot(player.pos.x - at.x, player.pos.z - at.z) < 0.01, `a held W ignored (scrollTop ${paper.scrollTop})`);
  key('keyup', 'KeyW');
  key('keydown', 'KeyW');
  key('keydown', 'KeyW', { repeat: true });
  pass &= check(paper.scrollTop < 300 - 60, `pressed again, W scrolls up and repeats (${paper.scrollTop})`);
  key('keyup', 'KeyW');
  press('KeyE');
  pass &= check(d.getElementById('note').hidden, 'E still closes it');
  out.textContent = `${pass ? 'ALL PASS' : 'SOME FAILED'}\n${lines.join('\n')}`;
};
</script>
</body>
</html>
