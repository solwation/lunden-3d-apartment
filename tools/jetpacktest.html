<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Jetpack test</title></head>
<body>
<pre id="out">running…</pre>
<script>
// #359: the jetpack on its hook by the garage door: E puts it on (hands free, the HUD's heat bar), Space lifts (flames,
// the first flight counts), letting go falls, C pushes down; the ceiling and OUTDOOR's edge hold; no flying through
// Hus L or into Hus A's façade; a soft landing on Hus C's roof (the roof counts); E stands it down there and it stays,
// E on it again; walking in through the front door stands it down outside; overheating cuts the thrust; a cut high up
// is a fall that hurts and wakes you outside the door with the jetpack back on its hook; F sends it home; keep.js
// round trip; touch: ⬆ / ⬇ and "Ta av dig jetpacken".
//   google-chrome --headless=new --dump-dom http://localhost:8137/tools/jetpacktest.html
const out = document.getElementById('out');
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const f = document.createElement('iframe');
f.width = 900; f.height = 600;
f.src = '../index.html?shot&time=12&month=6&freeze';
document.body.append(f);
f.onload = () => run().catch((e) => { out.textContent = `FAIL ${e}\n${e.stack}\nSOME FAILED`; });
async function run() {
  const w = f.contentWindow, d = f.contentDocument;
  while (!w.__app) await wait(100);
  const { player, fall, world, step, stats, camera, renderer, jetpack, toggleFurniture, touch, keepWorld } = w.__app;
  const mod = (p) => w.eval(`import('${new URL(p, location.href).href}')`);
  const { FALL, PLAYER, JETPACK, OUTDOOR, SITE, GARAGE } = await mod('../src/config.js');
  const lines = [];
  let pass = true;
  const check = (ok, name) => { lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}`); pass &&= !!ok; return ok; };
  const f2 = (v) => v.toFixed(2);
  d.getElementById('install').hidden = true;
  Object.defineProperty(d, 'pointerLockElement', { get: () => renderer.domElement, configurable: true });
  d.dispatchEvent(new w.Event('pointerlockchange'));
  const landings = [];
  const land0 = player.onLand;
  player.onLand = (drop, gap) => { const r = land0(drop, gap); landings.push({ drop, gap, r }); return r; };
  const dt = 1 / 60;
  const key = (code, down = true) => d.dispatchEvent(new w.KeyboardEvent(down ? 'keydown' : 'keyup', { code, bubbles: true }));
  const prompt = () => d.getElementById('prompt').hidden ? '' : d.getElementById('prompt').textContent;
  const settle = () => { while (fall.t >= 0) step(dt); };
  const place = (x, z, feet, yawDeg = 180, pitchDeg = 0) => {
    player.spawn(x, z, yawDeg * Math.PI / 180);
    if (feet !== undefined) { player.pos.y = feet; player.eyeY = feet + PLAYER.eye; }
    camera.rotation.x = pitchDeg * Math.PI / 180;
    landings.length = 0; jetpack.heat = 0; jetpack.cut = false;
    for (let i = 0; i < 10; i++) step(dt);
  };
  const run = (secs, keys = []) => { player.keys = new Set(keys); for (let t = 0; t < secs; t += dt) { step(dt); if (fall.active) break; } player.keys = new Set(); };
  /** Fly towards (x, y, z): steer with W, Space while under the height (with a lead on the vertical speed). */
  const flyTo = (x, y, z, max = 30, stopAt = 0.6) => {
    let t = 0;
    for (; t < max && !fall.active; t += dt) {
      const dx = x - player.pos.x, dz = z - player.pos.z, far = Math.hypot(dx, dz);
      camera.rotation.y = Math.atan2(-dx, -dz);
      const keys = [];
      if (far > stopAt) keys.push('KeyW');
      if (player.pos.y + player.vy * 0.5 < y) keys.push('Space');
      player.keys = new Set(keys);
      step(dt);
      if (far <= stopAt && Math.abs(player.pos.y - y) < 0.6 && Math.hypot(player.jv.x, player.jv.z) < 1.5) break;
    }
    player.keys = new Set();
    return t < max && !fall.active;
  };
  /** Come down softly: thrust whenever sinking faster than 2.5 m/s, until landed. */
  const softLand = (max = 30) => {
    for (let t = 0; t < max && !fall.active; t += dt) {
      player.keys = new Set(player.vy < -2.5 ? ['Space'] : []);
      step(dt);
      if (!player.flying && !player.fall) break;
    }
    player.keys = new Set();
  };

  // (1) #520: actual hook in the small room, on the portik's east wall.
  const H = JETPACK.hook, gd = SITE.terrain.garageDoor, m = jetpack.model.position, garage = world.garage;
  check(jetpack.state==='hook'&&Math.abs(m.x-H.x)<.1&&Math.abs(m.z-H.z)<.01&&world.portik.contains(m.x,m.z)&&m.y>0&&jetpack.sign.position.y>m.y,'on its hook in the portik small room, sign above');
  world.portik.doorTarget.toggle();for(let i=0;i<20;i++)world.portik.doorTarget.update(.1);
  place(H.x-1,H.z,0,-90,-15);
  check(/ta på dig jetpacken/.test(prompt()), `facing it: "${prompt()}"`);
  const flights0 = stats.flights ?? 0, seen0 = !!stats.seen.flights?.jetpack;
  key('KeyE'); key('KeyE', false);
  step(dt);
  check(jetpack.worn && player.jet === jetpack && !jetpack.model.visible && !d.getElementById('jetpack').hidden && !w.__app.heldItem(), 'E: worn on the back (hands free, the heat bar shows)');
  check(/ta av dig jetpacken/.test(prompt()), `standing with it on: "${prompt()}"`);

  // (#441) under the garage's ceiling Space does nothing; out through the garage door, then it lifts
  const roomY=player.pos.y;key('Space');for(let i=0;i<60;i++)step(dt);key('Space',false);
  check(Math.abs(player.pos.y-roomY)<.01&&!jetpack.flames.visible,'no thrust through portik room ceiling');
  place(-68.95,40.45,GARAGE.floor,90,-15);
  const yg = player.pos.y;
  key('Space'); for (let i = 0; i < 60; i++) step(dt); key('Space', false);
  check(jetpack.worn && Math.abs(player.pos.y - yg) < 0.01 && !jetpack.flames.visible, `in the garage: no thrust under the ceiling (y ${f2(player.pos.y)})`);
  garage.door.open(); for (let i = 0; i < (GARAGE.door.seconds + 1) * 10; i++) step(0.1);
  const walkTo = (x, z, secs = 8) => { for (let t = 0; t < secs && Math.hypot(player.pos.x - x, player.pos.z - z) > 0.15; t += dt) { camera.rotation.y = Math.atan2(-(x - player.pos.x), -(z - player.pos.z)); player.keys = new Set(['KeyW']); step(dt); } player.keys = new Set(); };
  walkTo(-68, 44); walkTo(-74.5, 44);
  check(jetpack.worn && !player.below && player.pos.x < gd.x - 3, `out through the garage door with it on (x ${f2(player.pos.x)})`);
  walkTo(-66, 44);
  check(jetpack.worn && player.below, 'back into the garage: still worn');
  walkTo(-74.5, 44);
  camera.rotation.x = 0;
  // (2) Space lifts, letting go falls; flames, heat, the first flight counted
  const y0 = player.pos.y;
  key('Space'); for (let i = 0; i < 90; i++) step(dt);
  check(player.pos.y > y0 + 3 && player.flying && jetpack.flames.visible && jetpack.heat > 0, `Space held 1.5 s: up ${f2(player.pos.y - y0)} m, flames, heat ${f2(jetpack.heat)}`);
  check(player.vy <= JETPACK.climb + 1e-6, `climbing no faster than ${JETPACK.climb} m/s (${f2(player.vy)})`);
  check((stats.flights ?? 0) === flights0 + 1 && stats.seen.flights?.jetpack, `the take-off counted (${stats.flights}${seen0 ? ', not the first' : ', the first'})`);
  key('Space', false);
  const top = player.pos.y;
  for (let i = 0; i < 70; i++) step(dt);
  check(player.vy < -1 && player.pos.y < top + 1, `let go: falling (vy ${f2(player.vy)})`);
  softLand();
  check(!player.flying && !landings.some((l) => l.r === 'hurt'), `a soft landing on thrust (impact as a drop: ${f2(Math.max(0, ...landings.map((l) => l.drop)))} m)`);

  // (3) the ceiling
  run(10, ['Space']);
  check(Math.abs(player.pos.y - JETPACK.ceiling) < 0.01, `the ceiling holds at ${f2(player.pos.y)} m`);
  // C pushes down faster than falling
  const fallA = (() => { const y = player.pos.y; run(0.8); return y - player.pos.y; })();
  run(0.6, ['Space']); for (let i = 0; i < 60 && player.vy > 0.01; i++) step(dt); // (up again and still)
  const fallB = (() => { const y = player.pos.y; run(0.8, ['KeyC']); return y - player.pos.y; })();
  check(fallB > fallA + 1, `C pushes down: ${f2(fallB)} m in 0.8 s against ${f2(fallA)} m falling`);
  check(!player.crouched, 'no crouching in the air');

  // (4) OUTDOOR's edge holds in the air
  jetpack.heat = 0;
  for (let i = 0; i < 600 && player.vy < 0.5; i++) { player.keys = new Set(['Space']); step(dt); } // (out of the dive)
  player.keys = new Set();
  flyTo(OUTDOOR.x0 - 10, 30, H.z, 8);
  check(player.pos.x > OUTDOOR.x0 && !fall.active, `the area's west edge holds in the air (x ${f2(player.pos.x)} > ${OUTDOOR.x0}, y ${f2(player.pos.y)}${landings.length ? `, landed: ${JSON.stringify(landings)}` : ''})`);

  // (5) Hus C's roof: fly over, come down softly; it counts
  jetpack.heat = 0;
  const C = SITE.blocks.find((b) => b.name === 'Hus C'), cx = (C.x0 + C.x1) / 2, cz = (C.z0 + C.z1) / 2;
  const roofC = world.roofs.topAt(cx, cz + 4);
  check(flyTo(cx, roofC + 4, cz + 4), `flew over Hus C (${f2(player.pos.x)}, ${f2(player.pos.y)}, ${f2(player.pos.z)})`);
  softLand();
  const on = world.roofs.standingOn(player.pos.x, player.pos.z, player.pos.y);
  check(on?.id === 'roof-Hus C' && !landings.some((l) => l.r === 'hurt'), `landed on ${on?.name ?? 'nothing'} at ${f2(player.pos.y)} m, unhurt`);
  for (let i = 0; i < 5; i++) step(dt);
  check(stats.seen.roofs?.['roof-Hus C'], 'the roof counted');
  // (6) E with nothing else: stood down there, it stays; E on it again
  camera.rotation.x = 0;
  for (let i = 0; i < 3; i++) step(dt);
  key('KeyE'); key('KeyE', false); step(dt);
  check(jetpack.state === 'ground' && !player.jet && jetpack.model.visible && Math.abs(m.y - world.roofs.topAt(m.x, m.z)) < 0.15, `stood down on the roof at (${f2(m.x)}, ${f2(m.y)}, ${f2(m.z)})`);
  const at = m.clone();
  for (let i = 0; i < 60; i++) step(dt);
  check(m.distanceTo(at) < 1e-6, 'it stays there');
  camera.lookAt(jetpack.target.pickable.getWorldPosition(camera.position.clone()));for(let i=0;i<3;i++)step(dt);
  check(/ta på dig jetpacken/.test(prompt()), `looking down at it: "${prompt()}"`);
  key('KeyE'); key('KeyE', false); step(dt);
  check(jetpack.worn, 'E: on again');
  // keep.js (#277): stood down → saved → back in the same spot
  jetpack.takeOff();
  const saved = JSON.parse(JSON.stringify(keepWorld().jetpack ?? null)), spot = m.clone();
  jetpack.goHome();
  jetpack.loadState(saved);
  check(saved?.s === 'ground' && jetpack.state === 'ground' && m.distanceTo(spot) < 0.01, `keep.js round trip: ${JSON.stringify(saved)}`);
  jetpack.putOn();

  // (7) no flying through houses: Hus L's back at 4 m, Hus A's façade under its eaves
  place(3, 16, 4, 0); jetpack.putOn();
  flyTo(3, 4, 6, 4);
  check(player.pos.z > 12.7 + PLAYER.radius - 0.05, `Hus L's back holds at 4 m (z ${f2(player.pos.z)})`);
  const A = SITE.blocks.find((b) => b.name === 'Hus A');
  place((A.x0 + A.x1) / 2, A.z0 - 3, 0.5, 180); jetpack.putOn();
  flyTo((A.x0 + A.x1) / 2, 6, A.z0 + 6, 5);
  check(player.pos.z < A.z0 && !fall.active, `Hus A's north façade holds at ${f2(player.pos.y)} m (z ${f2(player.pos.z)} < ${A.z0})`);
  softLand();
  await settle();

  // (8) overheating cuts the thrust
  place(-20, -6, 0, 180); jetpack.putOn();
  jetpack.heat = 0.995;
  run(1.5, ['Space']); // (low: a cut up high would be a fall)
  check(jetpack.cut && d.getElementById('jetpack').classList.contains('cut') && !jetpack.thrusting && !player.flying && !landings.some((l) => l.r === 'hurt'),
    `too hot: the thrust cuts out ("För varm!"), back on the ground at ${f2(player.pos.y)} m`);
  softLand();
  await settle();
  for (let i = 0; i < 200 && jetpack.cut; i++) step(0.05);
  check(!jetpack.cut, `cooled down (heat ${f2(jetpack.heat)})`);

  // (9) a cut high up: a fall that hurts; awake outside the door, the jetpack on its hook
  place(-20, -6, 0, 180); jetpack.putOn();
  run(3.5, ['Space']);
  const high = player.pos.y;
  run(6);
  check(landings.some((l) => l.r === 'hurt'), `thrust cut at ${f2(high)} m: hurt`);
  settle();
  check(jetpack.state === 'hook' && !player.jet && Math.hypot(player.pos.x - FALL.wake.x, player.pos.z - FALL.wake.z) < 0.6, 'awake outside the front door; the jetpack is back on its hook');

  // (10) in through the front door with it on: stood down outside
  const door = world.doors.find((dd) => dd.name === 'ytterdörren' && Math.abs(dd.object.getWorldPosition(camera.position.clone()).z) < 0.5);
  if (door && !door.isOpen) { door.toggle(); for (let i = 0; i < 40; i++) door.update(0.1); }
  place(1.3, -1.5, 0, 180); jetpack.putOn();
  let inside = false;
  for (let t = 0; t < 4 && !inside; t += dt) { camera.rotation.y = Math.atan2(-(1.3 - player.pos.x), -(2.5 - player.pos.z)); player.keys = new Set(['KeyW']); step(dt); inside = player.inFootprint(); }
  player.keys = new Set();
  for (let i = 0; i < 3; i++) step(dt);
  check(inside && jetpack.state === 'ground' && !player.jet && m.z < 0.05 && m.z > -1.5, `in through the front door: stood down outside it (${f2(m.x)}, ${f2(m.z)})`);
  check(jetpack.targets().length === 1 && (jetpack.putOn(), !jetpack.worn), 'not put on indoors');
  if (door?.isOpen) { door.toggle(); for (let i = 0; i < 40; i++) door.update(0.1); }

  // (11) F sends it home
  toggleFurniture(false); toggleFurniture(true);
  check(jetpack.state === 'hook' && Math.abs(m.z - H.z) < 0.01 && garage.inside(m.x, m.z), 'F: back on its hook in the portik room');

  // (12) touch: ⬆ / ⬇ while it is worn; "Ta av dig jetpacken" on the action button
  place(-20, -6, 0, 180); jetpack.putOn();
  touch.enabled = true; d.body.classList.add('touch');
  for (let i = 0; i < 3; i++) step(dt);
  const upBtn = d.getElementById('jet-up'), act = d.getElementById('action');
  check(!upBtn.hidden && !d.getElementById('jet-down').hidden && /Ta av dig jetpacken/.test(act.textContent) && !act.hidden, `touch: ⬆ ⬇ shown, the button says "${act.textContent}"`);
  const ty = player.pos.y;
  upBtn.dispatchEvent(new w.PointerEvent('pointerdown', { bubbles: true, pointerType: 'touch' }));
  for (let i = 0; i < 60; i++) step(dt);
  upBtn.dispatchEvent(new w.PointerEvent('pointerup', { bubbles: true, pointerType: 'touch' }));
  check(player.pos.y > ty + 1.5, `⬆ held 1 s: up ${f2(player.pos.y - ty)} m`);
  softLand();
  act.click(); step(dt);
  check(jetpack.state === 'ground' && upBtn.hidden, 'the action button stood it down; ⬆ ⬇ hidden');
  touch.enabled = false; d.body.classList.remove('touch');
  jetpack.goHome();

  out.textContent = lines.join('\n') + `\n${pass ? 'ALL PASS' : 'SOME FAILED'}`;
}
</script>
</body>
</html>
