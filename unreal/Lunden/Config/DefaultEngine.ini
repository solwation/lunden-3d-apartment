; Lunden (#2243). Minimal project defaults for a UE 5.8 Windows desktop game.
; ASSUMPTION: values mirror what a UE 5.x Blank C++ template writes (Lumen GI + reflections, Nanite-capable
; DX12/SM6, virtual shadow maps, desktop/maximum hardware class). They were written without the engine installed;
; phase B (first editor start) confirms them and the editor may append template keys it is missing.
; Lighting/look decisions belong to #2246; packaging to #2248.

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/Lunden")
+ActiveGameNameRedirects=(OldGameName="/Script/TP_Blank",NewGameName="/Script/Lunden")

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; Lumen for global illumination and reflections (1 = Lumen), virtual shadow maps, mesh distance fields for Lumen.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
; ASSUMPTION: no baked lightmaps (Lumen only), so maps produce no lightmap *_BuiltData; #2246 may change this.
r.AllowStaticLighting=False
; Nanite needs no project switch in UE 5.8; it is enabled per static mesh (the importer in #2245 decides).
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.SkinCache.CompileShaders=True
