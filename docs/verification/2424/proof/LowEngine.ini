; Lunden (#2243). Minimal project defaults for a UE 5.8 Windows desktop game.
; ASSUMPTION: values mirror what a UE 5.x Blank C++ template writes (Lumen GI + reflections, Nanite-capable
; DX12/SM6, virtual shadow maps, desktop/maximum hardware class). They were written without the engine installed;
; phase B (first editor start) confirms them and the editor may append template keys it is missing.
; Lighting/look decisions belong to #2246; packaging to #2248.

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/Lunden")
+ActiveGameNameRedirects=(OldGameName="/Script/TP_Blank",NewGameName="/Script/Lunden")

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.RendererSettings]
; Lumen for global illumination and reflections (1 = Lumen), virtual shadow maps, mesh distance fields for Lumen.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
; ASSUMPTION: no baked lightmaps (Lumen only), so maps produce no lightmap *_BuiltData; #2246 may change this.
r.AllowStaticLighting=False
; Nanite needs no project switch in UE 5.8; it is enabled per static mesh (the importer in #2245 decides).
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.SkinCache.CompileShaders=True

; #2291 (avatar looks, the hall mirror): BP_LundenMirror's SceneCapture clips at the glass (bEnableClipPlane), so the
; wall and the rooms behind the mirror stay out of its picture; a scene capture's clip plane only works with the global
; clip plane allowed. Cost: every base-pass vertex shader gets the clip-plane test (Epic: a few percent on the GPU, more
; shader permutations); the extra scene render only runs while the glass is on screen. Owner: #2291.
[/Script/Engine.RendererSettings]
r.AllowGlobalClipPlane=True

; #2320: mix like Web Audio, so the web's own gains give the web's level. A mono source played 2D is copied to both
; channels at full level (Web Audio's 'speakers' up-mix; the engine's unset default is Linear, 0.5 each, -6 dB), a
; positioned source pans with the equal-power law of the web's PannerNode 'equalpower' (unset default Linear), and no
; platform headroom is taken (BaseWindowsEngine.ini: -3 dB); the web's master gain 0.8 is in the builders' gains.
; AudioMixerChannelMaps.cpp, AudioMixerDevice.cpp (pan law), AudioMixerSource.cpp UpdateVolume (headroom). Owner: #2320.
[/Script/Engine.AudioSettings]
MonoChannelUpmixMethod=FullVolume
PanningMethod=EqualPower

[Audio]
PlatformHeadroomDB=0

; #2419: a packaged (Shipping) game ignores a map on its command line, so without this it opened the engine's empty
; default map. The persistent world map holds the sub-level list, START and the GameMode (compose_world.py).
[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Lunden/Maps/L_Lunden.L_Lunden

; #2467: opt-in Linux development profile, appended to a copy of DefaultEngine.ini.
; Quality guesses for the UHD 630 development host, not a Windows visual-acceptance profile.
[/Script/LinuxTargetPlatform.LinuxTargetSettings]
!TargetedRHIs=ClearArray
+TargetedRHIs=SF_VULKAN_SM5

